function Timeline({ story, selEpId, onSelEp, onDeleteEp }) {
  const scrollRef = useRef(null);
  const trackRef = useRef(null);
  const dragRef = useRef({ active: false, pointerId: null, startClientX: 0, startScrollLeft: 0 });
  const [scrollUI, setScrollUI] = useState({ show: false, thumbW: 56, thumbX: 0 });
  const forceTabletScrollbar = useMemo(() => isTabletSafariBrowser(), []);
  const eps = [...(story.episodes||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));

  // "New since your last visit" tracking — captured once per story (pure read,
  // safe during render); the write that advances it lives in the effect below.
  const lastViewedRef = useRef(null);
  if (!lastViewedRef.current || lastViewedRef.current.storyId !== story?.id) {
    const map = loadLastViewedMap();
    lastViewedRef.current = { storyId: story?.id, prev: map[story?.id] || null };
  }
  const prevViewedAt = lastViewedRef.current.prev;
  const newEpisodeIds = useMemo(() => {
    if (!prevViewedAt) return new Set(); // never viewed before — don't flag everything as new
    const prevMs = new Date(prevViewedAt).getTime();
    const set = new Set();
    eps.forEach(ep => {
      const addedMs = ep.addedAt ? new Date(ep.addedAt).getTime() : 0;
      if (addedMs > prevMs) set.add(ep.id);
    });
    return set;
  }, [eps, prevViewedAt]);
  useEffect(() => {
    if (story?.id) touchStoryLastViewed(story.id);
  }, [story?.id]);

  useEffect(() => {
    if (!forceTabletScrollbar) return;
    const el = scrollRef.current;
    if (!el) return;
    function syncThumb() {
      const maxLeft = Math.max(0, el.scrollWidth - el.clientWidth);
      if (maxLeft <= 0) {
        setScrollUI({ show: false, thumbW: Math.max(56, el.clientWidth * 0.25), thumbX: 0 });
        return;
      }
      const ratio = Math.max(0, Math.min(1, el.clientWidth / el.scrollWidth));
      const trackW = el.clientWidth;
      const thumbW = Math.max(56, Math.round(trackW * ratio));
      const movable = Math.max(0, trackW - thumbW);
      const thumbX = Math.round((el.scrollLeft / maxLeft) * movable);
      setScrollUI({ show: true, thumbW, thumbX });
    }
    syncThumb();
    el.addEventListener('scroll', syncThumb, { passive: true });
    window.addEventListener('resize', syncThumb);
    return () => {
      el.removeEventListener('scroll', syncThumb);
      window.removeEventListener('resize', syncThumb);
    };
  }, [forceTabletScrollbar, eps.length]);

  function onTrackPointerDown(e) {
    if (!forceTabletScrollbar) return;
    const el = scrollRef.current;
    const track = trackRef.current;
    if (!el || !track || !scrollUI.show) return;
    const rect = track.getBoundingClientRect();
    const maxLeft = Math.max(0, el.scrollWidth - el.clientWidth);
    const movable = Math.max(1, rect.width - scrollUI.thumbW);
    if (maxLeft <= 0) return;
    const clickX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
    const targetThumbX = Math.max(0, Math.min(movable, clickX - scrollUI.thumbW / 2));
    el.scrollLeft = (targetThumbX / movable) * maxLeft;
    dragRef.current = { active: true, pointerId: e.pointerId, startClientX: e.clientX, startScrollLeft: el.scrollLeft };
    track.setPointerCapture?.(e.pointerId);
  }

  function onTrackPointerMove(e) {
    const el = scrollRef.current;
    const track = trackRef.current;
    const drag = dragRef.current;
    if (!el || !track || !drag.active || drag.pointerId !== e.pointerId) return;
    const maxLeft = Math.max(0, el.scrollWidth - el.clientWidth);
    const movable = Math.max(1, track.getBoundingClientRect().width - scrollUI.thumbW);
    if (maxLeft <= 0) return;
    const dx = e.clientX - drag.startClientX;
    const scrollDx = (dx / movable) * maxLeft;
    el.scrollLeft = Math.max(0, Math.min(maxLeft, drag.startScrollLeft + scrollDx));
  }

  function onTrackPointerUp(e) {
    const track = trackRef.current;
    const drag = dragRef.current;
    if (!drag.active || drag.pointerId !== e.pointerId) return;
    dragRef.current = { active: false, pointerId: null, startClientX: 0, startScrollLeft: 0 };
    track?.releasePointerCapture?.(e.pointerId);
  }

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
      {eps.length===0 ? (
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:C.textMute,fontSize:14}}>
          No episodes yet — add the first one above.
        </div>
      ) : (
      <>
      <div
        ref={scrollRef}
        className="tl-scroll"
        style={{
          flex:1,
          padding:'0 0 16px',
          overflowX: forceTabletScrollbar ? 'scroll' : 'auto',
          WebkitOverflowScrolling: 'touch'
        }}>
        <div style={{position:'relative',display:'inline-flex',alignItems:'flex-start',gap:0,padding:'32px 48px 12px',minWidth:'max-content'}}>
          {buildTimelineNodes(eps).map((node, i, arr) => {
            const next = arr[i + 1];
            const prev = arr[i - 1];
            const gapMs = next
              ? new Date(nodeFirstDate(next)) - new Date(nodeLastDate(node))
              : null;
            const prevGapMs = prev
              ? new Date(nodeFirstDate(node)) - new Date(nodeLastDate(prev))
              : null;
            const isResumed = prevGapMs !== null && prevGapMs / 86_400_000 >= 30;
            return (
              <React.Fragment key={i}>
                {node.type === 'single'
                  ? <EpisodeNode ep={node.ep} selected={node.ep.id===selEpId}
                      onClick={()=>onSelEp(node.ep.id===selEpId?null:node.ep.id)}
                      onDelete={onDeleteEp} isResumed={isResumed} isNew={newEpisodeIds.has(node.ep.id)}/>
                  : <ClusterNode node={node} selEpId={selEpId} onSelEp={onSelEp}
                      onDeleteEp={onDeleteEp} isResumed={isResumed} newEpisodeIds={newEpisodeIds}/>
                }
                {gapMs !== null && <GapSegment ms={Math.max(0, gapMs)}/>}
              </React.Fragment>
            );
          })}
        </div>
      </div>
      {forceTabletScrollbar && scrollUI.show && (
        <div
          ref={trackRef}
          onPointerDown={onTrackPointerDown}
          onPointerMove={onTrackPointerMove}
          onPointerUp={onTrackPointerUp}
          onPointerCancel={onTrackPointerUp}
          style={{
            margin:'0 20px 8px',
            height:10,
            borderRadius:999,
            background: C.borderLight,
            position:'relative',
            touchAction:'none',
            cursor:'ew-resize',
            flexShrink:0
          }}>
          <div style={{
            position:'absolute',
            left:scrollUI.thumbX,
            top:0,
            height:10,
            width:scrollUI.thumbW,
            borderRadius:999,
            background:C.textMute,
            opacity:0.85
          }}/>
        </div>
      )}
      </>
      )}
    </div>
  );
}

function HeadlinesFeed({ story, settings, onAddFromHeadline, onStoryRefreshed, onExpandVideos, onExpandPodcasts }) {
  const podcastPreviewCount = getCacheEntry(story?.id, 'podcasts')?.items?.length || 0;
  // Captured once per story (pure read — Timeline owns advancing the actual
  // timestamp) so headlines discovered since your last visit can carry the
  // same "new" language as episodes do.
  const lastViewedPeekRef = React.useRef(null);
  if (!lastViewedPeekRef.current || lastViewedPeekRef.current.storyId !== story?.id) {
    lastViewedPeekRef.current = { storyId: story?.id, prev: peekStoryLastViewed(story?.id) };
  }
  const prevViewedAt = lastViewedPeekRef.current.prev;
  const [phase,      setPhase]      = useState('idle'); // idle|loading|ready|error
  const [items,      setItems]      = useState([]);
  const [videos,     setVideos]     = useState([]);
  const [socials,    setSocials]    = useState([]);
  const [socialRefreshing, setSocialRefreshing] = useState(false);
  const [activeVid,  setActiveVid]  = useState(null);
  const [tick,       setTick]       = useState(0);
  const [expanded,   setExpanded]   = useState(false);
  const [cachedAt,   setCachedAt]   = useState(null);
  const [hoveredIdx, setHoveredIdx] = useState(null);
  const [addedIdx,   setAddedIdx]   = useState(null); // briefly shows ✓ after adding
  const [addedSocialIdx, setAddedSocialIdx] = useState(null);
  const [filtered,   setFiltered]   = useState([]);   // articles the relevance judge removed
  const [rechecking, setRechecking] = useState(false);
  const forceRef = React.useRef(false);

  function handleRefresh() { forceRef.current = true; setTick(n => n + 1); }

  // Put an article back (and tell the server never to filter it again).
  function restoreFiltered(a) {
    const { relevance, ...clean } = a;
    restoreRelevance(storyRelevanceCtx(story), a);
    const nextItems = [...items, clean].sort((x, y) => new Date(y.date || 0) - new Date(x.date || 0));
    const nextFiltered = filtered.filter(x => x.url !== a.url);
    setItems(nextItems); setFiltered(nextFiltered);
    patchCacheEntry(story.id, 'headlines', { items: nextItems, filtered: nextFiltered });
  }
  // Run the relevance judge over the headlines already on screen (cleans up junk from before the filter existed).
  async function recheckItems() {
    if (rechecking || !items.length) return;
    setRechecking(true);
    const gate = await checkRelevance(storyRelevanceCtx(story), items);
    if (!gate.stats?.error) {
      const c = getCacheEntry(story.id, 'headlines') || {};
      const nextFiltered = mergeFiltered(c.filtered || [], gate.filtered, gate.kept);
      setItems(gate.kept); setFiltered(nextFiltered);
      patchCacheEntry(story.id, 'headlines', { items: gate.kept, filtered: nextFiltered });
    }
    setRechecking(false);
  }

  // Respond to global daily pivot refresh or bulk headline refresh (stale-while-revalidate)
  useEffect(() => {
    const onPivotRefresh = () => setTick(n => n + 1);
    window.addEventListener('lateral-refresh', onPivotRefresh);
    return () => window.removeEventListener('lateral-refresh', onPivotRefresh);
  }, []);

  // Re-read cache when this specific story's headlines were refreshed externally
  useEffect(() => {
    const onUpdated = (e) => { if (e.detail?.storyId === story?.id) setTick(n => n + 1); };
    window.addEventListener('lateral-headlines-updated', onUpdated);
    return () => window.removeEventListener('lateral-headlines-updated', onUpdated);
  }, [story?.id]);

  useEffect(() => {
    if (!story) return;
    let cancelled = false;
    const forced = forceRef.current;
    forceRef.current = false;
    setFiltered(getCacheEntry(story.id, 'headlines')?.filtered || []);
    // Nothing needs to refresh more often than the configured auto-refresh
    // interval (default 8h, same as the backend scheduler) — a shorter,
    // separately-hardcoded cooldown here would just mean this one piece
    // ignores the cadence everything else in the app agrees on.
    const socialCooldownMs = Math.max(0, Number(settings?.autoRefreshHours ?? 8)) * 60 * 60 * 1000;

    // Social search is the expensive/flaky one (up to ~40 web searches per attempt).
    // Runs on its own, decoupled from the items/videos pipeline, and is cooldown-gated
    // so a weak result doesn't get retried on every single story revisit.
    function maybeRefreshSocialOnly(queries) {
      const cached = getCacheEntry(story.id, 'headlines') || {};
      if (hasRenderableSocialContext(cached.socials)) return;
      const lastAttempt = cached.socialAttemptedAt ? new Date(cached.socialAttemptedAt).getTime() : 0;
      if (!forced && Date.now() - lastAttempt < socialCooldownMs) return;
      setSocialRefreshing(true);
      fetchSocialContext(story, queries).then(socialResults => {
        if (cancelled) return;
        const top = (socialResults || []).slice(0, 10);
        const c = getCacheEntry(story.id, 'headlines') || {};
        setCacheEntry(story.id, 'headlines', { ...c, socials: hasRenderableSocialContext(top) ? top : (c.socials || []), socialAttemptedAt: now() });
        if (hasRenderableSocialContext(top)) setSocials(top);
      }).catch(() => {}).finally(() => { if (!cancelled) setSocialRefreshing(false); });
    }

    // ── Check cache first (unless forced) ──────────────────────────────────
    let hasStaleItems = false;
    if (!forced) {
      const cached = getCacheEntry(story.id, 'headlines');
      const hasVideos = cached && Array.isArray(cached.videos);
      if (cached && !isCacheStale(cached.generatedAt, settings?.refreshTime) && hasVideos) {
        setItems(cached.items || []);
        setVideos(cached.videos || []);
        setSocials(cached.socials || []);
        setCachedAt(cached.generatedAt);
        setPhase('ready');
        // Items/videos are fresh — no need to re-run the whole pipeline just
        // because social is weak. Retry social alone, cooldown-gated.
        maybeRefreshSocialOnly(cached.queries || [story.title]);
        return;
      }
      // Stale-while-revalidate: show stale content immediately, refresh in background
      if (cached && cached.items?.length) {
        hasStaleItems = true;
        setItems(cached.items);
        setVideos(cached.videos || []);
        setSocials(cached.socials || []);
        setCachedAt(cached.generatedAt);
        setPhase('ready'); // display stale content now; run() will update silently
        // fall through to run()
      } else {
        setPhase('loading');
        setItems([]);
        setVideos([]);
        setSocials([]);
        setExpanded(false);
        setCachedAt(null);
      }
    } else {
      setPhase('loading');
      setItems([]);
      setVideos([]);
      setSocials([]);
      setExpanded(false);
      setCachedAt(null);
    }

    async function run() {
      try {
        // Try AI queries; fall back to title + tags if Ollama isn't reachable
        let queries;
        try { queries = await generateSearchQueries(story, settings); }
        catch { queries = [story.title, ...(story.tags||[]).slice(0,1).map(t=>`${story.title} ${t}`)].slice(0,2); }
        if (cancelled) return;

        // Parallel searches, deduplicated by URL
        const [batches, videoResults] = await Promise.all([
          Promise.all(queries.map(q => searchArticles(q).catch(()=>[]))),
          fetchVideos(story.title)
        ]);
        if (cancelled) return;

        const seen = new Set();
        const all  = [];
        for (const batch of batches)
          for (const a of batch)
            if (a.url && !seen.has(a.url)) { seen.add(a.url); all.push(a); }

        // Preserve headlines from the previous fetch instead of wholesale-
        // replacing the list every refresh — a story's coverage doesn't stop
        // being true just because this particular search didn't happen to
        // surface that article again. Fresh results win on URL collision
        // (kept first, so they win the seen-set race), union capped at 30.
        const prevItemsForMerge = getCacheEntry(story.id, 'headlines')?.items;
        if (Array.isArray(prevItemsForMerge)) {
          for (const a of prevItemsForMerge) if (a.url && !seen.has(a.url)) { seen.add(a.url); all.push(a); }
        }

        // Relevance gate: judge fresh results AND the carried-over ones. Verdicts are cached, so only new articles cost anything.
        const gate = await checkRelevance(storyRelevanceCtx(story), all);
        if (cancelled) return;
        const filteredNow = mergeFiltered(getCacheEntry(story.id, 'headlines')?.filtered || [], gate.filtered, gate.kept);
        const keptAll = gate.kept;

        keptAll.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
        const result = keptAll.slice(0, 30);
        const seedForImages = result.slice(0, 12);
        const enrichedSeed = seedForImages.length
          ? await attachImages(seedForImages).catch(() => seedForImages)
          : [];
        const withImages = enrichedSeed.length
          ? [...enrichedSeed, ...result.slice(enrichedSeed.length)]
          : result;
        if (!cancelled) {
          const prevCached = getCacheEntry(story.id, 'headlines') || {};
          const prevCachedSocials = Array.isArray(prevCached.socials) ? prevCached.socials : [];
          const carrySocials = hasRenderableSocialContext(prevCachedSocials) ? prevCachedSocials.slice(0, 10) : [];
          const stampedItems = stampFirstSeen(withImages, prevCached.items);
          setCacheEntry(story.id, 'headlines', { items: stampedItems, videos: videoResults.slice(0, 8), socials: carrySocials, socialAttemptedAt: prevCached.socialAttemptedAt || null, queries, filtered: filteredNow });
          setFiltered(filteredNow);
          onStoryRefreshed && onStoryRefreshed(story.id);
          const ts = getCacheEntry(story.id, 'headlines')?.generatedAt || null;
          setItems(stampedItems);
          setVideos(videoResults.slice(0, 8));
          setSocials(prev => hasRenderableSocialContext(prev) ? prev : carrySocials);
          setCachedAt(ts);
          setPhase('ready');

          // Social refresh is expensive; only when forced, or we lack usable
          // socials AND haven't tried too recently.
          const lastAttempt = prevCached.socialAttemptedAt ? new Date(prevCached.socialAttemptedAt).getTime() : 0;
          const offCooldown = Date.now() - lastAttempt >= socialCooldownMs;
          const shouldRefreshSocial = forced || (!hasRenderableSocialContext(carrySocials) && offCooldown);
          if (shouldRefreshSocial) {
            setSocialRefreshing(true);
            fetchSocialContext(story, queries).then(socialResults => {
              if (cancelled) return;
              const top = (socialResults || []).slice(0, 10);
              const good = hasRenderableSocialContext(top);
              if (good) setSocials(top);
              setCacheEntry(story.id, 'headlines', { items: stampedItems, videos: videoResults.slice(0, 8), socials: good ? top : carrySocials, socialAttemptedAt: now(), queries, filtered: filteredNow });
              const ts2 = getCacheEntry(story.id, 'headlines')?.generatedAt || null;
              setCachedAt(ts2 || ts);
            }).catch(() => {}).finally(() => { if (!cancelled) setSocialRefreshing(false); });
          }
        }
      } catch(e) { if (!cancelled && !hasStaleItems) setPhase('error'); }
    }

    run();
    return () => { cancelled = true; };
  }, [story?.id, tick]);

  const HL = { fontSize:12.5, fontWeight:800, color:C.textMute, textTransform:'uppercase', letterSpacing:'0.06em' };
  const cacheLabel = cachedAt ? `cached ${fmtS(cachedAt)}` : null;

  // ── Source diversity check ────────────────────────────────────────────────
  const sourceDiversityWarning = React.useMemo(() => {
    if (items.length < 4) return null;
    const counts = {};
    items.forEach(a => {
      const h = a.source?.domain || (a.url ? new URL(a.url).hostname.replace(/^www\./, '') : '');
      if (h) counts[h] = (counts[h] || 0) + 1;
    });
    const entries = Object.entries(counts).sort((x, y) => y[1] - x[1]);
    if (!entries.length) return null;
    const total = items.length;
    const [topDomain, topCount] = entries[0];
    const topPct = Math.round(topCount / total * 100);
    if (entries.length === 1) return { msg: `All ${total} headlines from a single source (${topDomain})`, level: 'high' };
    if (topPct >= 70) return { msg: `${topPct}% of headlines from ${topDomain} — limited source diversity`, level: 'high' };
    if (topPct >= 50 && entries.length <= 3) return { msg: `Coverage concentrated in ${entries.length} sources`, level: 'low' };
    return null;
  }, [items]);

  // ── Empty / loading / error states
  if (phase !== 'ready') return (
    <div style={{borderTop:`1px solid ${C.borderLight}`,padding:'10px 24px',display:'flex',alignItems:'center',gap:8,flexShrink:0,background:C.surface}}>
      <div style={HL}>Latest Headlines</div>
      <span style={{fontSize:11,color:C.textMute,fontStyle:'italic'}}>
        {phase==='loading'?'fetching…':phase==='error'?'search unavailable':null}
      </span>
      {phase!=='loading' && <button onClick={handleRefresh} style={{marginLeft:'auto',fontSize:11,color:C.accent,background:'none',border:'none',cursor:'pointer',fontWeight:700,padding:0}}>↻ Retry</button>}
    </div>
  );

  if (items.length === 0) return (
    <>
    <div style={{borderTop:`1px solid ${C.borderLight}`,padding:'10px 24px',display:'flex',alignItems:'center',gap:8,flexShrink:0,background:C.surface}}>
      <div style={HL}>Latest Headlines</div>
      <span style={{fontSize:11,color:C.textMute}}>No results found</span>
      <button onClick={handleRefresh} style={{marginLeft:'auto',fontSize:11,color:C.accent,background:'none',border:'none',cursor:'pointer',fontWeight:700,padding:0}}>↻ Refresh</button>
    </div>
    {filtered.length > 0 && <FilteredOutList items={filtered} onRestore={restoreFiltered}/>}
    </>
  );

  const displayed = expanded ? items : items.slice(0, 5);

  return (
    <div style={{borderTop:`1px solid ${C.borderLight}`,flexShrink:0,background:C.surface}}>
      {/* Section bar */}
      <div style={{padding:'10px 24px 8px',display:'flex',alignItems:'center',gap:8,borderBottom:`1px solid ${C.borderLight}`}}>
        <div style={HL}>Latest Headlines</div>
        <span style={{fontSize:10,color:C.textMute}}>·</span>
        <span style={{fontSize:10,color:C.textMute}}>{items.length} results</span>
        {cacheLabel && <span style={{fontSize:9.5,color:C.textMute,fontStyle:'italic'}}>· {cacheLabel}</span>}
        <button onClick={recheckItems} disabled={rechecking} title="Have the AI re-read these headlines and move any that don't belong to the Filtered out list"
          style={{marginLeft:'auto',fontSize:11,color:C.textMute,background:'none',border:'none',cursor:rechecking?'default':'pointer',fontWeight:700,padding:0}}>{rechecking ? 'checking…' : '✓ Check relevance'}</button>
        <button onClick={handleRefresh} style={{fontSize:11,color:C.accent,background:'none',border:'none',cursor:'pointer',fontWeight:700,padding:0}}>↻ Refresh</button>
      </div>
      {/* Source diversity warning */}
      {sourceDiversityWarning && (
        <div style={{padding:'6px 24px', background: sourceDiversityWarning.level === 'high' ? '#fef3c7' : '#f8fafc', borderBottom:`1px solid ${sourceDiversityWarning.level === 'high' ? '#fde68a' : C.borderLight}`, display:'flex', alignItems:'center', gap:6}}>
          <span style={{fontSize:11, color: sourceDiversityWarning.level === 'high' ? '#92400e' : C.textMute}}>
            {sourceDiversityWarning.level === 'high' ? '⚠ ' : '○ '}{sourceDiversityWarning.msg}
          </span>
        </div>
      )}
      {/* Rows — 5 shown by default */}
      {displayed.map((a,i) => {
        const domain  = a.source?.domain||'';
        const name    = a.source?.name||domain||'';
        const title   = (() => { const d=a.title.lastIndexOf(' - '); return d>20?a.title.slice(0,d).trim():a.title; })();
        const hue     = domain.split('').reduce((acc,c)=>acc*31+c.charCodeAt(0),7)%360;
        const isHover = hoveredIdx === i;
        const wasAdded = addedIdx === i;
        const isNew = !!(prevViewedAt && a.firstSeenAt && new Date(a.firstSeenAt) > new Date(prevViewedAt));
        return (
          <div key={a.url||i}
            onMouseEnter={() => setHoveredIdx(i)}
            onMouseLeave={() => setHoveredIdx(null)}
            style={{display:'flex',alignItems:'center',gap:10,padding:'8px 24px',borderBottom:`1px solid ${C.borderLight}`,background:isHover?C.bg:'transparent',transition:'background 0.1s',minHeight:56}}>
            {domain && <img src={`https://www.google.com/s2/favicons?domain=${domain}&sz=32`} width={13} height={13} style={{flexShrink:0,borderRadius:2,opacity:0.8}} onError={e=>e.target.style.display='none'}/>}
            {isNew && (
              <span style={{fontSize:8,fontWeight:800,color:C.accent,background:C.borderLight,padding:'1px 5px',borderRadius:3,textTransform:'uppercase',letterSpacing:'0.06em',flexShrink:0}}>• New</span>
            )}
            <a href={a.url} target="_blank" rel="noopener noreferrer"
              style={{flex:1,minWidth:0,fontSize:12.5,color:C.text,lineHeight:1.4,fontWeight:500,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden',textDecoration:'none'}}>
              {title}
            </a>
            <div style={{flex:'0 0 176px',display:'flex',alignItems:'center',gap:5,justifyContent:'flex-end',width:176}}>
              {isHover ? (
                <div style={{display:'flex',gap:5,width:'100%',justifyContent:'flex-end'}}>
                  <a href={a.url} target="_blank" rel="noopener noreferrer"
                    style={{fontSize:11,fontWeight:700,color:C.textMid,background:'none',border:`1px solid ${C.border}`,borderRadius:5,padding:'3px 8px',cursor:'pointer',textDecoration:'none',whiteSpace:'nowrap',minWidth:64,textAlign:'center'}}>
                    ↗ Open
                  </a>
                  {onAddFromHeadline && (
                    wasAdded
                      ? <span style={{fontSize:11,fontWeight:700,color:'#059669',whiteSpace:'nowrap',display:'inline-block',minWidth:64,textAlign:'center'}}>✓ Added</span>
                      : <button
                          onClick={e => {
                            e.stopPropagation();
                            onAddFromHeadline(a, title);
                            setAddedIdx(i);
                            setTimeout(() => setAddedIdx(n => n===i ? null : n), 1800);
                          }}
                          style={{fontSize:11,fontWeight:700,color:C.accent,background:'none',border:`1px solid ${C.accent}`,borderRadius:5,padding:'3px 8px',cursor:'pointer',whiteSpace:'nowrap',minWidth:64,textAlign:'center'}}>
                          + Add
                        </button>
                  )}
                </div>
              ) : (
                <div style={{textAlign:'right',width:'100%'}}>
                  <div style={{fontSize:10,fontWeight:700,color:`hsl(${hue},40%,52%)`,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{name}</div>
                  {a.date && <div style={{fontSize:9.5,color:C.textMute,marginTop:1}}>{fmtD(a.date)}</div>}
                </div>
              )}
            </div>
          </div>
        );
      })}
      {/* Expand / collapse */}
      {items.length > 5 && (
        <button onClick={()=>setExpanded(e=>!e)}
          style={{width:'100%',padding:'7px 24px',textAlign:'left',fontSize:11,fontWeight:700,color:C.accent,background:'none',border:'none',borderTop:`1px solid ${C.borderLight}`,cursor:'pointer'}}>
          {expanded ? '↑ Show less' : `↓ ${items.length - 5} more headlines`}
        </button>
      )}

      {/* Articles the relevance judge removed — reviewable, restorable */}
      <FilteredOutList items={filtered} onRestore={restoreFiltered}/>

      {/* Video Strip — always present so this is a reliable, findable section */}
      <div style={{padding:'12px 0 16px', borderTop:`1px solid ${C.borderLight}`, background:'rgba(0,0,0,0.03)'}}>
        <div style={{...HL, ...SECTION_HEAD_ROW, padding:'0 24px 10px', gap:6}}>
          {onExpandVideos
            ? <button onClick={onExpandVideos} style={{background:'none', border:'none', color:'inherit', fontWeight:'inherit', fontSize:'inherit', letterSpacing:'inherit', textTransform:'inherit', cursor:'pointer', padding:0, display:'flex', alignItems:'center', gap:2}}>
                Video Context <span style={{fontSize:13, lineHeight:1}}>›</span>
              </button>
            : <span>Video Context</span>}
        </div>
        {videos.length > 0 ? (
          <div style={{...CONTEXT_STRIP_BASE, height:160}}>
            {videos.slice(0, 8).map((v, i) => (
              <VideoCard
                key={i}
                video={v}
                onPlay={() => setActiveVid(v)}
                onAdd={() => onAddFromHeadline({
                  title: v.title,
                  url: v.url,
                  imageUrl: v.thumbnail,
                  videoUrl: v.iframe || v.url,
                  source: { name: v.author, domain: 'youtube.com' }
                }, v.title)}
              />
            ))}
          </div>
        ) : (
          <div style={{padding:'0 24px 4px', fontSize:11, color:C.textMute}}>No video coverage found yet.</div>
        )}
      </div>
      {/* Podcast Strip — below Video, same expandable pattern, always present */}
      <div style={{padding:'10px 0 14px', borderTop:`1px solid ${C.borderLight}`, background:'rgba(0,0,0,0.03)'}}>
        <div style={{...HL, ...SECTION_HEAD_ROW, padding:'0 24px 6px', gap:6}}>
          {onExpandPodcasts
            ? <button onClick={onExpandPodcasts} style={{background:'none', border:'none', color:'inherit', fontWeight:'inherit', fontSize:'inherit', letterSpacing:'inherit', textTransform:'inherit', cursor:'pointer', padding:0, display:'flex', alignItems:'center', gap:2}}>
                Podcast Context <span style={{fontSize:13, lineHeight:1}}>›</span>
              </button>
            : <span>Podcast Context</span>}
          {podcastPreviewCount > 0 && <span style={{fontSize:10, color:C.textMute, fontWeight:600, textTransform:'none', letterSpacing:0}}>{podcastPreviewCount} episodes</span>}
        </div>
        <div style={{padding:'0 24px 4px', fontSize:11, color:C.textMute}}>
          {podcastPreviewCount > 0 ? `${podcastPreviewCount} podcast episode${podcastPreviewCount!==1?'s':''} found — tap to browse.` : 'Tap to search for relevant podcast episodes.'}
        </div>
      </div>
      {/* Social Strip — always present so this is a reliable, findable section */}
      <div style={{padding:'10px 0 14px', borderTop:`1px solid ${C.borderLight}`, background:'rgba(0,0,0,0.02)'}}>
          <div style={{...HL, ...SECTION_HEAD_ROW, padding:'0 24px 10px'}}>
            <span>Social Context</span>
            {socials.length > 0 && <span style={{fontSize:10, color:C.textMute, fontWeight:600, textTransform:'none', letterSpacing:0}}>{socials.length} posts</span>}
            {socialRefreshing && (
              <span style={{marginLeft:6, display:'inline-flex', alignItems:'center', gap:6, fontSize:10, color:C.textMute, fontWeight:600, textTransform:'none', letterSpacing:0}}>
                <span style={{width:8, height:8, borderRadius:'50%', background:C.accent, animation:'chatPulse 1.2s ease-in-out infinite'}}/>
                Refreshing…
              </span>
            )}
          </div>
          {hasRenderableSocialContext(socials) ? (
            <div style={CONTEXT_STRIP_BASE}>
              {socials.map((s, i) => (
                <SocialCard
                  key={s.url || i}
                  social={s}
                  added={addedSocialIdx === i}
                  onAdd={() => {
                    const platformLabel = socialMeta(s.platform)?.label || 'Social';
                    const title = (s.title || s.snippet || `${platformLabel} discussion`).trim();
                    onAddFromHeadline({
                      title,
                      url: s.url,
                      imageUrl: s.imageUrl || '',
                      source: s.source,
                      socialPlatform: s.platform,
                      socialSource: s.source?.name || '',
                      date: s.date || '',
                    }, title);
                    setAddedSocialIdx(i);
                    setTimeout(() => setAddedSocialIdx(n => n===i ? null : n), 1800);
                  }}
                />
              ))}
            </div>
          ) : (
            <div style={{padding:'0 24px 8px', fontSize:11, color:C.textMute}}>
              {socialRefreshing ? 'Gathering relevant Reddit, Bluesky, and Threads posts…' : 'No social discussion found yet.'}
            </div>
          )}
      </div>

      {/* Video Overlay Player */}
      {activeVid && (
        <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.85)', zIndex:2000, display:'flex', alignItems:'center', justifyContent:'center', padding:40}}
          onClick={() => setActiveVid(null)}>
          <div style={{width:'min(900px, 100%)', aspectRatio:'16/9', background:'#000', borderRadius:12, overflow:'hidden', boxShadow:'0 30px 90px rgba(0,0,0,0.5)', position:'relative'}}
            onClick={e => e.stopPropagation()}>
            <button onClick={() => setActiveVid(null)} 
              style={{position:'absolute', top:12, right:12, width:32, height:32, borderRadius:'50%', background:'rgba(0,0,0,0.5)', border:'none', color:'#fff', fontSize:20, cursor:'pointer', zIndex:10}}>×</button>
            <iframe 
              src={activeVid.iframe ? activeVid.iframe + (activeVid.iframe.includes('?') ? '&' : '?') + 'autoplay=1' : activeVid.url}
              style={{width:'100%', height:'100%', border:'none'}} 
              allow="autoplay; encrypted-media; picture-in-picture" 
              allowFullScreen
            />
          </div>
        </div>
      )}
    </div>
  );
}

// Generates short, keyword-style search terms suited for podcast search.
// Deliberately avoids LLM — podcast APIs respond better to 2-4 word topic phrases
// than the sentence-style queries generated by generateSearchQueries.
function buildPodcastSearchTerms(story) {
  const title   = String(story?.title   || '').trim();
  const tags    = (story?.tags    || []).map(t => String(t || '').trim()).filter(Boolean);
  const actors  = (story?.actors  || []).map(a => String(a || '').trim()).filter(Boolean);
  const lastEp  = (story?.episodes || []).slice(-1)[0];
  const STOP = new Set([
    'the','a','an','and','or','but','in','on','at','to','for','of','with','by','from',
    'up','into','about','than','then','that','this','these','those','its','their','our',
    'is','are','was','were','be','been','have','has','had','will','would','could','should',
    'may','might','can','do','does','did','how','why','who','what','when','where','which'
  ]);
  const sigWords = (str) => String(str || '').split(/[\s\-–—:,;()'"/\\]+/)
    .map(w => w.replace(/[^a-zA-Z0-9]/g, ''))
    .filter(w => w.length >= 3 && !STOP.has(w.toLowerCase()));
  const terms = []; const seen = new Set();
  const add = (t) => { const s = String(t || '').trim(); if (!s || seen.has(s.toLowerCase())) return; seen.add(s.toLowerCase()); terms.push(s); };
  add(title);                                          // full title first
  const tw = sigWords(title);
  if (tw.length >= 2) add(tw.slice(0, 2).join(' ')); // first 2 significant title words
  if (tw.length >= 3) add(tw.slice(0, 3).join(' ')); // first 3 significant title words
  tags.slice(0, 3).forEach(add);                      // each tag is already a good short term
  if (actors[0]) add(actors[0]);                      // primary actor
  if (actors[0] && tags[0]) add(`${actors[0]} ${tags[0]}`); // actor + top tag
  if (lastEp?.headline) {                             // key words from latest episode
    const hw = sigWords(lastEp.headline).slice(0, 3);
    if (hw.length >= 2) add(hw.join(' '));
  }
  return terms.slice(0, 4);
}

// Broader fallback terms used when the primary pass returns nothing.
function broadenPodcastTerms(story) {
  const tags   = (story?.tags   || []).map(t => String(t || '').trim()).filter(Boolean);
  const actors = (story?.actors || []).map(a => String(a || '').trim()).filter(Boolean);
  const STOP = new Set(['the','a','an','and','or','for','of','with','in','on','at','to','is','are','was']);
  const tw = String(story?.title || '').split(/[\s\-–—:,;()'"/\\]+/)
    .map(w => w.replace(/[^a-zA-Z0-9]/g, ''))
    .filter(w => w.length >= 4 && !STOP.has(w.toLowerCase()));
  const terms = []; const seen = new Set();
  const add = (t) => { const s = String(t || '').trim(); if (!s || seen.has(s.toLowerCase())) return; seen.add(s.toLowerCase()); terms.push(s); };
  tags.slice(0, 2).forEach(add);
  actors.slice(0, 1).forEach(add);
  tw.slice(0, 2).forEach(add);
  return terms.slice(0, 3);
}

function PodcastsFeed({ story, settings, onAddPodcast, onStoryRefreshed, onClose }) {
  const [phase, setPhase] = useState('idle'); // idle|loading|ready|error
  const [items, setItems] = useState([]);
  const [tick, setTick] = useState(0);
  const [cachedAt, setCachedAt] = useState(null);
  const [addedIdx, setAddedIdx] = useState(null);
  const [activeAudio, setActiveAudio] = useState(null);
  const [loadSecs, setLoadSecs] = useState(0);
  const forceRef = React.useRef(false);

  function handleRefresh() { forceRef.current = true; setTick(n => n + 1); }

  useEffect(() => {
    if (phase !== 'loading') { setLoadSecs(0); return; }
    const started = Date.now();
    const t = setInterval(() => setLoadSecs(Math.floor((Date.now() - started) / 1000)), 1000);
    return () => clearInterval(t);
  }, [phase, story?.id, tick]);

  useEffect(() => {
    if (!story?.id) return;
    let cancelled = false;
    const forced = forceRef.current;
    forceRef.current = false;

    const cached = getCacheEntry(story.id, 'podcasts');
    if (!forced && cached && !isCacheStale(cached.generatedAt, settings?.refreshTime) && Array.isArray(cached.items) && cached.items.length > 0) {
      setItems(cached.items || []);
      setCachedAt(cached.generatedAt || null);
      setPhase('ready');
      return;
    }
    setPhase('loading');

    (async () => {
      try {
        let queries = buildPodcastSearchTerms(story);
        if (!queries.length) queries = [String(story.title || '').trim()].filter(Boolean);
        queries = [...new Set(queries)].slice(0, 4);
        console.log(`[podcasts] searching "${story.title}" with queries:`, queries);

        const batches = await Promise.all(queries.map(q => fetchPodcasts(q, 16).catch(() => [])));
        if (cancelled) return;

        const merged = [];
        const seen = new Set();
        for (const batch of batches) {
          for (const p of (batch || [])) {
            const key = String(p?.url || `${p?.podcastTitle || ''}::${p?.title || ''}`).toLowerCase();
            if (!key || seen.has(key)) continue;
            seen.add(key);
            merged.push(p);
          }
        }
        merged.sort((a, b) => new Date(b?.date || 0) - new Date(a?.date || 0));
        let top = merged.slice(0, 18);

        // Auto-broaden: if first pass is empty, retry once with shorter, broader terms
        if (!top.length && !cancelled) {
          const broadTerms = broadenPodcastTerms(story).filter(t => !queries.includes(t));
          if (broadTerms.length) {
            const broadBatches = await Promise.all(broadTerms.map(q => fetchPodcasts(q, 16).catch(() => [])));
            if (!cancelled) {
              const broadSeen = new Set(); const broadMerged = [];
              for (const batch of broadBatches) {
                for (const p of (batch || [])) {
                  const key = String(p?.url || `${p?.podcastTitle||''}::${p?.title||''}`).toLowerCase();
                  if (!key || broadSeen.has(key)) continue;
                  broadSeen.add(key); broadMerged.push(p);
                }
              }
              broadMerged.sort((a, b) => new Date(b?.date||0) - new Date(a?.date||0));
              top = broadMerged.slice(0, 18);
            }
          }
        }

        // Only cache when we actually got results — don't lock out future retries on empty
        if (top.length > 0) {
          setCacheEntry(story.id, 'podcasts', { items: top, queries });
          onStoryRefreshed && onStoryRefreshed(story.id);
        }
        const ts = top.length > 0 ? (getCacheEntry(story.id, 'podcasts')?.generatedAt || null) : null;
        if (cancelled) return;
        setItems(top);
        setCachedAt(ts);
        setPhase('ready');
      } catch {
        if (!cancelled) setPhase('error');
      }
    })();
    return () => { cancelled = true; };
  }, [story?.id, tick]);

  const HL = { fontSize:12.5, fontWeight:800, color:C.textMute, textTransform:'uppercase', letterSpacing:'0.06em' };
  const cacheLabel = cachedAt ? `cached ${fmtS(cachedAt)}` : null;

  if (phase !== 'ready') {
    const mm = String(Math.floor(loadSecs / 60)).padStart(2, '0');
    const ss = String(loadSecs % 60).padStart(2, '0');
    return (
      <div style={{borderTop:`1px solid ${C.borderLight}`,padding:'10px 24px',display:'flex',alignItems:'center',gap:8,flexShrink:0,background:C.surface}}>
        <div style={HL}>Podcast Context</div>
        {phase === 'loading' ? (

function StoryDashboard({ story, settings, locked, onStoryRefreshed, onSaveAsEpisode }) {
  const [phase,       setPhase]       = useState('idle');
  const [brief,       setBrief]       = useState(null);
  const [tick,        setTick]        = useState(0);
  const [cachedAt,    setCachedAt]    = useState(null);
  const [valeLoading, setValeLoading] = useState(false);
  const [analyzeSecs, setAnalyzeSecs] = useState(0);
  const [webSecs,     setWebSecs]     = useState(0);
  const [processMsg,  setProcessMsg]  = useState('');
  const [intelDebug,  setIntelDebug]  = useState('');
  const [regenNotice, setRegenNotice] = useState('');
  const forceRef = React.useRef(false);
  const pivotRefreshRef = React.useRef(false);
  const lastRegenErrorRef = React.useRef('');
  function showRegenNotice(msg) { setRegenNotice(String(msg || '').trim()); }

  function handleRegen() { forceRef.current = true; setTick(n => n + 1); setShowExport(false); }

  // Respond to global daily pivot refresh (stale-while-revalidate — no force flag)
  useEffect(() => {
    const onPivotRefresh = () => { pivotRefreshRef.current = true; setTick(n => n + 1); };
    window.addEventListener('lateral-refresh', onPivotRefresh);
    return () => window.removeEventListener('lateral-refresh', onPivotRefresh);
  }, []);

  // Live timer while intelligence generation is running
  useEffect(() => {
    if (phase !== 'loading') { setAnalyzeSecs(0); return; }
    const started = Date.now();
    const t = setInterval(() => {
      setAnalyzeSecs(Math.floor((Date.now() - started) / 1000));
    }, 1000);
    return () => clearInterval(t);
  }, [phase, story?.id, tick]);

  // Live timer while web intelligence fetch is running
  useEffect(() => {
    const active = valeLoading && !brief?.valeReport;
    if (!active) { setWebSecs(0); return; }
    const started = Date.now();
    const t = setInterval(() => {
      setWebSecs(Math.floor((Date.now() - started) / 1000));
    }, 1000);
    return () => clearInterval(t);
  }, [valeLoading, brief?.valeReport, story?.id, tick]);

  const [showExport,      setShowExport]      = useState(false);
  const [selectedNoteIds, setSelectedNoteIds] = useState(() => new Set());

  function toggleExport() {
    if (!showExport && brief) {
      const noted = (story.episodes||[]).filter(e => e.notes?.trim());
      setSelectedNoteIds(new Set(noted.map(e => e.id)));
    }
    setShowExport(e => !e);
  }

  useEffect(() => {
    if (!story) return;
    let cancelled = false;
    const forced = forceRef.current;
    const pivotRefresh = pivotRefreshRef.current;
    forceRef.current = false;
    pivotRefreshRef.current = false;
    const previousBrief = brief;
    const previousCachedAt = cachedAt;
    const hadVisibleContentAtStart = !!previousBrief;
    const shouldAutoRevalidate = forced || pivotRefresh;
    const prevCacheMs = previousCachedAt ? new Date(previousCachedAt).getTime() : 0;

    // ── Locked (resolved) stories: serve cache only, never regenerate ───────
    if (locked) {
      const cached = getCacheEntry(story.id, 'intelligence');
      if (cached && cached.brief) {
        setBrief(cached.brief);
        setCachedAt(cached.generatedAt);
        setPhase('ready');
      } else {
        setPhase('idle');
      }
      return;
    }

    // ── Check cache first (unless forced) ──────────────────────────────────
    let hasStaleContent = false;
    if (!forced) {
      const cached = getCacheEntry(story.id, 'intelligence');
      if (cached && cached.brief && !isCacheStale(cached.generatedAt, settings?.refreshTime)) {
        setBrief(cached.brief);
        setCachedAt(cached.generatedAt);
        setPhase('ready');
        return;
      }
      // Stale-while-revalidate: show stale brief immediately, regenerate in background
      if (cached && cached.brief) {
        hasStaleContent = true;
        setBrief(cached.brief);
        setCachedAt(cached.generatedAt);
        setPhase('ready'); // display stale content now; will update silently when done
        // Only revalidate when explicitly requested (regen/global refresh), not on story navigation.
        if (!shouldAutoRevalidate) return;
      } else {
        setPhase('loading');
        setBrief(null);
        setCachedAt(null);
      }
    } else {
      setPhase('loading');
      // Keep prior content visible while forcing a regenerate to avoid
      // flashing "unavailable" during queue/conflict transitions.
      if (!hadVisibleContentAtStart) {
        setBrief(null);
        setCachedAt(null);
      }
    }
    (async () => {
      try {
        setValeLoading(true);
        setProcessMsg('');
        setIntelDebug('');
        lastRegenErrorRef.current = '';
        let blockedByOther = false;
        let blockingJob = null;
        let startedJobId = '';
        try {
          const started = await startIntelligenceJob({ scope: 'story', storyId: story.id, story, settings });
          startedJobId = String(started?.job?.id || '');
          setIntelDebug('start:ok');
        } catch (e) {
          if (e?.status !== 409) throw e;
          // Another intelligence run is active.
          blockingJob = e?.payload?.activeJob || null;
          blockedByOther = !!(blockingJob && (blockingJob.scope !== 'story' || String(blockingJob.storyId || '') !== String(story.id)));
          if (!blockedByOther && blockingJob?.id) {
            // Same-story job already running: attach to that job id and continue polling.
            startedJobId = String(blockingJob.id);
          }
          setProcessMsg(e?.payload?.error || 'Another intelligence process is already in progress and should complete soon.');
          setIntelDebug(`start:409 blockedByOther=${blockedByOther ? 'yes' : 'no'} active=${blockingJob?.scope || 'unknown'}:${blockingJob?.storyId || '-'}`);
          setPhase('loading');
        }

        if (blockedByOther && blockingJob) {
          // A different scope/story is running. Do not treat this as a failure for current story.
          setIntelDebug('wait:blocked-by-other');
          showRegenNotice('Another intelligence process is already in progress and should complete soon.');
          setPhase(hasStaleContent || hadVisibleContentAtStart ? 'ready' : 'idle');
          return;
        }

        const waitOut = await waitForIntelligenceJob({
          scope: 'story',
          storyId: story.id,
          expectedJobId: startedJobId,
          onProgress: (job) => {
            if (cancelled) return;
            if (!hasStaleContent && job?.state === 'running') setPhase('loading');
          },
          intervalMs: 1000
        });

        if (cancelled) return;
        await syncServerCacheToLocal().catch((e) => {
          lastRegenErrorRef.current = String(e?.message || 'cache sync failed');
        });
        let fresh = getCacheEntry(story.id, 'intelligence');
        let freshMs = fresh?.generatedAt ? new Date(fresh.generatedAt).getTime() : 0;
        const hasNewerFresh = !!(fresh?.brief && (!prevCacheMs || (Number.isFinite(freshMs) && freshMs > prevCacheMs)));
        if (!hasNewerFresh) {
          const statusFresh = waitOut?.status?.storyIntelligence || null;
          const statusMs = statusFresh?.generatedAt ? new Date(statusFresh.generatedAt).getTime() : 0;
          const hasNewerStatus = !!(statusFresh?.brief && (!prevCacheMs || (Number.isFinite(statusMs) && statusMs > prevCacheMs)));
          if (hasNewerStatus) {
            const c = loadCache();
            if (!c[story.id]) c[story.id] = {};
            c[story.id].intelligence = { ...statusFresh };
            saveCache(c);
            fresh = statusFresh;
            freshMs = statusMs;
          }
        }
        if (!(fresh?.brief && (!prevCacheMs || (Number.isFinite(freshMs) && freshMs > prevCacheMs)))) {
          const serverFresh = await fetchStoryIntelligenceFromServer(story.id).catch(() => null);
          const serverMs = serverFresh?.generatedAt ? new Date(serverFresh.generatedAt).getTime() : 0;
          const hasNewerServer = !!(serverFresh?.brief && (!prevCacheMs || (Number.isFinite(serverMs) && serverMs > prevCacheMs)));
          if (hasNewerServer) {
            const c = loadCache();
            if (!c[story.id]) c[story.id] = {};
            c[story.id].intelligence = { ...serverFresh };
            saveCache(c);
            fresh = serverFresh;
            freshMs = serverMs;
          }
        }
        if (fresh?.brief && (!prevCacheMs || (Number.isFinite(freshMs) && freshMs > prevCacheMs))) {
          setBrief(fresh.brief);
          setCachedAt(fresh.generatedAt);
          setPhase('ready');
          setIntelDebug(`result:fresh-cache new=${fresh?.generatedAt || 'n/a'} prev=${previousCachedAt || 'n/a'}`);
          setRegenNotice('');
          onStoryRefreshed && onStoryRefreshed(story.id);
        } else if (hasStaleContent || hadVisibleContentAtStart) {
          // Preserve whatever the user was already seeing instead of hard-failing.
          if (!brief && previousBrief) {
            setBrief(previousBrief);
            setCachedAt(previousCachedAt || null);
          }
          setPhase('ready');
          setIntelDebug(`result:no-new-cache new=${fresh?.generatedAt || 'n/a'} prev=${previousCachedAt || 'n/a'}`);
          showRegenNotice(`Regenerate failed${lastRegenErrorRef.current ? `: ${lastRegenErrorRef.current}` : ''}; showing cached intelligence.`);
        } else if (!hasStaleContent) {
          setPhase('error');
          setIntelDebug(`result:no-new-cache-error new=${fresh?.generatedAt || 'n/a'} prev=${previousCachedAt || 'n/a'}`);
          showRegenNotice(`Regenerate failed${lastRegenErrorRef.current ? `: ${lastRegenErrorRef.current}` : ''}; intelligence is unavailable.`);
        }
      } catch (e) {
        lastRegenErrorRef.current = String(e?.message || 'unknown error');
        if (!cancelled) {
          if (hasStaleContent || hadVisibleContentAtStart) {
            if (!brief && previousBrief) {
              setBrief(previousBrief);
              setCachedAt(previousCachedAt || null);
            }
            setPhase('ready');
            setIntelDebug(`catch:visible-fallback ${e?.message || 'unknown'}`);
            showRegenNotice(`Regenerate failed: ${e?.message || 'unknown error'}; showing cached intelligence.`);
          } else {
            setPhase('error');
            setIntelDebug(`catch:error ${e?.message || 'unknown'}`);
            showRegenNotice(`Regenerate failed: ${e?.message || 'unknown error'}`);
          }
        }
      } finally {
        if (!cancelled) {
          setValeLoading(false);
          setProcessMsg('');
        }
      }
    })();
    return () => { cancelled = true; };
  }, [story?.id, tick]);

  // If this story's backend intelligence job is already running, resume polling
  // so navigation away/back does not lose completion updates.
  useEffect(() => {
    if (!story || locked) return;
    let cancelled = false;
    const previousBrief = brief;
    const previousCachedAt = cachedAt;
    const hadVisibleContentAtStart = !!previousBrief;
    const prevCacheMs = previousCachedAt ? new Date(previousCachedAt).getTime() : 0;
    (async () => {
      try {
        const st = await getIntelligenceJobStatus({ scope: 'story', storyId: story.id });
        const job = st?.job;
        if (!job || job.scope !== 'story' || String(job.storyId || '') !== String(story.id) || job.state !== 'running') return;
        if (cancelled) return;
        setPhase('loading');
        setValeLoading(true);
        setProcessMsg('Resuming intelligence generation…');
        const waitOut = await waitForIntelligenceJob({
          scope: 'story',
          storyId: story.id,
          expectedJobId: String(job.id || ''),
          onProgress: () => {},
          intervalMs: 1000
        });
        if (cancelled) return;
        await syncServerCacheToLocal().catch((e) => {
          lastRegenErrorRef.current = String(e?.message || 'cache sync failed');
        });
        let fresh = getCacheEntry(story.id, 'intelligence');
        let freshMs = fresh?.generatedAt ? new Date(fresh.generatedAt).getTime() : 0;
        const hasNewerFresh = !!(fresh?.brief && (!prevCacheMs || (Number.isFinite(freshMs) && freshMs > prevCacheMs)));
        if (!hasNewerFresh) {
          const statusFresh = waitOut?.status?.storyIntelligence || null;
          const statusMs = statusFresh?.generatedAt ? new Date(statusFresh.generatedAt).getTime() : 0;
          const hasNewerStatus = !!(statusFresh?.brief && (!prevCacheMs || (Number.isFinite(statusMs) && statusMs > prevCacheMs)));
          if (hasNewerStatus) {
            const c = loadCache();
            if (!c[story.id]) c[story.id] = {};
            c[story.id].intelligence = { ...statusFresh };
            saveCache(c);
            fresh = statusFresh;
            freshMs = statusMs;
          }
        }
        if (!(fresh?.brief && (!prevCacheMs || (Number.isFinite(freshMs) && freshMs > prevCacheMs)))) {
          const serverFresh = await fetchStoryIntelligenceFromServer(story.id).catch(() => null);
          const serverMs = serverFresh?.generatedAt ? new Date(serverFresh.generatedAt).getTime() : 0;
          const hasNewerServer = !!(serverFresh?.brief && (!prevCacheMs || (Number.isFinite(serverMs) && serverMs > prevCacheMs)));
          if (hasNewerServer) {
            const c = loadCache();
            if (!c[story.id]) c[story.id] = {};
            c[story.id].intelligence = { ...serverFresh };
            saveCache(c);
            fresh = serverFresh;
            freshMs = serverMs;
          }
        }
        if (fresh?.brief && (!prevCacheMs || (Number.isFinite(freshMs) && freshMs > prevCacheMs))) {
          setBrief(fresh.brief);
          setCachedAt(fresh.generatedAt);
          setPhase('ready');
          setIntelDebug(`resume:fresh-cache new=${fresh?.generatedAt || 'n/a'} prev=${previousCachedAt || 'n/a'}`);
          setRegenNotice('');
          onStoryRefreshed && onStoryRefreshed(story.id);
        } else if (hadVisibleContentAtStart) {
          if (!brief && previousBrief) {
            setBrief(previousBrief);
            setCachedAt(previousCachedAt || null);
          }
          setPhase('ready');
          setIntelDebug(`resume:no-new-cache new=${fresh?.generatedAt || 'n/a'} prev=${previousCachedAt || 'n/a'}`);
          showRegenNotice('Regenerate failed; showing cached intelligence.');
        } else {
          setPhase('idle');
          setIntelDebug(`resume:no-new-cache-idle new=${fresh?.generatedAt || 'n/a'} prev=${previousCachedAt || 'n/a'}`);
        }
      } catch (e) {
        lastRegenErrorRef.current = String(e?.message || 'unknown error');
        if (!cancelled) {
          if (hadVisibleContentAtStart) {
            if (!brief && previousBrief) {
              setBrief(previousBrief);
              setCachedAt(previousCachedAt || null);
            }
            setPhase('ready');
            setIntelDebug(`resume:visible-fallback ${e?.message || 'unknown'}`);
            showRegenNotice(`Regenerate failed: ${e?.message || 'unknown error'}; showing cached intelligence.`);
          } else {
            setPhase('idle');
            setIntelDebug(`resume:idle ${e?.message || 'unknown'}`);
            showRegenNotice(`Resume failed: ${e?.message || 'unknown error'}`);
          }
        }
      } finally {
        if (!cancelled) {
          setValeLoading(false);
          setProcessMsg('');
        }
      }
    })();
    return () => { cancelled = true; };
  }, [story?.id, locked]);

  const VEL = {
    accelerating: { color:'#dc2626', bg:'#fee2e2', label:'▲ Accelerating' },

  };
  const HL = { fontSize:12.5, fontWeight:800, color:C.textMute, textTransform:'uppercase', letterSpacing:'0.06em' };

  const vel = brief ? (VEL[brief.velocity]||VEL.steady) : null;
  const cacheLabel = cachedAt ? `cached ${fmtS(cachedAt)}` : null;
  const analyzeLabel = `${String(Math.floor(analyzeSecs / 60)).padStart(2, '0')}:${String(analyzeSecs % 60).padStart(2, '0')}`;
  const webLabel = `${String(Math.floor(webSecs / 60)).padStart(2, '0')}:${String(webSecs % 60).padStart(2, '0')}`;
  const notedEps = (story?.episodes||[]).filter(e => e.notes?.trim());
  const resolution = story?.resolution || null;
  const storySpeechText = buildStoryBriefSpeechText(story, brief);
  const webSpeechText = markdownToSpeechText(brief?.valeReport?.message || '');
  const storyHeadlineFallback = (getCacheEntry(story?.id, 'headlines')?.items || []).slice(0, 12);
  const storyValeSources = resolveRenderSources(
    brief?.valeReport?.message || '',
    brief?.valeReport?.sources,
    storyHeadlineFallback
  );

  function exportPDF() {
    if (!brief) return;
    const vel2 = VEL[brief.velocity] || VEL.steady;
    const exportDate = new Date().toLocaleDateString('en-US', {weekday:'long',year:'numeric',month:'long',day:'numeric'});
    const epCount = (story.episodes||[]).length;
    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function rlist(items, color) {
      if (!items?.length) return '';
      return `<ul class="bl">${items.map(item => {
        const t = typeof item==='object' ? `${esc(item.name)}${item.role?' — '+esc(item.role):''}` : esc(item);
        return `<li><span style="color:${color}">›</span>${t}</li>`;
      }).join('')}</ul>`;

    const notedForExport = notedEps.filter(e => selectedNoteIds.has(e.id));
    const notesHtml = notedForExport.map(ep =>
      `<div class="ne"><div class="nh">${esc(ep.headline)} <span class="nd">· ${fmtS(ep.date)}</span></div><div class="nt">${esc(ep.notes||'').replace(/\n/g,'<br/>')}</div></div>`

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Intelligence: ${esc(story.title)}</title><style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:32px 40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#fff;color:#1a1714}

</style></head><body>
${getExportLogoHtml('Story Intelligence Export')}

    const blob = new Blob([html], {type:'text/html'});

        <TTSButton text={storySpeechText} settings={settings} label="Read" title="Read intelligence aloud" style={{marginLeft:'auto'}}/>
        <button onClick={toggleExport} disabled={!brief}

                <div>

                  {resolution.openQuestions.slice(0,4).map((it,i)=><div key={i} style={{fontSize:12,color:C.textMid,lineHeight:1.5,marginBottom:3}}>• {it}</div>)}

          {story.resolutionError && <div style={{marginTop:8,fontSize:11,color:'#b91c1c'}}>Summary failed: {story.resolutionError}</div>}
        </div>
      )}
      {/* Export panel — note selector + print */}
      {showExport && brief && (
        <div style={{padding:'12px 24px 14px',borderBottom:`1px solid ${C.borderLight}`,background:'#faf9f7'}}>
          {notedEps.length > 0 ? (
            <div style={{marginBottom:10}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                <div style={{fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.07em'}}>Include Episode Notes</div>
                <button onClick={()=>setSelectedNoteIds(new Set(notedEps.map(e=>e.id)))}
                  style={{fontSize:10,fontWeight:700,color:C.accent,background:'none',border:'none',cursor:'pointer',padding:0}}>all</button>
                <button onClick={()=>setSelectedNoteIds(new Set())}
                  style={{fontSize:10,fontWeight:700,color:C.textMute,background:'none',border:'none',cursor:'pointer',padding:0}}>none</button>
              </div>
              {notedEps.map(ep => (
                <label key={ep.id} style={{display:'flex',alignItems:'flex-start',gap:7,marginBottom:8,cursor:'pointer'}}>
                  <input type="checkbox" checked={selectedNoteIds.has(ep.id)}
                    onChange={ev=>{setSelectedNoteIds(prev=>{const n=new Set(prev);ev.target.checked?n.add(ep.id):n.delete(ep.id);return n;});}}
                    style={{marginTop:3,flexShrink:0,accentColor:C.accent}}/>
                  <span style={{flex:1,minWidth:0}}>
                    <span style={{fontSize:12,fontWeight:600,color:C.text}}>{ep.headline}</span>

                    <div style={{fontSize:11,color:C.textMid,marginTop:2,lineHeight:1.4,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{ep.notes}</div>
                  </span>

              ))}
            </div>
          ) : (
            <div style={{fontSize:12,color:C.textMute,marginBottom:10}}>No episode notes yet. Add notes in the episode detail panel.</div>
          )}
          <button onClick={exportPDF}
            style={{width:'100%',padding:'7px 0',borderRadius:7,background:C.accent,color:'#fff',border:'none',fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em'}}>
            ⬡ Print / Save PDF
          </button>
        </div>
      )}
      {/* Content — keep cached brief visible while loading/queued */}
      {(phase==='ready' || phase==='loading') && brief && (
        <div style={{padding:'14px 24px'}}>
          {phase==='loading' && (
            <div style={{fontSize:11,color:C.textMute,fontStyle:'italic',marginBottom:10}}>
              Showing cached intelligence while regeneration runs…
            </div>
          )}
          {brief.velocityNote && <div style={{fontSize:12,color:C.textMid,fontStyle:'italic',marginBottom:12}}>{brief.velocityNote}</div>}
          {brief.summary && <div style={{fontSize:13,color:C.text,lineHeight:1.7,marginBottom:14}}>{brief.summary}</div>}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 24px'}}>
            <div>
              <Row label="Key Points"    items={brief.keyPoints}       color='#059669'/>
              <Row label="Key Players"   items={brief.keyPlayers}      color='#7c3aed'/>
              <Row label="Next Steps"    items={brief.likelyNextSteps} color='#0891b2'/>
            </div>
            <div>
              <Row label="Actionable"    items={brief.actionableItems} color='#0891b2'/>
              <Row label="Watch Signals" items={brief.watchSignals}    color='#d97706'/>
              <Row label="Gaps"          items={brief.informationGaps} color='#dc2626'/>
            </div>
          </div>
          {valeLoading && !brief?.valeReport && (
            <div style={{marginTop:20, paddingTop:16, borderTop:`1px solid ${C.borderLight}`, display:'flex', alignItems:'center', gap:10}}>

              <div style={{fontSize:11, color:C.textMute, fontStyle:'italic'}}>Fetching live web intelligence… {webLabel}</div>
            </div>

          {brief.valeReport && (
