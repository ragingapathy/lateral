function CopyableBubble({ role, content }) {
  const [copied, setCopied] = useState(false);
  function copy() {
    navigator.clipboard.writeText(content).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    });
  }
  return (
    <div className={`chat-bubble-wrap ${role}`}>
      <div className={`chat-bubble ${role}`}>
        <MiniMarkdown text={content}/>
        <div className="chat-bubble-actions">
          <button className="chat-copy-btn" onClick={copy}>{copied ? '✓' : 'Copy'}</button>
        </div>
      </div>
    </div>
  );
}

// ─── Chat Loading Bubble ──────────────────────────────────────────────────────
function ChatLoadingBubble() {
  const [secs, setSecs] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setSecs(s => s + 1), 1000);
    return () => clearInterval(t);
  }, []);
  const mm = String(Math.floor(secs / 60)).padStart(2, '0');
  const ss = String(secs % 60).padStart(2, '0');
  return (
    <div className="chat-bubble assistant" style={{display:'flex', alignItems:'center', gap:10, padding:'12px 16px'}}>
      <div style={{display:'flex', alignItems:'center', gap:7}}>
        <div style={{width:8, height:8, borderRadius:'50%', background:'var(--accent)', animation:'chatPulse 1.2s ease-in-out infinite 0s'}}/>
        <div style={{width:8, height:8, borderRadius:'50%', background:'var(--accent)', animation:'chatPulse 1.2s ease-in-out infinite 0.2s'}}/>
        <div style={{width:8, height:8, borderRadius:'50%', background:'var(--accent)', animation:'chatPulse 1.2s ease-in-out infinite 0.4s'}}/>
      </div>
      <span style={{fontSize:11, color:'var(--text-mute)', fontVariantNumeric:'tabular-nums', letterSpacing:'0.03em'}}>{mm}:{ss}</span>
    </div>
  );
}

// ─── Chat Drawer ─────────────────────────────────────────────────────────────
function ChatDrawer({ story, stories, leftPanelOpen, rightPanelWidth = 308, onAddEpisode, isMobile = false }) {
  const [open,       setOpen]       = useState(false);
  const [query,      setQuery]      = useState('');
  const [messages,   setMessages]   = useState([]);
  const [loading,    setLoading]    = useState(false);
  const [savingIdx,  setSavingIdx]  = useState(null);
  const [saveStory,  setSaveStory]  = useState('');
  const messagesEndRef = useRef(null);
  const inputRef       = useRef(null);
  const sendingRef     = useRef(false);
  const abortRef       = useRef(null);
  const pageRef        = useRef(null);
  const dragRef        = useRef({ active:false, startY:0, delta:0 });

  useEffect(() => {
    if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  function resetPullVisual() {
    if (!pageRef.current) return;
    pageRef.current.style.transform = 'translateY(0px)';
    pageRef.current.style.transition = 'transform 0.18s ease';
    setTimeout(() => {
      if (pageRef.current) pageRef.current.style.transition = '';
    }, 180);
  }

  function onHandleMove(e) {
    if (!dragRef.current.active || !pageRef.current) return;
    const dy = Math.max(0, e.clientY - dragRef.current.startY);
    dragRef.current.delta = dy;
    pageRef.current.style.transform = `translateY(${Math.min(dy, 90)}px)`;
  }

  function onHandleUp() {
    if (!dragRef.current.active) return;
    const dy = dragRef.current.delta;
    dragRef.current = { active:false, startY:0, delta:0 };
    document.removeEventListener('mousemove', onHandleMove);
    document.removeEventListener('mouseup', onHandleUp);
    if (dy > 48) setOpen(false);
    resetPullVisual();
  }

  function onHandleDown(e) {
    if (e.button !== 0 || !open) return;
    dragRef.current = { active:true, startY:e.clientY, delta:0 };
    document.addEventListener('mousemove', onHandleMove);
    document.addEventListener('mouseup', onHandleUp);
  }

  useEffect(() => () => {
    document.removeEventListener('mousemove', onHandleMove);
    document.removeEventListener('mouseup', onHandleUp);
  }, []);

  // Build story context to include with every query
  function buildContext() {
    const active = (stories || []).filter(isActiveStoryForWork);
    if (!active.length) return '';
    const lines = active.map(s => `- "${s.title}" (${s.status}): ${s.summary || 'no summary'}`).join('\n');
    return `The user is tracking these stories:\n${lines}${story ? `\n\nCurrently viewing: "${story.title}"` : ''}`;
  }

  async function handleSend() {
    const q = query.trim();
    if (!q || loading || sendingRef.current) return;
    sendingRef.current = true;
    setLoading(true);
    setQuery('');
    setOpen(true);
    setMessages(prev => [...prev, { role: 'user', content: q }]);
    const controller = new AbortController();
    abortRef.current = controller;
    try {
      const context = buildContext();
      const systemInstructions = context
        ? `You are an intelligence analyst assistant. ${context}. Answer the user's question using current web information. Structure your response with an executive summary, then key developments as bullet points, then cite sources.`
        : 'You are an intelligence analyst assistant. Answer the user\'s question using current web information. Structure your response with an executive summary, then key developments as bullet points, then cite sources.';
      const storyContext = story ? { title: story.title, actors: story.actors || [] } : null;
      const r = await fetch('/api/lateral/vale', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q, systemInstructions, chat: true, storyContext }),
        signal: controller.signal,
      });
      if (!r.ok) throw new Error(`${r.status}`);
      const data = await r.json();
      setMessages(prev => [...prev, {
        role: 'assistant',
        query: q,
        headline: data.headline || q,
        content: data.message || '(no response)',
        keyPoints: data.keyPoints || [],
        informationGaps: data.informationGaps || [],
        sources: data.sources || [],
        fallback: !!data.fallback,
      }]);
    } catch(e) {
      if (e.name === 'AbortError') {
        // User cancelled — remove the loading bubble, leave the user message
      } else {
        setMessages(prev => [...prev, { role: 'error', content: `Could not reach web intelligence: ${e.message}` }]);
      }
    } finally {
      setLoading(false);
      sendingRef.current = false;
      abortRef.current = null;
      inputRef.current?.focus();
    }
  }

  function handleStop() {
    if (abortRef.current) abortRef.current.abort();
  }

  function handleClear() { setMessages([]); setOpen(false); }

  const leftInset = isMobile ? 0 : (leftPanelOpen ? 272 : 56);
  const rightInset = isMobile ? 0 : rightPanelWidth;

  return (
    <div id="chat-drawer" style={{ left: leftInset, right: rightInset }}>
      <div id="chat-page" ref={pageRef} className={open ? 'open' : ''}>
        <div id="chat-top-handle" onMouseDown={onHandleDown} onDoubleClick={() => setOpen(false)} title="Drag down to close">
          <div id="chat-top-handle-grip"/>
        </div>
        <div id="chat-messages">
          {messages.length === 0 && (
            <div style={{color:'var(--text-mute)', fontSize:12, fontStyle:'italic', textAlign:'center', marginTop:20}}>
              Ask anything. Your tracked stories are included as context.
            </div>
          )}
          {messages.map((m, i) => (
            <div key={i} style={{display:'flex', flexDirection:'column', alignItems: m.role === 'user' ? 'flex-end' : 'flex-start', marginBottom:8}}>
              <CopyableBubble role={m.role} content={m.content}/>
              {m.role === 'assistant' && m.keyPoints?.length > 0 && (
                <div style={{fontSize:11.5, color:'var(--text-mid)', marginTop:6, paddingLeft:4, lineHeight:1.55}}>
                  {m.keyPoints.map((kp, j) => (
                    <div key={j} style={{display:'flex', gap:5, marginBottom:2}}>
                      <span style={{color:'var(--accent)', flexShrink:0}}>•</span>
                      <span>{kp}</span>
                    </div>
                  ))}
                </div>
              )}
              {m.sources?.length > 0 && (
                <div style={{display:'flex', flexWrap:'wrap', gap:5, marginTop:5, paddingLeft: m.role === 'user' ? 0 : 4, justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start'}}>
                  {m.sources.filter(s => s.url).slice(0, 5).map((s, j) => (
                    <a key={j} href={normalizeExternalUrl(s.url)} target="_blank" rel="noopener noreferrer"
                       style={{fontSize:10, color:'var(--text-mute)', border:'1px solid var(--border)', borderRadius:5, padding:'2px 7px', textDecoration:'none', maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                      {s.title || 'Source'}
                    </a>
                  ))}
                </div>
              )}
              {m.role === 'assistant' && onAddEpisode && (
                <div style={{marginTop:6, paddingLeft:4}}>
                  {savingIdx === i ? (
                    <div style={{display:'flex', alignItems:'center', gap:6, flexWrap:'wrap'}}>
                      <select value={saveStory} onChange={e => setSaveStory(e.target.value)}
                        style={{fontSize:11, padding:'3px 6px', borderRadius:5, border:'1px solid var(--border)', background:'var(--bg)', color:'var(--text)', maxWidth:180}}>
                        <option value="">— pick a story —</option>
                        {(stories || []).filter(s => s.status !== 'resolved' && s.status !== 'buried').map(s => (
                          <option key={s.id} value={s.id}>{s.title}</option>
                        ))}
                      </select>
                      <button onClick={() => {
                        if (!saveStory) return;
                        onAddEpisode({
                          id: uid(),
                          date: now().slice(0, 10),
                          type: 'development',
                          episodeType: 'web-summary',
                          headline: m.headline || m.query || 'Web intelligence note',
                          summary: m.content,
                          sourceUrl: m.sources?.[0]?.url || '',
                          sourceLinks: (m.sources || []).filter(s => s.url),
                          addedAt: now(),
                        }, saveStory);
                        setSavingIdx(null);
                        setSaveStory('');
                      }} disabled={!saveStory}
                        style={{fontSize:11, padding:'3px 9px', borderRadius:5, border:'none',
                                background: saveStory ? 'var(--accent)' : 'var(--border)',
                                color: saveStory ? 'white' : 'var(--text-mute)',
                                cursor: saveStory ? 'pointer' : 'default', fontWeight:700}}>
                        Save
                      </button>
                      <button onClick={() => { setSavingIdx(null); setSaveStory(''); }}
                        style={{fontSize:11, padding:'3px 7px', borderRadius:5, border:'1px solid var(--border)', background:'none', color:'var(--text-mute)', cursor:'pointer'}}>
                        Cancel
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => { setSavingIdx(i); setSaveStory(story?.id || ''); }}
                      style={{fontSize:10, padding:'2px 8px', borderRadius:5, border:'1px solid var(--border)',
                              background:'none', color:'var(--text-mute)', cursor:'pointer', fontWeight:600,
                              transition:'all 0.15s'}}
                      title="Save this response as a timeline episode">
                      📌 Save as Episode
                    </button>
                  )}
                </div>
              )}
            </div>
          ))}
          {loading && <ChatLoadingBubble/>}
          <div ref={messagesEndRef}/>
        </div>
      </div>
      <form id="chat-bar" onSubmit={e => { e.preventDefault(); handleSend(); }}>
        <button
          type="button"
          onClick={() => setOpen(o => !o)}
          title={open ? 'Collapse' : 'Expand chat'}
          style={{background:'none', border:'none', cursor:'pointer', color:'var(--text-mute)', fontSize:13, padding:'4px 6px', borderRadius:5, flexShrink:0, transition:'color 0.15s'}}
        >
          {open ? '▼' : '▲'}
        </button>
        <input
          id="chat-input"
          ref={inputRef}
          placeholder={story ? `Ask about "${story.title}"…` : 'Ask about your tracked stories…'}
          value={query}
          onChange={e => setQuery(e.target.value)}
          onFocus={() => { if (messages.length > 0) setOpen(true); }}
        />
        {messages.length > 0 && (
          <button type="button" onClick={handleClear} title="Clear chat"
            style={{background:'none', border:'none', cursor:'pointer', color:'var(--text-mute)', fontSize:11, padding:'4px 6px', borderRadius:5, flexShrink:0}}>
            Clear
          </button>
        )}
        {loading
          ? <button type="button" onClick={handleStop}
              style={{background:'#dc2626', color:'white', border:'none', borderRadius:7, padding:'6px 14px', fontSize:12, fontWeight:700, cursor:'pointer', flexShrink:0}}>
              Stop
            </button>
          : <button type="submit" disabled={!query.trim()}
              style={{background:'var(--accent)', color:'white', border:'none', borderRadius:7, padding:'6px 14px', fontSize:12, fontWeight:700, cursor: !query.trim() ? 'not-allowed' : 'pointer', opacity: !query.trim() ? 0.5 : 1, flexShrink:0, transition:'all 0.15s'}}>
              Ask
            </button>
        }
      </form>
    </div>
  );
}

// Deep linking is story-level only (see the popstate/pushState effects in
// App) — a bookmarked or shared ?story=<id> link that doesn't match anything
// in this browser's own data just falls back to no selection, not an error;
// story data is local, not server-side, so there's nothing else it could do.
function getStoryIdFromUrl() {
  try { return new URLSearchParams(window.location.search).get('story') || null; }
  catch { return null; }
}

function useIsMobile(breakpoint = MOBILE_BREAKPOINT) {
  const getMatch = () => {
    if (typeof window === 'undefined') return false;
    return window.innerWidth <= breakpoint;
  };
  const [isMobile, setIsMobile] = useState(getMatch);
  useEffect(() => {
    const onResize = () => setIsMobile(getMatch());
    onResize();
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [breakpoint]);
  return isMobile;
}

function MobileDrawer({ side='left', open, onClose, width, children }) {
  useEffect(() => {
    if (!open) return;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = prevOverflow; };
  }, [open]);
  if (!open) return null;
  const panelStyle = side === 'left'
    ? { left: 0, borderRight: `1px solid ${C.border}`, transform: 'translateX(0)' }
    : { right: 0, borderLeft: `1px solid ${C.border}`, transform: 'translateX(0)' };
  return (
    <>
      <div
        onClick={onClose}
        style={{
          position:'fixed',
          inset:0,
          background:'rgba(10, 12, 16, 0.42)',
          backdropFilter:'blur(2px)',
          zIndex:1400
        }}
      />
      <div
        style={{
          position:'fixed',
          top:52,
          bottom:0,
          width:width,
          maxWidth:'92vw',
          background:C.surface,
          zIndex:1401,
          boxShadow: side === 'left' ? '10px 0 30px rgba(0,0,0,0.18)' : '-10px 0 30px rgba(0,0,0,0.18)',
          overflow:'hidden',
          display:'flex',
          ...panelStyle
        }}
      >
        {children}
      </div>
    </>
  );
}

function App() {
  const NOTEBOOKLM_EXPORT_ENABLED = true;
  const [data,setData]=useState(load);
  const [settings,setSettings]=useState(loads);
  const [selStory,setSelStory]=useState(() => getStoryIdFromUrl());
  const [selEp,setSelEp]=useState(null);
  const [modal,setModal]=useState(null);
  const isMobile = useIsMobile();
  const [leftPanelOpen, setLeftPanelOpen] = useState(false);
  const [rightPanelWidth, setRightPanelWidth] = useState(308);
  const [mobileRightPanelOpen, setMobileRightPanelOpen] = useState(false);
  const [aiLoading,setAiLoading]=useState(false);
  const [homeView,setHomeView]=useState(() => !getStoryIdFromUrl());
  const [activeView, setActiveView] = useState('stories'); // 'stories' | 'predictions'
  const skipNextUrlPushRef = useRef(false);
  const [prefillArticle,setPrefillArticle]=useState(null);
  const [cacheVer,setCacheVer]=useState(0); // bumped after server cache hydration → triggers re-render
  const [serverReady,setServerReady]=useState(false);
  const [floatingPlayer, setFloatingPlayer] = useState(null);
  const settingsSyncReadyRef = useRef(false);
  const [theme, setTheme] = useState(() => localStorage.getItem('lateral-theme') || 'beige');
  
  const toggleTheme = () => {
    const newTheme = theme === 'beige' ? 'midnight' : 'beige';
    setTheme(newTheme);
    localStorage.setItem('lateral-theme', newTheme);
    document.documentElement.setAttribute('data-theme', newTheme);
  };
  
  // Set initial theme attribute on mount
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, []);

  useEffect(() => {
    if (!isMobile) {
      setMobileRightPanelOpen(false);
      return;
    }
    setLeftPanelOpen(false);
  }, [isMobile]);

  useEffect(() => {
    if (!isMobile) return;
    setMobileRightPanelOpen(false);
  }, [selStory, selEp, homeView, isMobile]);

  // Deep linking: keep the URL's ?story= param in sync with which story is
  // open, so the browser's own back/forward and bookmarks work — previously
  // the URL never changed regardless of what was selected. Story-level only;
  // which episode is open doesn't round-trip through the URL.
  useEffect(() => {
    if (skipNextUrlPushRef.current) { skipNextUrlPushRef.current = false; return; }
    const url = new URL(window.location.href);
    const nextParam = (!homeView && selStory) ? selStory : null;
    if (url.searchParams.get('story') === nextParam) return; // URL already matches, nothing to push
    if (nextParam) url.searchParams.set('story', nextParam);
    else url.searchParams.delete('story');
    window.history.pushState({ storyId: nextParam }, '', url.toString());
  }, [selStory, homeView]);

  useEffect(() => {
    function onPopState() {
      const id = getStoryIdFromUrl();
      skipNextUrlPushRef.current = true; // this change came from the URL, not the other way around
      setSelEp(null);
      if (id) { setSelStory(id); setHomeView(false); }
      else { setSelStory(null); setHomeView(true); }
    }
    window.addEventListener('popstate', onPopState);
    return () => window.removeEventListener('popstate', onPopState);
  }, []);

  useEffect(()=>save(data),[data]);
  useEffect(()=>saves(settings),[settings]);
  useEffect(() => {
    if (!settingsSyncReadyRef.current) return;
    const payload = {
      location: String(settings?.location || '').trim(),
      autoRefreshHours: Number(settings?.autoRefreshHours ?? DEF_SETTINGS.autoRefreshHours),
    };
    fetch('/api/lateral/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).catch(() => {});
  }, [settings?.location, settings?.autoRefreshHours]);

  // ── Auto-refresh at daily pivot time ────────────────────────────────────────
  // Fires a 'lateral-refresh' event exactly when isCacheStale flips to true,
  // so open tabs get fresh content without requiring a page reload.
  useEffect(() => {
    function msUntilPivot() {
      const [h, m] = (settings?.refreshTime || '08:00').split(':').map(Number);
      const now = new Date();
      const next = new Date(now); next.setHours(h, m, 0, 0);
      if (next <= now) next.setDate(next.getDate() + 1); // already past → next day
      return next.getTime() - now.getTime();
    }
    let timer;
    function schedule() {
      timer = setTimeout(() => {
        window.dispatchEvent(new CustomEvent('lateral-refresh'));
        schedule(); // reschedule for same time tomorrow
      }, msUntilPivot());
    }
    schedule();
    return () => clearTimeout(timer);
  }, [settings?.refreshTime]);

  // On mount: sync with server.
  // Sets serverSyncReady=true BEFORE calling setData so the triggered save()
  // correctly POSTs back to the server (no more initial-render clobber).
  // Merge per-story by `updatedAt` — this actually does what the old comment
  // here claimed ("server wins only if newer") but the old code never checked:
  // it used to force-apply server data unconditionally whenever the server had
  // any stories at all, which could silently discard a local edit whose save
  // POST simply hadn't landed yet before the next reload (verified: renaming a
  // story then reloading immediately lost the rename this way). Per-story
  // recency comparison fixes that while still picking up stories added via the
  // extension or another origin, which is what this was originally for.
  useEffect(() => {
    fetch('/api/lateral/data')
      .then(r => r.ok ? r.json() : null)
      .then(serverData => {
        serverSyncReady = true;   // unlock server POSTs before any setData
        if (serverData?.stories?.length > 0) {
          setData(localData => {
            const localStories = Array.isArray(localData?.stories) ? localData.stories : [];
            const localById = new Map(localStories.map(s => [s.id, s]));
            const serverIds = new Set(serverData.stories.map(s => s.id));
            const merged = serverData.stories.map(serverStory => {
              const localStory = localById.get(serverStory.id);
              if (!localStory) return serverStory; // server-only — e.g. added via extension
              const localTs  = new Date(localStory.updatedAt  || 0).getTime();
              const serverTs = new Date(serverStory.updatedAt || 0).getTime();
              return localTs > serverTs ? localStory : serverStory;
            });
            const localOnly = localStories.filter(s => !serverIds.has(s.id)); // e.g. added seconds ago, save still in flight
            return { ...serverData, stories: [...merged, ...localOnly] };
          });
        }
        setServerReady(true);
      })
      .catch(() => { serverSyncReady = true; setServerReady(true); }); // unlock even if server is down

    // Sync lightweight settings that should persist across browsers.
    // Only apply server value when local is blank, so existing local prefs stay intact.
    fetch('/api/lateral/settings')
      .then(r => r.ok ? r.json() : null)
      .then(ss => {
        const serverLocation = String(ss?.location || '').trim();
        if (!serverLocation) return;
        setSettings(cur => {
          if (String(cur?.location || '').trim()) return cur;
          return { ...cur, location: serverLocation };
        });
      })
      .catch(() => {})
      .finally(() => { settingsSyncReadyRef.current = true; });

    // Hydrate AI caches from server — first-time / new-browser visitors get
    // all previously generated headlines, intelligence, brief, and discovery
    // without having to wait for regeneration.
    fetch('/api/lateral/cache')
      .then(r => r.ok ? r.json() : null)
      .then(sc => {
        if (!sc) return;
        let changed = false;
        // storyCache: merge with local; newer generatedAt wins per entry
        if (sc.storyCache && Object.keys(sc.storyCache).length) {
          const local = loadCache();
          const base  = { ...sc.storyCache };
          for (const [sid, types] of Object.entries(local)) {
            if (!base[sid]) { base[sid] = types; continue; }
            for (const [type, entry] of Object.entries(types)) {
              if (!base[sid][type] || new Date(entry.generatedAt) > new Date(base[sid][type].generatedAt)) {
                base[sid][type] = entry;
              }
            }
          }
          saveCache(base);
          changed = true;
        }
        // brief: only hydrate if local is empty
        if (sc.brief && !loadBrief()) {
          try { localStorage.setItem(BRIEF_SK, JSON.stringify(sc.brief)); } catch {}
          changed = true;
        }
        // disc: only hydrate if local is empty
        if (sc.disc && !loadDisc()) {
          try { localStorage.setItem(DISC_SK, JSON.stringify(sc.disc)); } catch {}
          changed = true;
        }
        // vale: only hydrate if local is empty
        if (sc.vale && !loadVale()) {
          try { localStorage.setItem(VALE_SK, JSON.stringify(sc.vale)); } catch {}
          changed = true;
        }
        // Bump cacheVer so home view re-renders and shows the hydrated cards
        if (changed) setCacheVer(v => v + 1);
      })
      .catch(() => {});

    // Bootstrap: upload whatever's already in this browser's localStorage so
    // the server cache is seeded immediately (other browsers will get it next load).
    const bootCache = loadCache();
    const bootBrief = loadBrief();
    const bootDisc  = loadDisc();
    const bootVale  = loadVale();
    const bootPayload = {};
    if (Object.keys(bootCache).length) bootPayload.storyCache = bootCache;
    if (bootBrief) bootPayload.brief = bootBrief;
    if (bootDisc)  bootPayload.disc  = bootDisc;
    if (bootVale)  bootPayload.vale  = bootVale;
    if (Object.keys(bootPayload).length) {
      fetch('/api/lateral/cache', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(bootPayload) }).catch(()=>{});
    }

    // Visibility re-sync: when the user tabs back, quietly check if the
    // extension (or another tab) added stories/episodes since last render.
    const onVisible = () => {
      if (document.visibilityState !== 'visible' || !serverSyncReady) return;
      fetch('/api/lateral/data')
        .then(r => r.ok ? r.json() : null)
        .then(serverData => {
          if (serverData) setData(cur => serverIsNewer(serverData, cur) ? serverData : cur);
        })
        .catch(() => {});
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, []);

  const storiesView = useMemo(() => (
    (data.stories || [])
      .filter(s => String(s?.status || '').toLowerCase() !== 'deleted')
      .map(s => ({ ...s, status: effectiveStoryStatus(s, settings) }))
  ), [data.stories, settings?.stalledDays]);

  const story = storiesView.find(s=>s.id===selStory)||null;
  const ep    = story?.episodes?.find(e=>e.id===selEp)||null;

  // Backfill the dek (statusLine) for any story that doesn't have one yet —
  // anything created before this field existed. inceptStory() and
  // regenSummary() already keep it current going forward; this just closes
  // the retroactive gap. One attempt per story per session (tracked in a
  // ref, not state, so a failure doesn't retry on every render), sequential
  // rather than all-at-once so it doesn't pile concurrent requests onto an
  // already-contended Ollama instance.
  const statusLineBackfillRef = useRef(new Set());
  useEffect(() => {
    const missing = storiesView.filter(s => !s.statusLine && !statusLineBackfillRef.current.has(s.id));
    if (!missing.length) return;
    let cancelled = false;
    (async () => {
      for (const s of missing) {
        if (cancelled) return;
        statusLineBackfillRef.current.add(s.id);
        try {
          const statusLine = await generateStatusLineOnly(s, settings);
          if (!cancelled && statusLine) updateStory(s.id, { statusLine });
        } catch {} // best-effort — stays without one until a future attempt
      }
    })();
    return () => { cancelled = true; };
  }, [storiesView, settings]);

  const [refreshingHL,  setRefreshingHL]  = useState(false);
  const [refreshHLDone, setRefreshHLDone] = useState(false);
  const [refreshHLProg, setRefreshHLProg] = useState(null);
  const [refreshLog,    setRefreshLog]    = useState(null); // { lastRunAt, runs[] }

  // Poll server refresh log every 5 minutes
  useEffect(() => {
    async function fetchRefreshLog() {
      try {
        const r = await fetch('/api/lateral/refresh-log');
        if (r.ok) setRefreshLog(await r.json());
      } catch {}
    }
    fetchRefreshLog();
    const t = setInterval(fetchRefreshLog, 5 * 60 * 1000);
    return () => clearInterval(t);
  }, []);

  const briefNudge = React.useMemo(() => {
    const latestRun = refreshLog?.runs?.[0];
    if (!latestRun) return false;
    const briefAt = loadBrief()?.generatedAt;
    if (!briefAt || new Date(latestRun.at) <= new Date(briefAt)) return false;
    return (latestRun.stories || []).some(s => s.coverage === 'growing');
  }, [refreshLog]);

  async function refreshAllHeadlines() {
    const targets = storiesView.filter(s => s.status !== 'resolved' && s.status !== 'buried');
    if (!targets.length || refreshingHL) return;
    setRefreshingHL(true); setRefreshHLDone(false); setRefreshHLProg({ i: 0, total: targets.length, title: '' });
    for (let i = 0; i < targets.length; i++) {
      const s = targets[i];
      setRefreshHLProg({ i: i + 1, total: targets.length, title: s.title });
      try {
        const [r, videoResults] = await Promise.all([
          fetch(`/api/lateral/search?q=${encodeURIComponent(s.title)}&intent=news`, { cache: 'no-store' }),
          fetchVideos(s.title).catch(() => [])
        ]);
        const d = await r.json();
        if (d.articles?.length) {
          const gate = await checkRelevance(storyRelevanceCtx(s), d.articles);
          const existing = getCacheEntry(s.id, 'headlines') || {};
          const socials = Array.isArray(existing.socials) ? existing.socials : [];
          const filteredNow = mergeFiltered(existing.filtered || [], gate.filtered, gate.kept);
          setCacheEntry(s.id, 'headlines', { items: gate.kept, videos: videoResults.slice(0, 8), socials, filtered: filteredNow });
          touchStoryUpdatedAt(s.id);
          window.dispatchEvent(new CustomEvent('lateral-headlines-updated', { detail: { storyId: s.id } }));
        }
      } catch {}
    }
    setRefreshingHL(false); setRefreshHLProg(null); setRefreshHLDone(true);
    setTimeout(() => setRefreshHLDone(false), 3000);
  }

  function addStory(s) { setData(d=>({...d,stories:[...d.stories,s]})); setSelStory(s.id); setSelEp(s.episodes?.[0]?.id||null); setHomeView(false); }

  function addEpisodeFromBrief(briefData, targetStory) {
    if (!briefData || !targetStory?.id) return;
    // The global cross-story brief (HomePanel) nests per-story data under storyBriefs[].brief;
    // the per-story brief (StoryDashboard) IS the brief object itself. Support both shapes.
    const storyBrief = Array.isArray(briefData.storyBriefs)
      ? briefData.storyBriefs.find(sb => sb?.story?.id === targetStory.id)?.brief
      : null;
    const brief = storyBrief || briefData;

    const summaryParts = [];
    const pushList = (label, items) => {
      const arr = (Array.isArray(items) ? items : []).map(i => String(i || '').trim()).filter(Boolean);
      if (arr.length) summaryParts.push(`${label}:\n` + arr.map(i => `• ${i}`).join('\n'));
    };
    if (briefData.execSummary && !storyBrief) summaryParts.push(briefData.execSummary.trim());
    pushList('Key Developments', brief?.keyDevelopments);
    pushList('Key Points', brief?.keyPoints);
    if (Array.isArray(brief?.keyPlayers) && brief.keyPlayers.length) {
      const players = brief.keyPlayers.map(p => {
        const name = String(p?.name || '').trim();
        const role = String(p?.role || '').trim();
        return name ? `• ${name}${role ? ` — ${role}` : ''}` : '';
      }).filter(Boolean);
      if (players.length) summaryParts.push('Key Players:\n' + players.join('\n'));
    }
    pushList('Watch Signals', brief?.watchSignals);
    pushList('Information Gaps', brief?.informationGaps);
    pushList('Actionable Items', brief?.actionableItems);
    pushList('Likely Next Steps', brief?.likelyNextSteps);
    if (brief?.valeReport?.message) summaryParts.push(`Live Web Intelligence:\n${brief.valeReport.message}`);
    const summaryText = summaryParts.join('\n\n') || 'Brief generated with no narrative content captured.';

    const framingParts = [];
    if (brief?.velocity) framingParts.push(`Velocity: ${brief.velocity}${brief.velocityNote ? ` — ${brief.velocityNote}` : ''}`);
    if (brief?.sourceDiversityFlag) framingParts.push(`Source Diversity: ${brief.sourceDiversityFlag}${brief.sourceDiversityNote ? ` — ${brief.sourceDiversityNote}` : ''}`);
    const framingNote = framingParts.join('\n');

    const cachedHeadlines = getCacheEntry(targetStory.id, 'headlines')?.items || [];
    const sourceLinks = resolveRenderSources(brief?.valeReport?.message || '', brief?.valeReport?.sources, cachedHeadlines);

    const ep = {
      id: uid(),
      date: now().slice(0, 10),
      type: 'development',
      episodeType: 'brief',
      headline: `Intelligence Brief — ${targetStory.title}`,
      summary: summaryText,
      framingNote,
      sourceUrl: '',
      sourceLinks,
      addedAt: now(),
    };
    addEpisode(ep, targetStory.id);
  }

  function addEpisode(episode, targetStoryId) {
    const storyId = targetStoryId || selStory;
    const epActors = [...(episode._suggestedActors||[]), ...(episode.actors||[])];
    const epTags   = episode.tags||[];
    delete episode._suggestedActors;
    setData(d=>({...d,stories:d.stories.map(s=>{
      if(s.id!==storyId)return s;
      return {
        ...s,
        episodes: [...(s.episodes||[]),episode],
        actors:   [...new Set([...(s.actors||[]),...epActors])],
        tags:     [...new Set([...(s.tags||[]),...epTags])],
        updatedAt: now()
      };
    })}));
    setSelEp(episode.id);
  }

  function updateEpisode(epId, changes) {
    setData(d => ({
      ...d,
      stories: d.stories.map(s => {
        if (s.id !== selStory) return s;
        const storyActors = changes.actors
          ? [...new Set([...(s.actors||[]), ...changes.actors])]
          : s.actors;
        const storyTags = changes.tags
          ? [...new Set([...(s.tags||[]), ...changes.tags])]
          : s.tags;
        return {
          ...s,
          actors: storyActors,
          tags: storyTags,
          episodes: (s.episodes||[]).map(e => e.id === epId ? {...e, ...changes} : e),
          updatedAt: now()
        };
      })
    }));
  }

  function updateStory(storyId, changes) {
    setData(d => ({
      ...d,
      stories: d.stories.map(s => s.id === storyId ? { ...s, ...changes, updatedAt: now() } : s)
    }));
  }

  function addEpisodeFromHeadline(article, titleText) {
    const epId = uid();
    const baseDate = article.date ? article.date.slice(0,10) : now().slice(0,10);
    addEpisode({
      id: epId,
      date: baseDate,
      type: 'development',
      headline: titleText,
      summary: '',
      framingNote: '',
      sourceUrl: article.url || '',
      imageUrl: article.imageUrl || '',
      videoUrl: article.videoUrl || '',
      socialPlatform: article.socialPlatform || '',
      socialSource: article.socialSource || '',
      addedAt: now(),
    });

    // The episode is on the timeline immediately (instant feedback, same as
    // before) — then draft its summary/framing in the background, same AI
    // analysis the manual "Add Episode via URL" flow already does, instead of
    // leaving a bare headline that requires a separate "Analyze" click later.
    // Best-effort: if this fails (Ollama busy, fetch blocked), the bare
    // episode from above is still there, exactly like today.
    const analysisStory = story;
    if (analysisStory) {
      (async () => {
        try {
          const text = article.url ? await fetchText(article.url) : null;
          const r = await analyzeEpisode(text || titleText, analysisStory, settings);
          updateEpisode(epId, {
            date: r.date || baseDate,
            type: r.type || 'development',
            summary: r.summary || '',
            framingNote: r.framingNote || '',
            tags: Array.isArray(r.tags) ? r.tags : [],
            actors: Array.isArray(r.actors) ? r.actors : [],
          });
        } catch {}
      })();
    }
  }

  function addEpisodeFromPodcast(podcast) {
    if (!podcast) return;
    const headline = String(podcast.title || 'Podcast episode').trim();
    const podcastTitle = String(podcast.podcastTitle || '').trim();
    const summary = String(podcast.summary || '').trim();
    const sourceUrl = String(podcast.url || '').trim();
    const textSummary = [podcastTitle ? `From ${podcastTitle}.` : '', summary].filter(Boolean).join(' ');
    addEpisode({
      id: uid(),
      date: podcast.date ? String(podcast.date).slice(0,10) : now().slice(0,10),
      type: 'development',
      headline,
      summary: textSummary,
      framingNote: 'Imported from podcast context search.',
      sourceUrl,
      imageUrl: podcast.imageUrl || '',
      videoUrl: '',
      audioUrl: podcast.audioUrl || '',
      podcastTitle,
      socialPlatform: '',
      socialSource: podcast.source?.name || podcastTitle || 'Podcast',
      addedAt: now(),
    });
  }

  function addEpisodeFromCard(article, storyId) {
    const ep = {
      id: uid(),
      date: article.date ? article.date.slice(0,10) : now().slice(0,10),
      type: 'development',
      headline: article.title,
      summary: '',
      framingNote: '',
      sourceUrl: article.url || '',
      addedAt: now(),
    };
    addEpisode(ep, storyId);
    setSelStory(storyId);
    setHomeView(false);
  }

  function deleteEpisode(epId) {
    setData(d=>({...d,stories:d.stories.map(s=>s.id!==selStory?s:{...s,episodes:(s.episodes||[]).filter(e=>e.id!==epId),updatedAt:now()})}));
    if (selEp===epId) setSelEp(null);
  }

  function deleteStory(storyId) {
    setData(d=>({
      ...d,
      stories:d.stories.map(s=>s.id===storyId
        ? { ...s, status:'deleted', deletedAt: now(), updatedAt: now() }
        : s)
    }));
    if (selStory===storyId) { setSelStory(null); setSelEp(null); }
  }

  function purgeDeletedStories() {
    let removedCount = 0;
    setData(d => {
      const allStories = Array.isArray(d?.stories) ? d.stories : [];
      const keptStories = allStories.filter(s => String(s?.status || '').toLowerCase() !== 'deleted');
      removedCount = Math.max(0, allStories.length - keptStories.length);
      if (removedCount === 0) return d;
      const next = { ...d, stories: keptStories };
      // Persist immediately so extension/API consumers stop seeing deleted rows.
      save(next);
      return next;
    });
    return removedCount;
  }

  function reorderStories(sourceId, targetId, edge='before') {
    if (!sourceId || !targetId || sourceId===targetId) return;
    setData(d => {
      const stories = [...(d.stories||[])];
      const fromIdx = stories.findIndex(s => s.id===sourceId);
      if (fromIdx < 0) return d;
      const [moved] = stories.splice(fromIdx, 1);
      let toIdx = stories.findIndex(s => s.id===targetId);
      if (toIdx < 0) return d;
      if (edge === 'after') toIdx += 1;
      stories.splice(toIdx, 0, moved);
      return { ...d, stories };
    });
  }

  function resolveStory(storyId) {
    const target = (data.stories || []).find(s => s.id === storyId);
    if (!target) return;
    const nextStatus = target.status === 'resolved' ? 'active' : 'resolved';
    if (nextStatus === 'active') {
      setData(d=>({...d,stories:d.stories.map(s=>s.id===storyId?{...s,status:'active',resolutionGenerating:false,updatedAt:now()}:s)}));
      return;
    }

    setData(d=>({...d,stories:d.stories.map(s=>s.id===storyId?{...s,status:'resolved',resolutionGenerating:true,resolutionError:'',resolvedAt:now(),updatedAt:now()}:s)}));

    generateResolutionSummary(target, settings)
      .then(summary => {
        setData(d => ({
          ...d,
          stories: d.stories.map(s => {
            if (s.id !== storyId) return s;
            if (s.status !== 'resolved') return s;
            return {
              ...s,
              resolution: summary || null,
              resolutionGeneratedAt: now(),
              resolutionGenerating: false,
              resolutionError: '',
              updatedAt: now()
            };
          })
        }));
      })
      .catch(e => {
        setData(d => ({
          ...d,
          stories: d.stories.map(s => s.id===storyId ? { ...s, resolutionGenerating:false, resolutionError:e.message||'Failed to generate summary', updatedAt:now() } : s)
        }));
      });
  }

  async function handleRegen() {
    if (!story||aiLoading) return;
    setAiLoading(true);
    try { const r=await regenSummary(story,settings); setData(d=>({...d,stories:d.stories.map(s=>s.id===selStory?{...s,summary:r.summary||s.summary,statusLine:r.statusLine||s.statusLine,updatedAt:now()}:s)})); }
    catch(e) { console.error(e); }
    setAiLoading(false);
  }

  function touchStoryUpdatedAt(storyId) {
    if (!storyId) return;
    setData(d => ({
      ...d,
      stories: d.stories.map(s => s.id === storyId ? { ...s, updatedAt: now() } : s)
    }));
  }

  return (
    <ThemeContext.Provider value={{ theme, toggleTheme }}>
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:C.bg}}>
      <header style={{position:'relative',flexShrink:0,display:'flex',flexDirection:'column',padding:isMobile?'8px 12px':'0 20px',background:C.surface,borderBottom:`1px solid ${C.borderLight}`,boxShadow:'0 1px 3px rgba(0,0,0,0.06)',gap:isMobile?8:0}}>
        <div style={{height:isMobile?'auto':52,display:'flex',alignItems:'center',gap:10,minWidth:0}}>
          {isMobile && (
            <button
              onClick={()=>setLeftPanelOpen(true)}
              title="Open story panel"
              style={{width:34,height:34,borderRadius:9,border:`1px solid ${C.border}`,background:C.bg,color:C.text,cursor:'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',padding:0,flexShrink:0}}
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7H20" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                <path d="M4 12H20" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                <path d="M4 17H20" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
              </svg>
            </button>
          )}
          <div style={{display:'flex',alignItems:'center',gap:10,flex:1,minWidth:0,overflow:'hidden'}}>
            <span onClick={()=>{setHomeView(true);setSelStory(null);setSelEp(null);}} style={{fontSize:19,fontWeight:900,color:C.text,letterSpacing:'-0.5px',fontFamily:"'Playfair Display', Georgia, serif",cursor:'pointer',userSelect:'none',flexShrink:0}}>LATERAL</span>
            {!isMobile && (
              <>
                <svg width="60" height="10" viewBox="0 0 60 10" style={{flexShrink:0}}>
                  <line x1="0" y1="5" x2="60" y2="5" stroke={theme === 'midnight' ? '#3d3058' : '#e2e8f0'} strokeWidth="2"/>
                  <circle cx="10" cy="5" r="3" fill="#2563eb"/>
                  <circle cx="28" cy="5" r="3" fill="#059669"/>
                  <circle cx="44" cy="5" r="3" fill="#dc2626"/>
                  <circle cx="58" cy="5" r="3" fill="#d97706"/>
                </svg>
                <span style={{fontSize:11.5,color:C.textMute,fontStyle:'italic',whiteSpace:'nowrap'}}>narrative memory</span>
                {refreshLog?.lastRunAt && (
                  <span title="Last automatic headline refresh" style={{fontSize:10.5,color:C.textMute,opacity:0.7,whiteSpace:'nowrap'}}>
                    · auto-refresh {fmtHoursAgo(refreshLog.lastRunAt)}
                  </span>
                )}
              </>
            )}
          </div>
          {!isMobile && storiesView.some(s=>s.episodes?.length>0) && (
            <div style={{display:'flex',alignItems:'center',gap:12,flexShrink:0,marginRight:10}}>
            <button
              onClick={refreshAllHeadlines}
              disabled={refreshingHL}
              title={refreshingHL ? `Refreshing ${refreshHLProg?.i||0}/${refreshHLProg?.total||0}: ${refreshHLProg?.title||''}` : 'Refresh headlines for all active stories'}
              style={{padding:'5px 13px',borderRadius:7,background: refreshHLDone ? '#166534' : refreshingHL ? '#78350f' : '#92400e',color:'#fde68a',border:`1.5px solid ${refreshHLDone ? '#22c55e' : refreshingHL ? '#d97706' : '#f59e0b'}`,fontSize:12,fontWeight:700,cursor: refreshingHL ? 'default' : 'pointer',letterSpacing:'0.02em',flexShrink:0,transition:'all 0.3s',opacity: refreshingHL ? 0.8 : 1}}>
              {refreshHLDone ? '✓ Refreshed' : refreshingHL ? `↻ ${refreshHLProg?.i||0}/${refreshHLProg?.total||0}` : '↻ Headlines'}
            </button>
            <button onClick={()=>setModal('brief')} title={briefNudge ? 'New coverage detected since your last brief — click to regenerate' : 'Open Intelligence Brief'}
              style={{position:'relative',padding:'5px 13px',borderRadius:7,background:C.surface,color:C.accent,border:`1.5px solid ${C.accent}`,fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em',flexShrink:0,transition:'all 0.15s'}}>
              Brief
              {briefNudge && (
                <span style={{position:'absolute',top:-3,right:-3,width:8,height:8,borderRadius:'50%',background:'#f59e0b',border:'1.5px solid '+C.surface,boxShadow:'0 0 0 1px #f59e0b'}}/>
              )}
            </button>
            {NOTEBOOKLM_EXPORT_ENABLED && (
              <button onClick={()=>setModal('notebooklm')} title="Export selected stories as NotebookLM-ready plain-text bundle"
                style={{padding:'5px 13px',borderRadius:7,background:C.surface,color:'#0f766e',border:'1.5px solid #0f766e',fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em',flexShrink:0,transition:'all 0.15s'}}>
                NotebookLM
              </button>
            )}
            <button onClick={()=>setModal('map')} title="Spider Map — visualize story connections"
              style={{padding:'5px 13px',borderRadius:7,background:C.surface,color:'#7c3aed',border:'1.5px solid #7c3aed',fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em',flexShrink:0,transition:'all 0.15s'}}>
              ⬡ Map
            </button>
            </div>
          )}
          <button onClick={()=>setModal('settings')} title="Settings" style={{border:'none',background:'none',fontSize:17,cursor:'pointer',color:C.textMute,padding:'4px 8px',borderRadius:6,flexShrink:0}}>⚙</button>
          {isMobile && (
            <button
              onClick={()=>setMobileRightPanelOpen(true)}
              title="Open details panel"
              style={{width:34,height:34,borderRadius:9,border:`1px solid ${C.border}`,background:C.bg,color:C.text,cursor:'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',padding:0,flexShrink:0}}
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 6L15 12L9 18" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          )}
          <button onClick={toggleTheme} title={`Switch to ${theme === 'beige' ? 'Midnight' : 'Beige'} theme`} style={{border:'none',background:'none',fontSize:16,cursor:'pointer',color:C.textMute,padding:'4px 8px',borderRadius:6,flexShrink:0}}>{theme === 'beige' ? '🌙' : '☀️'}</button>
        </div>
        {isMobile && (
          <div style={{display:'flex',flexWrap:'wrap',gap:8,paddingBottom:4}}>
            {storiesView.some(s=>s.episodes?.length>0) && (
              <>
                <button
                  onClick={refreshAllHeadlines}
                  disabled={refreshingHL}
                  title={refreshingHL ? `Refreshing ${refreshHLProg?.i||0}/${refreshHLProg?.total||0}: ${refreshHLProg?.title||''}` : 'Refresh headlines for all active stories'}
                  style={{padding:'5px 13px',borderRadius:7,background: refreshHLDone ? '#166534' : refreshingHL ? '#78350f' : '#92400e',color:'#fde68a',border:`1.5px solid ${refreshHLDone ? '#22c55e' : refreshingHL ? '#d97706' : '#f59e0b'}`,fontSize:12,fontWeight:700,cursor: refreshingHL ? 'default' : 'pointer',letterSpacing:'0.02em',transition:'all 0.3s',opacity: refreshingHL ? 0.8 : 1}}>
                  {refreshHLDone ? '✓ Refreshed' : refreshingHL ? `↻ ${refreshHLProg?.i||0}/${refreshHLProg?.total||0}` : '↻ Headlines'}
                </button>
                <button onClick={()=>setModal('brief')} title={briefNudge ? 'New coverage detected since your last brief — click to regenerate' : 'Open Intelligence Brief'}
                  style={{position:'relative',padding:'5px 13px',borderRadius:7,background:C.surface,color:C.accent,border:`1.5px solid ${C.accent}`,fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em',transition:'all 0.15s'}}>
                  Brief
                  {briefNudge && (
                    <span style={{position:'absolute',top:-3,right:-3,width:8,height:8,borderRadius:'50%',background:'#f59e0b',border:'1.5px solid '+C.surface,boxShadow:'0 0 0 1px #f59e0b'}}/>
                  )}
                </button>
                {NOTEBOOKLM_EXPORT_ENABLED && (
                  <button onClick={()=>setModal('notebooklm')} title="Export selected stories as NotebookLM-ready plain-text bundle"
                    style={{padding:'5px 13px',borderRadius:7,background:C.surface,color:'#0f766e',border:'1.5px solid #0f766e',fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em',transition:'all 0.15s'}}>
                    NotebookLM
                  </button>
                )}
                <button onClick={()=>setModal('map')} title="Spider Map — visualize story connections"
                  style={{padding:'5px 13px',borderRadius:7,background:C.surface,color:'#7c3aed',border:'1.5px solid #7c3aed',fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em',transition:'all 0.15s'}}>
                  ⬡ Map
                </button>
              </>
            )}
          </div>
        )}
      </header>
      <div style={{flex:1,display:'flex',overflow:'hidden',position:'relative'}}>
        {!isMobile && (
          <LeftPanel
            stories={storiesView}
            selectedId={selStory}
            onSelect={id=>{setSelStory(id);setSelEp(null);setHomeView(false);}}
            onNew={()=>setModal('addStory')}
            onNewPrediction={()=>setModal('addPrediction')}
            onDeleteStory={deleteStory}
            onReorderStories={reorderStories}
            isOpen={leftPanelOpen}
            onOpen={()=>setLeftPanelOpen(true)}
            onClose={()=>setLeftPanelOpen(false)}
            activeView={activeView}
            onViewChange={setActiveView}
          />
        )}
        {isMobile && (
          <MobileDrawer side={'left'} open={leftPanelOpen} onClose={()=>setLeftPanelOpen(false)} width={272}>
            <LeftPanel
              stories={storiesView}
              selectedId={selStory}
              onSelect={id=>{setSelStory(id);setSelEp(null);setHomeView(false);setLeftPanelOpen(false);}}
              onNew={()=>{setModal('addStory');setLeftPanelOpen(false);}}
              onNewPrediction={()=>{setModal('addPrediction');setLeftPanelOpen(false);}}
              onDeleteStory={deleteStory}
              onReorderStories={reorderStories}
              isOpen={true}
              onOpen={()=>setLeftPanelOpen(true)}
              onClose={()=>setLeftPanelOpen(false)}
              activeView={activeView}
              onViewChange={setActiveView}
            />
          </MobileDrawer>
        )}
        <div style={{flex:1,minWidth:0,display:'flex',overflow:'hidden'}}>
          {homeView
            ? <HomePanel stories={storiesView} settings={settings} serverReady={serverReady} onStartStory={a=>{setPrefillArticle(a);setModal('addStory');}} onAddEpisode={addEpisodeFromCard} onSelectStory={id=>{setSelStory(id);setHomeView(false);}} refreshing={refreshingHL} refreshProg={refreshHLProg} refreshDone={refreshHLDone} refreshLog={refreshLog}/>
            : <CenterPanel story={story} selEpId={selEp} onSelEp={id=>setSelEp(id)} onAddEp={()=>setModal('addEpisode')} onDiscover={()=>setModal('discover')} onRegen={handleRegen} aiLoading={aiLoading} onDeleteEp={deleteEpisode} settings={settings} onAddFromHeadline={addEpisodeFromHeadline} onAddPodcast={addEpisodeFromPodcast} onStoryRefreshed={touchStoryUpdatedAt} onSaveBriefAsEpisode={addEpisodeFromBrief} onBackfill={()=>setModal('backfill')} onUpdateStory={updateStory}/>
          }
        </div>
        {!isMobile && (
          <RightPanel story={story} ep={ep} onDeleteEp={deleteEpisode} onUpdateEp={updateEpisode} settings={settings} stories={storiesView} onAddStory={addStory} onAddEpisode={addEpisode} onResolveStory={resolveStory} onDeleteStory={deleteStory} onPopOut={setFloatingPlayer} onWidthChange={setRightPanelWidth}/>
        )}
        {isMobile && (
          <MobileDrawer side={'right'} open={mobileRightPanelOpen} onClose={()=>setMobileRightPanelOpen(false)} width={Math.min(Math.max(rightPanelWidth, 260), 360)}>
            <RightPanel story={story} ep={ep} onDeleteEp={deleteEpisode} onUpdateEp={updateEpisode} settings={settings} stories={storiesView} onAddStory={addStory} onAddEpisode={addEpisode} onResolveStory={resolveStory} onDeleteStory={deleteStory} onPopOut={setFloatingPlayer} onWidthChange={setRightPanelWidth} isMobile={true}/>
          </MobileDrawer>
        )}
      </div>
      <ChatDrawer story={story} stories={storiesView} leftPanelOpen={isMobile ? false : leftPanelOpen} rightPanelWidth={isMobile ? 0 : rightPanelWidth} onAddEpisode={addEpisode} isMobile={isMobile}/>
      {modal==='addStory'   && <AddStoryModal onClose={()=>{setModal(null);setPrefillArticle(null);}} onAdd={addStory} settings={settings} prefill={prefillArticle}/>}
      {modal==='addPrediction' && <AddPredictionModal onClose={()=>setModal(null)} onAdd={addStory}/>}
      {modal==='addEpisode' && story && <AddEpisodeModal story={story} onClose={()=>setModal(null)} onAdd={addEpisode} settings={settings}/>}
      {modal==='backfill'   && story && <BackfillModal story={story} onClose={()=>setModal(null)} onAdd={addEpisode} settings={settings}/>}
      {modal==='discover'   && story && <DiscoverModal story={story} onClose={()=>setModal(null)} onAdd={addEpisode} settings={settings}/>}
      {modal==='settings'   && <SettingsModal settings={settings} onSave={setSettings} onClose={()=>setModal(null)} onPurgeDeletedStories={purgeDeletedStories}/>}
      {modal==='brief'      && <BriefModal stories={storiesView} settings={settings} onClose={()=>setModal(null)}/>}
      {NOTEBOOKLM_EXPORT_ENABLED && modal==='notebooklm' && <NotebookLMExportModal stories={storiesView} onClose={()=>setModal(null)}/>}
      {modal==='map'        && <SpiderMapModal stories={storiesView} onClose={()=>setModal(null)} onSelectStory={id=>{setSelStory(id);setSelEp(null);setHomeView(false);setModal(null);}}/>}
      <FloatingAudioPlayer player={floatingPlayer} onClose={() => setFloatingPlayer(null)}/>
    </div>
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
