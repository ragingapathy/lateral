  const openStoryById = (id) => { const st = storiesView.find(x => x.id === id); setActiveView(st && st.predictionId ? 'predictions' : 'stories'); setSelStory(id); setSelEp(null); setHomeView(false); setModal(null); };

  // Open the Library (optionally filtered to one tracked story's saved articles).
  const openCivic = () => { setActiveView('civic'); setLeftPanelOpen(true); setCivicSel(null); setModal(null); };
  const civicSelOfficial = civic && civicSel ? (civic.officials || []).find(o => civicKey(o) === civicSel) : null;
  const civicPanel = activeView === 'civic'
    ? (civicSelOfficial ? <CivicProfile key={civicSel} o={civicSelOfficial} civic={civic} onClose={() => { setCivicSel(null); if (isMobile) setMobileRightPanelOpen(false); }} onUpdate={setCivic}/> : <CivicProfileEmpty hasProfile={!!civic}/>)
    : null;
  // On a phone the two drawers never stack: opening one closes the other, and choosing someone in the Civic list shows their profile.
  useEffect(() => { if (isMobile && activeView === 'civic' && civicSel) { setLeftPanelOpen(false); setMobileRightPanelOpen(true); } }, [civicSel]);
  useEffect(() => { if (isMobile && leftPanelOpen) setMobileRightPanelOpen(false); }, [leftPanelOpen]);
  useEffect(() => { if (isMobile && mobileRightPanelOpen) setLeftPanelOpen(false); }, [mobileRightPanelOpen]);
  useEffect(() => { if (activeView === 'civic' && civic === undefined) civicJson('profile').then(d => setCivic(d.error ? null : (d.profile || null))); }, [activeView]);
  const openLibrary = (storyId) => { setActiveView('library'); setLeftPanelOpen(true); setLibKey(null); if (typeof storyId === 'string') setLibStory(storyId); setModal(null); };

  // Keyboard shortcuts. Ignored while typing in a field or when a modifier key is held.
  useEffect(() => {
    function onKey(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const el = e.target;
      if (el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable)) return;
      if (e.key === 'Escape') { if (modal) { e.preventDefault(); setModal(null); } return; }
      if (modal && e.key !== '?') return;
      switch (e.key) {
        case '/':
          e.preventDefault();
          setHomeView(true); setSelStory(null); setSelEp(null);
          setTimeout(() => { const i = document.getElementById('lateral-home-search'); if (i) i.focus(); }, 80);
          break;
        case 'h': setHomeView(true); setSelStory(null); setSelEp(null); break;
        case 'n': e.preventDefault(); setModal('addStory'); break;
        case 'p': e.preventDefault(); setModal('addPrediction'); break;
        case 'l': e.preventDefault(); openLibrary(); break;
        case 'c': e.preventDefault(); openCivic(); break;
        case 'a': e.preventDefault(); setModal('activity'); break;
        case ',': e.preventDefault(); openSettings(); break;
        case 't': toggleTheme(); break;
        case '?': e.preventDefault(); setModal(modal === 'shortcuts' ? null : 'shortcuts'); break;
        default: break;
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  // "Saved copy" buttons elsewhere (e.g. on an episode) ask the Library to open one article.
  useEffect(() => {
    const h = (e) => { openLibrary(); setLibKey(e.detail && e.detail.key ? e.detail.key : null); };
    window.addEventListener('lateral-open-library', h);
    return () => window.removeEventListener('lateral-open-library', h);
  });

  // Keep a saved copy of each source article as episodes are added. The first pass after load only records what already
  // exists (use Library → "Save everything I already track" for those), so opening the app never triggers a surprise batch.
  const archSeenRef = useRef(null);
  useEffect(() => {
    if (!serverReady) return;
    const eps = [];
    (data.stories || []).forEach(s => (s.episodes || []).forEach(e => { if (e.sourceUrl && /^https?:\/\//i.test(e.sourceUrl)) eps.push({ url: e.sourceUrl, title: e.headline || '', storyId: s.id }); }));
    if (archSeenRef.current === null) { archSeenRef.current = new Set(eps.map(x => x.url)); return; }
    const fresh = eps.filter(x => !archSeenRef.current.has(x.url));
    fresh.forEach(x => archSeenRef.current.add(x.url));
    if (fresh.length && settings?.archiveAuto !== false) archivePost('queue', { articles: fresh.slice(0, 50) });
  }, [data.stories, serverReady]);

  // On mount: sync with server.
  // Sets serverSyncReady=true BEFORE calling setData so the triggered save()
  // correctly POSTs back to the server (no more initial-render clobber).
  // Merge per-story by `updatedAt` — this actually does what the old comment
  // here claimed ("server wins only if newer") but the old code never checked:
  // it used to force-apply server data unconditionally whenever the server had
  // any stories at all, which could silently discard a local edit whose save
  // POST simply hadn't landed yet before the next reload (verified: renaming a
  // story then reloading immediately lost the rename this way). Per-story
  // recency comparison fixes that while still picking up stories added via the
  // extension or another origin, which is what this was originally for.
  useEffect(() => {
    fetch('/api/lateral/data')
      .then(r => r.ok ? r.json() : null)
      .then(serverData => {
        serverSyncReady = true;   // unlock server POSTs before any setData
        if (serverData?.stories?.length > 0) {
          setData(localData => {
            const localStories = Array.isArray(localData?.stories) ? localData.stories : [];
            const localById = new Map(localStories.map(s => [s.id, s]));
            const serverIds = new Set(serverData.stories.map(s => s.id));
            const merged = serverData.stories.map(serverStory => {
              const localStory = localById.get(serverStory.id);
              if (!localStory) return serverStory; // server-only — e.g. added via extension
              const localTs  = new Date(localStory.updatedAt  || 0).getTime();
              const serverTs = new Date(serverStory.updatedAt || 0).getTime();
              return localTs > serverTs ? localStory : serverStory;
            });
            const localOnly = localStories.filter(s => !serverIds.has(s.id)); // e.g. added seconds ago, save still in flight
            return { ...serverData, stories: [...merged, ...localOnly] };
          });
        }
        setServerReady(true);
      })
      .catch(() => { serverSyncReady = true; setServerReady(true); }); // unlock even if server is down

    // Sync lightweight settings that should persist across browsers.
    // Only apply server value when local is blank, so existing local prefs stay intact.
    fetch('/api/lateral/settings')
      .then(r => r.ok ? r.json() : null)
      .then(ss => {
        const serverLocation = String(ss?.location || '').trim();
        if (!serverLocation) return;
        setSettings(cur => {
          if (String(cur?.location || '').trim()) return cur;
          return { ...cur, location: serverLocation };
        });
      })
      .catch(() => {})
      .finally(() => { settingsSyncReadyRef.current = true; });

    // Hydrate AI caches from server — first-time / new-browser visitors get
    // all previously generated headlines, intelligence, brief, and discovery
    // without having to wait for regeneration.
    fetch('/api/lateral/cache')
      .then(r => r.ok ? r.json() : null)
      .then(sc => {
        if (!sc) return;
        let changed = false;
        // storyCache: merge with local; newer generatedAt wins per entry
        if (sc.storyCache && Object.keys(sc.storyCache).length) {
          const local = loadCache();
          const base  = { ...sc.storyCache };
          for (const [sid, types] of Object.entries(local)) {
            if (!base[sid]) { base[sid] = types; continue; }
            for (const [type, entry] of Object.entries(types)) {
              if (!base[sid][type] || new Date(entry.generatedAt) > new Date(base[sid][type].generatedAt)) {
                base[sid][type] = entry;
              }
            }
          }
          saveCache(base);
          changed = true;
        }
        // brief: only hydrate if local is empty
        if (sc.brief && !loadBrief()) {
          try { localStorage.setItem(BRIEF_SK, JSON.stringify(sc.brief)); } catch {}
          changed = true;
        }
        // disc: only hydrate if local is empty
        if (sc.disc && !loadDisc()) {
          try { localStorage.setItem(DISC_SK, JSON.stringify(sc.disc)); } catch {}
          changed = true;
        }
        // vale: only hydrate if local is empty
        if (sc.vale && !loadVale()) {
          try { localStorage.setItem(VALE_SK, JSON.stringify(sc.vale)); } catch {}
          changed = true;
        }
        // Bump cacheVer so home view re-renders and shows the hydrated cards
        if (changed) setCacheVer(v => v + 1);
      })
      .catch(() => {});

    // Bootstrap: upload whatever's already in this browser's localStorage so
    // the server cache is seeded immediately (other browsers will get it next load).
    const bootCache = loadCache();
    const bootBrief = loadBrief();
    const bootDisc  = loadDisc();
    const bootVale  = loadVale();
    const bootPayload = {};
    if (Object.keys(bootCache).length) bootPayload.storyCache = bootCache;
    if (bootBrief) bootPayload.brief = bootBrief;
    if (bootDisc)  bootPayload.disc  = bootDisc;
    if (bootVale)  bootPayload.vale  = bootVale;
    if (Object.keys(bootPayload).length) {
      fetch('/api/lateral/cache', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(bootPayload) }).catch(()=>{});
    }

    // Visibility re-sync: when the user tabs back, quietly check if the
    // extension (or another tab) added stories/episodes since last render.
    const onVisible = () => {
      if (document.visibilityState !== 'visible' || !serverSyncReady) return;
      fetch('/api/lateral/data')
        .then(r => r.ok ? r.json() : null)
        .then(serverData => {
          if (serverData) setData(cur => serverIsNewer(serverData, cur) ? serverData : cur);
        })
        .catch(() => {});
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, []);

  const storiesView = useMemo(() => (
    (data.stories || [])
      .filter(s => String(s?.status || '').toLowerCase() !== 'deleted')
      .map(s => ({ ...s, status: effectiveStoryStatus(s, settings) }))
  ), [data.stories, settings?.stalledDays]);

  const story = storiesView.find(s=>s.id===selStory)||null;
  const ep    = story?.episodes?.find(e=>e.id===selEp)||null;

  // Backfill the dek (statusLine) for any story that doesn't have one yet —
  // anything created before this field existed. inceptStory() and
  // regenSummary() already keep it current going forward; this just closes
  // the retroactive gap. One attempt per story per session (tracked in a
  // ref, not state, so a failure doesn't retry on every render), sequential
  // rather than all-at-once so it doesn't pile concurrent requests onto an
  // already-contended Ollama instance.
  const statusLineBackfillRef = useRef(new Set());
  useEffect(() => {
    const missing = storiesView.filter(s => !s.statusLine && !statusLineBackfillRef.current.has(s.id));
    if (!missing.length) return;
    let cancelled = false;
    (async () => {
      for (const s of missing) {
        if (cancelled) return;
        statusLineBackfillRef.current.add(s.id);
        try {
          const statusLine = await generateStatusLineOnly(s, settings);
          if (!cancelled && statusLine) updateStory(s.id, { statusLine });
        } catch {} // best-effort — stays without one until a future attempt
      }
    })();
    return () => { cancelled = true; };
  }, [storiesView, settings]);

  const [refreshingHL,  setRefreshingHL]  = useState(false);
  const [refreshHLDone, setRefreshHLDone] = useState(false);
  const [refreshHLProg, setRefreshHLProg] = useState(null);
  const [refreshLog,    setRefreshLog]    = useState(null); // { lastRunAt, runs[] }

  // Poll server refresh log every 5 minutes
  useEffect(() => {
    async function fetchRefreshLog() {
      try {
        const r = await fetch('/api/lateral/refresh-log');
        if (r.ok) setRefreshLog(await r.json());
      } catch {}
    }
    fetchRefreshLog();
    const t = setInterval(fetchRefreshLog, 5 * 60 * 1000);
    return () => clearInterval(t);
  }, []);

  const briefNudge = React.useMemo(() => {
    const latestRun = refreshLog?.runs?.[0];
    if (!latestRun) return false;
    const briefAt = loadBrief()?.generatedAt;
    if (!briefAt || new Date(latestRun.at) <= new Date(briefAt)) return false;
    return (latestRun.stories || []).some(s => s.coverage === 'growing');
  }, [refreshLog]);

  async function refreshAllHeadlines() {
    const targets = storiesView.filter(s => s.status !== 'resolved' && s.status !== 'buried');
    if (!targets.length || refreshingHL) return;
    setRefreshingHL(true); setRefreshHLDone(false); setRefreshHLProg({ i: 0, total: targets.length, title: '' });
    for (let i = 0; i < targets.length; i++) {
      const s = targets[i];
      setRefreshHLProg({ i: i + 1, total: targets.length, title: s.title });
      try {
        const [r, videoResults] = await Promise.all([
          fetch(`/api/lateral/search?q=${encodeURIComponent(s.title)}&intent=news`, { cache: 'no-store' }),
          fetchVideos(s.title).catch(() => [])
        ]);
        const d = await r.json();
        if (d.articles?.length) {
          const gate = await checkRelevance(storyRelevanceCtx(s), d.articles);
          const existing = getCacheEntry(s.id, 'headlines') || {};
          const socials = Array.isArray(existing.socials) ? existing.socials : [];
          const filteredNow = mergeFiltered(existing.filtered || [], gate.filtered, gate.kept);
          setCacheEntry(s.id, 'headlines', { items: gate.kept, videos: videoResults.slice(0, 8), socials, filtered: filteredNow });
          touchStoryUpdatedAt(s.id);
          window.dispatchEvent(new CustomEvent('lateral-headlines-updated', { detail: { storyId: s.id } }));
        }
      } catch {}
    }
    setRefreshingHL(false); setRefreshHLProg(null); setRefreshHLDone(true);
    setTimeout(() => setRefreshHLDone(false), 3000);
  }

  function addStory(s) { setData(d=>({...d,stories:[...d.stories,s]})); setSelStory(s.id); setSelEp(s.episodes?.[0]?.id||null); setHomeView(false); }

  function addEpisodeFromBrief(briefData, targetStory) {
    if (!briefData || !targetStory?.id) return;
    // The global cross-story brief (HomePanel) nests per-story data under storyBriefs[].brief;
    // the per-story brief (StoryDashboard) IS the brief object itself. Support both shapes.
    const storyBrief = Array.isArray(briefData.storyBriefs)
      ? briefData.storyBriefs.find(sb => sb?.story?.id === targetStory.id)?.brief
      : null;
    const brief = storyBrief || briefData;

    const summaryParts = [];
    const pushList = (label, items) => {
      const arr = (Array.isArray(items) ? items : []).map(i => String(i || '').trim()).filter(Boolean);
      if (arr.length) summaryParts.push(`${label}:\n` + arr.map(i => `• ${i}`).join('\n'));
    };
    if (briefData.execSummary && !storyBrief) summaryParts.push(briefData.execSummary.trim());
    pushList('Key Developments', brief?.keyDevelopments);
    pushList('Key Points', brief?.keyPoints);
    if (Array.isArray(brief?.keyPlayers) && brief.keyPlayers.length) {
      const players = brief.keyPlayers.map(p => {
        const name = String(p?.name || '').trim();
        const role = String(p?.role || '').trim();
        return name ? `• ${name}${role ? ` — ${role}` : ''}` : '';
      }).filter(Boolean);
      if (players.length) summaryParts.push('Key Players:\n' + players.join('\n'));
    }
    pushList('Watch Signals', brief?.watchSignals);
    pushList('Information Gaps', brief?.informationGaps);
    pushList('Actionable Items', brief?.actionableItems);
    pushList('Likely Next Steps', brief?.likelyNextSteps);
    if (brief?.valeReport?.message) summaryParts.push(`Live Web Intelligence:\n${brief.valeReport.message}`);
    const summaryText = summaryParts.join('\n\n') || 'Brief generated with no narrative content captured.';

    const framingParts = [];
    if (brief?.velocity) framingParts.push(`Velocity: ${brief.velocity}${brief.velocityNote ? ` — ${brief.velocityNote}` : ''}`);
    if (brief?.sourceDiversityFlag) framingParts.push(`Source Diversity: ${brief.sourceDiversityFlag}${brief.sourceDiversityNote ? ` — ${brief.sourceDiversityNote}` : ''}`);
    const framingNote = framingParts.join('\n');

    const cachedHeadlines = getCacheEntry(targetStory.id, 'headlines')?.items || [];
    const sourceLinks = resolveRenderSources(brief?.valeReport?.message || '', brief?.valeReport?.sources, cachedHeadlines);

    const ep = {
      id: uid(),
      date: now().slice(0, 10),
      type: 'development',
      episodeType: 'brief',
      headline: `Intelligence Brief — ${targetStory.title}`,
      summary: summaryText,
      framingNote,
      sourceUrl: '',
      sourceLinks,
      addedAt: now(),
    };
    addEpisode(ep, targetStory.id);
  }

  function addEpisode(episode, targetStoryId) {
    const storyId = targetStoryId || selStory;
    const epActors = [...(episode._suggestedActors||[]), ...(episode.actors||[])];
    const epTags   = episode.tags||[];
    delete episode._suggestedActors;
    setData(d=>({...d,stories:d.stories.map(s=>{
      if(s.id!==storyId)return s;
      return {
        ...s,
        episodes: [...(s.episodes||[]),episode],
        actors:   [...new Set([...(s.actors||[]),...epActors])],
        tags:     [...new Set([...(s.tags||[]),...epTags])],
        updatedAt: now()
      };
    })}));
    setSelEp(episode.id);
  }

  function updateEpisode(epId, changes) {
    setData(d => ({
      ...d,
      stories: d.stories.map(s => {
        if (s.id !== selStory) return s;
        const storyActors = changes.actors
          ? [...new Set([...(s.actors||[]), ...changes.actors])]
          : s.actors;
        const storyTags = changes.tags
          ? [...new Set([...(s.tags||[]), ...changes.tags])]
          : s.tags;
        return {
          ...s,
          actors: storyActors,
          tags: storyTags,
          episodes: (s.episodes||[]).map(e => e.id === epId ? {...e, ...changes} : e),
          updatedAt: now()
        };
      })
    }));
  }

  function updateStory(storyId, changes) {
    setData(d => ({
      ...d,
      stories: d.stories.map(s => s.id === storyId ? { ...s, ...changes, updatedAt: now() } : s)
    }));
  }

  function addEpisodeFromHeadline(article, titleText) {
    const epId = uid();
    const baseDate = article.date ? article.date.slice(0,10) : now().slice(0,10);
    addEpisode({
      id: epId,
      date: baseDate,
      type: 'development',
      headline: titleText,
      summary: '',
      framingNote: '',
      sourceUrl: article.url || '',
      imageUrl: article.imageUrl || '',
      videoUrl: article.videoUrl || '',
      socialPlatform: article.socialPlatform || '',
      socialSource: article.socialSource || '',
      addedAt: now(),
    });

    // The episode is on the timeline immediately (instant feedback, same as
    // before) — then draft its summary/framing in the background, same AI
    // analysis the manual "Add Episode via URL" flow already does, instead of
    // leaving a bare headline that requires a separate "Analyze" click later.
    // Best-effort: if this fails (Ollama busy, fetch blocked), the bare
    // episode from above is still there, exactly like today.
    const analysisStory = story;
    if (analysisStory) {
      (async () => {
        try {
          const text = article.url ? await fetchText(article.url) : null;
          const r = await analyzeEpisode(text || titleText, analysisStory, settings);
          updateEpisode(epId, {
            date: r.date || baseDate,
            type: r.type || 'development',
            summary: r.summary || '',
            framingNote: r.framingNote || '',
            tags: Array.isArray(r.tags) ? r.tags : [],
            actors: Array.isArray(r.actors) ? r.actors : [],
          });
        } catch {}
      })();
    }
  }

  function addEpisodeFromPodcast(podcast) {
    if (!podcast) return;
    const headline = String(podcast.title || 'Podcast episode').trim();
    const podcastTitle = String(podcast.podcastTitle || '').trim();
    const summary = String(podcast.summary || '').trim();
    const sourceUrl = String(podcast.url || '').trim();
    const textSummary = [podcastTitle ? `From ${podcastTitle}.` : '', summary].filter(Boolean).join(' ');
    addEpisode({
      id: uid(),
      date: podcast.date ? String(podcast.date).slice(0,10) : now().slice(0,10),
      type: 'development',
      headline,
      summary: textSummary,
      framingNote: 'Imported from podcast context search.',
      sourceUrl,
      imageUrl: podcast.imageUrl || '',
      videoUrl: '',
      audioUrl: podcast.audioUrl || '',
      podcastTitle,
      socialPlatform: '',
      socialSource: podcast.source?.name || podcastTitle || 'Podcast',
      addedAt: now(),
    });
  }

  function addEpisodeFromCard(article, storyId) {
    const ep = {
      id: uid(),
      date: article.date ? article.date.slice(0,10) : now().slice(0,10),
      type: 'development',
      headline: article.title,
      summary: '',
      framingNote: '',
      sourceUrl: article.url || '',
      addedAt: now(),
    };
    addEpisode(ep, storyId);
    setSelStory(storyId);
    setHomeView(false);
  }

  function deleteEpisode(epId) {
    setData(d=>({...d,stories:d.stories.map(s=>s.id!==selStory?s:{...s,episodes:(s.episodes||[]).filter(e=>e.id!==epId),updatedAt:now()})}));
    if (selEp===epId) setSelEp(null);
  }

  function deleteStory(storyId) {
    setData(d=>({
      ...d,
      stories:d.stories.map(s=>s.id===storyId
        ? { ...s, status:'deleted', deletedAt: now(), updatedAt: now() }
        : s)
    }));
    if (selStory===storyId) { setSelStory(null); setSelEp(null); }
  }

  function purgeDeletedStories() {
    let removedCount = 0;
    setData(d => {
      const allStories = Array.isArray(d?.stories) ? d.stories : [];
      const keptStories = allStories.filter(s => String(s?.status || '').toLowerCase() !== 'deleted');
      removedCount = Math.max(0, allStories.length - keptStories.length);
      if (removedCount === 0) return d;
      const next = { ...d, stories: keptStories };
      // Persist immediately so extension/API consumers stop seeing deleted rows.
      save(next);
      return next;
    });
    return removedCount;
  }

  function reorderStories(sourceId, targetId, edge='before') {
    if (!sourceId || !targetId || sourceId===targetId) return;
    setData(d => {
      const stories = [...(d.stories||[])];
      const fromIdx = stories.findIndex(s => s.id===sourceId);
      if (fromIdx < 0) return d;
      const [moved] = stories.splice(fromIdx, 1);
      let toIdx = stories.findIndex(s => s.id===targetId);
      if (toIdx < 0) return d;
      if (edge === 'after') toIdx += 1;
      stories.splice(toIdx, 0, moved);
      return { ...d, stories };
    });
  }

  function resolveStory(storyId) {
    const target = (data.stories || []).find(s => s.id === storyId);
    if (!target) return;
    const nextStatus = target.status === 'resolved' ? 'active' : 'resolved';
    if (nextStatus === 'active') {
      setData(d=>({...d,stories:d.stories.map(s=>s.id===storyId?{...s,status:'active',resolutionGenerating:false,updatedAt:now()}:s)}));
      return;
    }

    setData(d=>({...d,stories:d.stories.map(s=>s.id===storyId?{...s,status:'resolved',resolutionGenerating:true,resolutionError:'',resolvedAt:now(),updatedAt:now()}:s)}));

    generateResolutionSummary(target, settings)
      .then(summary => {
        setData(d => ({
          ...d,
          stories: d.stories.map(s => {
            if (s.id !== storyId) return s;
            if (s.status !== 'resolved') return s;
            return {
              ...s,
              resolution: summary || null,
              resolutionGeneratedAt: now(),
              resolutionGenerating: false,
              resolutionError: '',
              updatedAt: now()
            };
          })
        }));
      })
      .catch(e => {
        setData(d => ({
          ...d,
          stories: d.stories.map(s => s.id===storyId ? { ...s, resolutionGenerating:false, resolutionError:e.message||'Failed to generate summary', updatedAt:now() } : s)
        }));
      });
  }

  async function handleRegen() {
    if (!story||aiLoading) return;
    setAiLoading(true);
    try { const r=await regenSummary(story,settings); setData(d=>({...d,stories:d.stories.map(s=>s.id===selStory?{...s,summary:r.summary||s.summary,statusLine:r.statusLine||s.statusLine,updatedAt:now()}:s)})); }
    catch(e) { console.error(e); }
    setAiLoading(false);
  }

  function touchStoryUpdatedAt(storyId) {
    if (!storyId) return;
    setData(d => ({
      ...d,
      stories: d.stories.map(s => s.id === storyId ? { ...s, updatedAt: now() } : s)
    }));
  }

  return (
    <ThemeContext.Provider value={{ theme, toggleTheme, setThemeTo }}>
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:C.bg}}>
      <header style={{position:'relative',flexShrink:0,display:'flex',flexDirection:'column',padding:isMobile?'8px 12px':'0 20px',background:C.surface,borderBottom:`1px solid ${C.borderLight}`,boxShadow:'0 1px 3px rgba(0,0,0,0.06)',gap:isMobile?8:0}}>
        <div style={{height:isMobile?'auto':52,display:'flex',alignItems:'center',gap:10,minWidth:0}}>
          {isMobile && (
            <button
              onClick={()=>setLeftPanelOpen(true)}
              title="Open story panel"
              style={{width:34,height:34,borderRadius:9,border:`1px solid ${C.border}`,background:C.bg,color:C.text,cursor:'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',padding:0,flexShrink:0}}
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7H20" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                <path d="M4 12H20" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                <path d="M4 17H20" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
              </svg>
            </button>
          )}
          <div style={{display:'flex',alignItems:'center',gap:10,flex:1,minWidth:0,overflow:'hidden'}}>
            <span onClick={()=>{setHomeView(true);setSelStory(null);setSelEp(null);}} style={{fontSize:19,fontWeight:900,color:C.text,letterSpacing:'-0.5px',fontFamily:"'Playfair Display', Georgia, serif",cursor:'pointer',userSelect:'none',flexShrink:0}}>LATERAL</span>
            {!isMobile && (
              <>
                <svg width="60" height="10" viewBox="0 0 60 10" style={{flexShrink:0}}>
                  <line x1="0" y1="5" x2="60" y2="5" stroke={theme === 'midnight' ? '#3d3058' : theme === 'ledger' ? '#a9bfac' : '#e2e8f0'} strokeWidth="2"/>
                  <circle cx="10" cy="5" r="3" fill="#2563eb"/>
                  <circle cx="28" cy="5" r="3" fill="#059669"/>
                  <circle cx="44" cy="5" r="3" fill="#dc2626"/>
                  <circle cx="58" cy="5" r="3" fill="#d97706"/>
                </svg>
                <span style={{fontSize:11.5,color:C.textMute,fontStyle:'italic',whiteSpace:'nowrap'}}>narrative memory</span>
                {refreshLog?.lastRunAt && (
                  <span title="Last automatic headline refresh" style={{fontSize:10.5,color:C.textMute,opacity:0.7,whiteSpace:'nowrap'}}>
                    · auto-refresh {fmtHoursAgo(refreshLog.lastRunAt)}
                  </span>
                )}
              </>
            )}
          </div>
          {!isMobile && storiesView.some(s=>s.episodes?.length>0) && (
            <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0,marginRight:8}}>
              <NavActions refreshingHL={refreshingHL} refreshHLDone={refreshHLDone} refreshHLProg={refreshHLProg} onRefresh={refreshAllHeadlines}
                briefNudge={briefNudge} onBrief={()=>setModal('brief')} showNotebook={NOTEBOOKLM_EXPORT_ENABLED} onNotebook={()=>setModal('export')}
                onMap={()=>setModal('map')}/>
            </div>
          )}
          <button className="tb-icon" onClick={()=>setModal('activity')} title={alertsUnread.unread ? `Activity: ${alertsUnread.unread} unread (press a)` : 'Activity (press a)'} style={{position:'relative'}}>
            <LIcon size={18}>{ICONS.bell}</LIcon>
            {alertsUnread.unread > 0 && <span style={{position:'absolute',top:3,right:2,minWidth:15,height:15,padding:'0 4px',borderRadius:8,background:alertsUnread.important ? '#dc2626' : 'var(--accent)',color:'#fff',fontSize:9.5,fontWeight:800,lineHeight:'15px',textAlign:'center',boxSizing:'border-box'}}>{alertsUnread.unread > 9 ? '9+' : alertsUnread.unread}</span>}
          </button>
          <button className="tb-icon" onClick={()=>setModal('settings')} title="Settings (press ,)"><LIcon size={18}>{ICONS.gear}</LIcon></button>
          {isMobile && (
            <button
              onClick={()=>setMobileRightPanelOpen(true)}
              title="Open details panel"
              style={{width:34,height:34,borderRadius:9,border:`1px solid ${C.border}`,background:C.bg,color:C.text,cursor:'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',padding:0,flexShrink:0}}
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 6L15 12L9 18" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          )}
          <button className="tb-icon" onClick={toggleTheme} title={`Theme: ${themeById(theme).label} — click for ${THEMES[(THEMES.findIndex(t => t.id === theme) + 1) % THEMES.length].label} (or press t)`}>{themeById(theme).icon}</button>
        </div>
        {isMobile && (
          <div style={{display:'flex',flexWrap:'wrap',gap:8,paddingBottom:4}}>
            {storiesView.some(s=>s.episodes?.length>0) && (
              <NavActions refreshingHL={refreshingHL} refreshHLDone={refreshHLDone} refreshHLProg={refreshHLProg} onRefresh={refreshAllHeadlines}
                briefNudge={briefNudge} onBrief={()=>setModal('brief')} showNotebook={NOTEBOOKLM_EXPORT_ENABLED} onNotebook={()=>setModal('export')}
                onMap={()=>setModal('map')}/>
            )}
          </div>
        )}
      </header>
      {showTavilyWarning && (
        <div style={{flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,padding:'8px 14px',background:'#fef3c7',borderBottom:'1px solid #fcd34d',color:'#92400e',fontSize:13}}>
          <span>
            <strong>⚠ Tavily usage at {tavilyUsage.percentage}%</strong>
            {' — intelligence features may stop working when credits run out.'}
          </span>
          <button
            onClick={dismissTavilyWarning}
            style={{flexShrink:0,background:'transparent',border:'1px solid #d97706',borderRadius:6,color:'#92400e',fontSize:11,fontWeight:600,padding:'3px 10px',cursor:'pointer'}}
          >
            Dismiss
          </button>
        </div>
      )}
      {healthProblem && !healthDismissed && (
        <div style={{flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,padding:'8px 14px',background:'#fee2e2',borderBottom:'1px solid #fca5a5',color:'#991b1b',fontSize:13}}>
          <span><strong>Setup needs attention:</strong> {healthProblem.label} — {healthProblem.detail}</span>
          <span style={{display:'flex',gap:8,flexShrink:0}}>
            <button onClick={()=>openSettings('status')} style={{background:'#991b1b',border:'none',borderRadius:6,color:'#fff',fontSize:11,fontWeight:700,padding:'3px 10px',cursor:'pointer'}}>See what to do</button>
            <button onClick={()=>setHealthDismissed(true)} style={{background:'transparent',border:'1px solid #dc2626',borderRadius:6,color:'#991b1b',fontSize:11,fontWeight:600,padding:'3px 10px',cursor:'pointer'}}>Dismiss</button>
          </span>
        </div>
      )}
      <div style={{flex:1,display:'flex',overflow:'hidden',position:'relative'}}>
        {!isMobile && (
          <LeftPanel
            stories={storiesView}
            selectedId={selStory}
            onSelect={id=>{setSelStory(id);setSelEp(null);setHomeView(false);}}
            onNew={()=>setModal('addStory')}
            onNewPrediction={()=>setModal('addPrediction')}
            onDeleteStory={deleteStory}
            onReorderStories={reorderStories}
            isOpen={leftPanelOpen}
            onOpen={()=>setLeftPanelOpen(true)}
            onClose={()=>setLeftPanelOpen(false)}
            activeView={activeView}
            onViewChange={setActiveView}
            libraryNode={<LibraryList stories={storiesView} selectedKey={libKey} onOpen={setLibKey} filterStory={libStory} onFilterStory={setLibStory} tick={libTick}/>} civicNode={<CivicList civic={civic} selKey={civicSel} onSelect={setCivicSel}/>}
          />
        )}
        {isMobile && (
          <MobileDrawer side={'left'} open={leftPanelOpen} onClose={()=>setLeftPanelOpen(false)} width={304} label="Stories, predictions, library and civic">
            <LeftPanel
              stories={storiesView}
              selectedId={selStory}
              onSelect={id=>{setSelStory(id);setSelEp(null);setHomeView(false);setLeftPanelOpen(false);}}
              onNew={()=>{setModal('addStory');setLeftPanelOpen(false);}}
              onNewPrediction={()=>{setModal('addPrediction');setLeftPanelOpen(false);}}
              onDeleteStory={deleteStory}
              onReorderStories={reorderStories}
              isOpen={true}
              fluid
              onOpen={()=>setLeftPanelOpen(true)}
              onClose={()=>setLeftPanelOpen(false)}
              activeView={activeView}
              onViewChange={setActiveView}
              libraryNode={<LibraryList stories={storiesView} selectedKey={libKey} onOpen={setLibKey} filterStory={libStory} onFilterStory={setLibStory} tick={libTick}/>} civicNode={<CivicList civic={civic} selKey={civicSel} onSelect={setCivicSel}/>}
            />
          </MobileDrawer>
        )}
        <div style={{flex:1,minWidth:0,display:'flex',overflow:'hidden'}}>
          {activeView==='civic'
            ? <CivicCenter civic={civic} selKey={civicSel} onSelect={setCivicSel} onChange={p => { setCivic(p); setCivicSel(null); }} onUpdate={setCivic} onAddStory={addStory} onOpenStory={openStoryById} onStartStory={a=>{setPrefillArticle(a);setModal('addStory');}}/>
            : activeView==='library'
            ? <LibraryCenter keyId={libKey} stories={storiesView} onSelectKey={setLibKey} onFilterStory={setLibStory} onOpenStory={id=>{const st=storiesView.find(x=>x.id===id); setActiveView(st&&st.predictionId?'predictions':'stories'); setSelStory(id); setSelEp(null); setHomeView(false);}} onChanged={()=>setLibTick(t=>t+1)} tick={libTick}/>
            : homeView
            ? <HomePanel stories={storiesView} settings={settings} serverReady={serverReady} onStartStory={a=>{setPrefillArticle(a);setModal('addStory');}} onAddEpisode={addEpisodeFromCard} onSelectStory={id=>{setSelStory(id);setHomeView(false);}} refreshing={refreshingHL} refreshProg={refreshHLProg} refreshDone={refreshHLDone} refreshLog={refreshLog}/>
            : <CenterPanel onOpenLibrary={openLibrary} story={story} selEpId={selEp} onSelEp={id=>setSelEp(id)} onAddEp={()=>setModal('addEpisode')} onDiscover={()=>setModal('discover')} onRegen={handleRegen} aiLoading={aiLoading} onDeleteEp={deleteEpisode} settings={settings} onAddFromHeadline={addEpisodeFromHeadline} onAddPodcast={addEpisodeFromPodcast} onStoryRefreshed={touchStoryUpdatedAt} onSaveBriefAsEpisode={addEpisodeFromBrief} onBackfill={()=>setModal('backfill')} onUpdateStory={updateStory}/>
          }
        </div>
        {!isMobile && (
          <RightPanel story={story} ep={ep} onDeleteEp={deleteEpisode} onUpdateEp={updateEpisode} settings={settings} stories={storiesView} onAddStory={addStory} onAddEpisode={addEpisode} onResolveStory={resolveStory} onDeleteStory={deleteStory} onPopOut={setFloatingPlayer} onWidthChange={setRightPanelWidth} civicNode={civicPanel}/>
        )}
        {isMobile && (
          <MobileDrawer side={'right'} open={mobileRightPanelOpen} onClose={()=>setMobileRightPanelOpen(false)} width={Math.min(Math.max(rightPanelWidth, 260), 360)} label="Details">
            <RightPanel story={story} ep={ep} onDeleteEp={deleteEpisode} onUpdateEp={updateEpisode} settings={settings} stories={storiesView} onAddStory={addStory} onAddEpisode={addEpisode} onResolveStory={resolveStory} onDeleteStory={deleteStory} onPopOut={setFloatingPlayer} onWidthChange={setRightPanelWidth} isMobile={true} civicNode={civicPanel}/>
          </MobileDrawer>
        )}
      </div>
      <ChatDrawer story={story} stories={storiesView} leftPanelOpen={isMobile ? false : leftPanelOpen} rightPanelWidth={isMobile ? 0 : rightPanelWidth} onAddEpisode={addEpisode} isMobile={isMobile}/>
      {modal==='addStory'   && <AddStoryModal onClose={()=>{setModal(null);setPrefillArticle(null);}} onAdd={addStory} settings={settings} prefill={prefillArticle}/>}
      {modal==='addPrediction' && <AddPredictionModal onClose={()=>setModal(null)} onAdd={addStory}/>}
      {trackBill && <TrackBillModal item={trackBill} onClose={()=>setTrackBill('')} onCreated={d => {
        setTrackBill('');
        if (d.existing) { openStoryById('pred-' + d.existing.predictionId.slice(0, 8)); return; }
        addStory({ ...d.story, status: 'active', actors: [], createdAt: now(), updatedAt: now(), episodes: [] });
        setActiveView('predictions');
      }}/>}
      {modal==='addEpisode' && story && <AddEpisodeModal story={story} onClose={()=>setModal(null)} onAdd={addEpisode} settings={settings}/>}
      {modal==='backfill'   && story && <BackfillModal story={story} onClose={()=>setModal(null)} onAdd={addEpisode} settings={settings}/>}
      {modal==='discover'   && story && <DiscoverModal story={story} onClose={()=>setModal(null)} onAdd={addEpisode} settings={settings}/>}
      {modal==='settings'   && <SettingsModal settings={settings} onSave={setSettings} onClose={()=>{setModal(null);setSettingsTab(null);}}onPurgeDeletedStories={purgeDeletedStories} tavilyUsage={tavilyUsage} setTavilyUsage={setTavilyUsage} initialTab={settingsTab} onShowShortcuts={()=>setModal('shortcuts')} stories={storiesView}/>}
      {modal==='activity'   && <ActivityModal onClose={()=>{setModal(null);refreshAlerts();}} onOpenStory={openStoryById} onOpenSettings={()=>openSettings('alerts')} onChanged={refreshAlerts}/>}
      {modal==='shortcuts'  && (
        <Modal title="Keyboard shortcuts" onClose={()=>setModal(null)} maxWidth={420}>
          {[['/','Search the news'],['h','Home'],['n','New story'],['p','New prediction'],['l','Library (saved articles)'],['c','Civic (who represents you)'],['a','Activity and alerts'],[',','Settings'],['t','Switch theme'],['?','This list'],['Esc','Close a window']].map(([k,d]) => (
            <div key={k} style={{display:'flex',alignItems:'center',gap:14,padding:'7px 0',borderBottom:`1px solid ${C.borderLight}`}}>
              <kbd style={{minWidth:34,textAlign:'center',padding:'2px 8px',borderRadius:5,border:`1px solid ${C.border}`,background:C.surface,color:C.text,fontSize:12,fontWeight:700,fontFamily:'inherit'}}>{k}</kbd>
              <span style={{fontSize:13,color:C.text}}>{d}</span>
            </div>
          ))}
          <div style={{fontSize:11,color:C.textMute,marginTop:10}}>Shortcuts are off while you’re typing in a box.</div>
        </Modal>
      )}
      {modal==='brief'      && <BriefModal stories={storiesView} settings={settings} onClose={()=>setModal(null)}/>}
      {NOTEBOOKLM_EXPORT_ENABLED && modal==='export' && <ExportModal stories={storiesView} onClose={()=>setModal(null)}/>}
      {modal==='map'        && <SpiderMapModal stories={storiesView} onClose={()=>setModal(null)} onSelectStory={id=>{setSelStory(id);setSelEp(null);setHomeView(false);setModal(null);}}/>}
      <FloatingAudioPlayer player={floatingPlayer} onClose={() => setFloatingPlayer(null)}/>
    </div>
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
