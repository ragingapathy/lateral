        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{display:'flex',gap:10}}>
            <button onClick={()=>setSel(new Set(stories.map(s=>s.id)))} style={{fontSize:11.5,color:C.accent,background:'none',border:'none',cursor:'pointer',fontWeight:700,padding:0}}>All</button>
            <button onClick={()=>setSel(new Set())} style={{fontSize:11.5,color:C.textMute,background:'none',border:'none',cursor:'pointer',fontWeight:600,padding:0}}>None</button>
          </div>
          <Btn onClick={goToMap} disabled={sel.size===0}>Map {sel.size} stor{sel.size===1?'y':'ies'} →</Btn>
        </div>
      </div>
    </div>
  );

  // ── MAP PHASE ────────────────────────────────────────────────────────────
  const { nodes, edges } = mapData;
  const nodeById   = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const crossEdges = edges.filter(e=>e.type!=='ep');
  const totalEps   = selStories.reduce((a,s)=>a+(s.episodes||[]).length,0);
  const safeTooltip = (tooltip && Number.isFinite(tooltip.x) && Number.isFinite(tooltip.y) && typeof tooltip.type === 'string')
    ? tooltip
    : null;
  const episodeNodes = nodes
    .filter(n=>n.type==='episode')
    .sort((a,b)=>(a.id===hoverNodeId?1:0)-(b.id===hoverNodeId?1:0));
  const storyNodes = nodes
    .filter(n=>n.type==='story')
    .sort((a,b)=>(a.id===hoverNodeId?1:0)-(b.id===hoverNodeId?1:0));

  return (
    <div style={{position:'fixed',inset:0,background:C.bg,zIndex:1100,display:'flex',flexDirection:'column',userSelect:'none'}}>

      {/* ── Header ── */}
      <div style={{height:50,flexShrink:0,display:'flex',alignItems:'center',padding:'0 18px',background:C.surface,borderBottom:`1px solid ${C.border}`,gap:14,boxShadow:'0 1px 3px rgba(0,0,0,0.05)'}}>
        <button onClick={()=>setPhase('select')} style={{border:'none',background:'none',fontSize:12,color:C.accent,cursor:'pointer',fontWeight:700,padding:'4px 0',letterSpacing:'0.02em'}}>← Back</button>
        <span style={{fontWeight:900,fontSize:15,color:C.text,fontFamily:"'Playfair Display',Georgia,serif",letterSpacing:'-0.3px'}}>⬡ Spider Map</span>
        <span style={{fontSize:11,color:C.textMute,borderLeft:`1px solid ${C.border}`,paddingLeft:14}}>
          {selStories.length} stor{selStories.length===1?'y':'ies'} · {totalEps} episode{totalEps!==1?'s':''}
          {crossEdges.length>0?` · ${crossEdges.length} connection${crossEdges.length>1?'s':''}` : ''}
        </span>
        <div style={{flex:1}}/>
        {crossEdges.length===0&&(
          <span style={{fontSize:11,color:'#92400e',background:'#fef9c3',padding:'3px 10px',borderRadius:20,fontWeight:600}}>No strong links yet — add more episodes/tags/players</span>
        )}
        <button onClick={()=>setShowAllTags(v=>!v)}
          style={{fontSize:11,color:showAllTags?C.accent:C.textMid,border:`1px solid ${showAllTags?C.accent:C.border}`,background:'none',cursor:'pointer',padding:'4px 11px',borderRadius:6,fontWeight:600,transition:'all 0.15s'}}>
          Tags
        </button>
        <button onClick={()=>setShowAllPlayers(v=>!v)}
          style={{fontSize:11,color:showAllPlayers?C.accent:C.textMid,border:`1px solid ${showAllPlayers?C.accent:C.border}`,background:'none',cursor:'pointer',padding:'4px 11px',borderRadius:6,fontWeight:600,transition:'all 0.15s'}}>
          Players
        </button>
        <button onClick={()=>setShowLegend(v=>!v)}
          style={{fontSize:11,color:showLegend?C.accent:C.textMid,border:`1px solid ${showLegend?C.accent:C.border}`,background:'none',cursor:'pointer',padding:'4px 11px',borderRadius:6,fontWeight:600,transition:'all 0.15s'}}>
          Legend
        </button>
        <div style={{display:'flex',gap:4,alignItems:'center',padding:'3px 5px',borderRadius:8,background:'#c4b5fd',border:'1px solid #a78bfa'}}>
          <button onClick={exportMapSvg}
            style={{fontSize:11,color:'#312e81',border:'1px solid #a78bfa',background:'#ddd6fe',cursor:'pointer',padding:'3px 8px',borderRadius:6,fontWeight:700}}>
            SVG
          </button>
          <button onClick={exportMapPng}
            style={{fontSize:11,color:'#312e81',border:'1px solid #a78bfa',background:'#ddd6fe',cursor:'pointer',padding:'3px 8px',borderRadius:6,fontWeight:700}}>
            PNG
          </button>
          <button onClick={exportMapPdf}
            style={{fontSize:11,color:'#312e81',border:'1px solid #a78bfa',background:'#ddd6fe',cursor:'pointer',padding:'3px 8px',borderRadius:6,fontWeight:700}}>
            PDF
          </button>
        </div>
        <button onClick={onClose} style={{border:'none',background:'none',fontSize:20,cursor:'pointer',color:C.textMute,lineHeight:1,padding:'0 4px'}}>×</button>
      </div>

      {/* ── Canvas ── */}
      <div ref={containerRef} style={{flex:1,overflow:'hidden',cursor:isPanning?'grabbing':'grab',position:'relative'}}
        onPointerDown={onPD} onPointerMove={onPM} onPointerUp={onPU} onPointerCancel={onPU} onLostPointerCapture={onPU}>
        <div data-map-ui="true" style={{position:'absolute',top:12,left:12,zIndex:1150,width:300,maxWidth:'calc(100vw - 24px)'}} onPointerDown={e=>e.stopPropagation()}>
          <div style={{background:`${C.surface}f2`,border:`1px solid ${C.border}`,borderRadius:10,padding:'9px 10px',backdropFilter:'blur(4px)',boxShadow:'0 8px 24px rgba(0,0,0,0.12)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:7}}>
              <div style={{fontSize:11,fontWeight:800,color:C.text,letterSpacing:'0.06em',textTransform:'uppercase'}}>Tag Key</div>
              {activeTagNorm && <button onClick={()=>setActiveTag('')} style={{fontSize:10.5,color:C.accent,border:'none',background:'none',cursor:'pointer',padding:0,fontWeight:700}}>Clear</button>}
            </div>
            {tagMeta.topTags.length===0
              ? <div style={{fontSize:11.5,color:C.textMute}}>No tags available in selected stories.</div>
              : <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {tagMeta.topTags.map(t => {
                    const on = activeTagNorm === t.tag;
                    return (
                      <button key={t.tag} onClick={()=>{ setActiveTag(on?'':t.tag); setActivePlayer(''); }}
                        style={{fontSize:11,padding:'3px 8px',borderRadius:999,border:`1px solid ${on?C.accent:C.border}`,background:on?`${C.accent}22`:'transparent',color:on?C.accent:C.textMid,cursor:'pointer',fontWeight:on?700:600}}>
                        {t.tag} · {t.count}
                      </button>
                    );
                  })}
                </div>}
            {tagMeta.extraTags.length>0 && (
              <button
                onClick={()=>setShowAllTags(v=>!v)}
                style={{marginTop:7,fontSize:10.5,color:C.accent,background:'none',border:'none',padding:0,cursor:'pointer',fontWeight:700}}
              >
                {showAllTags ? 'Hide extra tags' : `+ ${tagMeta.extraTags.length} more tags`}
              </button>
            )}
          </div>
          {showAllTags && tagMeta.extraTags.length>0 && (
            <div style={{marginTop:8,background:`${C.surface}fa`,border:`1px solid ${C.border}`,borderRadius:10,padding:'10px',maxHeight:280,overflowY:'auto',backdropFilter:'blur(3px)',boxShadow:'0 8px 24px rgba(0,0,0,0.12)'}}>
              <input
                value={tagSearch}
                onChange={e=>setTagSearch(e.target.value)}
                placeholder="Search tags…"
                style={{...inputStyle,background:C.bg,padding:'6px 9px',fontSize:11.5,marginBottom:8}}
              />
              {orderedExtraGroups.length===0
                ? <div style={{fontSize:11.5,color:C.textMute}}>No tags match that search.</div>
                : orderedExtraGroups.map(([group, items])=>{
                    const expanded = openTagGroups[group] !== false;
                    return (
                    <div key={group} style={{marginBottom:8}}>
                      <button
                        onClick={()=>setOpenTagGroups(prev=>({ ...prev, [group]: !expanded }))}
                        style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',background:'none',border:'none',padding:0,cursor:'pointer',marginBottom:expanded?5:0}}
                      >
                        <span style={{fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.06em'}}>{group}</span>
                        <span style={{fontSize:10,color:C.textMute}}>{expanded ? '▾' : '▸'}</span>
                      </button>
                      {expanded && (
                        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                          {items.map(t => {
                            const on = activeTagNorm === t.tag;
                            return (
                              <button key={t.tag} onClick={()=>{ setActiveTag(on?'':t.tag); setActivePlayer(''); }}
                                style={{fontSize:10.5,padding:'2px 7px',borderRadius:999,border:`1px solid ${on?C.accent:C.border}`,background:on?`${C.accent}22`:'transparent',color:on?C.accent:C.textMid,cursor:'pointer',fontWeight:on?700:600}}>
                                {t.tag} · {t.count}
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </div>
                    );
                  })}
            </div>
          )}
        </div>
        <div data-map-ui="true" style={{position:'absolute',top:12,right:12,zIndex:1150,width:300,maxWidth:'calc(100vw - 24px)'}} onPointerDown={e=>e.stopPropagation()}>
          <div style={{background:`${C.surface}f2`,border:`1px solid ${C.border}`,borderRadius:10,padding:'9px 10px',backdropFilter:'blur(4px)',boxShadow:'0 8px 24px rgba(0,0,0,0.12)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:7}}>
              <div style={{fontSize:11,fontWeight:800,color:C.text,letterSpacing:'0.06em',textTransform:'uppercase'}}>Key Players</div>
              {activePlayerNorm && <button onClick={()=>setActivePlayer('')} style={{fontSize:10.5,color:C.accent,border:'none',background:'none',cursor:'pointer',padding:0,fontWeight:700}}>Clear</button>}
            </div>
            {playerMeta.topPlayers.length===0
              ? <div style={{fontSize:11.5,color:C.textMute}}>No key players in selected stories.</div>
              : <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {playerMeta.topPlayers.map(p => {
                    const on = activePlayerNorm === p.norm;
                    return (
                      <button key={p.norm} onClick={()=>{ setActivePlayer(on?'':p.norm); setActiveTag(''); }}
                        style={{fontSize:11,padding:'3px 8px',borderRadius:999,border:`1px solid ${on?C.accent:C.border}`,background:on?`${C.accent}22`:'transparent',color:on?C.accent:C.textMid,cursor:'pointer',fontWeight:on?700:600}}>
                        {p.label} · {p.count}
                      </button>
                    );
                  })}
                </div>}
            {playerMeta.extraPlayers.length>0 && (
              <button
                onClick={()=>setShowAllPlayers(v=>!v)}
                style={{marginTop:7,fontSize:10.5,color:C.accent,background:'none',border:'none',padding:0,cursor:'pointer',fontWeight:700}}
              >
                {showAllPlayers ? 'Hide extra players' : `+ ${playerMeta.extraPlayers.length} more players`}
              </button>
            )}
          </div>
          {showAllPlayers && playerMeta.extraPlayers.length>0 && (
            <div style={{marginTop:8,background:`${C.surface}fa`,border:`1px solid ${C.border}`,borderRadius:10,padding:'10px',maxHeight:280,overflowY:'auto',backdropFilter:'blur(3px)',boxShadow:'0 8px 24px rgba(0,0,0,0.12)'}}>
              <input
                value={playerSearch}
                onChange={e=>setPlayerSearch(e.target.value)}
                placeholder="Search players…"
                style={{...inputStyle,background:C.bg,padding:'6px 9px',fontSize:11.5,marginBottom:8}}
              />
              {orderedExtraPlayerGroups.length===0
                ? <div style={{fontSize:11.5,color:C.textMute}}>No players match that search.</div>
                : orderedExtraPlayerGroups.map(([group, items])=>{
                    const expanded = openPlayerGroups[group] !== false;
                    return (
                      <div key={group} style={{marginBottom:8}}>
                        <button
                          onClick={()=>setOpenPlayerGroups(prev=>({ ...prev, [group]: !expanded }))}
                          style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',background:'none',border:'none',padding:0,cursor:'pointer',marginBottom:expanded?5:0}}
                        >
                          <span style={{fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.06em'}}>{group}</span>
                          <span style={{fontSize:10,color:C.textMute}}>{expanded ? '▾' : '▸'}</span>
                        </button>
                        {expanded && (
                          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                            {items.map(p => {
                              const on = activePlayerNorm === p.norm;
                              return (
                                <button key={p.norm} onClick={()=>{ setActivePlayer(on?'':p.norm); setActiveTag(''); }}
                                  style={{fontSize:10.5,padding:'2px 7px',borderRadius:999,border:`1px solid ${on?C.accent:C.border}`,background:on?`${C.accent}22`:'transparent',color:on?C.accent:C.textMid,cursor:'pointer',fontWeight:on?700:600}}>
                                  {p.label} · {p.count}
                                </button>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
            </div>
          )}
        </div>
        <svg ref={svgRef} width="100%" height="100%" style={{display:'block'}}>
          <g transform={`translate(${window.innerWidth/2+pz.x}, ${(window.innerHeight-50)/2+pz.y}) scale(${pz.s})`}>

            {/* Center crosshair */}
            <line x1={-18} y1={0} x2={18} y2={0} stroke={C.border} strokeWidth={1} opacity={0.4}/>
            <line x1={0} y1={-18} x2={0} y2={18} stroke={C.border} strokeWidth={1} opacity={0.4}/>

            {/* Episode → Story edges */}
            {edges.filter(e=>e.type==='ep').map(e=>{
              const s=nodeById[e.source], t=nodeById[e.target]; if(!s||!t) return null;
              const active = edgeHasTag(e);
              return <line key={e.id} x1={s.x} y1={s.y} x2={t.x} y2={t.y}
                stroke={EP[t.ep?.type]?.color||C.border} strokeWidth={active?1.8:1.2} opacity={focusActive?(active?0.45:0.08):0.28}/>;
            })}

            {/* Cross-story edges — curved dashed */}
            {crossEdges.map(e=>{
              const s=nodeById[e.source], t=nodeById[e.target]; if(!s||!t) return null;
              const active = edgeHasTag(e);
              const mx=(s.x+t.x)/2, my=(s.y+t.y)/2;
              const dx=t.x-s.x, dy=t.y-s.y, len=Math.sqrt(dx*dx+dy*dy)||1;
              const cpx=mx-dy/len*80, cpy=my+dx/len*80;
              return (
                <g key={e.id} style={{cursor:'default'}}
                  onMouseEnter={ev=>setTooltip({x:ev.clientX,y:ev.clientY,type:'edge',label:e.label})}
                  onMouseLeave={()=>setTooltip(null)}>
                  <path d={`M${s.x},${s.y} Q${cpx},${cpy} ${t.x},${t.y}`}
                    stroke={e.color} strokeWidth={active?2.8:2} fill="none" strokeDasharray="8 4" opacity={focusActive?(active?0.9:0.12):0.82}/>
                  {/* Wide transparent hit area */}
                  <path d={`M${s.x},${s.y} Q${cpx},${cpy} ${t.x},${t.y}`}
                    stroke="transparent" strokeWidth={18} fill="none"/>
                </g>
              );
            })}

            {/* Episode nodes */}
            {episodeNodes.map(n=>{
              const cfg=EP[n.ep?.type]||{color:'#94a3b8',light:'#f1f5f9',symbol:'·'};
              const active = nodeMatchesFocus(n);
              const hovered = hoverNodeId === n.id;
              return (
                <g key={n.id}
                  style={{cursor:'pointer'}}
                  onMouseEnter={ev=>{ setHoverNodeId(n.id); setTooltip({x:ev.clientX,y:ev.clientY,type:'ep',node:n}); }}
                  onMouseMove={ev=>setTooltip(t=>t && t.type==='ep' && t.node?.id===n.id ? {...t, x:ev.clientX, y:ev.clientY} : t)}
                  onMouseLeave={()=>{ setHoverNodeId(h=>h===n.id?null:h); setTooltip(null); }}>
                  <circle cx={n.x} cy={n.y} r={n.r+(hovered?13:9)} fill="transparent" stroke="transparent" strokeWidth={0}/>
                  <circle className="ep-circle" cx={n.x} cy={n.y} r={n.r+(hovered?4:0)} fill={cfg.light} stroke={cfg.color} strokeWidth={active?(hovered?2.6:1.8):(hovered?1.6:1.2)} opacity={focusActive?(active?1:0.16):1}/>
                  <text x={n.x} y={n.y} dy="0.35em" textAnchor="middle" fontSize={8} fontWeight={800} fill={cfg.color}
                    style={{pointerEvents:'none',opacity:focusActive?(active?1:0.24):1,fontFamily:"'Segoe UI', Arial, sans-serif"}}>{cfg.symbol}</text>
                </g>
              );
            })}

            {/* Story nodes */}
            {storyNodes.map(n=>{
              const cfg=ST[n.story.status]||ST.active;
              const lines=wrapText(n.story.title,11);
              const epCnt=(n.story.episodes||[]).length;
              const active = nodeMatchesFocus(n);
              const hovered = hoverNodeId === n.id;
              return (
                <g key={n.id} style={{cursor:'pointer'}} onClick={()=>onSelectStory(n.story.id)}
                  onMouseEnter={ev=>{ setHoverNodeId(n.id); setTooltip({x:ev.clientX,y:ev.clientY,type:'story',node:n}); }}
                  onMouseMove={ev=>setTooltip(t=>t && t.type==='story' && t.node?.id===n.id ? {...t, x:ev.clientX, y:ev.clientY} : t)}
                  onMouseLeave={()=>{ setHoverNodeId(h=>h===n.id?null:h); setTooltip(null); }}>
                  <circle cx={n.x} cy={n.y} r={n.r+(hovered?17:12)} fill="transparent" stroke="transparent" strokeWidth={0}/>
                  <circle cx={n.x} cy={n.y} r={n.r+5+(hovered?5:0)} fill={cfg.bg} stroke={cfg.dot} strokeWidth={active?(hovered?3.4:2.8):(hovered?2.5:2)} opacity={focusActive?(active?1:0.2):1}/>
                  <circle cx={n.x} cy={n.y} r={n.r+(hovered?4:0)} fill={C.surface} stroke={cfg.dot} strokeWidth={active?(hovered?2.3:1.7):(hovered?1.7:1.2)} opacity={focusActive?(active?1:0.16):1}/>
                  {/* Episode count badge */}
                  <circle cx={n.x+n.r+1+(hovered?3:0)} cy={n.y-n.r-1-(hovered?3:0)} r={9+(hovered?1:0)} fill={C.accent} opacity={focusActive?(active?1:0.35):1}/>
                  <text x={n.x+n.r+1+(hovered?3:0)} y={n.y-n.r-1-(hovered?3:0)} dy="0.35em" textAnchor="middle" fontSize={8} fontWeight={800} fill="white"
                    style={{pointerEvents:'none',opacity:focusActive?(active?1:0.55):1,fontFamily:"'Segoe UI', Arial, sans-serif"}}>{epCnt}</text>
                  {lines.map((ln,li)=>(
                    <text key={li} x={n.x} y={n.y+(li-(lines.length-1)/2)*12}
                      dy="0.35em" textAnchor="middle"
                      fontSize={9.5} fontWeight={700} fill={C.text}
                      style={{pointerEvents:'none',opacity:focusActive?(active?1:0.3):1,fontFamily:"'Segoe UI', Arial, sans-serif"}}>{ln}</text>
                  ))}
                </g>
              );
            })}
          </g>
        </svg>

        {/* Tooltip */}
        {safeTooltip&&(
          <div style={{position:'fixed',left:Math.min(safeTooltip.x+16,window.innerWidth-270),top:safeTooltip.y-6,
            background:'rgba(26,23,20,0.93)',color:'#f5f3ef',padding:'9px 13px',borderRadius:9,
            fontSize:12,maxWidth:260,pointerEvents:'none',zIndex:1200,lineHeight:1.55,
            boxShadow:'0 6px 20px rgba(0,0,0,0.35)'}}>
            {safeTooltip.type==='story'&&(<>
              <div style={{fontWeight:800,fontSize:12.5,marginBottom:3}}>{safeTooltip.node?.story?.title||'Story'}</div>
              <div style={{fontSize:11,color:'#c4bdb6',marginBottom:safeTooltip.node?.story?.summary?5:0}}>
                {(safeTooltip.node?.story?.episodes||[]).length} episodes · {ST[safeTooltip.node?.story?.status]?.label}
              </div>
              {safeTooltip.node?.story?.summary&&<div style={{fontSize:11,color:'#e2dcd6'}}>{safeTooltip.node.story.summary.slice(0,130)}{safeTooltip.node.story.summary.length>130?'…':''}</div>}
              <div style={{fontSize:10,color:'#7a746d',marginTop:5,fontStyle:'italic'}}>Click to open story</div>
            </>)}
            {safeTooltip.type==='ep'&&(<>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                <span style={{fontSize:14}}>{EP[safeTooltip.node?.ep?.type]?.symbol}</span>
                <span style={{fontWeight:700,fontSize:11,color:EP[safeTooltip.node?.ep?.type]?.color,textTransform:'uppercase',letterSpacing:'0.04em'}}>{EP[safeTooltip.node?.ep?.type]?.label}</span>
                <span style={{fontSize:10,color:'#7a746d'}}>· {safeTooltip.node?.ep?.date}</span>
              </div>
              <div style={{fontWeight:600,fontSize:12}}>{safeTooltip.node?.ep?.headline}</div>
              {safeTooltip.node?.ep?.summary&&<div style={{marginTop:4,fontSize:11,color:'#c4bdb6'}}>{safeTooltip.node.ep.summary.slice(0,110)}…</div>}
            </>)}
            {safeTooltip.type==='edge'&&(<>
              <div style={{fontSize:10.5,fontWeight:800,color:'#c4b5fd',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:3}}>Lateral Connection</div>
              <div style={{fontSize:11.5}}>{safeTooltip.label||'Relationship'}</div>
            </>)}
          </div>
        )}

        {/* Legend panel */}
        {showLegend&&(
          <div style={{position:'absolute',bottom:20,right:20,background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:'14px 16px',boxShadow:'0 4px 24px rgba(0,0,0,0.12)',minWidth:190,zIndex:100}}>
            <div style={{fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:9}}>Legend</div>
            <div style={{fontSize:10,fontWeight:700,color:C.textMid,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:5}}>Story Status</div>
            {Object.entries(ST).map(([k,v])=>(
              <div key={k} style={{display:'flex',alignItems:'center',gap:7,marginBottom:4}}>
                <span style={{width:10,height:10,borderRadius:'50%',background:v.dot,display:'inline-block',flexShrink:0}}/>
                <span style={{fontSize:11,color:C.textMid}}>{v.label}</span>
              </div>
            ))}
            <div style={{height:1,background:C.borderLight,margin:'8px 0'}}/>
            <div style={{fontSize:10,fontWeight:700,color:C.textMid,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:5}}>Episode Types</div>
            {Object.entries(EP).map(([k,v])=>(
              <div key={k} style={{display:'flex',alignItems:'center',gap:7,marginBottom:4}}>
                <span style={{fontSize:12,fontWeight:800,color:v.color,width:14,textAlign:'center',lineHeight:1}}>{v.symbol}</span>
                <span style={{fontSize:11,color:C.textMid}}>{v.label}</span>
              </div>
            ))}

// ─── Source color palette (deterministic hash → muted warm color) ────────────
function sourceBlockColor(name) {
  const palette = ['#b07060','#7a96b0','#8aab9a','#9b8ab5','#b8955a','#6fa5a5','#8a9660','#a07880'];
  let h = 0;
  for (let i = 0; i < (name || '').length; i++) h = (h * 31 + (name || '').charCodeAt(i)) & 0xffffffff;
  return palette[Math.abs(h) % palette.length];
}
// Fallback card for articles with no usable image: the source's colour as a soft gradient with a light sheen, so a
// grid with a few misses still looks designed rather than broken.
function shadeHex(hex, amt) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  const c = v => Math.max(0, Math.min(255, Math.round(v + (amt < 0 ? v : 255 - v) * amt)));
  return `rgb(${c((n >> 16) & 255)},${c((n >> 8) & 255)},${c(n & 255)})`;
}
function fallbackGradient(name) {
  const base = sourceBlockColor(name);
  return `linear-gradient(135deg, ${shadeHex(base, 0.12)} 0%, ${base} 45%, ${shadeHex(base, -0.3)} 100%)`;
}

const AGGREGATOR_DOMAIN_RE = /(^|\.)(news\.google\.com|bing\.com|search\.brave\.com|duckduckgo\.com|startpage\.com|qwant\.com)$/i;
const ENGINE_NAME_RE = /^(bing news|bing|qwant news|yahoo news|google news|wikinews|startpage news|brave\.?news|duckduckgo news)$/i;

function getArticleSourceMeta(article) {
  let sourceDomain = '';
  try {
    sourceDomain = new URL(article.realUrl || article.url || '').hostname.replace(/^www\./, '');
  } catch {}

  let sourceName = '';
  if (article.source) {
    if (typeof article.source === 'string') {
      sourceName = article.source;
    } else {
      sourceName = article.source.name || '';
      if (article.source.domain && (!sourceDomain || AGGREGATOR_DOMAIN_RE.test(sourceDomain))) {
        sourceDomain = String(article.source.domain).replace(/^www\./, '');
      }
    }
  }

  const useDomain = sourceDomain && !AGGREGATOR_DOMAIN_RE.test(sourceDomain);
  let sourceLabel = (useDomain ? sourceDomain : (sourceName || sourceDomain || ''));
  if (!sourceLabel || ENGINE_NAME_RE.test(sourceLabel.trim())) {
    sourceLabel = sourceName || (useDomain ? sourceDomain : '') || '';
  }
  sourceLabel = String(sourceLabel || '').replace(/^www\./, '');
  if (!sourceDomain && sourceLabel.includes('.')) sourceDomain = sourceLabel;
  if (sourceDomain && AGGREGATOR_DOMAIN_RE.test(sourceDomain) && sourceLabel && !sourceLabel.includes('.')) {
    sourceDomain = '';
  }

  return {
    sourceDomain,
    sourceLabel,
    faviconUrl: sourceDomain ? `https://www.google.com/s2/favicons?domain=${sourceDomain}&sz=64` : null,
    sourceInitial: (sourceLabel || sourceDomain || '?').charAt(0).toUpperCase(),
  };
}

function getArticleCardLayout(compact, feature) {
  return {
    mediaHeight: (!compact && feature) ? 188 : 110,
    cardStyle: {
      background: feature ? 'transparent' : C.surface,

    bodyGap: compact ? 3 : (feature ? 6 : 5),
    titleSize: compact ? 11.5 : (feature ? 14 : 12.5),
    titleClamp: compact ? 2 : (feature ? 4 : 3),
  };
}

function isSuspiciousArticleImageDimensions(imgEl) {
  const w = Number(imgEl?.naturalWidth || 0);
  const h = Number(imgEl?.naturalHeight || 0);
  if (!w || !h) return true;
  const ratio = w / h;
  // Common icon/sprite signals: very small raster or extreme aspect ratios.
  if (Math.min(w, h) < 90) return true;
  if (w < 220 && h < 140) return true;
  if (ratio > 4.2 || ratio < 0.45) return true;
  return false;
}

function ArticleCard({ article, compact = false, feature = false, hideMedia = false, onTrack, onAddEp }) {
  const [imgSrc,  setImgSrc]  = React.useState(article.imageUrl || null);
  const [imgErr,  setImgErr]  = React.useState(false);
  const [favErr,  setFavErr]  = React.useState(false);
  const [added,   setAdded]   = React.useState(false);
  const [recoverTried, setRecoverTried] = React.useState(false);
  const recoveringRef = React.useRef(false);
  const mountedRef = React.useRef(true);
  const hasImg = !hideMedia && imgSrc && !imgErr && !isWeakImageUrl(imgSrc);
  const { sourceDomain, sourceLabel, faviconUrl, sourceInitial } = getArticleSourceMeta(article);
  const { mediaHeight, cardStyle, bodyPadding, bodyGap, titleSize, titleClamp } = getArticleCardLayout(compact, feature);
  React.useEffect(() => {
    mountedRef.current = true;
    return () => { mountedRef.current = false; };
  }, []);
  React.useEffect(() => {
    setImgSrc(article.imageUrl || null);
    setImgErr(false);
    setRecoverTried(false);
  }, [article.imageUrl, article.url, article.realUrl]);
  const tryRecoverImage = React.useCallback(async () => {
    if (hideMedia || recoveringRef.current || recoverTried) return;
    recoveringRef.current = true;
    setRecoverTried(true);
    try {
      const improved = await resolveBestArticleImage(
        { ...article, imageUrl: '' },
        { forceSearchFirst: true, skipCurrent: true }
      ).catch(() => null);
      if (!mountedRef.current) return;
      if (improved && !isWeakImageUrl(improved) && improved !== imgSrc) {
        setImgSrc(improved);
        setImgErr(false);
        const key = article.realUrl || article.url || '';
        if (key) putCachedImageForUrl(key, improved);
      }
    } finally {
      recoveringRef.current = false;
    }
  }, [article, hideMedia, recoverTried, imgSrc]);
  React.useEffect(() => {
    if (hideMedia) return;
    if (imgSrc && isWeakImageUrl(imgSrc)) {
      setImgErr(true);
      tryRecoverImage();
    }
  }, [hideMedia, imgSrc, tryRecoverImage]);
  React.useEffect(() => {
    if (hideMedia) return;
    if (!imgSrc && !recoverTried) {
      tryRecoverImage();
    }
  }, [hideMedia, imgSrc, recoverTried, tryRecoverImage]);

  return (
    <div style={cardStyle}
      onClick={() => { const u = articleOpenUrl(article); if (u) window.open(u, '_blank'); }}
      onMouseEnter={e => {
        if (feature) return;

            style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}
            onLoad={e => { if (isSuspiciousArticleImageDimensions(e.currentTarget)) { setImgErr(true); tryRecoverImage(); } }}
            onError={() => { setImgErr(true); tryRecoverImage(); }}/>

      {/* Color block fallback — non-compact, no image */}
      {!compact && !hideMedia && !hasImg && (
        <div style={{width:'100%',height:mediaHeight,background:fallbackGradient(sourceLabel),position:'relative',overflow:'hidden',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={FALLBACK_SHEEN}/>

            <div style={{width:30,height:30,borderRadius:8,background:'rgba(255,255,255,0.2)',display:'grid',placeItems:'center'}}>
              {faviconUrl && !favErr
                ? <img src={faviconUrl} width={18} height={18} style={{display:'block'}} onError={() => setFavErr(true)}/>
                : <span style={{color:'rgba(255,255,255,0.92)',fontSize:14,fontWeight:800,lineHeight:1}}>{sourceInitial}</span>
              }
            </div>

              {sourceLabel || sourceDomain}

      {compact && !hideMedia && hasImg && (
        <div style={{width:68,height:68,background:'#ede9e3',overflow:'hidden',flexShrink:0}}>
          <img src={imgSrc} alt="" referrerPolicy="no-referrer"

function formatElapsed(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function useBusyElapsed(active) {
  const [since, setSince] = useState(null);
  const [elapsedMs, setElapsedMs] = useState(0);
  useEffect(() => {
    if (!active) { setSince(null); setElapsedMs(0); return; }
    setSince(prev => prev || Date.now());
  }, [active]);
  useEffect(() => {
    if (!since) return;
    const tick = () => setElapsedMs(Date.now() - since);
    tick();
    const id = setInterval(tick, 250);
    return () => clearInterval(id);
  }, [since]);
  return elapsedMs;
}

function shouldRefreshDiscoveryCache(entry) {

function PredictionsPanel() {
  const [predictions, setPredictions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedPred, setSelectedPred] = useState(null);
  const [links, setLinks] = useState([]);
  const [items, setItems] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [formStatement, setFormStatement] = useState('');
  const [formConfidence, setFormConfidence] = useState(50);
  const [formDate, setFormDate] = useState('');
  const [creating, setCreating] = useState(false);

  function loadPredictions() {
    setLoading(true);
    fetch('/v2/predictions')
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (d?.predictions) {
          setPredictions(d.predictions);
          if (d.predictions.length && !selectedPred) {
            setSelectedPred(d.predictions[0].id);
            loadLinks(d.predictions[0].id);
          }
        }
        setLoading(false);
      })
      .catch(() => setLoading(false));
  }

  useEffect(() => { loadPredictions(); }, []);

  function loadLinks(predId) {
    fetch(`/v2/links?predictionId=${predId}`)
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (d?.links) {
          setLinks(d.links);
          const itemMap = {};
          d.links.forEach(l => { if (l.item) itemMap[l.itemId] = l.item; });
          setItems(itemMap);
        }
      })
      .catch(() => {});
  }

  function selectPrediction(pred) {
    setSelectedPred(pred.id);
    loadLinks(pred.id);
  }

  function createPrediction(e) {
    e.preventDefault();
    if (!formStatement.trim()) return;
    setCreating(true);
    fetch('/v2/predictions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        statement: formStatement.trim(),
        confidence: Number(formConfidence),
        resolutionDate: formDate || undefined
      })
    })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      setCreating(false);
      if (d?.prediction) {
        setFormStatement('');
        setFormConfidence(50);
        setFormDate('');
        setShowForm(false);
        loadPredictions();
        setSelectedPred(d.prediction.id);
        loadLinks(d.prediction.id);
      }
    })
    .catch(() => setCreating(false));
  }

  const activePred = predictions.find(p => p.id === selectedPred);
  const supports = links.filter(l => l.stance === 'supports').sort((a,b) => b.weight - a.weight);
  const contradicts = links.filter(l => l.stance === 'contradicts').sort((a,b) => b.weight - a.weight);

  return (
    <div style={{padding:'24px 32px',maxWidth:900,margin:'0 auto',overflowY:'auto',height:'100%'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <h1 style={{fontSize:22,fontWeight:900,color:C.text,margin:0,fontFamily:"'Playfair Display', Georgia, serif"}}>Predictions</h1>
        <button onClick={()=>setShowForm(!showForm)} style={{padding:'7px 14px',borderRadius:7,border:`1.5px solid ${C.accent}`,background:C.surface,color:C.accent,fontSize:12,fontWeight:700,cursor:'pointer'}}>
          {showForm ? 'Cancel' : '+ New Prediction'}

      {showForm && (
        <form onSubmit={createPrediction} style={{background:C.surface,borderRadius:10,padding:'16px 20px',border:`1px solid ${C.border}`,marginBottom:24}}>
          <div style={{marginBottom:12}}>
            <label style={{display:'block',fontSize:11,fontWeight:700,color:C.textMute,marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Statement</label>
            <textarea
              value={formStatement}
              onChange={e=>setFormStatement(e.target.value)}
              placeholder="A falsifiable claim with explicit resolution criteria..."
              rows={3}
              style={{width:'100%',padding:'10px 12px',borderRadius:6,border:`1px solid ${C.border}`,background:C.bg,color:C.text,fontSize:13,fontFamily:'inherit',resize:'vertical'}}
            />

          <div style={{display:'flex',gap:16,marginBottom:16}}>
            <div style={{flex:1}}>
              <label style={{display:'block',fontSize:11,fontWeight:700,color:C.textMute,marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Confidence (%)</label>
              <input
                type="number"
                min={0}
                max={100}
                value={formConfidence}
                onChange={e=>setFormConfidence(Math.max(0,Math.min(100,Number(e.target.value))))}
                style={{width:'100%',padding:'8px 12px',borderRadius:6,border:`1px solid ${C.border}`,background:C.bg,color:C.text,fontSize:13}}
              />
            </div>
            <div style={{flex:1}}>
              <label style={{display:'block',fontSize:11,fontWeight:700,color:C.textMute,marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Resolution Date</label>
              <input
                type="date"
                value={formDate}
                onChange={e=>setFormDate(e.target.value)}
                style={{width:'100%',padding:'8px 12px',borderRadius:6,border:`1px solid ${C.border}`,background:C.bg,color:C.text,fontSize:13}}
              />
            </div>
          </div>
          <button type="submit" disabled={creating || !formStatement.trim()} style={{padding:'8px 18px',borderRadius:7,border:'none',background:creating?C.border:C.accent,color:'#fff',fontSize:13,fontWeight:700,cursor:creating?'default':'pointer'}}>
            {creating ? 'Creating...' : 'Create Prediction'}
          </button>
        </form>
      )}

      {loading && <div style={{color:C.textMute}}>Loading predictions…</div>}
      {!loading && predictions.length === 0 && <div style={{color:C.textMute}}>No predictions yet.</div>}
      
      {predictions.length > 0 && (
        <div style={{display:'flex',gap:16,marginBottom:24}}>
          {predictions.map(pred => (
            <button key={pred.id} onClick={()=>selectPrediction(pred)}
              style={{padding:'10px 16px',borderRadius:8,border:`1.5px solid ${selectedPred===pred.id?C.accent:C.border}`,background:selectedPred===pred.id?C.accent+'15':C.surface,color:selectedPred===pred.id?C.accent:C.text,fontSize:13,fontWeight:700,cursor:'pointer',textAlign:'left',flex:1}}>
              <div style={{fontSize:12,marginBottom:4,opacity:0.7}}>{pred.status}</div>
              <div style={{lineHeight:1.4}}>{pred.statement}</div>
              <div style={{marginTop:6,fontSize:18,fontWeight:900}}>{pred.confidence}%</div>
            </button>
          ))}
        </div>
      )}

      {activePred && (
        <div>
          <div style={{background:C.surface,borderRadius:10,padding:'16px 20px',border:`1px solid ${C.border}`,marginBottom:20}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
              <div style={{fontSize:15,fontWeight:700,color:C.text,lineHeight:1.4,flex:1}}>{activePred.statement}</div>
              <div style={{marginLeft:16,textAlign:'right'}}>
                <div style={{fontSize:28,fontWeight:900,color:C.accent}}>{activePred.confidence}%</div>
                <div style={{fontSize:11,color:C.textMute}}>confidence</div>
              </div>
            </div>
            <div style={{display:'flex',gap:12,flexWrap:'wrap',fontSize:12,color:C.textMute}}>
              <span>Status: <strong style={{color:C.text}}>{activePred.status}</strong></span>
              <span>Created: {new Date(activePred.createdAt).toLocaleDateString()}</span>
              {activePred.resolutionDate && <span>Resolves: {new Date(activePred.resolutionDate).toLocaleDateString()}</span>}
              <span>Signals: {activePred.signals?.length || 0}</span>
            </div>
          </div>

          {supports.length > 0 && (
            <div style={{marginBottom:20}}>
              <h3 style={{fontSize:13,fontWeight:800,color:C.accent,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>🟢 Supporting Evidence</h3>
              {supports.map(link => (
                <div key={link.id} style={{background:C.surface,borderRadius:8,padding:'12px 14px',border:`1px solid ${C.border}`,marginBottom:8}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                    <a href={link.item?.url} target="_blank" rel="noopener noreferrer" style={{fontSize:13,fontWeight:700,color:C.accent,textDecoration:'none',flex:1}}>{link.item?.title}</a>
                    <span style={{fontSize:12,fontWeight:900,color:C.accent,marginLeft:8}}>{link.weight}</span>
                  </div>
                  <div style={{fontSize:11,color:C.textMute,lineHeight:1.4}}>{link.reason}</div>
                </div>
              ))}
            </div>
          )}

          {contradicts.length > 0 && (
            <div>
              <h3 style={{fontSize:13,fontWeight:800,color:'#dc2626',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>🔴 Contradicting Evidence</h3>
              {contradicts.map(link => (
                <div key={link.id} style={{background:C.surface,borderRadius:8,padding:'12px 14px',border:`1px solid ${C.border}`,marginBottom:8}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                    <a href={link.item?.url} target="_blank" rel="noopener noreferrer" style={{fontSize:13,fontWeight:700,color:'#dc2626',textDecoration:'none',flex:1}}>{link.item?.title}</a>
                    <span style={{fontSize:12,fontWeight:900,color:'#dc2626',marginLeft:8}}>{link.weight}</span>
                  </div>
                  <div style={{fontSize:11,color:C.textMute,lineHeight:1.4}}>{link.reason}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function HomePanel({ stories, settings, serverReady, onStartStory, onAddEpisode, onSelectStory, refreshing, refreshProg, refreshDone, refreshLog }) {
  const latestRunByStory = React.useMemo(() => {
    const m = {};
    (refreshLog?.runs?.[0]?.stories || []).forEach(s => { m[s.id] = s; });
    return m;
  }, [refreshLog]);
  const [searchQ,      setSearchQ]      = useState('');
  const [searchInput,  setSearchInput]  = useState('');
  const [searchRes,    setSearchRes]    = useState([]);
  const [searchPhase,  setSearchPhase]  = useState('idle'); // idle | loading | done

  async function runSearch(q) {
    const qt = String(q || '').trim();
    if (!qt) return;
    setSearchQ(qt); setSearchPhase('loading'); setSearchRes([]);
    try {
      const r = await fetch(`/api/lateral/search?q=${encodeURIComponent(qt)}&intent=news`, { cache: 'no-store' });
      const d = await r.json();
      const arts = await attachImages(d.articles || []);
      setSearchRes(arts);
    } catch { setSearchRes([]); }
    setSearchPhase('done');
  }

  function handleSearchKey(e) {
    if (e.key === 'Enter') runSearch(searchInput);
  }
  const [brief,    setBrief]    = useState(loadBrief);
  const [phase,    setPhase]    = useState(() => {
    const b = loadBrief();
    if (b?.generatedAt) return 'ready'; // show even stale brief immediately
    return 'idle';
  });
  const [progress, setProgress] = useState('');
  const [errMsg,   setErrMsg]   = useState('');

  // ── Discovery feed state ──────────────────────────────────────────────────
  const [disc,      setDisc]      = useState(loadDisc);
  const discFilteredItems = React.useMemo(() => {
    const f = disc?.filtered || {};
    return Object.entries(f).flatMap(([k, arr]) => (Array.isArray(arr) ? arr : []).map(a => ({ ...a, _discKey: k })));
  }, [disc]);
  function restoreDiscovered(a) {
    const k = a._discKey;
    const { _discKey, relevance, ...clean } = a;
    const topic = discoveryRelevanceTopics(settings)[k];
    if (topic) restoreRelevance(topic, a);
    const next = {
      ...disc,
      [k]: [clean, ...(Array.isArray(disc?.[k]) ? disc[k] : [])],
      filtered: { ...(disc?.filtered || {}), [k]: ((disc?.filtered || {})[k] || []).filter(x => x.url !== a.url) },
    };
    saveDisc(next);
    setDisc(next);
  }
  const [discPhase, setDiscPhase] = useState(() => {
    const d = loadDisc();
    if (d?.generatedAt) return 'ready'; // show even stale discovery immediately
    return 'idle';
  });

  // ── Vale synthesis state ──────────────────────────────────────────────────
  const [vale,      setVale]      = useState(loadVale);
  const [valePhase, setValePhase] = useState(() => {
    const v = loadVale();
    if (v?.generatedAt) return 'ready'; // show stale immediately
    return 'idle';
  });

  // ── Collapsible section state ─────────────────────────────────────────────
  const [beatsOpen,   setBeatsOpen]   = useState(true);
  const [briefOpen,   setBriefOpen]   = useState(true);
  const [discOpen,  setDiscOpen]  = useState(() => {
    const m = {};
    DISC_CATEGORIES.forEach(c => { m[c.key] = true; });
    m.local = true;
    return m;
  });
  const discImageRunRef = useRef(0);
  const discHydratedForRef = useRef('');
  const activeStories = React.useMemo(() => selectActiveStoriesForBrief(stories), [stories]);
  const briefElapsedMs = useBusyElapsed(phase === 'generating');
  const discElapsedMs = useBusyElapsed(discPhase === 'loading');
  const valeElapsedMs = useBusyElapsed(valePhase === 'loading');
  const homeBriefSpeechText = buildGlobalBriefSpeechText(brief || null);
  const homeValeSpeechText = markdownToSpeechText(vale?.message || '');
  const homeValeFallback = (stories || [])
    .flatMap(s => (getCacheEntry(s?.id, 'headlines')?.items || []).slice(0, 3))
    .slice(0, 18);
  const homeValeSources = resolveRenderSources(vale?.message || '', vale?.sources, homeValeFallback);

  function bootstrapBriefIfNeeded() {
    if (!serverReady) return;
    const cached = loadBrief();
    if (!cached && activeStories.length > 0) generate();
  }

  function bootstrapDiscoveryIfStale() {
    const cachedDisc = loadDisc();
    if (shouldRefreshDiscoveryCache(cachedDisc)) {
      fetchDiscovery(loadBrief() || null);
    }
  }

  async function handlePivotRefresh() {
    fetchDiscovery(loadBrief() || null); // SearXNG only, fire immediately
    await generate(false);               // backend job: brief + web intelligence
  }

  function hydrateValeFromCache() {
    const v = loadVale();
    if (v) { setVale(v); setValePhase('ready'); }
  }

  // Auto-generate brief only after server stories are confirmed and no brief exists yet
  // If a stale brief exists, show it and wait for the user to manually regen
  useEffect(() => {
    bootstrapBriefIfNeeded();
  }, [serverReady]);

  // Auto-fetch discovery: always refresh if stale, even with no brief
  useEffect(() => {
    bootstrapDiscoveryIfStale();
  }, []);

  // Respond to global daily pivot refresh: discovery first (fast), then full
  // brief regen, then Vale — all sequential so Ollama is never double-loaded.
  useEffect(() => {
    window.addEventListener('lateral-refresh', handlePivotRefresh);
    return () => window.removeEventListener('lateral-refresh', handlePivotRefresh);
  }, []);

  useEffect(() => {
    if (phase === 'ready' && brief && discPhase === 'idle') fetchDiscovery(brief);
  }, [phase]);

  // One-time enrichment pass for cached discovery snapshots that are still within TTL.
  // This upgrades image coverage even when a full discovery refresh is not triggered.
  useEffect(() => {
    if (!disc?.generatedAt) return;
    if (discHydratedForRef.current === disc.generatedAt) return;
    discHydratedForRef.current = disc.generatedAt;
    let cancelled = false;
    (async () => {
      try {
        const catKeys = DISC_CATEGORIES.map(c => c.key);
        const curMap = {};
        catKeys.forEach(k => { curMap[k] = Array.isArray(disc[k]) ? disc[k] : []; });
        const curLocal = Array.isArray(disc.local) ? disc.local : [];
        const [catEnriched, localEnriched] = await Promise.all([
          Promise.all(catKeys.map(k => attachImages(curMap[k]))),
          attachImages(curLocal),
        ]);
        if (cancelled) return;
        let changed = false;
        const next = { ...disc };
        catKeys.forEach((k, i) => {
          next[k] = catEnriched[i];
          if (!changed) {
            const before = curMap[k];
            const after = catEnriched[i];
            for (let n = 0; n < Math.min(before.length, after.length); n++) {
              if (String(before[n]?.imageUrl || '') !== String(after[n]?.imageUrl || '')) { changed = true; break; }
            }
          }
        });
        next.local = localEnriched;
        if (!changed) {
          const before = curLocal;
          const after = localEnriched;
          for (let n = 0; n < Math.min(before.length, after.length); n++) {
            if (String(before[n]?.imageUrl || '') !== String(after[n]?.imageUrl || '')) { changed = true; break; }
          }
        }
        if (!changed) return;
        saveDisc(next);
        setDisc(next);
      } catch {}
    })();
    return () => { cancelled = true; };
  }, [disc?.generatedAt]);

  // Vale synthesis loads from cache on mount; only refreshes when explicitly triggered
  useEffect(() => {
    hydrateValeFromCache();
  }, []);

  // If a backend home-intelligence job is already running (user navigated away),
  // resume progress polling so the UI updates when it completes.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const st = await getIntelligenceJobStatus({ scope: 'home' });
        const job = st?.job;
        if (!job || job.scope !== 'home' || job.state !== 'running') return;
        if (cancelled) return;
        setPhase('generating');
        setValePhase('loading');
        setProgress(job.progress || 'Resuming intelligence generation…');
      await waitForIntelligenceJob({
        scope: 'home',
        expectedJobId: String(job.id || ''),
        onProgress: (j) => { if (!cancelled && j?.progress) setProgress(j.progress); }
      });
        if (cancelled) return;
        await syncServerCacheToLocal().catch(() => {});
        const nextBrief = loadBrief();
        const nextVale = loadVale();
        if (nextBrief) setBrief(nextBrief);
        if (nextVale) {
          setVale(nextVale);
          setValePhase('ready');
        }
        setPhase(nextBrief ? 'ready' : 'error');
      } catch {}
    })();
    return () => { cancelled = true; };
  }, []);

  async function fetchDiscovery(briefData) {
    const b = briefData || brief;
    // Stale-while-revalidate: only show loading spinner if we have no disc data at all
    const hasStaleDisc = !!(disc?.generatedAt);
    if (!hasStaleDisc) setDiscPhase('loading');
    try {
      // Fetch all category feeds in parallel
      const catResults = await Promise.all(
        DISC_CATEGORIES.map(cat => searchArticles(cat.query).catch(() => []))
      );
      const catMap = {};
      DISC_CATEGORIES.forEach((cat, i) => { catMap[cat.key] = catResults[i].slice(0, 12); });
      catMap.world = (catMap.world || []).filter(a => !isSportsArticle(a)).slice(0, 12);

      // Local news if location is configured
      let localArticles = [];
      if (settings.location) {
        const localResults = await searchArticles(`${settings.location} local news ${SPORTS_QUERY_EXCLUSIONS}`).catch(() => []);
        localArticles = localResults.filter(a => !isSportsArticle(a)).slice(0, 12);
      }

      // 1) Fast paint: show cached/thumbnails immediately.
      const seededMap = {};
      DISC_CATEGORIES.forEach(cat => { seededMap[cat.key] = applyCachedImages(catMap[cat.key]); });
      const seededLocal = applyCachedImages(localArticles);
      const seed = { generatedAt: new Date().toISOString(), ...seededMap, local: seededLocal };
      saveDisc(seed);
      setDisc(seed);
      setDiscPhase('ready');

      // 2) Background: AI relevance pass per category, then fill missing images — each step patches the feed in place.
      const runId = ++discImageRunRef.current;
      Promise.resolve().then(async () => {
        // 2a) Does each article actually belong in its category? Verdicts are cached, so repeat refreshes are cheap.
        const topics = discoveryRelevanceTopics(settings);
        const gated = {}, filteredMap = {};
        for (const k of [...DISC_CATEGORIES.map(c => c.key), 'local']) {
          const list = k === 'local' ? seededLocal : seededMap[k];
          if (!topics[k] || !list?.length) { gated[k] = list || []; filteredMap[k] = []; continue; }
          const g = await checkRelevance(topics[k], list);
          gated[k] = g.kept; filteredMap[k] = g.filtered;
        }
        if (runId !== discImageRunRef.current) return; // stale run
        const gatedSeed = { generatedAt: seed.generatedAt, ...gated, filtered: filteredMap };
        saveDisc(gatedSeed);
        setDisc(gatedSeed);

        // 2b) Fill missing images on what's left.
        const [catImgResults, localImg] = await Promise.all([
          Promise.all(DISC_CATEGORIES.map(cat => attachImages(gated[cat.key]))),
          attachImages(gated.local),
        ]);
        if (runId !== discImageRunRef.current) return; // stale run
        const catImgMap = {};
        DISC_CATEGORIES.forEach((cat, i) => { catImgMap[cat.key] = catImgResults[i]; });
        const enriched = { generatedAt: seed.generatedAt, ...catImgMap, local: localImg, filtered: filteredMap };
        saveDisc(enriched);
        setDisc(enriched);
      }).catch(() => {});
    } catch(e) {
      console.warn('Discovery fetch failed:', e.message);
      if (!hasStaleDisc) setDiscPhase('error'); // only show error if nothing to display
    }
  }

  async function generate(manual = false) {
    setPhase('generating'); setProgress(''); setErrMsg('');
    setValePhase('loading');
    try {
      if (!activeStories.length) { setPhase('idle'); return; }
      const activeForJob = activeStories.filter(isActiveStoryForWork);
      if (!activeForJob.length) { setPhase('idle'); return; }

      let startedJobId = '';
      try {
        const started = await startIntelligenceJob({ scope: 'home', stories: activeForJob, settings, force: !!manual });
        startedJobId = String(started?.job?.id || '');
      } catch (e) {
        if (e?.status !== 409) throw e;
        const activeJob = e?.payload?.activeJob || null;
        if (!(activeJob?.id && String(activeJob?.scope || '') === 'home')) {
          const msg = e?.payload?.error || 'Another intelligence process is already in progress and should complete soon.';
          throw new Error(msg);
        }
        startedJobId = String(activeJob.id);
        setProgress(activeJob?.progress || e?.payload?.error || 'Another home intelligence process is already in progress and should complete soon.');
      }

      await waitForIntelligenceJob({
        scope: 'home',
        expectedJobId: startedJobId,
        onProgress: (job) => {
          if (job?.progress) setProgress(job.progress);
        }
      });

      await syncServerCacheToLocal().catch(() => {});
      const nextBrief = loadBrief();
      const nextVale = loadVale();
      if (nextBrief) setBrief(nextBrief);
      if (nextVale) {
        setVale(nextVale);
        setValePhase('ready');
      } else setValePhase('error');
      setPhase(nextBrief ? 'ready' : 'error');
    } catch(e) {
      setErrMsg(e.message || 'Generation failed');
      setPhase('error');
      setValePhase('error');
    }
  }

  const totalEpisodes = stories.reduce((sum, s) => sum + (s.episodes?.length || 0), 0);
  const statusCounts  = Object.fromEntries(Object.keys(ST).map(k => [k, stories.filter(s => s.status === k).length]));
  const maxEps        = Math.max(...stories.map(s => s.episodes?.length || 0), 1);
  const lastUpdated   = brief ? new Date(brief.generatedAt).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}) : null;

  function printHomeBrief() {
    const el = document.getElementById('home-brief-body');
    if (!el) return;
    const briefDate = new Date().toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
    const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Lateral Brief — ${briefDate}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; padding: 32px 40px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #fff; color: #1a1714; }
  button { display: none !important; }
  .brief-story-section { page-break-inside: avoid; }
  .brief-cross-section { page-break-before: always; }
  .brief-exec { background: #f0f4ff !important; border: 1.5px solid #c7d7fd !important; border-radius: 10px; padding: 14px 18px; margin-bottom: 24px; }
  .brief-section-head { font-size: 10px; font-weight: 800; color: #9a948d; text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 7px; margin-top: 18px; }
  .brief-list { margin: 0 0 0 2px; padding: 0; list-style: none; }
  @page { margin: 1.5cm 2cm; size: A4; }
</style></head>
<body>
  ${getExportLogoHtml('Narrative Overview Brief')}
  <div style="border-bottom:2px solid #1a1714;padding-bottom:18px;margin-bottom:24px;">
    <div style="font-size:17px;font-weight:900;letter-spacing:-0.3px;">LATERAL BRIEF</div>
    <div style="font-size:11px;color:#9a948d;margin-top:1px;">${briefDate}</div>
  </div>
  ${el.innerHTML}
</body></html>`;
    const blob = new Blob([html], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    const win  = window.open(url, '_blank');
    if (!win) { URL.revokeObjectURL(url); return; }
    win.addEventListener('load', () => {
      setTimeout(() => { win.print(); win.addEventListener('afterprint', () => { win.close(); URL.revokeObjectURL(url); }); }, 200);
    });
  }

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:C.bg}}>
      {/* Header */}
      <div style={{padding:'14px 24px 12px', borderBottom:`1px solid ${C.borderLight}`, background:C.surface, flexShrink:0}}>
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10}}>
          <div style={{fontSize:15, fontWeight:900, color:C.text, letterSpacing:'-0.3px', fontFamily:"'Playfair Display', Georgia, serif"}}>Narrative Overview</div>
          <div style={{fontSize:11, color:C.textMute}}>
            {lastUpdated ? `Brief generated ${lastUpdated}` : 'No brief generated yet'}
            {' · '}{stories.length} {stories.length===1?'story':'stories'} · {totalEpisodes} episodes
          </div>
        </div>
        {refreshing && refreshProg?.title && (
          <div style={{fontSize:11, color:C.textMute, marginBottom:6, paddingLeft:1}}>
            Refreshing headlines: <em>{refreshProg.i}/{refreshProg.total} — {refreshProg.title}</em>
          </div>
        )}
        <div style={{display:'flex', gap:8, maxWidth:680, margin:'0 auto'}}>
          <input
            value={searchInput}
            onChange={e=>setSearchInput(e.target.value)}
            onKeyDown={handleSearchKey}
            placeholder="Search the news…"
            style={{flex:1, padding:'8px 14px', borderRadius:8, border:`1.5px solid ${C.border}`, background:C.bg, color:C.text, fontSize:13.5, outline:'none'}}

// ─── Markdown renderer (chat-safe, no library needed) ────────────────────────
function maybeDeltaJsonToMarkdown(parsed) {
  if (!parsed || typeof parsed !== 'object') return '';
  const exec = String(parsed.execSummary || parsed.summary || '').trim();
  const rows = Array.isArray(parsed.stories) ? parsed.stories : [];
  if (!exec && !rows.length) return '';
  const out = [];
  if (exec) {
    out.push('### Executive Summary');
    out.push(exec);
    out.push('');
  }
  rows.forEach((row) => {
    const title = String(row?.storyTitle || row?.title || row?.storyId || '').trim();
    if (!title) return;
    out.push(`#### ${title}`);
    const noNews = String(row?.noNews || '').toLowerCase() === 'true' || row?.noNews === true;
    const velocity = String(row?.velocity || '').trim().toLowerCase();
    const note = String(row?.velocityNote || '').trim();
    const fresh = Array.isArray(row?.keyDevelopments) ? row.keyDevelopments.filter(Boolean).slice(0, 3) : [];
    if (noNews) out.push('- No news since last update.');
    if (velocity) out.push(`- Velocity: ${velocity}`);
    if (note) out.push(`- ${note}`);
    if (fresh.length) {
      out.push('- Fresh developments:');
      fresh.forEach((item) => out.push(`  - ${String(item)}`));
    }
    out.push('');
  });
  return out.join('\n').trim();
}

function normalizeMarkdownInput(text) {
  if (text == null) return '';
  if (typeof text === 'string') {
    const raw = text.trim();
    if (!raw) return '';
    // Some providers return JSON-as-string payloads; recover the markdown field when present.
    if ((raw.startsWith('{') && raw.endsWith('}')) || (raw.startsWith('[') && raw.endsWith(']'))) {
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed?.markdown === 'string') return parsed.markdown;
        if (typeof parsed?.message === 'string') return parsed.message;
        if (typeof parsed?.summary === 'string') return parsed.summary;
        const deltaMd = maybeDeltaJsonToMarkdown(parsed);
        if (deltaMd) return deltaMd;
      } catch {}
    }
    // Some payloads come double-quoted with escaped newlines.
    if (raw.startsWith('"') && raw.endsWith('"')) {
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed === 'string') return parsed;
      } catch {}
    }
    return text;
  }
  if (Array.isArray(text)) {
    return text
      .map(v => (typeof v === 'string' ? v : (v == null ? '' : String(v))))
      .filter(Boolean)
      .join('\n');
  }
  if (typeof text === 'object') {
    if (typeof text.markdown === 'string') return text.markdown;
    if (typeof text.message === 'string') return text.message;
    if (typeof text.summary === 'string') return text.summary;
    const deltaMd = maybeDeltaJsonToMarkdown(text);
    if (deltaMd) return deltaMd;
    try { return JSON.stringify(text, null, 2); } catch {}
  }
  return String(text);
}

function MiniMarkdown({ text, sources = [] }) {
  const safeText = normalizeMarkdownInput(text);
  if (!safeText) return null;
  const lines = safeText.split('\n');
  const elements = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // Skip blank lines between blocks
    if (!line.trim()) { i++; continue; }
    // Fenced code blocks
    if (/^\s*```/.test(line)) {
      const codeLines = [];
      const open = line.match(/^\s*```(\w+)?/) || [];
      const lang = String(open[1] || '').trim();
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) {
        codeLines.push(lines[i]);
        i++;
      }
      if (i < lines.length && /^\s*```/.test(lines[i])) i++;
      elements.push(
        <pre
          key={`code-${i}`}
          style={{
            margin: '8px 0',
            padding: '10px 12px',
            borderRadius: 8,
            background: C.bgElev || C.bg2 || C.bg,
            border: `1px solid ${C.border}`,
            overflowX: 'auto',
            color: C.text,
            fontSize: 12,
            lineHeight: 1.5
          }}
        >
          {lang ? <div style={{fontSize:10,color:C.textMute,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.08em'}}>{lang}</div> : null}
          <code>{codeLines.join('\n')}</code>
        </pre>
      );
      continue;
    }
    // Markdown headings (# through ######)
    if (/^\s*#{1,6}\s/.test(line)) {
      const level = (line.match(/^\s*#+/)?.[0]?.trim().length) || 1;
      const size = level <= 2 ? 13.5 : 12.5;
      elements.push(<div key={i} style={{fontWeight:700, color:'var(--text)', marginTop:10, marginBottom:3, fontSize:size}}>{line.replace(/^\s*#{1,6}\s/, '')}</div>);
      i++; continue;
    }
    // Bullet list — collect consecutive bullet lines
    if (/^\s*[\-\*]\s/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[\-\*]\s/.test(lines[i])) {
        items.push(inlineFormat(lines[i].replace(/^\s*[\-\*]\s/, ''), i, sources));
        i++;
      }
      elements.push(<ul key={`ul-${i}`} style={{margin:'4px 0', paddingLeft:18}}>{items.map((it,j) => <li key={j} style={{marginBottom:2}}>{it}</li>)}</ul>);
      continue;
    }
    // Normal paragraph
    elements.push(<p key={i} style={{margin:'4px 0', lineHeight:1.6}}>{inlineFormat(line, i, sources)}</p>);
    i++;
  }
  return <div style={{fontSize:13}}>{elements}</div>;
}

function renderInlineLinks(text, keyBase, bold = false, sources = []) {
  const src = String(text || '');
  const srcList = normalizeSourceList(sources);
  const out = [];
  const tokenRe = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<>"']+)|(www\.[^\s<>"']+)/g;
  let last = 0;
  let m;
  let k = 0;
  while ((m = tokenRe.exec(src)) !== null) {
    if (m.index > last) out.push(src.slice(last, m.index));
    const mdLabel = m[1];
    const mdUrl = m[2];
    const bareUrl = m[3] || m[4];
    const href = normalizeExternalUrl(mdUrl || bareUrl || '');
    const label = mdLabel || bareUrl || href;
    if (href) {
      out.push(
        <a
          key={`${keyBase}-lnk-${k++}`}
          href={href}
          target="_blank"
          rel="noopener noreferrer"
          style={{ color: C.accent, textDecoration: 'underline', fontWeight: bold ? 700 : 500, wordBreak: bareUrl ? 'break-all' : 'normal' }}
        >
          {label}
        </a>
      );
    } else {
      out.push(label);
    }
    last = tokenRe.lastIndex;
  }
  if (last < src.length) out.push(src.slice(last));

  // Convert citation markers like [1], [2] to source links when available.
  const withCitations = [];
  let ck = 0;
  const citationRe = /\[(\d{1,3})\]/g;
  for (const part of out) {
    if (typeof part !== 'string') {
      withCitations.push(part);
      continue;
    }
    let pLast = 0;
    let cm;
    while ((cm = citationRe.exec(part)) !== null) {
      if (cm.index > pLast) withCitations.push(part.slice(pLast, cm.index));
      const n = Number(cm[1]);
      const src = srcList[n - 1] || null;
      const href = normalizeExternalUrl(src?.url || '');
      if (href) {
        withCitations.push(
          <a
            key={`${keyBase}-cit-${ck++}`}
            href={href}
            target="_blank"
            rel="noopener noreferrer"
            title={src?.title || `Source ${n}`}
            style={{ color: C.accent, textDecoration: 'underline', fontWeight: bold ? 700 : 500 }}
          >
            [{n}]
          </a>
        );
      } else {
        withCitations.push(cm[0]);
      }
      pLast = citationRe.lastIndex;
    }
    if (pLast < part.length) withCitations.push(part.slice(pLast));
  }
  return withCitations;
}

function inlineFormat(text, key, sources = []) {
  // Split on **bold** and render, while preserving hyperlinks.
  const parts = String(text || '').split(/(\*\*[^*]+\*\*)/g);
  return parts.map((p, i) => {
    if (/^\*\*[^*]+\*\*$/.test(p)) {
      const inner = p.slice(2, -2);
      return <strong key={`${key}-b-${i}`}>{renderInlineLinks(inner, `${key}-b-${i}`, true, sources)}</strong>;
    }
    return <React.Fragment key={`${key}-t-${i}`}>{renderInlineLinks(p, `${key}-t-${i}`, false, sources)}</React.Fragment>;
  });
}

const TTS_STATE = {
  utterance: null,
  ownerId: '',
  listeners: new Set(),
};

function subscribeTtsState(listener) {
  if (typeof listener !== 'function') return () => {};
  TTS_STATE.listeners.add(listener);
  return () => TTS_STATE.listeners.delete(listener);
}

function notifyTtsState() {
  TTS_STATE.listeners.forEach(fn => {
    try { fn(TTS_STATE.ownerId || ''); } catch {}
  });
}

function cancelTtsPlayback() {
  if (!window?.speechSynthesis) return;
  try { window.speechSynthesis.cancel(); } catch {}
  TTS_STATE.utterance = null;
  TTS_STATE.ownerId = '';
  notifyTtsState();
}

function markdownToSpeechText(text) {
  const raw = normalizeMarkdownInput(text);
  if (!raw) return '';
  return String(raw)
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^\s*[-*]\s+/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/_([^_]+)_/g, '$1')
    .replace(/\s+/g, ' ')
    .trim();
}

function listToSpeech(label, items) {
  const arr = Array.isArray(items) ? items : [];
  if (!arr.length) return '';
  const body = arr.map(item => {
    if (item && typeof item === 'object') {
      return `${item.name || ''}${item.role ? `, ${item.role}` : ''}`.trim();
    }
    return String(item || '').trim();
  }).filter(Boolean).join('. ');
  return body ? `${label}. ${body}.` : '';
}

function buildStoryBriefSpeechText(story, brief) {
  if (!brief) return '';
  const parts = [];
  if (story?.title) parts.push(`Story: ${story.title}.`);
  if (brief.velocity) parts.push(`Velocity: ${brief.velocity}.`);
  if (brief.velocityNote) parts.push(markdownToSpeechText(brief.velocityNote));
  parts.push(listToSpeech('Key points', brief.keyPoints));
  parts.push(listToSpeech('Key players', brief.keyPlayers));
  parts.push(listToSpeech('Actionable items', brief.actionableItems));
  parts.push(listToSpeech('Watch signals', brief.watchSignals));
  parts.push(listToSpeech('Information gaps', brief.informationGaps));
  if (brief.valeReport?.message) {
    parts.push('Live web intelligence.');
    parts.push(markdownToSpeechText(brief.valeReport.message));
  }
  return parts.filter(Boolean).join(' ');
}

function buildGlobalBriefSpeechText(briefData) {
  if (!briefData) return '';
  const exec = markdownToSpeechText(briefData.execSummary || '');
  const briefs = Array.isArray(briefData.storyBriefs) ? briefData.storyBriefs : [];
  const cross = briefData.crossBrief || null;
  const out = [];
  if (exec) out.push(`Executive summary. ${exec}`);
  briefs.forEach(({ story, brief }) => {
    out.push(buildStoryBriefSpeechText(story, brief));
  });
  if (cross) {
    if (cross.globalTheme) out.push(`Lateral connections theme. ${markdownToSpeechText(cross.globalTheme)}`);
    out.push(listToSpeech('Story connections', cross.connections?.map(c => c.label || c.connection || c.note || '')));
    out.push(listToSpeech('Convergences', cross.convergences));
    out.push(listToSpeech('Collective blind spots', cross.blindSpots));
  }
  return out.filter(Boolean).join(' ');
}

function splitSpeechChunks(text, maxLen = 220) {
  const raw = String(text || '').trim();
  if (!raw) return [];
  const cleaned = raw.replace(/\s+/g, ' ').trim();
  const sentences = cleaned.split(/(?<=[\.\!\?])\s+/).filter(Boolean);
  const chunks = [];
  let cur = '';
  for (const s of sentences) {
    if (s.length > maxLen) {
      if (cur) { chunks.push(cur.trim()); cur = ''; }
      for (let i = 0; i < s.length; i += maxLen) {
        chunks.push(s.slice(i, i + maxLen).trim());
      }
      continue;
    }
    if (!cur) {
      cur = s;
      continue;
    }
    if ((cur.length + 1 + s.length) <= maxLen) cur += ` ${s}`;
    else { chunks.push(cur.trim()); cur = s; }
  }
  if (cur) chunks.push(cur.trim());
  return chunks.filter(Boolean);
}

function TTSButton({ text, settings, label = 'Read', title = 'Read aloud', style = {} }) {
  const ownerIdRef = React.useRef(`tts-${Math.random().toString(36).slice(2, 10)}`);
  const [active, setActive] = React.useState(false);
  const supported = !!window?.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined';
  const speechText = markdownToSpeechText(text);
  const canPlay = supported && !!speechText;

  React.useEffect(() => subscribeTtsState((ownerId) => {
    setActive(ownerId === ownerIdRef.current);
  }), []);

  React.useEffect(() => () => {
    if (TTS_STATE.ownerId === ownerIdRef.current) cancelTtsPlayback();
  }, []);

  const baseStyle = {
    fontSize: 11,
    color: C.accent,
    background: 'none',
    border: `1px solid ${C.border}`,
    borderRadius: 6,
    cursor: canPlay ? 'pointer' : 'default',
    fontWeight: 700,
    padding: '2px 8px',
    opacity: canPlay ? 1 : 0.45,
  };

  function onPress(e) {
    e?.stopPropagation?.();
    if (!canPlay) return;
    if (active) { cancelTtsPlayback(); return; }
    cancelTtsPlayback();
    const chunks = splitSpeechChunks(speechText);
    if (!chunks.length) return;
    const voiceId = String(settings?.ttsVoice || '').trim();
    const voices = window.speechSynthesis.getVoices?.() || [];
    const selected = voiceId ? voices.find(v => v.voiceURI === voiceId) : null;
    const ownerId = ownerIdRef.current;
    TTS_STATE.ownerId = ownerId;
    TTS_STATE.utterance = { ownerId, chunks: chunks.length };
    notifyTtsState();
    chunks.forEach((chunk, idx) => {
      const utterance = new SpeechSynthesisUtterance(chunk);
      if (selected) utterance.voice = selected;
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.onend = () => {
        if (TTS_STATE.ownerId !== ownerId) return;
        if (idx !== chunks.length - 1) return;
        TTS_STATE.ownerId = '';
        TTS_STATE.utterance = null;
        notifyTtsState();
      };
      utterance.onerror = () => {
        if (TTS_STATE.ownerId !== ownerId) return;
        TTS_STATE.ownerId = '';
        TTS_STATE.utterance = null;
        notifyTtsState();
      };
      window.speechSynthesis.speak(utterance);
    });
  }

  return (
    <button onClick={onPress} title={title} disabled={!canPlay} style={{...baseStyle, ...style}}>
      {active ? '■ Stop' : `🔊 ${label}`}
    </button>
  );
}
