// Click-to-rename story title — no edit button, the text itself is the
// affordance. Matters in practice: a story auto-titled verbatim from a
// headline ("20+ things you may have missed in the GTA 6 extended look")
// makes a bad search term for everything downstream (headlines, videos,
// social, auto-refresh) that uses story.title as its query. Renaming to
// "GTA 6" broadens that search immediately, everywhere, for free.
function EditableStoryTitle({ story, onUpdateStory }) {
  const [editing, setEditing] = useState(false);
  const [draft,   setDraft]   = useState(story.title || '');
  const inputRef = useRef(null);
  const titleStyle = { margin:0, fontSize:17, fontWeight:800, color:C.text, letterSpacing:'-0.3px', fontFamily:'inherit' };

  useEffect(() => { setDraft(story.title || ''); setEditing(false); }, [story.id]);
  useEffect(() => { if (editing) { inputRef.current?.focus(); inputRef.current?.select(); } }, [editing]);

  function commit() {
    const trimmed = draft.trim();
    setEditing(false);
    if (trimmed && trimmed !== story.title) onUpdateStory && onUpdateStory(story.id, { title: trimmed });
    else setDraft(story.title || '');
  }
  function cancel() { setDraft(story.title || ''); setEditing(false); }

  if (!onUpdateStory) return <h2 style={titleStyle}>{story.title}</h2>;

  if (editing) {
    return (
      <input
        ref={inputRef}
        value={draft}
        onChange={e => setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } else if (e.key === 'Escape') cancel(); }}
        style={{...titleStyle, border:'none', borderBottom:`1.5px solid ${C.accent}`, background:'transparent', outline:'none', padding:0, minWidth:160, width:`${Math.max(10, draft.length + 1)}ch`, maxWidth:'100%'}}
      />
    );
  }
  return (
    <h2
      onClick={() => setEditing(true)}
      title="Click to rename"
      style={{...titleStyle, cursor:'text', borderBottom:'1.5px solid transparent', transition:'border-color 0.15s'}}
      onMouseEnter={e => { e.currentTarget.style.borderBottomColor = C.borderLight; }}
      onMouseLeave={e => { e.currentTarget.style.borderBottomColor = 'transparent'; }}
    >
      {story.title}
    </h2>
  );
}

// One scored article under a prediction, with controls to override the AI's call or score it again.
function PredictionLinkCard({ link, color, busy, onSetStance, onRescore }) {
  const item = link.item || {};
  let host = item.source || '';
  if (!host && item.url) { try { host = new URL(item.url).hostname.replace('www.', ''); } catch (e) {} }
  const STANCES = [['supports','Supports','#059669'],['contradicts','Contradicts','#dc2626'],['complicates','Complicates','#d97706'],['irrelevant','Irrelevant','#6b7280']];
  const unscored = link.stance === 'error' || link.stance === 'pending';
  const chip = (active, col) => ({fontSize:11,padding:'2px 9px',borderRadius:10,cursor:busy?'default':'pointer',
    border:`1px solid ${active ? col : C.borderLight}`,background:active ? col : 'transparent',color:active ? '#fff' : C.textMid});
  return (
    <div style={{padding:'10px 12px',borderRadius:8,background:C.surface,border:`1px solid ${C.borderLight}`,opacity:busy ? 0.6 : 1}}>
      <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
        <span style={{fontSize:18,fontWeight:900,color,lineHeight:1,minWidth:36,textAlign:'center'}}>{unscored ? '—' : link.weight}</span>
        <div style={{flex:1,minWidth:0}}>
          <a href={item.url} target="_blank" rel="noopener noreferrer" style={{fontSize:13,fontWeight:600,color:C.text,textDecoration:'none',lineHeight:1.4,display:'block',marginBottom:4}}>
            {item.title || 'Untitled'}
          </a>
          <div style={{fontSize:11,color:C.textMute,marginBottom:4}}>{host || 'Unknown source'}{link.tagger === 'user' ? ' · ✎ set by you' : ''}</div>
          {link.reason
            ? <div style={{fontSize:12,color:link.stance === 'error' ? '#d97706' : C.textMid,lineHeight:1.5,fontStyle:'italic'}}>{link.reason}</div>
            : (link.stance === 'pending' && <div style={{fontSize:12,color:C.textMute}}>Waiting to be scored…</div>)}
          <div style={{display:'flex',gap:4,flexWrap:'wrap',alignItems:'center',marginTop:8}}>
            <span style={{fontSize:10,color:C.textMute,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginRight:2}}>Mark as</span>
            {STANCES.map(([k, label, col]) => (
              <button key={k} disabled={busy} onClick={() => onSetStance(link, k)} style={chip(link.stance === k, col)}>{label}</button>
            ))}
            <button disabled={busy} onClick={() => onRescore(link)} title="Ask the AI to score this article again (replaces any change you made)"
              style={{...chip(false, C.textMute),marginLeft:'auto'}}>↻ Re-score</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PredictionCenterView({ story }) {
  const [prediction, setPrediction] = useState(null);
  const [links, setLinks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [evidence, setEvidence] = useState(null);
  const [job, setJob] = useState(null);
  const [sigBusy, setSigBusy] = useState(false);
  const [sigErr, setSigErr] = useState('');
  const [newQuery, setNewQuery] = useState('');
  const [newType, setNewType] = useState('indicator');
  const [linkBusy, setLinkBusy] = useState('');
  const [showIrrelevant, setShowIrrelevant] = useState(false);
  const pid = story?.predictionId;

  function loadAll() {
    if (!pid) return Promise.resolve();
    return Promise.all([
      fetch(`/v2/predictions/${pid}`).then(r => r.ok ? r.json() : null),
      fetch(`/v2/links?predictionId=${pid}`).then(r => r.ok ? r.json() : null)
    ]).then(([pData, lData]) => {
      if (pData?.prediction) setPrediction(pData.prediction);
      if (pData?.evidence) setEvidence(pData.evidence);
      if (lData?.links) setLinks(lData.links);
      window.dispatchEvent(new CustomEvent('lateral-prediction-updated', { detail: pid }));
    });
  }

  useEffect(() => {
    if (!pid) return;
    setLoading(true);
    loadAll()
      .then(() => fetch(`/v2/predictions/${pid}/search/status`).then(r => r.ok ? r.json() : null))
      .then(d => { if (d?.job) setJob(d.job); setLoading(false); })
      .catch(e => { setError(e.message); setLoading(false); });
  }, [pid]);

  // While a search+score job runs, poll its status and refresh results as articles get scored.
  useEffect(() => {
    if (!pid || job?.state !== 'running') return;
    const t = setInterval(async () => {
      try {
        const r = await fetch(`/v2/predictions/${pid}/search/status`);
        const d = r.ok ? await r.json() : null;
        if (d?.job) setJob(d.job);
        await loadAll();
      } catch {}
    }, 3000);
    return () => clearInterval(t);
  }, [pid, job?.state]);

  if (loading) return (
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:C.textMute}}>
      <div>Loading prediction…</div>
    </div>
  );

  const supports = links.filter(l => l.stance === 'supports').sort((a,b) => b.weight - a.weight);
  const contradicts = links.filter(l => l.stance === 'contradicts').sort((a,b) => b.weight - a.weight);
  const complicates = links.filter(l => l.stance === 'complicates').sort((a,b) => b.weight - a.weight);
  const needsScoring = links.filter(l => l.stance === 'pending' || l.stance === 'error');
  const irrelevant = links.filter(l => l.stance === 'irrelevant');

  const HL = {fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:8};

  // ── Per-article controls: override the AI's call, or have it scored again ──
  async function setStance(link, stance) {
    if (link.stance === stance && link.tagger === 'user') return;
    setLinkBusy(link.id); setSigErr('');
    try {
      const weight = stance === 'irrelevant' ? 0 : (link.weight > 0 ? link.weight : 30);
      const was = link.reason && link.tagger !== 'user' ? ` (AI said: ${link.reason})` : '';
      const reason = `You marked this "${stance}".${was}`.slice(0, 400);
      const r = await fetch(`/v2/links/${link.id}/review`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ stance, weight, reason }) });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'Could not update that article');
      await loadAll();
    } catch (e) { setSigErr(e.message); }
    setLinkBusy('');
  }
  async function rescoreLink(link) {
    setLinkBusy(link.id); setSigErr('');
    try {
      const r = await fetch(`/v2/links/${link.id}/score`, { method:'POST' });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'Could not re-score that article');
      await loadAll();
    } catch (e) { setSigErr(e.message); }
    setLinkBusy('');
  }

  // ── Signals: the search queries that feed evidence into this prediction ──
  const signals = prediction?.signals || [];
  const activeCount = signals.filter(s => s.active).length;
  const jobRunning = job?.state === 'running';

  async function saveSignals(next) {
    setSigBusy(true); setSigErr('');
    try {
      const r = await fetch(`/v2/predictions/${pid}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ signals: next }) });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'Could not save signals');
      setPrediction(d.prediction);
      window.dispatchEvent(new CustomEvent('lateral-prediction-updated', { detail: pid }));
    } catch (e) { setSigErr(e.message); }
    setSigBusy(false);
  }
  function addSignal() {
    const q = newQuery.trim();
    if (!q) return;
    if (signals.some(s => s.query.toLowerCase() === q.toLowerCase())) { setSigErr('That signal is already added.'); return; }
    setNewQuery('');
    saveSignals([...signals, { query: q, type: newType, active: true }]);
  }
  function toggleSignal(id) { saveSignals(signals.map(s => s.id === id ? { ...s, active: !s.active } : s)); }
  function removeSignal(id) { saveSignals(signals.filter(s => s.id !== id)); }
  async function suggestSignals() {
    setSigBusy(true); setSigErr('');
    try {
      const r = await fetch('/v2/signals/suggest', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ statement: prediction.statement, resolutionDate: prediction.resolutionDate }) });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'Could not suggest signals');
      const have = new Set(signals.map(s => s.query.toLowerCase()));
      const fresh = (d.signals || []).filter(s => !have.has(s.query.toLowerCase()));
      if (!fresh.length) { setSigErr('No new suggestions — try adding your own.'); setSigBusy(false); return; }
      await saveSignals([...signals, ...fresh.map(s => ({ ...s, active: true }))]);
    } catch (e) { setSigErr(e.message); setSigBusy(false); }
  }
  async function runSearch() {
    setSigErr('');
    try {
      const r = await fetch(`/v2/predictions/${pid}/search`, { method:'POST' });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'Could not start the search');
      setJob(d.job);
    } catch (e) { setSigErr(e.message); }
  }

  const SIG_TYPES = { indicator:'Indicator', actor:'Actor', event:'Event' };
  const dirLabel = { closer:'Trending toward TRUE', further:'Trending toward FALSE', mixed:'Mixed evidence', none:'No directional evidence yet' };
  const dirColor = { closer:'#059669', further:'#dc2626', mixed:'#d97706', none:C.textMute };

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:C.bg}}>
      {/* Header */}
      <div style={{padding:'18px 24px 14px',borderBottom:`1px solid ${C.borderLight}`,background:C.surface,flexShrink:0}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:5}}>
              <span style={{fontSize:15,fontWeight:700,color:C.text}}>{story.title.replace(' (Prediction)', '')}</span>
              <Dot status={story.status}/>
            </div>
            {story.statusLine && (
              <div style={{fontSize:13,fontStyle:'italic',color:C.accent,margin:'0 0 8px',lineHeight:1.4}}>
                {story.statusLine}
              </div>
            )}
            {(story.tags||[]).length>0 && <CompactPillCloud items={story.tags} maxVisible={5} moreLabel="more tags" gap={4}/>}
          </div>
          <div style={{display:'flex',gap:7,flexShrink:0}}>
            <Btn variant="ghost" onClick={() => shareStoryTimeline(story)} style={{padding:'6px 11px',fontSize:12}}>
              🔗 Share
            </Btn>
          </div>
        </div>
      </div>

      {/* Scrollable evidence report */}
      <div style={{flex:1,overflowY:'auto',padding:'20px 24px 64px'}}>
        {/* Prediction statement */}
        <div style={{marginBottom:20}}>
          <div style={{...HL}}>Prediction Statement</div>
          <div style={{fontSize:14,color:C.text,lineHeight:1.6,padding:'12px 14px',borderRadius:8,background:C.surface,border:`1px solid ${C.borderLight}`}}>
            {prediction?.statement || story.summary}
          </div>
          <div style={{display:'flex',gap:14,marginTop:10,fontSize:12,color:C.textMute}}>
            <span>Entered: {new Date(story.createdAt).toLocaleDateString()}</span>
            {prediction?.resolutionDate && <span>Resolves: {new Date(prediction.resolutionDate).toLocaleDateString()}</span>}
            <span>Signals: {prediction?.signals?.length || 0}</span>
          </div>
        </div>

        {/* Evidence */}
        {evidence && (
          <div style={{marginBottom:20}}>
            <div style={{...HL}}>Evidence balance</div>
            <div style={{padding:'12px 14px',borderRadius:8,background:C.surface,border:`1px solid ${C.borderLight}`}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:8,gap:8,flexWrap:'wrap'}}>
                <span style={{fontSize:13,fontWeight:700,color:dirColor[evidence.direction]||C.text}}>{dirLabel[evidence.direction] || 'No evidence yet'}</span>
                <span style={{fontSize:11,color:C.textMute}} title="Weight of supporting articles minus contradicting articles, from -100 (all against) to +100 (all for). This is NOT a probability and is separate from your confidence.">
                  {evidence.direction !== 'none' ? `balance ${evidence.score > 0 ? '+' : ''}${evidence.score} (of ±100)` : ''}
                  {evidence.strength && evidence.strength !== 'none' ? ` · ${evidence.strength} evidence` : ''}
                </span>
              </div>
              <div style={{position:'relative',height:8,borderRadius:4,background:C.borderLight}}>
                <div style={{position:'absolute',top:0,bottom:0,left:'50%',width:1,background:C.textMute}}/>
                {evidence.direction !== 'none' && (
                  <div style={{position:'absolute',top:0,bottom:0,borderRadius:4,background:evidence.score >= 0 ? '#059669' : '#dc2626',
                    left:evidence.score >= 0 ? '50%' : `${50 + evidence.score / 2}%`, width:`${Math.abs(evidence.score) / 2}%`}}/>
                )}
              </div>
              <div style={{display:'flex',gap:12,flexWrap:'wrap',marginTop:8,fontSize:11,color:C.textMute}}>
                <span>🟢 {evidence.supports} supports</span>
                <span>🔴 {evidence.contradicts} contradicts</span>
                <span>∼ {evidence.complicates} complicates</span>
                <span>{evidence.irrelevant} irrelevant</span>
              </div>
              <div style={{marginTop:8,fontSize:11,color:C.textMute,lineHeight:1.5,fontStyle:'italic'}}>
                Shows which way the news found so far leans: −100 = all against, +100 = all for. It is not a probability and doesn’t change your confidence.
              </div>
            </div>
          </div>
        )}

        {/* Signals */}
        <div style={{marginBottom:20}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,gap:8,flexWrap:'wrap'}}>
            <div style={{...HL,marginBottom:0}}>Signals ({activeCount} active)</div>
            <div style={{display:'flex',gap:6}}>
              <Btn variant="secondary" onClick={suggestSignals} disabled={sigBusy || jobRunning} style={{padding:'5px 10px',fontSize:12}}>✨ Suggest</Btn>
              <Btn onClick={runSearch} disabled={sigBusy || jobRunning || activeCount === 0} style={{padding:'5px 10px',fontSize:12}}>{jobRunning ? 'Running…' : '▶ Search & score'}</Btn>
            </div>
          </div>
          <div style={{padding:'10px 12px',borderRadius:8,background:C.surface,border:`1px solid ${C.borderLight}`}}>
            {signals.length === 0 && (
              <div style={{fontSize:12,color:C.textMute,lineHeight:1.5,marginBottom:8}}>
                Signals are the searches that watch for evidence about this prediction. Add your own below, or click “Suggest”.
              </div>
            )}
            {signals.map(s => (
              <div key={s.id} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',opacity:s.active ? 1 : 0.5}}>
                <input type="checkbox" checked={!!s.active} onChange={() => toggleSignal(s.id)} disabled={sigBusy} title="Include in searches"/>
                <span style={{flex:1,fontSize:13,color:C.text}}>{s.query}</span>
                <span style={{fontSize:10,fontWeight:700,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.05em'}}>{SIG_TYPES[s.type] || s.type}</span>
                <button onClick={() => removeSignal(s.id)} disabled={sigBusy} title="Remove signal" style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:14,padding:'0 4px'}}>✕</button>
              </div>
            ))}
            <div style={{display:'flex',gap:6,marginTop:signals.length ? 8 : 0}}>
              <input value={newQuery} onChange={e => setNewQuery(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addSignal(); } }}
                placeholder="Add a search to watch, e.g. “Powell rate cut statement”"
                style={{...inputStyle,flex:1,padding:'7px 10px',fontSize:12}}/>
              <select value={newType} onChange={e => setNewType(e.target.value)} style={{...inputStyle,width:'auto',padding:'7px 8px',fontSize:12}}>
                {Object.entries(SIG_TYPES).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
              </select>
              <Btn variant="secondary" onClick={addSignal} disabled={sigBusy || !newQuery.trim()} style={{padding:'5px 12px',fontSize:12}}>Add</Btn>
            </div>
            {sigErr && <div style={{marginTop:8,fontSize:12,color:'#dc2626'}}>{sigErr}</div>}
            {job && (
              <div style={{marginTop:10,paddingTop:8,borderTop:`1px solid ${C.borderLight}`,fontSize:12,color:C.textMid,lineHeight:1.5}}>
                {jobRunning
                  ? <span>⏳ {job.phase === 'searching' ? 'Searching' : job.phase === 'retrying' ? 'Retrying' : 'Scoring'}{job.currentSignal ? ` “${job.currentSignal}”` : ''} — signal {Math.min((job.signalsDone || 0) + 1, job.signalsTotal || 1)} of {job.signalsTotal || '?'} · {job.found} found · {job.scored} scored</span>
                  : job.state === 'error'
                    ? <span style={{color:'#dc2626'}}>Search failed: {job.message}</span>
                    : <span>✓ {job.message}</span>}
                {!jobRunning && (job.errors || []).length > 0 && (
                  <div style={{color:'#d97706',marginTop:4}}>{job.errors.length} issue{job.errors.length > 1 ? 's' : ''}: {job.errors[job.errors.length - 1]}</div>
                )}
              </div>
            )}
            {needsScoring.length > 0 && !jobRunning && (
              <div style={{marginTop:8,fontSize:12,color:'#d97706'}}>⚠ {needsScoring.length} article{needsScoring.length > 1 ? 's' : ''} not scored yet — click “Search & score” to retry.</div>
            )}
          </div>
        </div>

        {/* Scored articles, grouped by stance. Every card can be overridden or re-scored. */}
        {[
          { key:'supports',    label:'🟢 Supports',    color:'#059669', list:supports },
          { key:'contradicts', label:'🔴 Contradicts', color:'#dc2626', list:contradicts },
          { key:'complicates', label:'∼ Complicates',  color:'#d97706', list:complicates },
        ].map(g => g.list.length > 0 && (
          <div key={g.key} style={{marginBottom:20}}>
            <div style={{...HL,color:g.color,marginBottom:10}}>{g.label} ({g.list.length})</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {g.list.map(link => (
                <PredictionLinkCard key={link.id} link={link} color={g.color} busy={linkBusy === link.id} onSetStance={setStance} onRescore={rescoreLink}/>
              ))}
            </div>
          </div>
        ))}

        {needsScoring.length > 0 && (
          <div style={{marginBottom:20}}>
            <div style={{...HL,color:'#d97706',marginBottom:10}}>⚠ Not scored ({needsScoring.length})</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {needsScoring.map(link => (
                <PredictionLinkCard key={link.id} link={link} color={C.textMute} busy={linkBusy === link.id} onSetStance={setStance} onRescore={rescoreLink}/>
              ))}
            </div>
          </div>
        )}

        {irrelevant.length > 0 && (
          <div style={{marginBottom:20}}>
            <div onClick={() => setShowIrrelevant(v => !v)} style={{...HL,color:C.textMute,marginBottom:10,cursor:'pointer',userSelect:'none'}}>
              {showIrrelevant ? '▾' : '▸'} Irrelevant ({irrelevant.length}) — {showIrrelevant ? 'hide' : 'show to review or reclassify'}
            </div>
            {showIrrelevant && (
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {irrelevant.map(link => (
                  <PredictionLinkCard key={link.id} link={link} color={C.textMute} busy={linkBusy === link.id} onSetStance={setStance} onRescore={rescoreLink}/>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function CenterPanel({ story, selEpId, onSelEp, onAddEp, onDiscover, onRegen, aiLoading, onDeleteEp, settings, onAddFromHeadline, onAddPodcast, onStoryRefreshed, onSaveBriefAsEpisode, onBackfill, onUpdateStory }) {
  const [contentMode, setContentMode] = useState('headlines');
  const [winW, setWinW] = useState(() => window.innerWidth);
  useEffect(() => {
    const onResize = () => setWinW(window.innerWidth);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  const isTablet = winW < 1100;

  useEffect(() => {
    setContentMode('headlines');
  }, [story?.id]);

  if (!story) return (
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,color:C.textMute}}>
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="23" stroke="#d1ccc4" strokeWidth="2"/><path d="M14 24h20M28 18l6 6-6 6" stroke="#d1ccc4" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
      <div style={{fontSize:15,fontWeight:500}}>Select a story to see its timeline</div>
      <div style={{fontSize:13}}>or create one to get started</div>
    </div>
  );

  // Prediction story — render prediction center view
  if (story.predictionId) {
    return <PredictionCenterView story={story} />;
  }

  // Normal story — existing timeline view
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:C.bg}}>
      {/* Story header */}
      <div style={{padding:'18px 24px 14px',borderBottom:`1px solid ${C.borderLight}`,display:'flex',flexDirection:isTablet?'column':'row',alignItems:'flex-start',gap:isTablet?6:12,background:C.surface,flexShrink:0}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:5}}>
            <EditableStoryTitle story={story} onUpdateStory={onUpdateStory}/>
            <Dot status={story.status}/>
          </div>
          {story.statusLine && (
            <div style={{fontSize:13,fontStyle:'italic',color:C.accent,margin:'0 0 8px',lineHeight:1.4}}>
              {story.statusLine}
            </div>
          )}
          {(story.tags||[]).length>0&&<CompactPillCloud items={story.tags} maxVisible={3} moreLabel="more tags" gap={4}/>}
        </div>
        {((story.episodes||[]).length>0 || story.status !== 'resolved') && (
          <div style={{display:'flex',gap:7,flexShrink:0,flexWrap:'wrap'}}>
            {(story.episodes||[]).length>0 && (
              <Btn variant="ghost" onClick={() => shareStoryTimeline(story)} style={{padding:'6px 11px',fontSize:12}} title="Generate a shareable timeline webpage of every episode">
                🔗 Share
              </Btn>
            )}
            <Btn variant="ghost" onClick={onBackfill} style={{padding:'6px 11px',fontSize:12}} title="Search Wikipedia (or paste a source) to backfill this story's history as dated episodes">
              ⏳ Backfill
            </Btn>
            {story.status !== 'resolved' && (<>
              <Btn variant="ghost" onClick={onRegen} disabled={aiLoading} style={{padding:'6px 11px',fontSize:12}}>{aiLoading?'…':'⚡ Regen'}</Btn>
              <Btn variant="ghost" onClick={onDiscover} style={{padding:'6px 11px',fontSize:12}}>🔍 Discover</Btn>
              <Btn onClick={onAddEp} style={{padding:'6px 13px',fontSize:12}}>+ Episode</Btn>
            </>)}
          </div>
        )}
      </div>
      {/* Timeline — fixed-height zone so headlines always have room below */}
      <div style={{height:200,flexShrink:0,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        <Timeline story={story} selEpId={selEpId} onSelEp={onSelEp} onDeleteEp={onDeleteEp}/>
      </div>
      {/* Scrollable region: headlines + dashboard scroll together */}
      <div style={{flex:1,overflowY:'auto',minHeight:0,paddingBottom:64}}>
        {contentMode === 'podcasts' ? (
          <PodcastsFeed story={story} settings={settings} onAddPodcast={onAddPodcast} onStoryRefreshed={onStoryRefreshed} onClose={() => setContentMode('headlines')}/>
        ) : contentMode === 'videos' ? (
          <VideosFeed story={story} onClose={() => setContentMode('headlines')} onAddFromHeadline={onAddFromHeadline}/>
        ) : (
          <>
            {story.status!=='resolved' && <HeadlinesFeed story={story} settings={settings} onAddFromHeadline={onAddFromHeadline} onStoryRefreshed={onStoryRefreshed} onExpandVideos={() => setContentMode('videos')} onExpandPodcasts={() => setContentMode('podcasts')}/>}
            <StoryDashboard story={story} settings={settings} locked={story.status==='resolved'} onStoryRefreshed={onStoryRefreshed} onSaveAsEpisode={onSaveBriefAsEpisode}/>
          </>
        )}
      </div>
    </div>
  );
}

// ─── Episode Detail (editable right panel) ───────────────────────────────────
function EpisodeDetail({ story, ep, onUpdateEp, onDeleteEp, settings, onPopOut }) {
  const [summary,     setSummary]     = useState(ep.summary||'');
  const [framingNote, setFramingNote] = useState(ep.framingNote||'');
  const [notes,       setNotes]       = useState(ep.notes||'');
  const [analyzing,   setAnalyzing]   = useState(false);
  const [analyzeError,setAnalyzeError]= useState('');
  const [editField,   setEditField]   = useState(null);  // null|'summary'|'framing'
  // Tracks the last value we knowingly synced in from `ep`, per field — lets
  // the background-update effect below tell "still matches what we loaded"
  // apart from "the user has since typed something different," without
  // needing to know whether a field happens to have edit-gating (summary/
  // framing do via editField; notes doesn't).
  const syncedRef = useRef({ summary: ep.summary||'', framingNote: ep.framingNote||'', notes: ep.notes||'' });

  // Sync local state when episode changes
  useEffect(() => {
    setSummary(ep.summary||'');
    setFramingNote(ep.framingNote||'');
    setNotes(ep.notes||'');
    setAnalyzeError('');
    setEditField(null);
    syncedRef.current = { summary: ep.summary||'', framingNote: ep.framingNote||'', notes: ep.notes||'' };
  }, [ep.id]);

  // Re-sync from background updates to the SAME episode — e.g. the AI draft
  // from "+ Add" landing while this panel is already open — without
  // clobbering an edit the user hasn't saved yet. Only adopts the incoming
  // value if the local field still matches what was last synced in; if the
  // user has typed something different, their draft wins until they blur.
  useEffect(() => {
    setSummary(prev => {
      if (prev !== syncedRef.current.summary) return prev;
      syncedRef.current.summary = ep.summary || '';
      return ep.summary || '';
    });
    setFramingNote(prev => {
      if (prev !== syncedRef.current.framingNote) return prev;
      syncedRef.current.framingNote = ep.framingNote || '';
      return ep.framingNote || '';
    });
    setNotes(prev => {
      if (prev !== syncedRef.current.notes) return prev;
      syncedRef.current.notes = ep.notes || '';
      return ep.notes || '';
    });
  }, [ep.summary, ep.framingNote, ep.notes]);

  function save(changes) { onUpdateEp && onUpdateEp(ep.id, changes); }

  async function analyze() {
    if (analyzing) return;
    setAnalyzing(true);
    setAnalyzeError('');
    try {
      let text = ep.headline;
      if (ep.sourceUrl) {
        try { const f = await fetchText(ep.sourceUrl); if (f) text = f; } catch {}
      }
      const r = await analyzeEpisode(text, story, settings);
      if (r.summary)     { setSummary(r.summary);         save({ summary: r.summary }); }
      if (r.framingNote) { setFramingNote(r.framingNote); save({ framingNote: r.framingNote }); }
      if (r.tags?.length)   save({ tags:   [...new Set([...(ep.tags||[]),   ...r.tags])] });
      if (r.actors?.length) save({ actors: [...new Set([...(ep.actors||[]), ...r.actors])] });
    } catch(e) {
      const msg = e?.message || String(e);
      setAnalyzeError(msg);
      console.warn('analyze failed:', e);
    }
    finally { setAnalyzing(false); }
  }

  const cfg = EP[ep.type]||EP.seed;

  const HL  = { fontSize:10, fontWeight:800, color:C.textMute, textTransform:'uppercase', letterSpacing:'0.07em' };
  const taS = { width:'100%', boxSizing:'border-box', fontSize:12.5, color:C.text, lineHeight:1.65,
                border:`1.5px solid ${C.border}`, borderRadius:7, padding:'8px 10px', resize:'vertical',
                outline:'none', background:C.bg, minHeight:64, fontFamily:'inherit' };
  const divider = { borderTop:`1px solid ${C.borderLight}`, margin:'14px 0' };


  return (
    <div className="fade-in">
      {(ep.imageUrl || ep.sourceUrl || ep.videoUrl || ep.audioUrl) && (
        <EpMedia
          url={ep.sourceUrl}
          imageUrl={ep.imageUrl}
          videoUrl={ep.videoUrl}
          audioUrl={ep.audioUrl}
          onPopOut={ep.audioUrl && onPopOut ? () => onPopOut({ audioUrl: ep.audioUrl, title: ep.headline, showName: ep.podcastTitle || ep.socialSource || 'Podcast', imageUrl: ep.imageUrl }) : undefined}
        />
      )}

      {/* Type badge + date */}
      <div style={{marginBottom:14}}>
        <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
          <Tag color={cfg.color} bg={cfg.light}>{cfg.symbol} {cfg.label}</Tag>
          <select
            value={ep.type}
            onChange={e => save({ type: e.target.value })}
            style={{
              fontSize:12,
              padding:'4px 8px',
              borderRadius:6,
              border:`1.5px solid ${C.border}`,
              background:C.bg,
              color:C.text,
              cursor:'pointer',
              outline:'none'
            }}
          >
            {Object.entries(EP).map(([key, val]) => (
              <option key={key} value={key}>{val.symbol} {val.label}</option>
            ))}
          </select>
        </div>
        <div style={{fontSize:12,color:C.textMute,marginTop:7}}>{fmtL(ep.date)}</div>
      </div>

      {/* Headline */}
      <h3 style={{margin:'0 0 16px',fontSize:15,fontWeight:700,color:C.text,lineHeight:1.4}}>
        {ep.sourceUrl
          ? <a href={ep.sourceUrl} target="_blank" rel="noopener noreferrer" style={{color:'inherit',textDecoration:'none',borderBottom:`1px solid ${C.border}`}}>{ep.headline}</a>
          : ep.headline}
      </h3>

      <hr style={divider}/>

      {/* Summary */}
      <div style={{marginBottom:14}}>
        <div style={{...HL,marginBottom:6}}>Summary</div>
        {editField !== 'summary'
          ? <div onClick={()=>setEditField('summary')}
              style={{fontSize:12.5,lineHeight:1.65,padding:'8px 10px',borderRadius:7,
                      border:`1.5px dashed ${C.border}`,cursor:'text',whiteSpace:'pre-wrap',
                      background:C.bg,minHeight:36,
                      color:summary?C.text:C.textMute,fontStyle:summary?'normal':'italic'}}>
              {summary||'No summary yet — click to write or use ✦ Analyze…'}
            </div>
          : <textarea value={summary} onChange={e=>setSummary(e.target.value)}
              autoFocus
              onBlur={()=>{save({summary});setEditField(null);}}
              placeholder="No summary yet — click ↻ Generate or write one…"
              style={taS}/>
        }
      </div>

      {/* Framing Note */}
      <div style={{marginBottom:14}}>
        <div style={{...HL,marginBottom:6}}>Framing Note</div>
        {editField !== 'framing'
          ? <div onClick={()=>setEditField('framing')}
              style={{fontSize:12.5,lineHeight:1.65,padding:'8px 10px',borderRadius:7,
                      border:`1.5px dashed ${C.border}`,cursor:'text',whiteSpace:'pre-wrap',
                      background:C.bg,minHeight:36,
                      color:framingNote?C.text:C.textMute,fontStyle:framingNote?'normal':'italic'}}>
              {framingNote||'Narrative framing, bias, structural observation…'}
            </div>
          : <textarea value={framingNote} onChange={e=>setFramingNote(e.target.value)}
              autoFocus
              onBlur={()=>{save({framingNote});setEditField(null);}}
              placeholder="Narrative framing, bias, structural observation…"
              style={taS}/>
        }
      </div>

      {/* Source links for Summary / Brief episodes */}
      {(ep.episodeType === 'web-summary' || ep.episodeType === 'brief') && Array.isArray(ep.sourceLinks) && ep.sourceLinks.length > 0 && (
        <div style={{marginBottom:14}}>
          <div style={{...HL,marginBottom:6}}>Sources</div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {ep.sourceLinks.map((s, i) => (
              <a key={i} href={s.url} target="_blank" rel="noopener noreferrer"
                style={{fontSize:11.5,color:C.accent,textDecoration:'none',lineHeight:1.4,
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'block'}}
                title={s.url}>
                {s.title || s.url}
              </a>
            ))}
          </div>
        </div>
      )}

      <hr style={divider}/>

      {/* Tags */}
      <div style={{marginBottom:14}}>
        <TagChipInput
          label="Tags"
          items={ep.tags||[]}
          onChange={tags => save({tags})}
          placeholder="Add tag…"
        />
      </div>

      {/* Players */}
      <div style={{marginBottom:14}}>
        <TagChipInput
          label="Players"
          items={ep.actors||[]}
          onChange={actors => save({actors})}
          placeholder="Add player…"
        />
      </div>

      <hr style={divider}/>

      {/* Notes */}
      <div style={{marginBottom:16}}>
        <div style={{...HL,marginBottom:6}}>Notes</div>
        <textarea value={notes} onChange={e=>setNotes(e.target.value)}
          onBlur={()=>save({notes})}
          placeholder="Your analysis, questions, observations, follow-ups…"
          style={{...taS, minHeight:90, background:'#fffdf5', borderColor:'#e5ddb0'}}/>
      </div>

      {/* Source */}
      {ep.sourceUrl && (
        <a href={ep.sourceUrl} target="_blank" rel="noopener noreferrer"
          style={{fontSize:12,color:C.accent,display:'block',marginBottom:14,wordBreak:'break-all'}}>
          Source article →
        </a>
      )}

      {/* Analyze + Delete */}
      <div style={{display:'flex',gap:8,marginTop:4}}>
        <button onClick={analyze} disabled={analyzing}
          style={{flex:1,padding:'8px 11px',borderRadius:8,border:`1.5px solid ${C.border}`,
                  background:C.bg,color:C.text,fontSize:11.5,fontWeight:700,cursor:analyzing?'not-allowed':'pointer',
                  opacity:analyzing?0.45:1,transition:'opacity 0.15s'}}>
          {analyzing?'Analyzing…':'✦ Analyze'}
        </button>
        {onDeleteEp && (
          <button onClick={()=>{if(window.confirm('Delete this episode?'))onDeleteEp(ep.id);}}
            style={{flexShrink:0,border:'1.5px solid #fca5a5',background:'none',color:'#dc2626',borderRadius:7,
                    cursor:'pointer',fontSize:12,padding:'6px 12px'}}>
            Delete
          </button>
        )}
      </div>
      {analyzeError && (
        <div style={{fontSize:11.5,color:'#dc2626',marginTop:8,lineHeight:1.45}}>
          Analyze failed: {analyzeError}
        </div>
      )}
    </div>
  );
}

// ─── Add Panel (right panel form — mirrors Chrome extension UX) ──────────────
function TagChipInput({ label, items, onChange, placeholder, headerAction }) {
  const [input, setInput] = useState('');
  const id = 'tci-' + label.replace(/\s+/g,'');
  function add(val) {
    const v = val.trim().toLowerCase();
    if (v && !items.includes(v)) onChange([...items, v]);
    setInput('');
  }
  function remove(item) { onChange(items.filter(i => i !== item)); }
  function handleKey(e) {
    if (e.key === 'Enter' || e.key === ',' || e.key === 'Tab') {
      e.preventDefault(); add(input);
    } else if (e.key === 'Backspace' && !input && items.length > 0) {
      onChange(items.slice(0,-1));
    }
  }
  const chipStyle = {display:'inline-flex',alignItems:'center',gap:3,background:C.accent+'22',
    color:C.accent,borderRadius:4,padding:'2px 7px 2px 7px',fontSize:11,fontWeight:600};
  const xBtn = {background:'none',border:'none',cursor:'pointer',color:C.accent,
    padding:'0 0 0 2px',lineHeight:1,fontSize:13,fontWeight:700,display:'flex',alignItems:'center'};
  return (
    <div>
      {headerAction
        ? <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:5}}>
            <label style={{...labelStyle,marginBottom:0}}>{label}</label>
            {headerAction}
          </div>
        : <label style={labelStyle}>{label}</label>
      }
      <div onClick={()=>document.getElementById(id)?.focus()}
        style={{...inputStyle,display:'flex',flexWrap:'wrap',gap:4,height:'auto',
          minHeight:34,padding:'4px 8px',cursor:'text',alignItems:'center'}}>
        {items.map(item=>(
          <span key={item} style={chipStyle}>
            {item}
            <button style={xBtn} onClick={e=>{e.stopPropagation();remove(item);}}>×</button>
          </span>
        ))}
        <input id={id} value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={handleKey} onBlur={()=>{if(input.trim())add(input);}}
          placeholder={items.length===0?placeholder:''}
          style={{border:'none',outline:'none',background:'none',fontSize:12.5,
            color:C.text,minWidth:60,flex:1,padding:'2px 0'}}/>
      </div>
    </div>
  );
}

function AddPanel({ stories, selStory, settings, onAddStory, onAddEpisode }) {
  const [mode, setMode]             = useState(selStory ? 'episode' : 'story');
  const [analyzing, setAnalyzing]   = useState(false);
  const [status, setStatus]         = useState('');
  const [submitting, setSubmitting] = useState(false);

  const [sf, setSf] = useState({ title:'', summary:'', tags:[], actors:[], url:'', type:'seed' });
  const [ef, setEf] = useState({
    storyId:     selStory || stories[0]?.id || '',
    headline:    '',
    date:        now().slice(0,10),
    type:        'development',
    summary:     '',
    framingNote: '',
    tags:        [],
    actors:      [],
    url:         '',
  });

  // When selected story changes: update picker and switch to episode tab (if story form is empty)
  useEffect(() => {
    if (selStory) {
      setEf(f => ({...f, storyId: selStory}));
      if (!sf.title) setMode('episode');
    }
  }, [selStory]);

  // Keep storyId valid if stories list changes
  useEffect(() => {
    if (stories.length > 0 && !stories.find(s => s.id === ef.storyId)) {
      setEf(f => ({...f, storyId: stories[0]?.id || ''}));
    }
  }, [stories]);

  async function analyze() {
    const activeUrl = mode === 'story' ? sf.url : ef.url;
    if (!activeUrl.trim() || analyzing || submitting) return;
    setAnalyzing(true);
    setStatus('Fetching article…');
    try {
      const text = await fetchText(activeUrl.trim());
      if (!text) throw new Error('Could not fetch URL');
      setStatus('Analyzing…');
      if (mode === 'story') {
        const r = await inceptStory(text, settings);
        setSf(f => ({
          ...f,
          title:   r.title   || f.title,
          summary: r.summary || f.summary,
          tags:    r.tags?.length   ? r.tags   : f.tags,
          actors:  r.actors?.length ? r.actors : f.actors,
        }));
      } else {
        const story = stories.find(s => s.id === ef.storyId);
        if (!story) throw new Error('Select a story first');
        const r = await analyzeEpisode(text, story, settings);
        setEf(f => ({
          ...f,
          headline:    r.headline    || f.headline,
          date:        r.date        || f.date,
          type:        r.type        || f.type,
          summary:     r.summary     || f.summary,
          framingNote: r.framingNote || f.framingNote,
          tags:        r.tags?.length   ? r.tags   : f.tags,
          actors:      r.actors?.length ? r.actors : f.actors,
        }));
      }
      setStatus('✦ Fields filled — review before saving');
    } catch(e) {
      setStatus(`⚠ AI failed: ${e.message}`);
    }
    setAnalyzing(false);
  }

  function submitStory() {
    if (!sf.title.trim() || submitting) return;
    setSubmitting(true);
    const n = now();
    const story = {
      id:        uid(),
      title:     sf.title.trim(),
      summary:   sf.summary.trim(),
      status:    'active',
      tags:      sf.tags,
      actors:    sf.actors,
      createdAt: n,
      updatedAt: n,
      episodes:  sf.url.trim() ? [{
        id:          uid(),
        date:        now().slice(0,10),
        type:        sf.type || 'seed',
        headline:    sf.title.trim(),
        summary:     sf.summary.trim(),
        framingNote: '',
        sourceUrl:   sf.url.trim(),
        addedAt:     n,
      }] : [],
    };
    onAddStory(story);
    setSf({ title:'', summary:'', tags:[], actors:[], url:'', type:'seed' });
    setStatus('✓ Story added');
    setSubmitting(false);
  }

  function submitEpisode() {
    if (!ef.storyId || !ef.headline.trim() || submitting) return;
    setSubmitting(true);
    const ep = {
      id:          uid(),
      date:        ef.date || now().slice(0,10),
      type:        ef.type,
      headline:    ef.headline.trim(),
      summary:     ef.summary.trim(),
      framingNote: ef.framingNote.trim(),
      tags:        ef.tags,
      actors:      ef.actors,
      sourceUrl:   ef.url.trim(),
      addedAt:     now(),
    };
    onAddEpisode(ep, ef.storyId);
    setEf(f => ({...f, headline:'', summary:'', framingNote:'', tags:[], actors:[], url:''}));
    setStatus('✓ Episode added');
    setSubmitting(false);
  }

  const statusColor = status.startsWith('✓') ? '#059669'
                    : status.startsWith('⚠') ? '#dc2626'
                    : status.startsWith('✦') ? '#2563eb'
                    : C.textMute;

  const activeUrl = mode === 'story' ? sf.url : ef.url;
  const canSubmit = mode === 'story'
    ? (!!sf.title.trim() && !submitting)
    : (stories.length > 0 && !!ef.headline.trim() && !submitting);

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{fontSize:11,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:12}}>Add Content</div>

      {/* Tabs */}
      <div style={{display:'flex',borderBottom:`1px solid ${C.border}`,marginBottom:16}}>
        {[['story','New Story'],['episode','Add Episode']].map(([m,label]) => (
          <button key={m} onClick={() => { setMode(m); setStatus(''); }}
            style={{flex:1,padding:'8px 0',border:'none',background:'none',fontWeight:mode===m?700:500,
              fontSize:11.5,cursor:'pointer',color:mode===m?C.accent:C.textMute,letterSpacing:'0.04em',
              textTransform:'uppercase',borderBottom:mode===m?`2px solid ${C.accent}`:'2px solid transparent',
              transition:'all 0.12s'}}>
            {label}
          </button>
        ))}
      </div>

      {/* Story form */}
      {mode === 'story' && (
        <div style={{display:'flex',flexDirection:'column',gap:10,flex:1,overflowY:'auto'}}>
          <div>
            <label style={labelStyle}>Title *</label>
            <input value={sf.title} onChange={e=>setSf({...sf,title:e.target.value})}
              style={inputStyle} placeholder="Story title…"
              onKeyDown={e=>{ if(e.key==='Enter') submitStory(); }}/>
          </div>
          <div>
            <label style={labelStyle}>Source URL</label>
            <input value={sf.url} onChange={e=>setSf({...sf,url:e.target.value})}
              placeholder="https://…" style={inputStyle}
              onKeyDown={e=>{ if(e.key==='Enter') analyze(); }}/>
          </div>
          <div>
            <label style={labelStyle}>Type</label>
            <select value={sf.type} onChange={e=>setSf({...sf,type:e.target.value})} style={inputStyle}>
              {Object.entries(EP).map(([k,v])=><option key={k} value={k}>{v.symbol} {v.label}</option>)}
            </select>
          </div>
          <div>
            <label style={labelStyle}>Summary</label>
            <textarea value={sf.summary} onChange={e=>setSf({...sf,summary:e.target.value})}
              style={{...inputStyle,resize:'vertical'}} rows={3} placeholder="What's the underlying narrative?"/>
          </div>
          <TagChipInput label="Tags" items={sf.tags}
            onChange={v=>setSf(f=>({...f,tags:v}))} placeholder="trade, policy…"/>
          <TagChipInput label="Key Actors" items={sf.actors}
            onChange={v=>setSf(f=>({...f,actors:v}))} placeholder="Acme Corp, City Council…"/>
        </div>
      )}

      {/* Episode form */}
      {mode === 'episode' && (
        <div style={{display:'flex',flexDirection:'column',gap:10,flex:1,overflowY:'auto'}}>
          {stories.length === 0 ? (
            <div style={{color:C.textMute,fontSize:13,textAlign:'center',padding:'24px 0',lineHeight:1.7}}>
              No stories tracked yet —<br/>add a story first.
            </div>
          ) : (<>
            <div>
              <label style={labelStyle}>Story</label>
              <select value={ef.storyId} onChange={e=>setEf({...ef,storyId:e.target.value})} style={inputStyle}>
                {stories.map(s=><option key={s.id} value={s.id}>{s.title}</option>)}
              </select>
            </div>
            <div>
              <label style={labelStyle}>Source URL</label>
              <input value={ef.url} onChange={e=>setEf({...ef,url:e.target.value})}
                placeholder="https://…" style={inputStyle}
                onKeyDown={e=>{ if(e.key==='Enter') analyze(); }}/>
            </div>
            <div>
              <label style={labelStyle}>Headline *</label>
              <input value={ef.headline} onChange={e=>setEf({...ef,headline:e.target.value})}
                style={inputStyle} placeholder="What happened?"
                onKeyDown={e=>{ if(e.key==='Enter') submitEpisode(); }}/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>

                <label style={labelStyle}>Date</label>

              </div>
              <div>
                <label style={labelStyle}>Type</label>
                <select value={ef.type} onChange={e=>setEf({...ef,type:e.target.value})} style={inputStyle}>
                  {Object.entries(EP).map(([k,v])=><option key={k} value={k}>{v.symbol} {v.label}</option>)}
                </select>
              </div>
            </div>
            <div>
              <label style={labelStyle}>Summary</label>
              <textarea value={ef.summary} onChange={e=>setEf({...ef,summary:e.target.value})}
                style={{...inputStyle,resize:'vertical'}} rows={3} placeholder="Key details…"/>
            </div>
            <div>
              <label style={labelStyle}>Framing Note</label>
              <input value={ef.framingNote} onChange={e=>setEf({...ef,framingNote:e.target.value})}
                style={inputStyle} placeholder="How is this being spun?"/>
            </div>
            <TagChipInput label="Tags" items={ef.tags}
              onChange={v=>setEf(f=>({...f,tags:v}))} placeholder="trade, policy…"/>
            <TagChipInput label="Players" items={ef.actors}
              onChange={v=>setEf(f=>({...f,actors:v}))} placeholder="Acme Corp, City Council…"/>
          </>)}
        </div>
      )}

      {/* Footer: status + analyze + submit */}
      <div style={{marginTop:'auto',paddingTop:12,display:'flex',flexDirection:'column',gap:8}}>
        {status && (

          </div>

          <button onClick={analyze}
            disabled={analyzing||!activeUrl.trim()||submitting||(mode==='episode'&&stories.length===0)}
            style={{flexShrink:0,padding:'8px 11px',borderRadius:8,border:`1.5px solid ${C.border}`,
              background:C.bg,color:C.text,fontSize:11.5,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',
              opacity:(analyzing||!activeUrl.trim()||submitting)?0.45:1,transition:'opacity 0.15s'}}>

            {submitting ? 'Saving…' : mode==='story' ? 'Add Story' : 'Add Episode'}
          </Btn>
        </div>
      </div>
    </div>
  );
}

function PredictionDetail({ predictionId, compact }) {
  const [prediction, setPrediction] = useState(null);
  const [links, setLinks] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!predictionId) return;
    let alive = true;
    const load = (first) => {
      if (first) setLoading(true);
      return Promise.all([
        fetch(`/v2/predictions/${predictionId}`).then(r => r.ok ? r.json() : null),
        fetch(`/v2/links?predictionId=${predictionId}`).then(r => r.ok ? r.json() : null)
      ])
      .then(([pData, lData]) => {
        if (!alive) return;
        if (pData?.prediction) setPrediction(pData.prediction);
        if (lData?.links) setLinks(lData.links);
        setLoading(false);
      })
      .catch(() => { if (alive) setLoading(false); });
    };
    load(true);
    // The center view announces edits (signals, overrides, finished searches) so this panel stays current.
    const onUpdated = (e) => { if (!e.detail || e.detail === predictionId) load(false); };
    window.addEventListener('lateral-prediction-updated', onUpdated);
    return () => { alive = false; window.removeEventListener('lateral-prediction-updated', onUpdated); };
  }, [predictionId]);

  if (loading) return <div style={{color:C.textMute,fontSize:13}}>Loading prediction…</div>;
  if (!prediction) return <div style={{color:C.textMute,fontSize:13}}>Prediction not found.</div>;

  const supports = links.filter(l => l.stance === 'supports').sort((a,b) => b.weight - a.weight);
  const contradicts = links.filter(l => l.stance === 'contradicts').sort((a,b) => b.weight - a.weight);
  const complicates = links.filter(l => l.stance === 'complicates').sort((a,b) => b.weight - a.weight);

  if (compact) {
    return (
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div style={{display:'flex',alignItems:'baseline',gap:6}}>

        <div style={{display:'flex',flexDirection:'column',gap:4,fontSize:11,color:C.textMute}}>
          <span>Status: <strong style={{color:C.text}}>{prediction.status}</strong></span>
          {prediction.resolutionDate && <span>Resolves: {new Date(prediction.resolutionDate).toLocaleDateString()}</span>}
          <span>Signals: {prediction.signals?.length || 0}</span>
        </div>
        {supports.length > 0 && (
          <div>
            <div style={{fontSize:10,fontWeight:800,color:'#059669',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:4}}>🟢 Supports ({supports.length})</div>
            <div style={{fontSize:11,color:C.textMute}}>Top: {supports[0].weight} · {supports[0].item?.title?.slice(0,40) || 'Untitled'}</div>

          <div>
            <div style={{fontSize:10,fontWeight:800,color:'#dc2626',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:4}}>🔴 Contradicts ({contradicts.length})</div>
            <div style={{fontSize:11,color:C.textMute}}>Top: {contradicts[0].weight} · {contradicts[0].item?.title?.slice(0,40) || 'Untitled'}</div>
          </div>

        <div style={{fontSize:14,fontWeight:700,color:C.text,lineHeight:1.5,marginBottom:10}}>
          {prediction.statement}
        </div>
        <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:6}}>
          <span style={{fontSize:32,fontWeight:900,color:C.accent}}>{prediction.confidence}%</span>
          <span style={{fontSize:11,color:C.textMute}}>confidence</span>

          <span>Status: <strong style={{color:C.text}}>{prediction.status}</strong></span>

          <span>Signals: {prediction.signals?.length || 0}</span>

      {supports.length > 0 && (

function buildDiscoverEditorialRows(articles) {
  const rows = [];
  let i = 0;
  let rhythm = 0;
  while (i < articles.length) {
    const useFeature = rhythm % 3 === 1;
    if (useFeature) {
      rows.push({ type: 'feature', article: articles[i], align: (rhythm % 2 === 0) ? 'left' : 'right' });
      i += 1;
    } else {
      rows.push({ type: 'triple', articles: articles.slice(i, i + 3) });
      i += 3;
    }
    rhythm += 1;
  }
  return rows;
}

function DiscoverEditorialRows({ rows, onAddArticle }) {
  return (
    <div style={{display:'flex',flexDirection:'column',gap:18,paddingBottom:4}}>

// ─── Discover Modal ──────────────────────────────────────────────────────────
function DiscoverModal({ story, onClose, onAdd, settings }) {
  const [phase, setPhase] = useState('idle'); // idle | searching | results
  const [queries, setQueries] = useState([]);
  const [articles, setArticles] = useState([]);
  const [status, setStatus] = useState('');
  const [addingUrl, setAddingUrl] = useState(null);
  const [activeSources, setActiveSources] = useState(null); // null = all; Set = specific domains
  const [busySince, setBusySince] = useState(null);
  const [busyElapsedMs, setBusyElapsedMs] = useState(0);
  const [customTerms, setCustomTerms] = useState('');
  const [cachedAt, setCachedAt] = useState(null);
  const [filteredOut, setFilteredOut] = useState([]);

  const storyCacheId = story?.id || story?.title || 'discover';

  // Derive source list + filtered articles from current state
  const sourceCounts = {};
  articles.forEach(a => { const k = a.source?.domain||''; if(k) sourceCounts[k]=(sourceCounts[k]||0)+1; });
  const sourceList = Object.entries(sourceCounts)
    .sort((a,b)=>b[1]-a[1])
    .map(([domain,count])=>({ domain, name:articles.find(a=>a.source?.domain===domain)?.source?.name||domain, count }));
  const displayedArticles = activeSources
    ? articles.filter(a => activeSources.has(a.source?.domain||''))
    : articles;
  const isFiltered = activeSources !== null;

  const editorialRows = React.useMemo(() => buildDiscoverEditorialRows(displayedArticles), [displayedArticles]);

  const busyActive = phase === 'searching' || addingUrl !== null;
  const busyLabel = phase === 'searching'
    ? 'Searching live sources'
    : (addingUrl ? 'Analyzing selected article' : 'Working');
  const fmtElapsed = ms => {
    const total = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `${m}:${String(s).padStart(2,'0')}`;
  };
  const fmtAgo = iso => {
    if (!iso) return '';
    const t = new Date(iso).getTime();
    if (!Number.isFinite(t)) return '';
    const mins = Math.max(0, Math.floor((Date.now() - t) / 60000));
    if (mins < 1) return 'just now';
    if (mins === 1) return '1 minute ago';
    return `${mins} minutes ago`;
  };

  useEffect(() => {
    if (!busySince) { setBusyElapsedMs(0); return; }
    const tick = () => setBusyElapsedMs(Date.now() - busySince);
    tick();
    const id = setInterval(tick, 250);
    return () => clearInterval(id);
  }, [busySince]);

  function toggleSource(domain) {
    setActiveSources(prev => {
      const allKeys = new Set(sourceList.map(s=>s.domain));
      const current = prev ? new Set(prev) : new Set(allKeys);
      current.has(domain) ? current.delete(domain) : current.add(domain);
      if (current.size === allKeys.size) return null; // all selected = reset to null
      return current;
    });
  }

  function parseCustomQueries(input) {
    const cleaned = String(input || '').trim();
    if (!cleaned) return [];
    const parts = cleaned.includes('\n') || cleaned.includes(';')
      ? cleaned.split(/[\n;]+/)
      : [cleaned];
    return [...new Set(parts.map(p => p.trim()).filter(Boolean))].slice(0, 4);
  }

  async function runQuerySet(qs, { cacheable = false, gated = false } = {}) {
    if (!qs?.length) {
      setStatus('No valid queries to run.');
      return;
    }

    setPhase('searching');
    setBusySince(Date.now());
    setStatus(`Searching: ${qs.join(' · ')}…`);
    setQueries(qs);
    setActiveSources(null);

    try {
      const results = await Promise.all(qs.map(q => searchArticles(q).catch(() => [])));
      const seen = new Set();
      const merged = results.flat().filter(a => {
        if (seen.has(a.url)) return false;
        seen.add(a.url);
        return true;
      }).sort((a,b) => (b.date||'') > (a.date||'') ? 1 : (b.date||'') < (a.date||'') ? -1 : 0);

      if (!merged.length) {
        setArticles([]);
        setPhase('results');
        setBusySince(null);
        setStatus('No results found. Try different queries.');
        return;
      }

      // AI relevance pass (AI-generated queries only; your own custom terms are never second-guessed).
      let kept = merged, rejected = [];
      if (gated) {
        setStatus(`Found ${merged.length} articles. Checking relevance…`);
        const gate = await checkRelevance(storyRelevanceCtx(story), merged);
        kept = gate.kept; rejected = gate.filtered;
      }
      setFilteredOut(rejected);

      setStatus(`Loaded ${kept.length} articles. Enriching images…`);
      const withImages = await attachImages(kept).catch(() => kept);
      setArticles(withImages);
      setPhase('results');
      setBusySince(null);
      setStatus('');

      if (cacheable) {
        setCacheEntry(storyCacheId, 'discoverModal', { queries: qs, articles: withImages, filtered: rejected });
        setCachedAt(getCacheEntry(storyCacheId, 'discoverModal')?.generatedAt || null);
      } else {
        setCachedAt(null);
      }
    } catch (e) {
      setBusySince(null);
      setPhase('idle');
      setStatus(`Error: ${e.message}`);
    }
  }

  async function discover(forceRefresh = false) {
    const cached = getCacheEntry(storyCacheId, 'discoverModal');
    const cacheFresh = cached?.generatedAt && (Date.now() - new Date(cached.generatedAt).getTime()) < DISCOVER_MODAL_TTL_MS;
    if (!forceRefresh && cacheFresh && Array.isArray(cached.articles) && cached.articles.length) {
      setQueries(cached.queries || []);
      setArticles(cached.articles || []);
      setFilteredOut(cached.filtered || []);
      setPhase('results');
      setActiveSources(null);
      setCachedAt(cached.generatedAt || null);
      setStatus(`Using saved discovery from ${fmtS(cached.generatedAt)}.`);
      return;
    }

    setStatus('Asking AI for search queries…');
    setCachedAt(null);
    setBusySince(Date.now());
    try {
      const qs = await generateSearchQueries(story, settings);
      await runQuerySet(qs, { cacheable: true, gated: true });
    } catch (e) {
      setBusySince(null);
      setPhase('idle');
      setStatus(`Error: ${e.message}`);
    }
  }

  async function runCustomDiscover() {
    const qs = parseCustomQueries(customTerms);
    if (!qs.length) {
      setStatus('Enter one or more custom search terms first.');
      return;
    }
    await runQuerySet(qs, { cacheable: false });
    setCachedAt(null);
  }

  function restoreDiscovered(a) {
    const { relevance, ...clean } = a;
    restoreRelevance(storyRelevanceCtx(story), a);
    const nextFiltered = filteredOut.filter(x => x.url !== a.url);
    setArticles(prev => [clean, ...prev]);
    setFilteredOut(nextFiltered);
    const cached = getCacheEntry(storyCacheId, 'discoverModal');
    if (cached) patchCacheEntry(storyCacheId, 'discoverModal', { articles: [clean, ...(cached.articles || [])], filtered: nextFiltered });
  }

  async function addArticle(article) {
    setAddingUrl(article.url);
    setBusySince(Date.now());
    setStatus(`Analyzing: ${article.title.slice(0,60)}…`);
    try {
      let ep = null;
      const [text, imgUrl] = await Promise.all([
        fetchText(article.url),
        (article.imageUrl ? Promise.resolve(article.imageUrl) : fetchOgImage(article.url)).catch(() => null),
      ]);
      if (text && text.length > 200) {

function AddPredictionModal({ onClose, onAdd }) {
  const [statement,setStatement]=useState('');
  const [confidence,setConfidence]=useState(50);
  const [resolutionDate,setResolutionDate]=useState('');
  const [busy,setBusy]=useState(false);
  const [status,setStatus]=useState('');
  const [signalText,setSignalText]=useState('');
  const [autoSuggest,setAutoSuggest]=useState(true);

  async function handleCreate() {
    if (!statement.trim()) { setStatus('Enter a prediction statement.'); return; }
    setBusy(true); setStatus('Creating prediction…');
    try {
      // Signals = the searches that watch for evidence. Your own (one per line) plus, optionally, AI suggestions.
      let signals = signalText.split('\n').map(l => l.trim()).filter(Boolean).map(q => ({ query: q, type: 'indicator', active: true }));
      if (autoSuggest) {
        setStatus('Suggesting signals…');
        try {
          const sr = await fetch('/v2/signals/suggest', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ statement: statement.trim(), resolutionDate })
          });
          const sd = await sr.json();
          if (sr.ok && Array.isArray(sd.signals)) {
            const have = new Set(signals.map(s => s.query.toLowerCase()));
            signals = [...signals, ...sd.signals.filter(s => !have.has(s.query.toLowerCase())).map(s => ({ ...s, active: true }))];
          }
        } catch (e) { /* non-fatal: the prediction is still created; add signals from its page later */ }
        setStatus('Creating prediction…');
      }
      const r = await fetch('/v2/predictions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statement: statement.trim(), confidence: Number(confidence), resolutionDate, signals })
      });
      const data = await r.json();
      if (!r.ok || data.error) throw new Error(data.error || 'Failed to create prediction');
      const pred = data.prediction || data; // server responds { prediction: {...} }
      if (!pred?.id) throw new Error('Server did not return a prediction id');
      // Create linked story
      const story = {
        id: 'pred-' + pred.id.slice(0,8),
        title: statement.trim().slice(0,80) + (statement.trim().length>80?'…':'') + ' (Prediction)',
        summary: statement.trim(),
        statusLine: `${confidence}% confidence · ${resolutionDate ? 'Resolves ' + resolutionDate : 'No resolution date'}`,
        status: 'active',
        tags: ['Prediction', 'Forecasting'],
        actors: [],
        predictionId: pred.id,
        createdAt: now(),
        updatedAt: now(),
        episodes: []
      };
      onAdd(story);
      onClose();
    } catch(e) { setStatus(`Error: ${e.message}`); }
    setBusy(false);
  }

  return (
    <Modal title="New Prediction" onClose={onClose}>
      <Field label="Statement *"><textarea value={statement} onChange={e=>setStatement(e.target.value)} placeholder="A clear, falsifiable claim… e.g. 'Bitcoin will hit $100k by Dec 31'" rows={3} style={{...inputStyle,resize:'vertical'}}/></Field>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
        <div><label style={labelStyle}>Confidence (0-100)</label><input type="number" min={0} max={100} value={confidence} onChange={e=>setConfidence(Math.max(0,Math.min(100,Number(e.target.value))))} style={inputStyle}/></div>
        <div><label style={labelStyle}>Resolution Date</label><input type="date" value={resolutionDate} onChange={e=>setResolutionDate(e.target.value)} style={inputStyle}/></div>
      </div>
      <Field label="Signals (optional) — one search per line">
        <textarea value={signalText} onChange={e=>setSignalText(e.target.value)} rows={3} placeholder={'Searches that would turn up evidence, e.g.\nFed rate cut odds\nPowell inflation statement'} style={{...inputStyle,resize:'vertical'}}/>
      </Field>
      <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:C.textMid,margin:'-4px 0 14px',cursor:'pointer'}}>
        <input type="checkbox" checked={autoSuggest} onChange={e=>setAutoSuggest(e.target.checked)}/>
        Also suggest signals for me (takes a few seconds)
      </label>
      <Btn onClick={handleCreate} disabled={busy||!statement.trim()} style={{width:'100%'}}>{busy?status||'Creating…':'Create Prediction'}</Btn>
      <StatusLine msg={status}/>
    </Modal>
  );
}
