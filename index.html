// Server-side image pipeline (proxy/images.js): resolves opaque Google News links to the real article, reads the page,
// falls back to Tavily Extract and image search, and runs every candidate past a vision judge so logos, thumbnails and
// unrelated images are rejected. Returns { [articleUrl]: { realUrl, imageUrl, via, ... } }; throws if the service is unreachable.
async function resolveImagesViaServer(articles, { budgetMs = 30000, chunk = 8 } = {}) {
  const list = (articles || []).filter(a => a && /^https?:\/\//i.test(a.url || ''));
  const out = {};
  const t0 = Date.now();
  let reached = false;
  for (let i = 0; i < list.length; i += chunk) {
    if (i > 0 && Date.now() - t0 > budgetMs) break;   // what's still running keeps going on the server and is cached for next time
    const part = list.slice(i, i + chunk).map(a => ({
      url: a.url, title: a.title || '',
      source: { domain: a.source?.domain || '', name: a.source?.name || '' },
      imageUrl: a.imageUrl || '',
    }));
    try {
      const r = await fetch('/api/lateral/images/resolve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ articles: part }) });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      reached = true;
      Object.assign(out, d.results || {});
    } catch (e) {
      if (!reached) throw e;
      break;
    }
  }
  if (!reached && list.length) throw new Error('image service unreachable');
  return out;
}

// A direct link to the article when we know it (instead of Google's redirect wrapper).
function articleOpenUrl(a) {
  const real = String(a?.realUrl || '').trim();
  if (/^https?:\/\//i.test(real) && !/news\.google\.com\/(?:rss\/)?articles\//i.test(real)) return real;
  return a?.url || '';
}

async function resolveBestArticleImage(article, { forceSearchFirst = false, skipCurrent = false } = {}) {
  const key = article?.realUrl || article?.url || '';
  if (!key) return null;
  const current = String(article?.imageUrl || '').trim();
  if (!skipCurrent && current && !isWeakImageUrl(current)) return current;
  const cachedImg = getCachedImageForUrl(key);
  if (cachedImg && !forceSearchFirst) return cachedImg;
  try {
    const res = await resolveImagesViaServer([article]);
    const r = res[article.url];
    if (r && r.imageUrl) { putCachedImageForUrl(key, r.imageUrl); return r.imageUrl; }
    return null;   // the service looked and found nothing usable: show the fallback card rather than a bad guess
  } catch { /* service unreachable — fall back to the older per-article lookup below */ }
  const og = await fetchOgImage(key).catch(() => null);
  if (og && !isWeakImageUrl(og)) { putCachedImageForUrl(key, og); return og; }
  const searched = await fetchSearchImage(article).catch(() => null);
  if (searched) { putCachedImageForUrl(key, searched); return searched; }
  return null;
}

function canAttemptOgImage(rawUrl) {
  const u = String(rawUrl || '').trim();
  if (!/^https?:\/\//i.test(u)) return false;
  try {
    const parsed = new URL(u);
    const host = parsed.hostname.replace(/^www\./, '').toLowerCase();
    const path = parsed.pathname.toLowerCase();
    // Skip aggregator wrappers and known feed wrapper paths that frequently fail.
    if (/(^|\.)(news\.google\.com|bing\.com|search\.brave\.com|duckduckgo\.com|startpage\.com|qwant\.com)$/.test(host)) return false;
    if (host === 'news.google.com' && path.includes('/rss/articles/')) return false;
    return true;
  } catch {
    return false;
  }
}

// Attach images with cache-first strategy and bounded concurrency.
// Returns quickly when cache/thumbnails are present; fetches only missing slots.
// maxFetch caps how many OG/search network fetches are attempted (default 12 — enough
// for the visible viewport; the rest show source logos rather than blocking the UI).
async function attachImages(articles, { concurrency = 4, maxFetch = 24 } = {}) {
  const seeded = applyCachedImages(articles || []);
  const out = seeded.map(a => ({ ...a }));
  const idxMissing = [];
  for (let i = 0; i < out.length; i++) {
    if (out[i].imageUrl && !isWeakImageUrl(out[i].imageUrl)) continue;
    const key = out[i].realUrl || out[i].url || '';
    if (!key) continue;
    idxMissing.push(i);
  }
  if (!idxMissing.length) return out;
  // Cap network work to the first maxFetch slots; the rest fall back to the source card until a later pass.
  const fetchSlots = idxMissing.slice(0, maxFetch);

  // Preferred path: the server's image pipeline, in batches. It caches everything it finishes, so anything cut off by the
  // time budget here is instant on the next call.
  try {
    const res = await resolveImagesViaServer(fetchSlots.map(i => out[i]));
    fetchSlots.forEach(i => {
      const r = res[out[i].url];
      if (!r) return;
      const patch = {};
      if (r.realUrl && r.realUrl !== out[i].url) patch.realUrl = r.realUrl;
      if (r.imageUrl) { patch.imageUrl = r.imageUrl; putCachedImageForUrl(out[i].realUrl || out[i].url, r.imageUrl); }
      out[i] = { ...out[i], ...patch };
    });
    return out;
  } catch { /* service unreachable — use the older per-article lookup */ }

  let cursor = 0;
  const workers = Array.from({ length: Math.max(1, Math.min(concurrency, fetchSlots.length)) }, async () => {
    while (cursor < fetchSlots.length) {
      const pos = fetchSlots[cursor++];
      const target = out[pos];
      const key = target.realUrl || target.url || '';
      if (!key) continue;
      const img = await resolveBestArticleImage(target).catch(() => null);
      if (!img) continue;
      out[pos] = { ...target, imageUrl: img };
      putCachedImageForUrl(key, img);
    }
  });
  await Promise.all(workers);
  return out;
}

function querySignature(story) {
  const recent = (story.episodes || []).slice(-3).map(e => `${e.date || ''}|${e.type || ''}|${e.headline || ''}`).join('||');
  const tags = (story.tags || []).slice(0, 4).join('|');
  const actors = (story.actors || []).slice(0, 4).join('|');
  return [story.title || '', story.summary || '', recent, tags, actors].join('::').toLowerCase();
}

// Many story titles follow a "Catchy Name: Explainer" pattern (from
// inceptStory, or just how people write titles) — great as a title, poor as
// a search query. The part before the colon/dash is usually the actual
// searchable subject; the rest is prose. Used as the deterministic fallback
// base, and to sanity-check what the LLM comes back with.
function shortTitlePhrase(title, maxWords = 6) {
  const t = String(title || '').trim();
  if (!t) return '';
  const base = t.split(/[:\-–—]/)[0].trim() || t;
  return base.split(/\s+/).filter(Boolean).slice(0, maxWords).join(' ');
}

// Guards against the failure mode confirmed on a long-titled story: the model
// echoed the full title back three times with small appended suffixes,
// producing near-duplicate, sentence-length "queries" that a search engine
// can't parse as targeted keywords — the story's headlines feed quietly
// starved on old results because of it, not because coverage had gone quiet.
function isUsableSearchQuery(q, story) {
  const t = String(q || '').trim();
  if (!t) return false;
  if (t.split(/\s+/).length > 9) return false; // sentence-length, not a search query
  const titleWords = String(story?.title || '').trim().split(/\s+/);
  if (titleWords.length > 5 && t.toLowerCase().startsWith(String(story.title).toLowerCase())) return false;
  return true;
}

function buildFallbackSearchQueries(story) {
  const short = shortTitlePhrase(story.title);
  const recent = (story.episodes||[]).slice(-1)[0];
  const out = [short];
  if (story.actors?.length) out.push(`${short} ${story.actors[0]}`);
  if (recent?.headline) out.push(recent.headline.split(/\s+/).slice(0, 6).join(' '));
  if (story.tags?.length) out.push(`${short} ${story.tags[0]}`);
  return [...new Set(out.filter(Boolean))].slice(0, 3);
}

async function generateSearchQueries(story, s) {
  const sig = querySignature(story);

  // Fast cache hit: if story context hasn't changed recently, reuse prior query set.
  const cached = story?.id ? getCacheEntry(story.id, 'searchQueries') : null;
  const cacheFresh = cached?.generatedAt && (Date.now() - new Date(cached.generatedAt).getTime()) < DISCOVER_MODAL_TTL_MS;
  if (cacheFresh && cached?.signature === sig && Array.isArray(cached?.queries) && cached.queries.length) {
    return cached.queries.slice(0, 3);
  }

  const recentCtx = (story.episodes||[])
    .slice(-2)
    .map(e=>`[${e.type}] ${e.date}: ${String(e.headline||'').slice(0,120)}`)
    .join('\n');
  const keyActors = (story.actors||[]).slice(0,3).join(', ');
  const keyTags = (story.tags||[]).slice(0,3).join(', ');

  try {
    // Query generation prefers speed over deep reasoning; use a faster model first.
    const fastSettings = { ...s, model: 'llama3.2:latest' };
    const r = await ollama([{role:'user',content:`Generate exactly 3 short news search queries (3-6 words each, like keywords someone would type into a search engine) for fresh developments on this story.\n\nDo NOT just repeat the story title back — it's a narrative label, not a search query. Extract the actual newsworthy subject instead.\n\nStory: "${story.title}"\nSummary: ${String(story.summary||'none').slice(0,260)}\nActors: ${keyActors||'none'}\nTags: ${keyTags||'none'}\nRecent: ${recentCtx||'none'}\n\nExample: for a story titled "The Unveiling of Alien Files: A Decade of Government Transparency", good queries look like "Pentagon UAP disclosure" or "AARO UFO files release" — not the title itself.\n\nReturn strict JSON only: {"queries":["q1","q2","q3"]}` }], fastSettings);

    let qs = r.queries;
    if (typeof qs === 'string') qs = qs.split('\n').map(q=>q.replace(/^\d+[\.\)]\s*/,'')).filter(Boolean);
    if (!Array.isArray(qs) || qs.length === 0) throw new Error('no queries returned');

    const cleaned = qs.slice(0, 3).map(q => String(q).trim()).filter(q => q && isUsableSearchQuery(q, story));
    const out = cleaned.length ? cleaned : buildFallbackSearchQueries(story);
    if (story?.id && out.length) setCacheEntry(story.id, 'searchQueries', { queries: out, signature: sig });
    return out;
  } catch(e) {
    console.warn('generateSearchQueries fell back to title:', e.message);
    const out = buildFallbackSearchQueries(story);
    if (story?.id && out.length) setCacheEntry(story.id, 'searchQueries', { queries: out, signature: sig });
    return out;
  }
}
async function inceptStory(text, s) {
  return ollama([{role:'user',content:`You are a narrative intelligence analyst. Given this article, extract a longitudinal story and its first episode.\n\nARTICLE:\n${text}\n\nReturn JSON:\n{\n  "title": "Concise story title (the ongoing narrative, not just this article)",\n  "summary": "2-3 sentences: what is this story really about at a systemic level?",\n  "statusLine": "One punchy line (5-10 words) capturing where this stands right now, e.g. 'Announced with fanfare, no follow-up yet' or 'Pilot program still running quietly'",\n  "status": "active",\n  "tags": ["3-5 topic tags"],\n  "actors": ["key organizations and individuals"],\n  "firstEpisode": {\n    "date": "YYYY-MM-DD",\n    "type": "one of: seed, development, contradiction, confirmation, escalation, burial, silence_noted",\n    "headline": "Terse headline for this specific event",\n    "summary": "What happened and what it means for the broader story arc",\n    "framingNote": "How is this framed? What editorial or structural bias appears?"\n  }\n}`}], s);
}

async function analyzeEpisode(text, story, s) {
  const ctx = (story.episodes||[]).map(e=>`[${e.type}] ${e.date}: ${e.summary}`).join('\n');
  return ollama([{role:'user',content:`You are tracking the story: "${story.title}"\n\nStory so far:\n${ctx||'(no prior episodes)'}\n\nNew article:\n${text}\n\nReturn JSON:\n{\n  "date": "YYYY-MM-DD",\n  "type": "one of: seed, development, contradiction, confirmation, escalation, burial, silence_noted",\n  "headline": "Terse headline for this specific event",\n  "summary": "What happened, and how does it relate to the story trajectory?",\n  "framingNote": "Framing, bias, or structural observation",\n  "tags": ["3-5 lowercase topic/theme tags, hyphenated if multi-word"],\n  "actors": ["named individuals and organizations appearing in this episode"]\n}`}], s);
}

async function regenSummary(story, s) {
  const ctx = (story.episodes||[]).map(e=>`[${e.type}] ${e.date}: ${e.summary}`).join('\n\n');
  const r = await ollama([{role:'user',content:`You are tracking: "${story.title}"\n\nEpisodes:\n${ctx}\n\nWrite an updated narrative summary (2-4 sentences). Synthesize the arc, tensions, and current state. Also write a one-line status line (5-10 words) — the kind of terse, punchy read someone gets at a glance, e.g. 'Promising, but no follow-up funding yet' or 'Delayed again; pilot still running in Idaho'.\n\nReturn JSON: { "summary": "...", "statusLine": "..." }`}], s);
  return r;
}

// Lightweight, single-purpose version of the dek half of regenSummary() —
// used to backfill stories that don't have one yet (anything created before
// this field existed, or a story someone added manually) without touching an
// existing summary the person may have already reviewed or edited.
async function generateStatusLineOnly(story, s) {
  const ctx = (story.episodes||[]).map(e=>`[${e.type}] ${e.date}: ${e.summary}`).join('\n\n');
  const r = await ollama([{role:'user',content:`You are tracking: "${story.title}"\n\nSummary: ${story.summary||'none'}\n\nEpisodes:\n${ctx||'(no episodes yet)'}\n\nWrite one terse, punchy status line (5-10 words) — the kind of read someone gets at a glance, e.g. 'Promising, but no follow-up funding yet' or 'Delayed again; pilot still running in Idaho'.\n\nReturn JSON: { "statusLine": "..." }`}], s);
  return r.statusLine;
}

async function generateStoryBrief(story, s) {
  const eps = (story.episodes||[]);
  // Keep context bounded for speed on large stories.
  const recentEps = eps.slice(-12);
  const clip = (v, n) => {
    const t = String(v || '').replace(/\s+/g, ' ').trim();
    return t.length > n ? `${t.slice(0, n)}…` : t;
  };
  // Compact episode text to prevent slow generations on long histories.
  const ctx = recentEps.map(e=>`[${e.type}] ${e.date}: ${clip(e.headline, 140)}\n  ${clip(e.summary, 260)}${e.framingNote?`\n  FRAMING: ${clip(e.framingNote, 160)}`:''}`).join('\n\n');
  const actors = (story.actors||[]).slice(0, 20).join(', ');
  return ollama([{role:'user',content:`You are a narrative intelligence analyst preparing a briefing on a tracked story.\n\nSTORY: "${story.title}"\nSTATUS: ${story.status}\nACTORS: ${actors||'none listed'}\nSUMMARY: ${story.summary||'none'}\n\nEPISODE LOG (${eps.length} total, latest ${recentEps.length} shown):\n${ctx||'(no episodes yet)'}\n\nGenerate a concise intelligence brief. Return JSON:\n{\n  "velocity": "accelerating|steady|decelerating|stalled",\n  "velocityNote": "One sentence: why this velocity rating",\n  "keyDevelopments": ["3-5 most significant developments, newest first"],\n  "keyPlayers": [{"name":"actor name","role":"their role in this story"}],\n  "keyPoints": ["3-5 most important analytical observations about this story"],\n  "informationGaps": ["2-3 things we don\'t know that matter"],\n  "actionableItems": ["2-3 concrete things a researcher should do next"],\n  "likelyNextSteps": ["2-3 predicted near-term developments"],\n  "watchSignals": ["2-3 specific events or publications that would be meaningful if they appear"],\n  "sourceDiversityFlag": "green|yellow|red",\n  "sourceDiversityNote": "One sentence on source health"\n}`}], s);
}
async function generateCrossStoryBrief(stories, s) {
  const digests = stories.map(story => {
    const recent = (story.episodes||[]).slice(-3).map(e=>`  [${e.type}] ${e.date}: ${e.headline}`).join('\n');
    return `STORY: "${story.title}" (${story.status})\nSUMMARY: ${story.summary||'none'}\nRECENT:\n${recent||'  (none)'}`;
  }).join('\n\n---\n\n');
  return ollama([{role:'user',content:`You are a lateral intelligence analyst. Your specialty is finding non-obvious connections between separate tracked stories.\n\nACTIVE STORIES:\n\n${digests}\n\nAnalyze these stories together. Return JSON:\n{\n  "globalTheme": "1-2 sentences: the underlying systemic story connecting these narratives",\n  "connections": [{"stories":["story title 1","story title 2"],"connection":"what links them and why it matters"}],\n  "convergences": ["2-3 points where multiple stories are heading toward the same event or outcome"],\n  "blindSpots": ["1-2 things the collective coverage is systematically missing"],\n  "recommendedReading": [{"topic":"what to search for","reason":"why it would illuminate the landscape"}]\n}`}], s);
}

async function generateValeSynthesis(stories, brief) {
  const titles = stories.map(s => `"${s.title}"`).join(', ');
  const theme  = brief?.crossBrief?.globalTheme || '';
  const query  = theme
    ? `Deep dive intelligence analysis for these topics: ${titles}. Context: ${theme}. Synthesize the latest web information into a comprehensive 3-5 paragraph report.`
    : `Comprehensive intelligence update for these tracked stories: ${titles}. Provide a multi-paragraph synthesis of latest developments.`;
  const systemInstructions = 'You are a professional senior intelligence analyst. Provide a comprehensive, multi-paragraph synthesis (approximately 400-500 words) of the latest web information about these tracked stories. Focus on cross-narrative patterns, new developments, and systemic implications. Avoid repetition.';
  const r = await fetch('/api/lateral/vale', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ query, systemInstructions }),
  });
  if (!r.ok) throw new Error(`Intelligence service ${r.status}`);
  return r.json(); // { message, sources }
}

async function generateStoryValeReport(story) {
  const query = `Comprehensive intelligence analysis: Latest developments, broader context, and systemic significance for the tracked story: "${story.title}". Provide a deep dive into the underlying forces, recent key events, and future implications.`;
  const systemInstructions = 'You are a professional senior intelligence analyst. Provide a comprehensive, multi-paragraph analysis (approximately 400-600 words) of the latest web information and context regarding this specific topic. Structure your response with a summary of recent events, an analysis of systemic significance, and potential future trajectories. Focus on developments from the last 14 days.';
  try {
    const r = await fetch('/api/lateral/vale', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ query, systemInstructions }),
    });
    if (!r.ok) return null;
    return await r.json(); // { message, sources }
  } catch(e) {
    console.warn('[Intelligence] story synthesis failed:', e.message);
    return null;
  }
}

async function generateExecutiveSummary(stories, s) {
  const lines = stories.map(st=>`- "${st.title}" (${st.status}): ${st.summary||'no summary'}`).join('\n');
  const r = await ollama([{role:'user',content:`You are briefing an analyst who tracks narratives across multiple stories.\n\nTRACKED STORIES:\n${lines}\n\nWrite a 2-3 sentence executive summary of the current intelligence landscape across all stories. Focus on the most urgent or significant pattern.\n\nReturn JSON: { "summary": "..." }`}], s);
  return r.summary || '';
}

// Renders one story's status/title/summary/tags/timeline block — shared by the
// single-story Share Timeline export and the multi-story NotebookLM/PDF export,
// so both stay in sync instead of drifting apart as two copies of this logic.
function storyTimelineSectionHtml(story, predData) {
  if (story.predictionId) return predictionSectionHtml(story, predData);
  const episodes = [...(story.episodes || [])].sort((a, b) => {
    const ad = parseDateSafe(a.date)?.getTime() ?? 0;
    const bd = parseDateSafe(b.date)?.getTime() ?? 0;
    return ad - bd;
  });
  const first = episodes[0], last = episodes[episodes.length - 1];
  const dateRange = first && last
    ? (first.date === last.date ? fmtL(first.date) : `${fmtD(first.date)} – ${fmtD(last.date)}`)
    : '';
  const stCfg = ST[story.status] || ST.active;

  function badgeFor(ep) {
    if (ep.episodeType === 'brief')       return { label: '◆ BRIEF',   color: '#4338ca', bg: '#e0e7ff' };
    if (ep.episodeType === 'web-summary') return { label: '◎ SUMMARY', color: '#047857', bg: '#d1fae5' };
    if (ep.videoUrl)       return { label: '▶ VIDEO',   color: '#dc2626', bg: '#fee2e2' };
    if (ep.audioUrl)       return { label: '◉ PODCAST', color: '#7c3aed', bg: '#ede9fc' };
    if (ep.socialPlatform) return { label: '💬 SOCIAL',  color: '#0369a1', bg: '#e0f2fe' };
    const cfg = EP[ep.type] || EP.development;
    return { label: `${cfg.symbol} ${cfg.label}`, color: cfg.color, bg: cfg.light };
  }

  const GAP_NOTE_DAYS = 30, GAP_LONG_DAYS = 90;

  const entriesHtml = episodes.map((ep, i) => {
    const prev = episodes[i - 1];
    let gapHtml = '';
    if (prev) {
      const prevDt = parseDateSafe(prev.date), curDt = parseDateSafe(ep.date);
      if (prevDt && curDt) {
        const days = Math.round((curDt - prevDt) / 86400000);
        if (days >= GAP_NOTE_DAYS) {
          const label = days >= GAP_LONG_DAYS ? `Long pause — roughly ${Math.round(days/30)} months of quiet` : `${days} days later`;
          gapHtml = `<div class="gap">${escHtml(label)}</div>`;
        }
      }
    }
    const b = badgeFor(ep);
    const cfg = EP[ep.type] || EP.development;
    const links = [];
    if (Array.isArray(ep.sourceLinks) && ep.sourceLinks.length) {
      ep.sourceLinks.forEach(s => {
        const href = normalizeExternalUrl(s?.url || '');

      });
    } else if (ep.sourceUrl) {
      const href = normalizeExternalUrl(ep.sourceUrl);
      if (href) links.push({ title: 'Read the original', url: href });
    }
    const mediaHref = normalizeExternalUrl(ep.videoUrl || ep.audioUrl || '');
    const mediaHtml = mediaHref
      ? `<a class="media" href="${escAttr(mediaHref)}" target="_blank" rel="noopener noreferrer">${ep.videoUrl ? '▶ Watch' : '◉ Listen'}</a>`
      : '';
    const linksHtml = links.map(l => `<a href="${escAttr(l.url)}" target="_blank" rel="noopener noreferrer">${escHtml(l.title)} ↗</a>`).join('');
    return `${gapHtml}<div class="entry">
      <div class="rail"><div class="dot" style="background:${cfg.color}"></div></div>
      <div class="card">
        <div class="meta"><span class="date">${escHtml(fmtL(ep.date))}</span><span class="badge" style="color:${b.color};background:${b.bg}">${escHtml(b.label)}</span></div>
        <h3>${escHtml(ep.headline || 'Untitled episode')}</h3>
        ${ep.summary ? `<div class="summary">${escHtml(ep.summary).replace(/\n/g,'<br/>')}</div>` : ''}
        ${ep.framingNote ? `<div class="framing">${escHtml(ep.framingNote).replace(/\n/g,'<br/>')}</div>` : ''}
        ${(mediaHtml || linksHtml) ? `<div class="links">${mediaHtml}${linksHtml}</div>` : ''}
      </div>
    </div>`;
  }).join('\n');

  const tagsHtml = (story.tags || []).slice(0, 8).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');

  return `
  <span class="status" style="color:${stCfg.text};background:${stCfg.bg}">${escHtml(stCfg.label)}</span>
  <h1>${escHtml(story.title)}</h1>
  ${story.summary ? `<div class="narrative">${escHtml(story.summary)}</div>` : ''}
  ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ''}
  <div class="stats">${episodes.length} episode${episodes.length!==1?'s':''} tracked${dateRange?` · ${escHtml(dateRange)}`:''}</div>
  <div class="timeline">
    ${entriesHtml || `<div style="color:${BEIGE.textMute};font-size:13px;">No episodes tracked yet.</div>`}
  </div>`;
}

// A prediction's evidence (signals, scored articles, balance) lives on the server, not in the story object,
// so share/export pages must fetch it first. Returns { [storyId]: { prediction, evidence, links } }.
async function fetchPredictionShareData(stories) {
  const out = {};
  const list = (Array.isArray(stories) ? stories : [stories]).filter(s => s && s.predictionId);
  await Promise.all(list.map(async s => {
    try {
      const [p, l] = await Promise.all([
        fetch(`/v2/predictions/${s.predictionId}`).then(r => r.ok ? r.json() : null),
        fetch(`/v2/links?predictionId=${s.predictionId}`).then(r => r.ok ? r.json() : null),
      ]);
      if (p?.prediction) out[s.id] = { prediction: p.prediction, evidence: p.evidence || null, links: l?.links || [] };
    } catch (e) { /* page still renders, with a note that evidence could not be loaded */ }
  }));
  return out;
}

// One prediction's share section: the claim, the evidence balance, and every tracked supporting / contradicting article.
function predictionSectionHtml(story, data) {
  const stCfg = ST[story.status] || ST.active;
  const title = String(story.title || '').replace(/\s*\(Prediction\)\s*$/, '');
  const pred = data?.prediction || null;
  const ev = data?.evidence || null;
  const links = data?.links || [];
  const statement = pred?.statement || story.summary || '';
  // Story titles are cut to 80 chars with "…"; when that happens, lead with the full statement instead of repeating it below.
  const titleTruncated = !!statement && title.endsWith('…') && statement.startsWith(title.slice(0, -1).trim());
  const headline = titleTruncated ? statement : title;
  const showStatement = !!statement && !titleTruncated && statement.trim() !== title.trim();
  let resolves = '';
  if (pred?.resolutionDate) {
    const d = new Date(pred.resolutionDate);
    if (!isNaN(d)) resolves = d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric', timeZone:'UTC' });
  }
  const by = st => links.filter(l => l.stance === st).sort((a, b) => (b.weight || 0) - (a.weight || 0));
  const nIrrelevant = links.filter(l => l.stance === 'irrelevant').length;
  const nUnscored = links.filter(l => l.stance === 'pending' || l.stance === 'error').length;
  const dirLabel = { closer:'Evidence leans toward TRUE', further:'Evidence leans toward FALSE', mixed:'Mixed evidence', none:'No directional evidence yet' };
  const dirColor = { closer:'#059669', further:'#dc2626', mixed:'#d97706', none:BEIGE.textMute };

  const claimHtml = (l, color) => {
    const it = l.item || {};
    const href = normalizeExternalUrl(it.url || '');
    let host = it.source || '';
    if (!host && href) { try { host = new URL(href).hostname.replace('www.', ''); } catch (e) {} }
    const ttl = escHtml(it.title || 'Untitled');
    const why = l.tagger === 'user' ? 'Classified by a person after review.' : (l.reason || '');
    return `<div class="claim"><div class="w" style="color:${color}">${Number(l.weight) || 0}</div><div style="flex:1;min-width:0">`
      + (href ? `<a class="t" href="${escAttr(href)}" target="_blank" rel="noopener noreferrer">${ttl} ↗</a>` : `<span class="t">${ttl}</span>`)
      + `<div class="src">${escHtml(host || 'Unknown source')}</div>`
      + (why ? `<div class="why">${escHtml(why)}</div>` : '')
      + `</div></div>`;
  };
  const groups = [
    { st:'supports',    label:'Supporting evidence',    color:'#059669' },
    { st:'contradicts', label:'Contradicting evidence', color:'#dc2626' },
    { st:'complicates', label:'Complicating evidence',  color:'#d97706' },
  ];
  const groupsHtml = groups.map(g => {
    const list = by(g.st);
    if (!list.length) return '';
    return `<div class="claims"><h2 style="color:${g.color}">${g.label} (${list.length})</h2>${list.map(l => claimHtml(l, g.color)).join('')}</div>`;
  }).join('');

  let evidenceHtml = '';
  if (ev && ev.direction && ev.direction !== 'none') {
    const sc = Number(ev.score) || 0;
    const left = sc >= 0 ? '50%' : `${50 + sc / 2}%`;
    evidenceHtml = `<div class="evi">
      <div class="head"><span class="dir" style="color:${dirColor[ev.direction] || BEIGE.text}">${escHtml(dirLabel[ev.direction] || '')}</span>
        <span class="bal">balance ${sc > 0 ? '+' : ''}${sc} (of ±100)${ev.strength && ev.strength !== 'none' ? ` · ${escHtml(ev.strength)} evidence` : ''}</span></div>
      <div class="meter"><div class="mid"></div><div class="fill" style="left:${left};width:${Math.abs(sc) / 2}%;background:${sc >= 0 ? '#059669' : '#dc2626'}"></div></div>
      <div class="counts"><span>${ev.supports || 0} supporting</span><span>${ev.contradicts || 0} contradicting</span><span>${ev.complicates || 0} complicating</span><span>${ev.irrelevant || 0} irrelevant</span></div>
      <div class="note">Shows which way the news tracked so far leans: −100 = all against, +100 = all for. It is not a probability and is separate from the author's confidence.</div>
    </div>`;
  } else if (data) {
    evidenceHtml = `<div class="evi"><div class="head"><span class="dir" style="color:${BEIGE.textMute}">No directional evidence yet</span></div></div>`;
  }

  const signals = (pred?.signals || []).filter(x => x.active).slice(0, 8);
  const signalsHtml = signals.length
    ? `<div class="tags"><span style="font-size:11px;color:${BEIGE.textMute};align-self:center">Tracking:</span>${signals.map(x => `<span class="tag">${escHtml(x.query)}</span>`).join('')}</div>`
    : '';

  const metaBits = [];
  if (pred && pred.confidence != null) metaBits.push(`<span>Author's confidence: <strong>${escHtml(String(pred.confidence))}%</strong></span>`);
  if (resolves) metaBits.push(`<span>Resolves: <strong>${escHtml(resolves)}</strong></span>`);
  if (pred?.status) metaBits.push(`<span>Status: <strong>${escHtml(pred.status)}</strong></span>`);
  if (links.length) metaBits.push(`<span><strong>${links.length}</strong> articles tracked</span>`);

  const footnotes = [];
  if (nIrrelevant) footnotes.push(`${nIrrelevant} further article${nIrrelevant === 1 ? '' : 's'} reviewed and judged not relevant.`);
  if (nUnscored) footnotes.push(`${nUnscored} article${nUnscored === 1 ? '' : 's'} not yet scored.`);

  return `
  <span class="status" style="color:${stCfg.text};background:${stCfg.bg}">PREDICTION · ${escHtml(stCfg.label)}</span>
  <h1>${escHtml(headline)}</h1>
  ${showStatement ? `<div class="narrative">${escHtml(statement)}</div>` : ''}
  ${metaBits.length ? `<div class="pred-meta">${metaBits.join('')}</div>` : ''}
  ${signalsHtml}
  ${data ? '' : `<div class="evi"><div class="note">Evidence could not be loaded when this page was generated, so only the prediction itself is shown.</div></div>`}
  ${evidenceHtml}
  ${groupsHtml || (data ? `<div style="color:${BEIGE.textMute};font-size:13px;">No evidence has been tracked for this prediction yet.</div>` : '')}
  ${footnotes.length ? `<div style="font-size:12px;color:${BEIGE.textMute};font-style:italic;">${footnotes.join(' ')}</div>` : ''}`;
}

const SHARE_HTML_REVEAL_SCRIPT = `
(function(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var els = document.querySelectorAll('.entry, .gap');
  if (!('IntersectionObserver' in window)) { els.forEach(function(el){ el.classList.add('in'); }); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting) { entry.target.classList.add('in'); io.unobserve(entry.target); }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  els.forEach(function(el){ io.observe(el); });
})();`;

async function shareStoryTimeline(story) {
  if (!story) return;
  // Prediction evidence lives on the server: open the tab inside the click (so pop-up blockers allow it),
  // fetch the evidence, then point the tab at the finished page.
  const needsData = !!story.predictionId;
  let win = needsData ? window.open('', '_blank') : null;
  let predMap = {};
  if (needsData) {
    try { predMap = await fetchPredictionShareData([story]); } catch (e) { predMap = {}; }
  }
  const html = buildStoryShareHtml(story, predMap[story.id]);
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  if (needsData) {
    if (win) win.location.href = url; else URL.revokeObjectURL(url);
  } else {
    win = window.open(url, '_blank');
    if (!win) { URL.revokeObjectURL(url); }
  }
  const a = document.createElement('a');
  a.href = url;
  a.download = `${safeFileToken(story.title, 'story')}-timeline.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function resolveCssVarColor(varName, fallback = '#1a1714') {
  try {

    const v = root.getPropertyValue(varName).trim();
    return v || fallback;
  } catch {
    return fallback;
  }
}

    'var(--accent)': resolveCssVarColor('--accent', '#b86b4a'),
  };
  const all = [clone, ...clone.querySelectorAll('*')];
  all.forEach((el) => {
    const fill = el.getAttribute('fill');
    if (fill && varMap[fill]) el.setAttribute('fill', varMap[fill]);
    const stroke = el.getAttribute('stroke');
    if (stroke && varMap[stroke]) el.setAttribute('stroke', varMap[stroke]);
    const style = el.getAttribute('style');
    if (style && style.includes('var(--')) {
      let next = style;
      Object.entries(varMap).forEach(([k, v]) => { next = next.split(k).join(v); });
      el.setAttribute('style', next);
    }
  });
}

  const eps = [...(story.episodes || [])]

  eps.forEach(ep => (ep.actors||[]).forEach(a => actorSet.add(a)));

  const timeline = eps.map((e,i)=>`${i+1}. ${fmtS(e.date)} — ${e.headline} (${EP[e.type]?.label || e.type})`).join('\n');

  return ollama([{

STORY: "${story.title}"
SUMMARY: ${story.summary || 'none'}
STATUS: resolved
PLAYERS: ${actors || 'none'}
EPISODE COUNT: ${eps.length}

FULL TIMELINE:
${timeline || '(no episodes)'}

Return strict JSON:
{

function storyMatchesQuery(story, q) {
  if (!q) return { match: true, hints: [] };
  const low = q.toLowerCase();
  // Title match — no hint needed, title is already visible
  if (story.title.toLowerCase().includes(low)) return { match: true, hints: [] };
  const seen = new Set();
  const hints = [];
  const push = (type, text) => { const k=type+text; if (!seen.has(k)) { seen.add(k); hints.push({ type, text }); } };
  // Story-level tags + actors
  (story.tags||[]).filter(t=>t.toLowerCase().includes(low)).forEach(t=>push('tag',t));
  (story.actors||[]).filter(a=>a.toLowerCase().includes(low)).forEach(a=>push('actor',a));
  // Episode-level tags + actors (scan all episodes)
  for (const ep of (story.episodes||[])) {
    (ep.tags||[]).filter(t=>t.toLowerCase().includes(low)).forEach(t=>push('tag',t));
    (ep.actors||[]).filter(a=>a.toLowerCase().includes(low)).forEach(a=>push('actor',a));
  }
  return { match: hints.length > 0, hints };
}

// ─── Timeline ────────────────────────────────────────────────────────────────
// ── Timeline pattern helpers ──────────────────────────────────────────────────

function formatGapLabel(ms) {
  const h = ms / 3_600_000;
  if (h < 1)  return '<1h';
  if (h < 24) return `${Math.round(h)}h`;
  const d = ms / 86_400_000;
  if (d < 7)   return `${Math.round(d)}d`;
  if (d < 30)  return `${Math.round(d / 7)}w`;
  if (d < 365) return `${Math.round(d / 30)}mo`;
  return `${(d / 365).toFixed(1)}y`;
}

// Gap width: log-proportional so long silences get more space but stay bounded
function gapPx(ms) {
  const d = ms / 86_400_000;
  return Math.round(Math.max(48, Math.min(260, 66 * Math.log2(1 + d))));
}

// Group sorted episodes: 3+ consecutive episodes each within 72h → cluster node
function buildTimelineNodes(eps) {
  if (!eps.length) return [];
  const WINDOW = 72 * 3_600_000;
  const MIN_CLUSTER = 3;
  const nodes = [];
  let i = 0;
  while (i < eps.length) {
    let j = i + 1;
    while (j < eps.length &&
      new Date(eps[j].date) - new Date(eps[j - 1].date) <= WINDOW) j++;
    if (j - i >= MIN_CLUSTER) {
      nodes.push({ type: 'cluster', eps: eps.slice(i, j) });
    } else {
      for (let k = i; k < j; k++) nodes.push({ type: 'single', ep: eps[k] });
    }
    i = j;
  }
  return nodes;
}

function nodeFirstDate(n) { return n.type === 'cluster' ? n.eps[0].date : n.ep.date; }
function nodeLastDate(n)  { return n.type === 'cluster' ? n.eps[n.eps.length - 1].date : n.ep.date; }

// ── GapSegment ────────────────────────────────────────────────────────────────
function GapSegment({ ms }) {
  const days   = ms / 86_400_000;
  const label  = formatGapLabel(ms);
  const isDormant  = days >= 30;
  const isVeryLong = days >= 90;
  const lineClr = isVeryLong ? '#ef4444' : isDormant ? '#f59e0b' : '#d4cfc7';
  const textClr = isVeryLong ? '#dc2626' : isDormant ? '#92400e' : C.textMute;
  const w = gapPx(ms);
  return (
    <div style={{width:w,flexShrink:0,position:'relative',
                 marginTop:18, // align 2px line with circle center (38px circle → 18+1=19px)
                 height:2,background:lineClr}}>
      <span style={{position:'absolute',left:'50%',top:'50%',
                    transform:'translate(-50%,-50%)',background:C.surface,
                    padding:'0 3px',fontSize:9,fontWeight:700,color:textClr,
                    whiteSpace:'nowrap',letterSpacing:'0.04em',lineHeight:1,
                    pointerEvents:'none'}}>{label}</span>
      {isDormant && (
        <span style={{position:'absolute',left:'50%',transform:'translateX(-50%)',
                      bottom:9,fontSize:8,fontWeight:800,color:textClr,
                      background:isVeryLong?'#fee2e2':'#fef3c7',
                      padding:'1px 5px',borderRadius:3,
                      textTransform:'uppercase',letterSpacing:'0.06em',
                      whiteSpace:'nowrap'}}>
          {isVeryLong ? 'Long pause' : 'Gap'}
        </span>
      )}
    </div>
  );
}
