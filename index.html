// Click-to-rename story title — no edit button, the text itself is the
// affordance. Matters in practice: a story auto-titled verbatim from a
// headline ("20+ things you may have missed in the GTA 6 extended look")
// makes a bad search term for everything downstream (headlines, videos,
// social, auto-refresh) that uses story.title as its query. Renaming to
// "GTA 6" broadens that search immediately, everywhere, for free.
function EditableStoryTitle({ story, onUpdateStory }) {
  const [editing, setEditing] = useState(false);
  const [draft,   setDraft]   = useState(story.title || '');
  const inputRef = useRef(null);
  const titleStyle = { margin:0, fontSize:17, fontWeight:800, color:C.text, letterSpacing:'-0.3px', fontFamily:'inherit' };

  useEffect(() => { setDraft(story.title || ''); setEditing(false); }, [story.id]);
  useEffect(() => { if (editing) { inputRef.current?.focus(); inputRef.current?.select(); } }, [editing]);

  function commit() {
    const trimmed = draft.trim();
    setEditing(false);
    if (trimmed && trimmed !== story.title) onUpdateStory && onUpdateStory(story.id, { title: trimmed });
    else setDraft(story.title || '');
  }
  function cancel() { setDraft(story.title || ''); setEditing(false); }

  if (!onUpdateStory) return <h2 style={titleStyle}>{story.title}</h2>;

  if (editing) {
    return (
      <input
        ref={inputRef}
        value={draft}
        onChange={e => setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } else if (e.key === 'Escape') cancel(); }}
        style={{...titleStyle, border:'none', borderBottom:`1.5px solid ${C.accent}`, background:'transparent', outline:'none', padding:0, minWidth:160, width:`${Math.max(10, draft.length + 1)}ch`, maxWidth:'100%'}}
      />
    );
  }
  return (
    <h2
      onClick={() => setEditing(true)}
      title="Click to rename"
      style={{...titleStyle, cursor:'text', borderBottom:'1.5px solid transparent', transition:'border-color 0.15s'}}
      onMouseEnter={e => { e.currentTarget.style.borderBottomColor = C.borderLight; }}
      onMouseLeave={e => { e.currentTarget.style.borderBottomColor = 'transparent'; }}
    >
      {story.title}
    </h2>
  );
}

// One scored article under a prediction, with controls to override the AI's call or score it again.
function PredictionLinkCard({ link, color, busy, onSetStance, onRescore, onSeparate }) {
  const item = link.item || {};
  const grp = link.group;
  const echo = !!(grp && grp.echo);
  let host = item.source || '';
  if (!host && item.url) { try { host = new URL(item.url).hostname.replace('www.', ''); } catch (e) {} }
  const STANCES = [['supports','Supports','#059669'],['contradicts','Contradicts','#dc2626'],['complicates','Complicates','#d97706'],['irrelevant','Irrelevant','#6b7280']];
  const unscored = link.stance === 'error' || link.stance === 'pending';
  const chip = (active, col) => ({fontSize:11,padding:'2px 9px',borderRadius:10,cursor:busy?'default':'pointer',
    border:`1px solid ${active ? col : C.borderLight}`,background:active ? col : 'transparent',color:active ? '#fff' : C.textMid});
  return (
    <div style={{padding:'10px 12px',borderRadius:8,background:C.surface,border:`1px solid ${C.borderLight}`,opacity:busy ? 0.6 : echo ? 0.72 : 1}}>
      <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
        <span style={{fontSize:18,fontWeight:900,color:echo ? C.textMute : color,lineHeight:1,minWidth:36,textAlign:'center',textDecoration:echo ? 'line-through' : 'none'}} title={echo ? 'Not counted: this story is already counted through another article' : ''}>{unscored ? '—' : link.weight}</span>
        <div style={{flex:1,minWidth:0}}>
          <a href={item.url} target="_blank" rel="noopener noreferrer" style={{fontSize:13,fontWeight:600,color:C.text,textDecoration:'none',lineHeight:1.4,display:'block',marginBottom:4}}>
            {item.title || 'Untitled'}
          </a>
          <div style={{fontSize:11,color:C.textMute,marginBottom:4}}>{host || 'Unknown source'}{link.tagger === 'user' ? ' · ✎ set by you' : ''}</div>
          {grp && (
            <div style={{fontSize:11,color:C.accent,marginBottom:5,lineHeight:1.45,display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
              <span title={(grp.outlets || []).join(', ')}>
                {echo ? '↳ Same story as a stronger article here, so it isn’t counted again' : `🔗 Same story in ${grp.size} articles (${(grp.outlets || []).slice(0, 4).join(', ')}${(grp.outlets || []).length > 4 ? '…' : ''}), counted once`}
              </span>
              {onSeparate && <button disabled={busy} onClick={() => onSeparate(link)} style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:11,textDecoration:'underline',padding:0}}>Not the same story</button>}
            </div>
          )}
          {link.countSeparately && !grp && onSeparate && (
            <div style={{fontSize:11,color:C.textMute,marginBottom:5}}>Counted on its own (you marked it as a different story).{' '}
              <button disabled={busy} onClick={() => onSeparate(link)} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontSize:11,textDecoration:'underline',padding:0}}>Undo</button>
            </div>
          )}
          {link.reason
            ? <div style={{fontSize:12,color:link.stance === 'error' ? '#d97706' : C.textMid,lineHeight:1.5,fontStyle:'italic'}}>{link.reason}</div>
            : (link.stance === 'pending' && <div style={{fontSize:12,color:C.textMute}}>Waiting to be scored…</div>)}
          <div style={{display:'flex',gap:4,flexWrap:'wrap',alignItems:'center',marginTop:8}}>
            <span style={{fontSize:10,color:C.textMute,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginRight:2}}>Mark as</span>
            {STANCES.map(([k, label, col]) => (
              <button key={k} disabled={busy} onClick={() => onSetStance(link, k)} style={chip(link.stance === k, col)}>{label}</button>
            ))}
            <button disabled={busy} onClick={() => onRescore(link)} title="Ask the AI to score this article again (replaces any change you made)"
              style={{...chip(false, C.textMute),marginLeft:'auto'}}>↻ Re-score</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Saved copies of articles ─────────────────────────────────────────────────
async function archiveJson(pathAndQuery, opts) {
  try {
    const r = await fetch('/api/lateral/archive/' + pathAndQuery, opts);
    const d = await r.json().catch(() => ({}));
    if (!r.ok && !d.error) d.error = `HTTP ${r.status}`;
    return d;
  } catch (e) { return { error: e.message }; }
}
const archivePost = (p, body) => archiveJson(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

// Reads one saved article. `inline` renders it without its own modal (used inside the Library).
function ArticleReader({ archiveKey, onClose, onDeleted, inline, extra }) {
  const [doc, setDoc] = useState(null);
  const [err, setErr] = useState('');
  const [ver, setVer] = useState(0);
  useEffect(() => {
    if (ver === 0) setDoc(null);
    setErr('');
    archiveJson('get?key=' + encodeURIComponent(archiveKey)).then(d => (d.error ? setErr(d.error) : setDoc(d)));
  }, [archiveKey, ver]);

  async function remove() {
    if (!window.confirm('Delete this saved copy? The original article is not affected.')) return;
    await archiveJson('item?key=' + encodeURIComponent(archiveKey), { method: 'DELETE' });
    if (onDeleted) onDeleted();
    if (onClose) onClose();
  }

  const body = (
    <div>
      {err && <div style={{color:'#dc2626',fontSize:13}}>{err}</div>}
      {!doc && !err && <div style={{color:C.textMute,fontSize:13}}>Loading…</div>}
      {doc && (
        <>
          <div style={{fontSize:21,fontWeight:900,color:C.text,lineHeight:1.25,fontFamily:"'Playfair Display', Georgia, serif",marginBottom:8}}>{doc.title}</div>
          <div style={{fontSize:12,color:C.textMute,lineHeight:1.6,marginBottom:12}}>
            {[doc.site, doc.byline && `by ${doc.byline}`, doc.publishedAt && new Date(doc.publishedAt).toLocaleDateString(), `${(doc.words || 0).toLocaleString()} words`].filter(Boolean).join(' · ')}
            <br/>
            Saved {new Date(doc.savedAt).toLocaleString()}{doc.method === 'tavily' ? ' (via Tavily Extract)' : ''}, kept only on this computer.
          </div>
          {extra && extra(doc, () => setVer(v => v + 1))}
          <div style={{display:'flex',gap:10,marginBottom:14,alignItems:'center'}}>
            <a href={doc.url} target="_blank" rel="noopener noreferrer" style={{fontSize:12,fontWeight:700,color:C.accent}}>Open original ↗</a>
            <button onClick={remove} style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'#dc2626',fontSize:11.5,fontWeight:700,padding:0}}>Delete saved copy</button>
          </div>
          <div style={{borderTop:`1px solid ${C.borderLight}`,paddingTop:14,maxHeight:inline ? 'none' : '58vh',overflowY:inline ? 'visible' : 'auto'}}>
            {String(doc.text || '').split(/\n\n+/).map((p, i) => (p.startsWith('## ')
              ? <h3 key={i} style={{fontSize:15,fontWeight:800,color:C.text,margin:'18px 0 6px'}}>{p.slice(3)}</h3>
              : <p key={i} style={{fontSize:14,lineHeight:1.75,color:C.text,margin:'0 0 12px',maxWidth:'68ch'}}>{p}</p>))}
          </div>
        </>
      )}
    </div>
  );
  return inline ? body : <Modal title="Saved copy" onClose={onClose} maxWidth={720}>{body}</Modal>;
}

// "Save a copy" / "Saved copy" button for one article. Renders as one cell of the joined .ep-seg control.
function SavedCopyChip({ url, title, storyId }) {
  const [st, setSt] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const check = () => archivePost('status', { urls: [url] }).then(d => setSt((d.status || {})[url] || { saved: false }));
  useEffect(() => { setSt(null); setMsg(''); if (url) check(); }, [url]);
  useEffect(() => { if (!st || !st.pending) return; const t = setInterval(check, 4000); return () => clearInterval(t); }, [st && st.pending, url]);
  if (!url) return null;

  const openInLibrary = (key) => window.dispatchEvent(new CustomEvent('lateral-open-library', { detail: { key } }));
  async function save() {
    setBusy(true); setMsg('');
    const d = await archivePost('save', { url, title, storyId });
    setBusy(false);
    if (d.ok) { await check(); openInLibrary(d.key); } else setMsg(d.reason || d.error || 'Could not save a copy.');
  }
  const saving = busy || (st && st.pending);
  const saved = st && st.saved;
  const bookmark = (
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M7 4h10a1 1 0 011 1v15l-6-3.6L6 20V5a1 1 0 011-1z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" fill={saved ? 'currentColor' : 'none'}/>
    </svg>
  );
  return (
    <span style={{flexDirection:'column'}}>
      {saved
        ? <button className="ep-cell" onClick={() => openInLibrary(st.key)} title="Read it in the Library">{bookmark}Saved copy{st.words ? <span style={{fontWeight:500,opacity:0.7}}>· {st.words.toLocaleString()}w</span> : null}</button>
        : <button className="ep-cell" onClick={save} disabled={saving || !st} title="Keep a readable copy of this article on this computer">{bookmark}{saving ? 'Saving…' : 'Save a copy'}</button>}
      {msg && <span style={{display:'block',fontSize:10.5,color:'#b45309',padding:'0 10px 7px',lineHeight:1.35}}>{msg}</span>}
      {st && !saved && !msg && st.failed && <span style={{display:'block',fontSize:10.5,color:C.textMute,padding:'0 10px 7px',lineHeight:1.35}}>Last try: {st.failed}</span>}
    </span>
  );
}

// Center panel for the Library: a landing page when nothing is open, otherwise one saved article with its story links.
function LibraryCenter({ keyId, stories, onSelectKey, onFilterStory, onOpenStory, onChanged, tick }) {
  const [stats, setStats] = useState(null);
  const [all, setAll] = useState([]);
  const [note, setNote] = useState('');

  useEffect(() => { loadStats(); }, [tick, keyId]);
  useEffect(() => { if (!stats || !stats.pending) return; const t = setInterval(loadStats, 4000); return () => clearInterval(t); }, [stats && stats.pending]);
  useEffect(() => { if (!keyId) archiveJson('list?limit=500').then(d => setAll(d.items || [])); }, [keyId, tick, stats && stats.saved]);

  async function backfill() {
    setBusy(true); setNote('');
    const d = await archivePost('backfill');
    setBusy(false);
    setNote(d.error ? d.error : d.found === 0 ? 'Nothing to save yet. Add episodes, or run a prediction search first.'
      : `Found ${d.found} article${d.found === 1 ? '' : 's'} across your stories and predictions; ${d.queued} queued to save${d.skipped ? `, ${d.skipped} already saved (their story links were refreshed)` : ''}. This runs in the background.`);
    loadStats(); if (onChanged) onChanged();
  }

  const wrap = {flex:1,minWidth:0,overflowY:'auto',padding:'22px 28px 60px',background:C.bg};

  if (keyId) {
    const extra = (doc, reload) => {
      const linkedIds = doc.storyIds || [];

      const tag = async (storyId, remove) => { await archivePost('tag', { key: doc.key, storyId, remove: !!remove }); reload(); if (onChanged) onChanged(); };

          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:linkedIds.length ? 8 : 0}}>
            {linkedIds.map(id => {
              const t = libStoryTitle(stories, id);
              return (
                <span key={id} style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:12,fontWeight:700,color:C.accent,border:`1px solid ${C.border}`,borderRadius:14,padding:'3px 5px 3px 10px',background:C.bg}}>
                  <button onClick={() => onOpenStory(id)} title="Open this story" style={{background:'none',border:'none',cursor:'pointer',color:'inherit',fontWeight:'inherit',fontSize:'inherit',padding:0}}>{t || 'Removed story'}</button>
                  <button onClick={() => tag(id, true)} title="Unlink" style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:13,lineHeight:1,padding:'0 3px'}}>×</button>
                </span>
              );
            })}
          </div>
          {free.length > 0 && (
            <select value="" onChange={e => { if (e.target.value) tag(e.target.value, false); }} style={{...inputStyle,fontSize:12,padding:'5px 8px',maxWidth:340}}>
              <option value="">Link to a tracked story…</option>
              {free.map(st => <option key={st.id} value={st.id}>{st.predictionId ? '🔮 ' : ''}{st.title.replace(' (Prediction)', '').slice(0, 70)}</option>)}
            </select>
          )}
        </div>
      );
    };
    return (
      <div style={wrap}>
        <div style={{maxWidth:760,margin:'0 auto'}}>
          <button onClick={() => onSelectKey(null)} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontSize:12,fontWeight:700,padding:0,marginBottom:12}}>← Library</button>
          <ArticleReader archiveKey={keyId} inline extra={extra} onDeleted={() => { onSelectKey(null); if (onChanged) onChanged(); }}/>
        </div>
      </div>
    );
  }

  const counts = {};
  let unlinked = 0;
  all.forEach(it => { const ids = it.storyIds || []; if (!ids.length) unlinked++; ids.forEach(id => { counts[id] = (counts[id] || 0) + 1; }); });
  const rows = (stories || []).filter(st => counts[st.id]).sort((a, b) => counts[b.id] - counts[a.id]);
  const card = {background:C.surface,border:`1px solid ${C.borderLight}`,borderRadius:10,padding:'14px 16px',marginBottom:14};
  return (
    <div style={wrap}>
      <div style={{maxWidth:760,margin:'0 auto'}}>
        <div style={{fontSize:24,fontWeight:900,color:C.text,fontFamily:"'Playfair Display', Georgia, serif",marginBottom:6}}>Library</div>
        <div style={{fontSize:13,color:C.textMid,lineHeight:1.6,marginBottom:16}}>
          Readable copies of the articles behind your stories and predictions, kept on this computer so your timelines survive dead links. Pick an article from the list on the left, or search the full text of everything saved.
        </div>
        <div style={card}>
          <div style={{fontSize:13,color:C.text,marginBottom:10}}>
            {stats ? <><strong>{stats.saved.toLocaleString()}</strong> saved · {stats.words.toLocaleString()} words{stats.pending ? ` · ${stats.pending} saving now…` : ''}{stats.failed ? ` · ${stats.failed} couldn’t be saved` : ''}</> : 'Loading…'}
          </div>
          <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
            <Btn variant="secondary" onClick={backfill} disabled={busy} style={{padding:'6px 12px',fontSize:12}}>{busy ? 'Working…' : 'Save & link everything I already track'}</Btn>
            {note && <span style={{fontSize:11.5,color:C.textMid,flex:1,minWidth:220}}>{note}</span>}
          </div>
          <div style={{fontSize:11.5,color:C.textMute,marginTop:8,lineHeight:1.5}}>New episodes and prediction evidence are saved automatically (Settings → Basic). This button catches up on what you already had, and links each article to the story it came from.</div>
        </div>
        {(rows.length > 0 || unlinked > 0) && (
          <div style={card}>
            <div style={{fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:8}}>By tracked story</div>
            {rows.map(st => (
              <div key={st.id} style={{display:'flex',alignItems:'center',gap:10,padding:'5px 0'}}>
                <button onClick={() => onFilterStory(st.id)} title="Show these articles in the list" style={{flex:1,textAlign:'left',background:'none',border:'none',cursor:'pointer',color:C.text,fontSize:13,fontWeight:600,padding:0}}>{st.predictionId ? '🔮 ' : ''}{st.title.replace(' (Prediction)', '')}</button>
                <span style={{fontSize:12,color:C.textMute}}>{counts[st.id]}</span>
                <button onClick={() => onOpenStory(st.id)} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontSize:11.5,fontWeight:700,padding:0}}>Open story →</button>
              </div>
            ))}
            {unlinked > 0 && (
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'5px 0',marginTop:4,borderTop:`1px solid ${C.borderLight}`}}>
                <button onClick={() => onFilterStory('_none')} style={{flex:1,textAlign:'left',background:'none',border:'none',cursor:'pointer',color:C.textMid,fontSize:13,padding:0}}>Not linked to a tracked story</button>
                <span style={{fontSize:12,color:C.textMute}}>{unlinked}</span>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Civic: who represents you, at every level of government ──────────────────
async function civicJson(pathAndQuery, opts) {
  try {
    const r = await fetch('/api/lateral/civic/' + pathAndQuery, opts);
    const d = await r.json().catch(() => ({}));
    if (!r.ok && !d.error) d.error = `HTTP ${r.status}`;
    return d;
  } catch (e) { return { error: e.message }; }
}
const civicPost = (p, body) => civicJson(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
const civicKey = o => `${o.level}|${o.office}|${o.name}`;
const CIVIC_LEVELS = [['federal', 'Federal'], ['state', 'State'], ['local', 'City, county and schools']];
// A bare date like 2026-10-06 is read as UTC midnight, which shows as the day before in US time zones: pin it to local noon.
const civicDate = d => { try { return d ? new Date(/^\d{4}-\d{2}-\d{2}$/.test(d) ? d + 'T12:00:00' : d).toLocaleDateString() : ''; } catch { return ''; } };
// A term that ends within the next twelve months (federal terms already show "on the ballot" instead).
const civicTermSoon = o => { const t = o && o.termEnds ? Date.parse(o.termEnds + 'T12:00:00') : NaN; return Number.isFinite(t) && t > Date.now() && t - Date.now() < 366 * 86400000; };
const SOCIAL_ORDER = ['instagram', 'tiktok', 'twitter', 'facebook', 'youtube', 'mastodon'];
const SOCIAL_LABEL = { instagram: 'Instagram', tiktok: 'TikTok', twitter: 'X', facebook: 'Facebook', youtube: 'YouTube', mastodon: 'Mastodon' };
const civicOfficeLine = o => [o.office + (o.district && !/Ward/.test(o.office) ? ' ' + o.district : ''), o.role, o.party].filter(Boolean).join(' · ');
// Local people in a sensible order: the mayor, the council, then the county, its courts and sheriff, then the school board.
const civicOrder = o => o.office === 'Mayor' ? 0 : !o.source ? 1 : /^County (Commissioner|Executive)/.test(o.office) ? 2 : /Judge/.test(o.office) ? 3 : /Sheriff/.test(o.office) ? 4 : o.office === 'School Board Member' ? 6 : 5;
const civicSortLocal = list => list.map((o, i) => [o, i]).sort((a, b) => (civicOrder(a[0]) - civicOrder(b[0])) || (a[1] - b[1])).map(x => x[0]);

// One consistent line-icon set for the profile (drawn to match the app's other icons).

// Which map layer an official belongs to (so selecting a person lights up their district).
function civicLayerFor(o) {
  if (o.level === 'federal') return /Senator/.test(o.office) ? 'state' : 'congress';
  if (o.office === 'State Senator') return 'stateSenate';
  if (o.office === 'State Representative') return 'stateHouse';
  if (o.level === 'local' && o.source) return o.office === 'Mayor' ? 'place' : o.office === 'School Board Member' ? 'school' : '';   // county offices have no outline here
  if (o.level === 'local') return /Ward/.test(o.office) ? 'stateSenate' : 'place';
  return 'state';
}
// "Represents": the plain-language area this person speaks for.
function civicRepresents(o, j) {
  j = j || {};
  const st = j.state && j.state.name;
  if (o.level === 'federal' && /Senator/.test(o.office)) return st ? `All of ${st}` : '';
  if (o.level === 'federal') return j.congress ? (j.congress.atLarge ? `${st || ''} at-large congressional district` : `${st ? st + '’s ' : ''}${ordinalSuffix(j.congress.district)} congressional district`).trim() : '';
  if (o.office === 'Governor' || o.office === 'Lieutenant Governor') return st ? `All of ${st}` : '';
  if (o.office === 'State Senator') return j.stateSenate ? j.stateSenate.name : '';
  if (o.office === 'State Representative') return j.stateHouse ? j.stateHouse.name : '';
  if (/Ward/.test(o.office)) return o.office.replace(/^.*, /, '');
  if (o.level === 'local' && o.source) {
    if (o.office === 'Mayor') return j.place ? `City of ${j.place.name.replace(/ city$/i, '')}` : '';
    if (o.office === 'School Board Member') return (j.schoolDistricts && j.schoolDistricts[0] && j.schoolDistricts[0].name) || '';
    if (/^County/.test(o.office)) return j.county ? j.county.name : '';
    return '';
  }
  if (o.level === 'local') return j.place ? `City of ${j.place.name}` : '';
  return '';
}
const civicInitials = n => { const w = String(n || '').split(/\s+/).filter(x => x && !/^(jr|sr|ii|iii|iv)\.?$/i.test(x)); return ((w[0] || '')[0] || '') + (w.length > 1 ? (w[w.length - 1][0] || '') : ''); };

// Left panel: everyone who represents you, grouped by level.
function CivicList({ civic, selKey, onSelect }) {
  if (civic === undefined) return <div style={{padding:'30px 14px',textAlign:'center',color:C.textMute,fontSize:12.5}}>Loading…</div>;
  if (!civic) return <div style={{padding:'6px 18px',color:C.textMute,fontSize:12.5,lineHeight:1.6}}>Enter your address in the main panel to see who represents you at every level of government.</div>;
  const officials = civic.officials || [];
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
      <div style={{padding:'0 14px 8px',fontSize:12,color:C.textMid,fontWeight:700}}>{civic.label}</div>
      <div style={{flex:1,overflowY:'auto',padding:'0 10px 10px'}}>
        {CIVIC_LEVELS.map(([lv, title]) => {
          const list = lv === 'local' ? civicSortLocal(officials.filter(o => o.level === lv)) : officials.filter(o => o.level === lv);
          if (!list.length) return null;
          return (
            <div key={lv} style={{marginBottom:8}}>
              <div style={{fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.07em',padding:'4px 4px 5px'}}>{title} · {list.length}</div>
              {list.map(o => {
                const k = civicKey(o), on = k === selKey;
                return (
                  <button key={k} onClick={() => onSelect(k)}
                    style={{display:'block',width:'100%',textAlign:'left',background:on ? C.accent + '18' : C.surface,border:`1px solid ${on ? C.accent : C.borderLight}`,borderRadius:8,padding:'7px 10px',marginBottom:5,cursor:'pointer'}}>
                    <div style={{fontSize:12.5,fontWeight:700,color:C.text,lineHeight:1.35}}>{o.name}</div>
                    <div style={{fontSize:10.5,color:C.textMute,marginTop:1}}>{civicOfficeLine(o)}</div>
                  </button>
                );
              })}
            </div>
          );
        })}
      </div>
      <div style={{padding:'8px 14px 58px',borderTop:`1px solid ${C.border}`,fontSize:11,color:C.textMute}}>{officials.length} officials · checked {civicDate(civic.asOf)}</div>
    </div>
  );
}

// The portrait: fetched and cached by Lateral's server; initials when there is no photo.
function CivicPhoto({ k, name, size = 124 }) {
  const [bad, setBad] = useState(false);
  useEffect(() => { setBad(false); }, [k]);
  if (bad) return <div className="cv-photo cv-initials" style={{width:size,height:size,fontSize:Math.round(size * 0.34)}} aria-label={name}>{civicInitials(name)}</div>;
  return <img className="cv-photo" src={'/api/lateral/civic/photo?key=' + encodeURIComponent(k)} alt={name} onError={() => setBad(true)} style={{width:size,height:size}}/>;
}

// Recent videos and posts from accounts that publish free public feeds (YouTube, Mastodon).
function CivicPosts({ k }) {
  const [d, setD] = useState(null);
  useEffect(() => { let on = true; setD(null); civicJson('posts?key=' + encodeURIComponent(k)).then(x => { if (on) setD(x); }); return () => { on = false; }; }, [k]);
  return (
    <div>
      {!d && <div style={{fontSize:12,color:C.textMute}}>Loading…</div>}
      {d && d.error && <div style={{fontSize:12,color:'#991b1b'}}>{d.error}</div>}
      {d && !d.error && d.items.length === 0 && <div style={{fontSize:12,color:C.textMute}}>{(d.notes || []).join(' ') || 'Nothing recent.'}</div>}
      {d && !d.error && d.items.map((it, i) => (
        <a key={i} className="cv-vid" href={it.url} target="_blank" rel="noreferrer">
          {it.thumb ? <img src={it.thumb} alt="" referrerPolicy="no-referrer"/> : <i/>}
          <div style={{minWidth:0}}><b>{it.title}</b><span>{SOCIAL_LABEL[it.platform]} · {civicDate(it.date)}</span></div>
        </a>
      ))}
      {d && !d.error && (d.notes || []).length > 0 && d.items.length > 0 && <div style={{fontSize:11,color:C.textMute,marginTop:6}}>{d.notes.join(' ')}</div>}
      <div style={{fontSize:10.5,color:C.textMute,marginTop:8,lineHeight:1.5}}>From the accounts' public feeds; thumbnails load from YouTube. Instagram, TikTok, X and Facebook offer no free way to read posts, so those are links only.</div>
    </div>
  );
}
