// ─── Export ───────────────────────────────────────────────────────────────────
// One modal for getting stories out of Lateral: a print-ready PDF (what NotebookLM, email and sharing accept), a single Markdown
// file, or an Obsidian vault (a zip of linked notes). Markdown and the vault can also carry saved article text and podcast key
// moments. Everything between the markers below is pure (no network, no DOM) so it can be tested on its own.

// <export-pure>
const EXPORT_FORMATS = [
  { id: 'pdf',   label: 'PDF',            hint: 'A print-ready page with each story\'s timeline and prediction evidence. NotebookLM, email and sharing all take PDFs.' },
  { id: 'md',    label: 'Markdown file',  hint: 'One .md file with every story, easy for NotebookLM, other AI tools and notes apps to read.' },
  { id: 'vault', label: 'Obsidian vault', hint: 'A .zip of linked notes (stories, saved articles, podcasts) with frontmatter and [[wikilinks]]. Unzip it into your vault.' },
];

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// A .zip with no compression (notes are small text): files = [{ name, text }]. Names are UTF-8 (flag bit 11).
function makeZip(files) {
  const enc = new TextEncoder();
  const u16 = n => [n & 255, (n >> 8) & 255];
  const u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const local = new Uint8Array([0x50, 0x4b, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(dosTime), ...u16(dosDate), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)]);
    parts.push(local, name, data);
    central.push({ name, crc, size: data.length, offset });
    offset += local.length + name.length + data.length;
  }
  const cdStart = offset;
  for (const c of central) {
    const h = new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(dosTime), ...u16(dosDate), ...u32(c.crc), ...u32(c.size), ...u32(c.size), ...u16(c.name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(c.offset)]);
    parts.push(h, c.name);
    offset += h.length + c.name.length;
  }
  parts.push(new Uint8Array([0x50, 0x4b, 5, 6, 0, 0, 0, 0, ...u16(central.length), ...u16(central.length), ...u32(offset - cdStart), ...u32(cdStart), ...u16(0)]));
  return new Blob(parts, { type: 'application/zip' });
}

// A note's file name: no characters Obsidian or Windows dislike, no clashes (case-insensitive).
function exportNoteName(text, used, fallback) {
  let n = String(text || '').replace(/[\\/:*?"<>|#^\[\]]/g, ' ').replace(/\s+/g, ' ').trim().replace(/[. ]+$/, '');
  if (!n) n = fallback || 'Untitled';
  n = n.slice(0, 80).trim();
  let out = n, i = 2;
  while (used.has(out.toLowerCase())) out = `${n} (${i++})`;
  used.add(out.toLowerCase());
  return out;
}
const yamlStr = s => JSON.stringify(String(s == null ? '' : s));        // a JSON string is a valid YAML scalar
const exportDay = d => { const p = parseDateSafe(d); return p && !isNaN(p) ? p.toISOString().slice(0, 10) : String(d || '').slice(0, 10); };
const mdLink = (text, url) => { const t = String(text || url || '').replace(/[\[\]]/g, ''); return url ? `[${t}](${url})` : t; };
const clipTxt = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s; };
const exportClock = sec => { sec = Math.max(0, Math.floor(Number(sec) || 0)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(x).padStart(2, '0'); };
const actorNames = story => (story.actors || []).map(a => (typeof a === 'string' ? a : a && a.name) || '').filter(Boolean);
const storyTitleOf = story => String(story.title || 'Untitled').replace(/\s*\(Prediction\)\s*$/, '');
const demote = text => String(text || '').replace(/^#{1,6} /gm, '##### ');   // an article's own headings sit below ours

function episodeKind(ep) {
  if (ep.episodeType === 'brief') return 'Brief';
  if (ep.episodeType === 'web-summary') return 'Summary';
  if (ep.videoUrl) return 'Video';
  if (ep.audioUrl) return 'Podcast';
  if (ep.socialPlatform) return 'Social';
  return (EP[ep.type] || EP.development).label;
}

// Stories that share an actor, or two tags, are related. Returns { [storyId]: [storyId…] } among the stories given.
function relatedStories(stories) {
  const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const info = stories.map(s => ({ id: s.id, tags: new Set((s.tags || []).map(norm).filter(Boolean)), actors: new Set(actorNames(s).map(norm)) }));
  const out = {};
  for (const a of info) {
    out[a.id] = info.filter(b => b.id !== a.id && ([...a.actors].some(x => b.actors.has(x)) || [...a.tags].filter(x => b.tags.has(x)).length >= 2)).map(b => b.id);
  }
  return out;
}

// x: { vault, pred, articles:[{ name, doc }], podcasts:[{ name, item, sections, transcribed }], related:[note names], opts }
function storyMarkdown(story, x) {
  const L = [];
  const title = storyTitleOf(story);
  const stCfg = ST[story.status] || ST.active;
  const eps = [...(story.episodes || [])].sort((a, b) => (parseDateSafe(a.date)?.getTime() ?? 0) - (parseDateSafe(b.date)?.getTime() ?? 0));
  const actors = actorNames(story);
  if (x.vault) {
    L.push('---', `title: ${yamlStr(title)}`, 'type: lateral-story', `status: ${yamlStr(stCfg.label.toLowerCase())}`,
      `created: ${yamlStr(exportDay(story.createdAt))}`, `updated: ${yamlStr(exportDay(story.updatedAt || story.createdAt))}`,
      `tags: [${['lateral', ...(story.tags || [])].map(t => yamlStr(String(t).trim().replace(/\s+/g, '-'))).join(', ')}]`,
      ...(actors.length ? [`actors: [${actors.map(yamlStr).join(', ')}]`] : []), ...(story.predictionId ? ['prediction: true'] : []),
      `lateral_id: ${yamlStr(story.id)}`, '---', '');
  }
  L.push(`# ${title}`, '');
  if (story.summary) L.push(...String(story.summary).split('\n').map(l => `> ${l}`), '');
  const first = eps[0], last = eps[eps.length - 1];
  const range = first && last ? (exportDay(first.date) === exportDay(last.date) ? exportDay(first.date) : `${exportDay(first.date)} to ${exportDay(last.date)}`) : '';
  L.push(`**Status:** ${stCfg.label} · ${eps.length} episode${eps.length === 1 ? '' : 's'}${range ? ' · ' + range : ''}`);
  if ((story.tags || []).length) L.push(`**Tags:** ${(story.tags || []).slice(0, 10).join(', ')}`);
  if (actors.length) L.push(`**People and groups:** ${actors.slice(0, 12).join(', ')}`);
  L.push('');

  if (story.predictionId) {
    L.push('## Prediction', '');
    const p = x.pred && x.pred.prediction;
    if (!p) L.push('_The evidence could not be loaded when this was exported._', '');
    else {
      L.push(`**Claim:** ${p.statement || story.summary || title}`, '');
      const bits = [];
      if (p.confidence != null) bits.push(`Your confidence: ${p.confidence}%`);
      bits.push(`Status: ${p.status || 'active'}`);
      if (p.resolutionDate) bits.push(`Resolves: ${String(p.resolutionDate).slice(0, 10)}`);
      if (p.resolution && p.resolution.outcome) bits.push(`Outcome: ${p.resolution.outcome === 'yes' ? 'Yes, it happened' : 'No, it did not'}`);
      L.push(bits.join(' · '), '');
      const ev = x.pred.evidence;
      if (ev) {
        const lean = { closer: 'toward TRUE', further: 'toward FALSE', mixed: 'mixed', none: 'no clear lean yet' }[ev.direction] || '';
        L.push(`**Evidence balance:** ${ev.score != null ? (ev.score > 0 ? '+' : '') + ev.score : ''} ${lean ? '(' + lean + (ev.strength && ev.strength !== 'none' ? ', ' + ev.strength + ' evidence' : '') + ')' : ''}`.trim(), '');
      }
      const links = x.pred.links || [];
      for (const [st, label] of [['supports', 'Supporting evidence'], ['contradicts', 'Contradicting evidence'], ['complicates', 'Complicating evidence']]) {
        const list = links.filter(l => l.stance === st).sort((a, b) => (b.weight || 0) - (a.weight || 0));
        if (!list.length) continue;
        L.push(`### ${label} (${list.length})`, '');
        for (const l of list) {
          const it = l.item || {};
          L.push(`- ${mdLink(it.title || 'Untitled', it.url)}${it.source ? ' · ' + it.source : ''} · weight ${Number(l.weight) || 0}${l.reason ? '\n  - ' + clipTxt(l.reason, 300) : ''}`);
        }
        L.push('');
      }
    }
  }

  L.push('## Timeline', '');
  if (!eps.length) L.push('_No episodes tracked yet._', '');
  for (const ep of eps) {
    L.push(`### ${exportDay(ep.date)} · ${episodeKind(ep)}: ${ep.headline || 'Untitled episode'}`, '');
    if (ep.summary) L.push(ep.summary, '');
    if (ep.framingNote) L.push(...String(ep.framingNote).split('\n').map(l => `> _${l}_`), '');
    const links = [];
    if (Array.isArray(ep.sourceLinks) && ep.sourceLinks.length) ep.sourceLinks.forEach(s => s && s.url && links.push(mdLink(s.title || s.url, s.url)));
    else if (ep.sourceUrl) links.push(mdLink('Read the original', ep.sourceUrl));
    if (ep.videoUrl) links.push(mdLink('Watch', ep.videoUrl));
    if (ep.audioUrl) links.push(mdLink('Listen', ep.audioUrl));
    if (links.length) L.push(links.join(' · '), '');
  }

  if (x.related && x.related.length) L.push('## Related stories', '', ...x.related.map(n => x.vault ? `- [[${n}]]` : `- ${n}`), '');

  if (x.articles && x.articles.length) {
    L.push('## Saved articles', '');
    for (const a of x.articles) {
      const d = a.doc || {};
      if (x.vault) L.push(`- [[${a.name}]]${d.site ? ' · ' + d.site : ''}`);
      else {
        L.push(`### ${d.title || a.name}`, '', [d.site, d.byline, d.publishedAt ? exportDay(d.publishedAt) : ''].filter(Boolean).join(' · ') + (d.url ? `${d.site || d.byline || d.publishedAt ? ' · ' : ''}${mdLink('source', d.url)}` : ''), '', demote(d.text), '');
      }
    }
    if (x.vault) L.push('');
  }

  if (x.podcasts && x.podcasts.length) {
    L.push('## Podcast episodes', '');
    for (const p of x.podcasts) {
      const it = p.item || {};
      L.push(x.vault ? `### [[${p.name}]]` : `### ${it.title || p.name}${it.podcastTitle ? ' · ' + it.podcastTitle : ''}`, '');
      const meta = [it.podcastTitle, it.date ? exportDay(it.date) : '', it.duration ? exportClock(it.duration) + ' long' : '', it.url ? mdLink('episode page', it.url) : '', it.audioUrl ? mdLink('audio', it.audioUrl) : ''].filter(Boolean);
      if (meta.length) L.push(meta.join(' · '), '');
      const secs = (p.sections && p.sections.sections) || [];
      if (secs.length) {
        L.push('**Key moments for this story:**', '');
        for (const s of secs) L.push(`- **${exportClock(s.start)}–${exportClock(s.end)}**${s.why ? ' — ' + s.why : ''}`, `  > ${clipTxt(s.text, 420)}`);
        L.push('');
      } else L.push('_Transcribed, but key moments were not analysed for this story. Open the episode\'s Key moments in Lateral to do that._', '');
      if (!x.vault && p.transcript) L.push(...transcriptLines(p.transcript), '');
    }
  }
  return L.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

// A transcript as readable paragraphs: five segments each, led by the time of the first.
function transcriptLines(doc) {
  const segs = (doc && doc.segments) || [];
  const out = ['**Transcript**', ''];
  for (let i = 0; i < segs.length; i += 5) {
    const chunk = segs.slice(i, i + 5);
    out.push(`**[${exportClock(chunk[0].s)}]** ${chunk.map(c => c.t).join(' ')}`, '');
  }
  return out;
}

function articleNote(name, doc, storyNames) {
  const d = doc || {};
  const L = ['---', `title: ${yamlStr(d.title || name)}`, 'type: lateral-article', ...(d.url ? [`source: ${yamlStr(d.url)}`] : []), ...(d.site ? [`site: ${yamlStr(d.site)}`] : []),
    ...(d.byline ? [`author: ${yamlStr(d.byline)}`] : []), ...(d.publishedAt ? [`published: ${yamlStr(exportDay(d.publishedAt))}`] : []), 'tags: ["lateral", "article"]', '---', '',
    `# ${d.title || name}`, '', [d.site, d.byline, d.publishedAt ? exportDay(d.publishedAt) : ''].filter(Boolean).join(' · ') + (d.url ? `${d.site || d.byline || d.publishedAt ? ' · ' : ''}${mdLink('original', d.url)}` : ''), ''];
  if (storyNames && storyNames.length) L.push(`From: ${storyNames.map(n => `[[${n}]]`).join(', ')}`, '');
  L.push(demote(d.text), '');
  return L.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

function podcastNote(name, item, transcript, storyNames) {
  const it = item || {};
  const L = ['---', `title: ${yamlStr(it.title || name)}`, 'type: lateral-podcast', ...(it.podcastTitle ? [`show: ${yamlStr(it.podcastTitle)}`] : []), ...(it.date ? [`date: ${yamlStr(exportDay(it.date))}`] : []),
    ...(it.url ? [`source: ${yamlStr(it.url)}`] : []), 'tags: ["lateral", "podcast"]', '---', '', `# ${it.title || name}`, ''];
  const meta = [it.podcastTitle, it.duration ? exportClock(it.duration) + ' long' : '', it.url ? mdLink('episode page', it.url) : '', it.audioUrl ? mdLink('audio', it.audioUrl) : ''].filter(Boolean);
  if (meta.length) L.push(meta.join(' · '), '');
  if (storyNames && storyNames.length) L.push(`From: ${storyNames.map(n => `[[${n}]]`).join(', ')}`, '');
  if (transcript) L.push(...transcriptLines(transcript), '');
  else L.push('_Transcript not included in this export._', '');
  return L.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

// data: { predMap, articles:{[storyId]:[{key,…}]}, docs:{[key]:doc}, podcasts:{[storyId]:[{item,sections,transcript}]}, library:[{key,…}] }
// -> { files:[{name,text}] } for the vault, or { text } for the single file.
function buildExport(picked, data, opts, format) {
  const vault = format === 'vault';
  const used = new Set(), storyName = {}, articleName = {}, podName = {};
  for (const s of picked) storyName[s.id] = exportNoteName(storyTitleOf(s), used, 'Story');
  const rel = relatedStories(picked);
  const articleStories = {}, podStories = {};
  const artFor = id => (opts.articles ? (data.articles[id] || []) : []);
  const podFor = id => (opts.podcasts ? (data.podcasts[id] || []) : []);
  for (const s of picked) {
    for (const a of artFor(s.id)) if (data.docs[a.key]) { (articleStories[a.key] = articleStories[a.key] || []).push(storyName[s.id]); }
    for (const p of podFor(s.id)) (podStories[p.item.key] = podStories[p.item.key] || []).push(storyName[s.id]);
  }
  const names = (map, key, title, fallback) => map[key] || (map[key] = exportNoteName(title, used, fallback));
  const blocks = [];
  const files = [];
  for (const s of picked) {
    const articles = artFor(s.id).filter(a => data.docs[a.key]).map(a => ({ name: names(articleName, a.key, data.docs[a.key].title || a.title, 'Article'), doc: data.docs[a.key] }));
    const podcasts = podFor(s.id).map(p => ({ name: names(podName, p.item.key, p.item.title, 'Podcast'), item: p.item, sections: p.sections, transcript: opts.transcripts ? p.transcript : null, transcribed: true }));
    const md = storyMarkdown(s, { vault, pred: data.predMap[s.id], articles, podcasts, related: (rel[s.id] || []).map(id => storyName[id]), opts });
    if (vault) files.push({ name: `Lateral/Stories/${storyName[s.id]}.md`, text: md });
    else blocks.push(md);
  }
  const seenArticle = new Set(), seenPod = new Set();
  const libraryItems = opts.articles && opts.library ? (data.library || []).filter(a => data.docs[a.key] && !articleStories[a.key]) : [];
  if (vault) {
    for (const key of Object.keys(articleStories)) if (!seenArticle.has(key)) { seenArticle.add(key); files.push({ name: `Lateral/Articles/${articleName[key]}.md`, text: articleNote(articleName[key], data.docs[key], articleStories[key]) }); }
    for (const a of libraryItems) { const n = names(articleName, a.key, data.docs[a.key].title || a.title, 'Article'); files.push({ name: `Lateral/Library/${n}.md`, text: articleNote(n, data.docs[a.key], []) }); }
    for (const s of picked) for (const p of podFor(s.id)) { const key = p.item.key; if (seenPod.has(key)) continue; seenPod.add(key); files.push({ name: `Lateral/Podcasts/${podName[key]}.md`, text: podcastNote(podName[key], p.item, opts.transcripts ? p.transcript : null, podStories[key]) }); }
    const day = new Date().toISOString().slice(0, 10);
    files.unshift({ name: 'Lateral/Lateral Index.md', text: ['---', 'type: lateral-index', `exported: ${yamlStr(day)}`, 'tags: ["lateral"]', '---', '', '# Lateral export', '', `Exported ${day}: ${picked.length} stor${picked.length === 1 ? 'y' : 'ies'}.`, '', '## Stories', '',
      ...picked.map(s => `- [[${storyName[s.id]}]]${s.summary ? ' — ' + clipTxt(s.summary, 140) : ''}`), ''].join('\n') });
    return { files };
  }
  if (libraryItems.length) {
    blocks.push(['# Library: other saved articles', '', ...libraryItems.flatMap(a => { const d = data.docs[a.key]; return [`## ${d.title || a.title || 'Article'}`, '', [d.site, d.byline, d.publishedAt ? exportDay(d.publishedAt) : ''].filter(Boolean).join(' · ') + (d.url ? ` · ${mdLink('source', d.url)}` : ''), '', demote(d.text), '']; })].join('\n').replace(/\n{3,}/g, '\n\n') + '\n');
  }
  const head = `<!-- Exported from Lateral on ${new Date().toISOString().slice(0, 10)}: ${picked.length} stor${picked.length === 1 ? 'y' : 'ies'} -->\n\n`;
  return { text: head + blocks.join('\n\n---\n\n') };
}
// </export-pure>

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// Gathers what the chosen options need from the server. Anything that cannot be fetched is skipped, never fatal.
async function collectExportData(picked, opts, say) {
  const data = { predMap: {}, articles: {}, docs: {}, podcasts: {}, library: [], counts: { articles: 0, episodes: 0 } };
  const getJ = async url => { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch { return null; } };
  say('Reading predictions…');
  data.predMap = await fetchPredictionShareData(picked).catch(() => ({}));
  if (opts.articles) {
    say('Reading saved articles…');
    for (const s of picked) data.articles[s.id] = ((await getJ(`/api/lateral/archive/list?storyId=${encodeURIComponent(s.id)}&limit=300`)) || {}).items || [];
    let keys = [...new Set(Object.values(data.articles).flat().map(a => a.key))];
    if (opts.library) {
      data.library = ((await getJ('/api/lateral/archive/list?limit=500')) || {}).items || [];
      keys = [...new Set([...keys, ...data.library.map(a => a.key)])];
    }
    let done = 0;
    const queue = keys.slice();
    await Promise.all(Array.from({ length: 4 }, async () => {
      while (queue.length) {
        const key = queue.shift();
        const doc = await getJ(`/api/lateral/archive/get?key=${encodeURIComponent(key)}`);
        if (doc && doc.text) data.docs[key] = doc;
        say(`Reading saved articles… ${++done}/${keys.length}`);
      }
    }));
    data.counts.articles = Object.keys(data.docs).length;
  }
  if (opts.podcasts) {
    say('Reading podcast transcripts…');
    for (const s of picked) {
      const list = ((await getJ(`/api/lateral/podcast/list?storyId=${encodeURIComponent(s.id)}`)) || {}).items || [];
      const topic = encodeURIComponent(storyRelevanceCtx(s).topic);
      data.podcasts[s.id] = [];
      for (const item of list) {
        const sections = await getJ(`/api/lateral/podcast/sections?key=${item.key}&topic=${topic}`);
        const transcript = opts.transcripts ? await getJ(`/api/lateral/podcast/transcript?key=${item.key}`) : null;
        data.podcasts[s.id].push({ item, sections: sections && sections.state === 'done' ? sections : null, transcript });
        data.counts.episodes++;
      }
    }
  }
  return data;
}

function ExportModal({ stories, onClose }) {
  const candidates = (stories || []).filter(s => (s.episodes || []).length > 0);
  const [selected, setSelected] = useState(() => new Set(candidates.map(s => s.id)));
  const saved = (() => { try { return JSON.parse(localStorage.getItem('lateral-export-v1') || '{}'); } catch { return {}; } })();
  const [format, setFormat] = useState(['pdf', 'md', 'vault'].includes(saved.format) ? saved.format : 'pdf');
  const [opts, setOpts] = useState({ articles: !!saved.articles, podcasts: !!saved.podcasts, transcripts: !!saved.transcripts, library: !!saved.library });
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState('');
  useEffect(() => { try { localStorage.setItem('lateral-export-v1', JSON.stringify({ format, ...opts })); } catch {} }, [format, opts]);

  const toggle = id => setSelected(prev => { const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); return next; });
  const setOpt = (k, v) => setOpts(o => ({ ...o, [k]: v, ...(k === 'podcasts' && !v ? { transcripts: false } : {}), ...(k === 'articles' && !v ? { library: false } : {}) }));
  const picked = candidates.filter(s => selected.has(s.id));
  const fmt = EXPORT_FORMATS.find(f => f.id === format);

  async function runPdf() {
    // Open the tab inside the click (pop-up blockers), then fetch prediction evidence before building the page.
    const win = window.open('', '_blank');
    if (!win) throw new Error('Pop-up blocked. Allow pop-ups and try again.');
    try {
      const predMap = await fetchPredictionShareData(picked);
      const url = URL.createObjectURL(new Blob([buildMultiStoryShareHtml(picked, predMap)], { type: 'text/html' }));
      win.location.href = url;
      setTimeout(() => URL.revokeObjectURL(url), 120000);
    } catch (e) { try { win.close(); } catch {} throw e; }
    return `✓ Opened ${picked.length} stor${picked.length === 1 ? 'y' : 'ies'} in a new tab. Click Download PDF there.`;
  }
  async function runFile() {
    const data = await collectExportData(picked, opts, setStatus);
    setStatus('Building…');
    const built = buildExport(picked, data, opts, format);
    const base = picked.length === 1 ? safeFileToken(storyTitleOf(picked[0]), 'story') : `lateral-export-${new Date().toISOString().slice(0, 10)}`;
    if (format === 'vault') downloadBlob(makeZip(built.files), `${base}.zip`);
    else downloadBlob(new Blob([built.text], { type: 'text/markdown;charset=utf-8' }), `${base}.md`);
    const extra = [data.counts.articles ? `${data.counts.articles} saved article${data.counts.articles === 1 ? '' : 's'}` : '', data.counts.episodes ? `${data.counts.episodes} podcast episode${data.counts.episodes === 1 ? '' : 's'}` : ''].filter(Boolean).join(' and ');
    return `✓ Saved ${format === 'vault' ? `${built.files.length} notes` : 'one Markdown file'} for ${picked.length} stor${picked.length === 1 ? 'y' : 'ies'}${extra ? ' with ' + extra : ''}.`;
  }
  async function runExport() {
    if (!picked.length || busy) return;
    setBusy(true); setStatus(format === 'pdf' ? 'Building PDF…' : 'Gathering…');
    try { setStatus(format === 'pdf' ? await runPdf() : await runFile()); }
    catch (e) { setStatus(`Failed: ${e.message || 'export failed'}`); }
    finally { setBusy(false); }
  }

  const sectionHead = { fontSize: 10, fontWeight: 800, color: C.textMute, textTransform: 'uppercase', letterSpacing: '0.07em', margin: '12px 0 6px' };
  const check = (label, key, hintText, disabled) => (
    <label style={{display:'flex',alignItems:'flex-start',gap:9,fontSize:12.5,color:disabled ? C.textMute : C.textMid,lineHeight:1.45,cursor:disabled ? 'default' : 'pointer',padding:'3px 0',opacity:disabled ? 0.55 : 1}}>
      <input type="checkbox" checked={!!opts[key] && !disabled} disabled={disabled} onChange={e => setOpt(key, e.target.checked)} style={{marginTop:3}}/>
      <span>{label}{hintText && <span style={{display:'block',fontSize:11.5,color:C.textMute}}>{hintText}</span>}</span>
    </label>
  );
  return (
    <Modal title="Export" onClose={onClose} maxWidth={720}>
      <div style={{...sectionHead,marginTop:0}}>1 · What to export</div>
      <div style={{display:'flex',gap:8,marginBottom:8}}>
        <Btn variant="ghost" onClick={() => setSelected(new Set(candidates.map(s => s.id)))} style={{padding:'6px 10px',fontSize:11.5}}>Select all</Btn>
        <Btn variant="ghost" onClick={() => setSelected(new Set())} style={{padding:'6px 10px',fontSize:11.5}}>Clear</Btn>
        <span style={{marginLeft:'auto',alignSelf:'center',fontSize:11.5,color:C.textMute}}>{picked.length} of {candidates.length} selected</span>
      </div>
      <div style={{border:`1px solid ${C.border}`,borderRadius:10,maxHeight:230,overflowY:'auto',padding:6}}>
        {candidates.length === 0 ? (
          <div style={{fontSize:12,color:C.textMute,padding:10}}>No tracked stories with episodes yet.</div>
        ) : candidates.map(s => {
          const on = selected.has(s.id);
          return (
            <label key={s.id} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'7px 8px',borderRadius:8,cursor:'pointer',background:on ? C.borderLight : 'transparent'}}>
              <input type="checkbox" checked={on} onChange={() => toggle(s.id)} style={{marginTop:2}}/>
              <div style={{minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:C.text,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{storyTitleOf(s)}</div>
                <div style={{fontSize:11.5,color:C.textMute}}>{s.predictionId ? 'Prediction · ' : ''}{(s.episodes || []).length} episode{(s.episodes || []).length === 1 ? '' : 's'} · updated {fmtS(s.updatedAt || s.createdAt)}</div>
              </div>
            </label>
          );
        })}

function BriefBulletList({ items, color, linkWiki = false }) {
  if (!items?.length) return null;
  const wikiFromItem = (item) => {
    const text = String(typeof item === 'object' ? (item?.name || '') : (item || '')).trim();
    if (!text) return '';
    const base = text.split(/\s[—-]\s|\s\|\s|,\s+/)[0].trim();
    const cleaned = base.replace(/^(the|a|an)\s+/i, '').trim();
    if (!cleaned || cleaned.length < 2) return '';
    return `https://en.wikipedia.org/w/index.php?search=${encodeURIComponent(cleaned)}`;
  };
  return (
    <ul className="brief-list" style={{margin:'0 0 0 2px',padding:0,listStyle:'none'}}>
      {items.map((item,i) => (
        <li key={i} style={{display:'flex',gap:7,marginBottom:5,fontSize:12.5,color:C.text,lineHeight:1.5}}>
          <span style={{color:color||C.accent,flexShrink:0,marginTop:2}}>›</span>
          {(() => {
            const label = typeof item==='object'?`${item.name} — ${item.role||item.connection||''}`:String(item||'');
            const wiki = linkWiki ? wikiFromItem(item) : '';
            if (!wiki) return <span>{label}</span>;
            return (
              <a href={wiki} target="_blank" rel="noopener noreferrer" style={{color:C.text,textDecoration:'underline',textDecorationColor:C.accent}}>
                {label}
              </a>
            );
          })()}
        </li>
      ))}
    </ul>
  );
}

function BriefModal({ stories, settings, onClose }) {
  const cachedBrief = loadBrief();
  const [phase, setPhase]   = useState(cachedBrief ? 'ready' : 'generating'); // generating | ready | error
  const [progress, setProgress] = useState('');
  const [storyBriefs, setStoryBriefs] = useState(() => cachedBrief?.storyBriefs || []);  // [{story, brief}]
  const [crossBrief, setCrossBrief]   = useState(() => cachedBrief?.crossBrief || null);
  const [execSummary, setExecSummary] = useState(() => cachedBrief?.execSummary || '');
  const [generatedAt, setGeneratedAt] = useState(() => cachedBrief?.generatedAt || '');
  const [errMsg, setErrMsg] = useState('');
  const genElapsedMs = useBusyElapsed(phase === 'generating');

  function applyBriefPayload(payload) {
    const p = payload || {};
    setExecSummary(String(p.execSummary || ''));
    setStoryBriefs(Array.isArray(p.storyBriefs) ? p.storyBriefs : []);
    setCrossBrief(p.crossBrief || null);
    setGeneratedAt(String(p.generatedAt || ''));
  }

  async function runGeneration({ force = true } = {}) {
    setPhase('generating');
    setErrMsg('');
    setStoryBriefs([]);
    setCrossBrief(null);
    setExecSummary('');
    try {
      const active = stories.filter(isActiveStoryForWork);
      if (active.length === 0) { setErrMsg('No active stories with episodes to brief.'); setPhase('error'); return; }
      let startedJobId = '';
      try {
        const started = await startIntelligenceJob({ scope: 'home', stories: active, settings, force: !!force });
        startedJobId = String(started?.job?.id || '');
      } catch (e) {
        if (e?.status !== 409) throw e;
        const activeJob = e?.payload?.activeJob || null;
        if (activeJob?.id && String(activeJob?.scope || '') === 'home') {
          startedJobId = String(activeJob.id);
          setProgress(activeJob?.progress || 'Another home intelligence process is already in progress and should complete soon.');
        } else {
          throw new Error(e?.payload?.error || 'Another intelligence process is already in progress and should complete soon.');
        }
      }
      await waitForIntelligenceJob({
        scope: 'home',
        expectedJobId: startedJobId,
        onProgress: (job) => {
          if (job?.progress) setProgress(job.progress);
        }
      });
      await syncServerCacheToLocal().catch(() => {});
      const fresh = loadBrief();
      if (!fresh || !Array.isArray(fresh.storyBriefs) || fresh.storyBriefs.length === 0) {
        throw new Error('No home brief available after generation.');
      }
      applyBriefPayload(fresh);
      setPhase('ready');
    } catch(e) {
      setErrMsg(e.message);
      setPhase('error');
    }
  }

  useEffect(() => {
    const activeStories = stories.filter(isActiveStoryForWork);
    const activeIds = new Set(activeStories.map(s => String(s.id || '')).filter(Boolean));
    const cachedIds = new Set(
      (Array.isArray(cachedBrief?.storyBriefs) ? cachedBrief.storyBriefs : [])
        .map(sb => String(sb?.story?.id || ''))
        .filter(Boolean)
    );
    const cacheMatchesActiveStories =
      activeIds.size === cachedIds.size &&
      [...activeIds].every(id => cachedIds.has(id));

    // If cache is missing, or story membership changed (deleted/resolved/reopened),
    // regenerate so the brief tracks the current active set exactly.
    if (!cachedBrief || !cacheMatchesActiveStories) {
      runGeneration({ force: true });
      return;
    }
    applyBriefPayload(cachedBrief);
  }, []);

  // ── Render loading
  if (phase === 'generating') {
    return (
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
        <div style={{background:C.surface,borderRadius:14,padding:'40px 44px',maxWidth:420,width:'90%',textAlign:'center',boxShadow:'0 24px 60px rgba(0,0,0,0.18)'}}>
          <div style={{fontSize:16,fontWeight:800,color:C.text,marginBottom:8}}>Generating Brief</div>
          <div style={{marginBottom:18}}>
            <BusyInline label={progress || 'Searching…'} elapsedMs={genElapsedMs} />
          </div>
          {storyBriefs.length > 0 && (
            <div style={{display:'flex',gap:6,flexWrap:'wrap',justifyContent:'center',marginBottom:20}}>
              {storyBriefs.map(({story})=>(
                <span key={story.id} style={{fontSize:10,fontWeight:700,color:'#059669',background:'#d1fae5',padding:'2px 8px',borderRadius:5}}>✓ {story.title.slice(0,24)}{story.title.length>24?'…':''}</span>
              ))}
            </div>
          )}
          <div style={{fontSize:11,color:C.textMute,marginTop:6}}>You can continue using Lateral while this runs.</div>
          <div style={{marginTop:14,display:'flex',gap:16,justifyContent:'center',alignItems:'center'}}>
            <button onClick={onClose} style={{fontSize:11,color:C.textMute,background:'none',border:'none',cursor:'pointer'}}>Run in background</button>
            <button onClick={async () => {
              await cancelIntelligenceJob({ scope: 'home' }).catch(() => {});
              onClose();
            }} style={{fontSize:11,color:'#dc2626',background:'none',border:'none',cursor:'pointer'}}>Cancel</button>
          </div>
        </div>
      </div>
    );
  }

  // ── Render error
  if (phase === 'error') {
    return (
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
        <div style={{background:C.surface,borderRadius:14,padding:36,maxWidth:380,width:'90%',textAlign:'center'}}>
          <div style={{fontSize:13,color:'#dc2626',marginBottom:16}}>{errMsg||'Brief generation failed.'}</div>
          <Btn onClick={onClose}>Close</Btn>
        </div>
      </div>
    );
  }

  // ── Render full brief
  const briefDate = new Date(generatedAt || Date.now()).toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const globalSpeechText = buildGlobalBriefSpeechText({ execSummary, storyBriefs, crossBrief });

  function printBrief() {
    const el = document.getElementById('brief-modal-inner');
    if (!el) return;

    // Use outerHTML so #brief-modal-inner exists in the print doc and CSS can target it
    const html = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lateral Brief — ${briefDate}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #fff; color: #1a1714;
    }
    /* Strip modal chrome — !important overrides inline React styles */
    button { display: none !important; }
    #brief-modal-inner {
      position: static !important;
      display: block !important;
      width: 100% !important;
      max-height: none !important;
      height: auto !important;
      overflow: visible !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      background: #fff !important;
    }
    .brief-header {
      padding: 0 0 18px !important;
      border-bottom: 2px solid #1a1714 !important;
      margin-bottom: 24px;
    }
    .brief-body {
      overflow-y: visible !important;
      max-height: none !important;
      flex: none !important;
      height: auto !important;
      padding: 0 !important;
    }
    .brief-story-section { page-break-inside: avoid; }
    .brief-cross-section { page-break-before: always; }
    @page { margin: 1.5cm 2cm; size: A4; }
  </style>
</head>
<body>
  ${getExportLogoHtml('Multi-Story Intelligence Brief')}
  ${el.outerHTML}
</body>
</html>`;

    // Blob URL: browser loads it as a real document — no document.write() timing issues
    const blob = new Blob([html], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    const win  = window.open(url, '_blank');
    if (!win) { URL.revokeObjectURL(url); return; }
    win.addEventListener('load', () => {
      setTimeout(() => {
        win.print();
        win.addEventListener('afterprint', () => { win.close(); URL.revokeObjectURL(url); });
      }, 200);
    });
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
      <div id="brief-modal-inner" style={{background:C.surface,borderRadius:14,width:'min(860px,96vw)',maxHeight:'92vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 60px rgba(0,0,0,0.2)',overflow:'hidden'}}>

        {/* ── Header bar */}
        <div className="brief-header" style={{padding:'16px 24px',borderBottom:`1px solid ${C.borderLight}`,display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
          <div style={{flex:1}}>
            <div style={{fontSize:17,fontWeight:900,color:C.text,letterSpacing:'-0.3px'}}>LATERAL BRIEF</div>
            <div style={{fontSize:11,color:C.textMute,marginTop:1}}>{briefDate}</div>
          </div>
          <button onClick={printBrief} title="Print / Export PDF"
            style={{padding:'6px 14px',borderRadius:7,background:C.accent,color:'#fff',border:'none',fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em'}}>
            ⬡ Export PDF
          </button>
          <button
            onClick={() => runGeneration({ force: true })}
            title="Regenerate brief"
            style={{padding:'6px 12px',borderRadius:7,background:C.surface,color:C.accent,border:`1.5px solid ${C.accent}`,fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em'}}
          >
            ↻ Regenerate
          </button>
          <TTSButton
            text={globalSpeechText}
            settings={settings}
            label="Read brief"
            title="Read full brief aloud"
            style={{fontSize:12,padding:'6px 10px',borderRadius:7}}
          />
          <button onClick={onClose} style={{border:'none',background:'none',fontSize:20,cursor:'pointer',color:C.textMute,lineHeight:1,padding:'2px 6px'}}>×</button>
        </div>

        {/* ── Scrollable body */}
        <div className="brief-body" style={{overflowY:'auto',padding:'22px 28px',flex:1}}>
          <BriefContent execSummary={execSummary} storyBriefs={storyBriefs} crossBrief={crossBrief} isGlobal={true}/>
        </div>
      </div>
    </div>
  );
}

  const isDragging                  = useRef(false);
  const lastPos                     = useRef(null);
  const containerRef                = useRef(null);
  const svgRef                      = useRef(null);

  const selStories = stories.filter(s=>sel.has(s.id));
  const tagMeta = useMemo(() => buildSpiderTagMeta(selStories), [selStories]);
  const playerMeta = useMemo(() => buildSpiderPlayerMeta(selStories), [selStories]);
  const activeTagNorm = normalizeMapTag(activeTag);
  const activePlayerNorm = normalizeMapPerson(activePlayer);
  const focusActive = !!(activeTagNorm || activePlayerNorm);
  const filteredGroupedExtraTags = useMemo(() => {
    const q = normalizeMapTag(tagSearch);
    const source = tagMeta.groupedExtraTags || {};
    if (!q) return source;
    const out = {};
    Object.entries(source).forEach(([group, items]) => {
      const keep = items.filter(it => it.tag.includes(q));
      if (keep.length) out[group] = keep;
    });
    return out;
  }, [tagMeta.groupedExtraTags, tagSearch]);
  const orderedExtraGroups = useMemo(() => (
    Object.entries(filteredGroupedExtraTags).sort((a, b) => {
      if (a[0] === 'Other') return 1;
      if (b[0] === 'Other') return -1;
      return a[0].localeCompare(b[0]);
    })
  ), [filteredGroupedExtraTags]);
  const filteredGroupedExtraPlayers = useMemo(() => {
    const q = normalizeMapPerson(playerSearch);
    const source = playerMeta.groupedExtraPlayers || {};
    if (!q) return source;
    const out = {};
    Object.entries(source).forEach(([group, items]) => {
      const keep = items.filter(it => it.norm.includes(q) || it.label.toLowerCase().includes(q));
      if (keep.length) out[group] = keep;
    });
    return out;
  }, [playerMeta.groupedExtraPlayers, playerSearch]);
  const orderedExtraPlayerGroups = useMemo(() => (
    Object.entries(filteredGroupedExtraPlayers).sort((a, b) => {
      if (a[0] === 'Other') return 1;
      if (b[0] === 'Other') return -1;
      return a[0].localeCompare(b[0]);
    })
  ), [filteredGroupedExtraPlayers]);

  const nodeHasTag = n => {
    if (!activeTagNorm) return true;
    if (!n) return false;
    if (n.type === 'story') return !!tagMeta.storyTagSets[n.story.id]?.has(activeTagNorm);
    if (n.type === 'episode') {
      return !!tagMeta.epTagSets[n.ep.id]?.has(activeTagNorm) || !!tagMeta.storyTagSets[n.storyId]?.has(activeTagNorm);
    }
    return false;
  };
  const nodeHasPlayer = n => {
    if (!activePlayerNorm) return true;
    if (!n) return false;
    if (n.type === 'story') return !!playerMeta.storyPlayerSets[n.story.id]?.has(activePlayerNorm);
    if (n.type === 'episode') {
      return !!playerMeta.epPlayerSets[n.ep.id]?.has(activePlayerNorm) || !!playerMeta.storyPlayerSets[n.storyId]?.has(activePlayerNorm);
    }
    return false;
  };
  const nodeMatchesFocus = n => nodeHasTag(n) && nodeHasPlayer(n);

  const edgeHasTag = e => {
    if (!focusActive) return true;
    const s = mapData.nodes.find(n => n.id === e.source);
    const t = mapData.nodes.find(n => n.id === e.target);
    return nodeMatchesFocus(s) || nodeMatchesFocus(t);
  };

  function goToMap() {
    const md = buildMapData(selStories, loadBrief());
    setMapData(md);
    setActiveTag('');
    setActivePlayer('');
    setShowAllTags(false);
    setShowAllPlayers(false);
    setTagSearch('');
    setPlayerSearch('');
    setOpenTagGroups({});
    setOpenPlayerGroups({});
    // Auto-fit initial view to node extents
    if (md.nodes.length) {
      const pad = 90;
      const xs = md.nodes.map(n => n.x), ys = md.nodes.map(n => n.y);
      const minX = Math.min(...xs)-pad, maxX = Math.max(...xs)+pad;
      const minY = Math.min(...ys)-pad, maxY = Math.max(...ys)+pad;
      const bw = maxX-minX, bh = maxY-minY;
      const vw = window.innerWidth, vh = window.innerHeight-50;
      const s = Math.min(1.1, Math.max(0.18, Math.min(vw/bw, vh/bh) * 0.82));
      const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
      setPz({ x: -cx*s, y: -cy*s, s });
    } else {
      setPz({x:0,y:0,s:1});
    }
    setPhase('map');
  }

  // Wheel zoom centered on cursor
  useEffect(()=>{
    if(phase!=='map') return;
    const el=containerRef.current; if(!el) return;
    const h=(e)=>{
      e.preventDefault();
      const f=e.deltaY<0?1.12:0.88;
      const rect=el.getBoundingClientRect();
      const ox=e.clientX-rect.left-rect.width/2;
      const oy=e.clientY-rect.top-rect.height/2;
      setPz(p=>{ const ns=Math.max(0.2,Math.min(5,p.s*f)); const r=ns/p.s;
        return {x:ox+(p.x-ox)*r, y:oy+(p.y-oy)*r, s:ns}; });
    };
    el.addEventListener('wheel',h,{passive:false});
    return ()=>el.removeEventListener('wheel',h);
  },[phase]);

  function onPD(e){
    if (e.button !== 0) return;
    if (!Number.isFinite(e.clientX) || !Number.isFinite(e.clientY)) return;
    isDragging.current = true;
    setIsPanning(true);
    lastPos.current = { x:e.clientX, y:e.clientY };
    try { containerRef.current?.setPointerCapture?.(e.pointerId); } catch {}
  }
  function onPM(e){
    if (!isDragging.current || !lastPos.current) return;
    if (!Number.isFinite(e.clientX) || !Number.isFinite(e.clientY)) return;
    const dx = e.clientX - lastPos.current.x;
    const dy = e.clientY - lastPos.current.y;
    if (!Number.isFinite(dx) || !Number.isFinite(dy)) return;
    setPz(p => ({ ...p, x: p.x + dx, y: p.y + dy }));
    lastPos.current = { x:e.clientX, y:e.clientY };
  }
  function onPU(e){
    isDragging.current = false;
    setIsPanning(false);
    lastPos.current = null;
    try { containerRef.current?.releasePointerCapture?.(e.pointerId); } catch {}
  }

  function exportStamp() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 800);
  }

  function getSerializedMapSvg() {
    const svg = svgRef.current;
    if (!svg) return null;
    const rect = svg.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    clone.setAttribute('width', String(w));
    clone.setAttribute('height', String(h));
    clone.setAttribute('viewBox', `0 0 ${w} ${h}`);
    materializeSvgThemeVars(clone);
    addMapExportLogo(clone, w, h);
    const markup = `<?xml version="1.0" encoding="UTF-8"?>\n${new XMLSerializer().serializeToString(clone)}`;
    return { markup, width: w, height: h };
  }

  function exportMapSvg() {
    const data = getSerializedMapSvg();
    if (!data) return;
    const blob = new Blob([data.markup], { type: 'image/svg+xml;charset=utf-8' });
    downloadBlob(blob, `lateral-spider-map-${exportStamp()}.svg`);
  }

  async function exportMapPng() {
    const data = getSerializedMapSvg();
    if (!data) return;
    const svgBlob = new Blob([data.markup], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    try {
      await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = data.width;
            canvas.height = data.height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = C.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            canvas.toBlob((pngBlob) => {
              if (!pngBlob) return reject(new Error('PNG export failed'));
              downloadBlob(pngBlob, `lateral-spider-map-${exportStamp()}.png`);
              resolve();
            }, 'image/png');
          } catch (err) { reject(err); }
        };
        img.onerror = () => reject(new Error('Could not render map image'));
        img.src = url;
      });
    } catch (err) {
      console.warn('PNG export failed', err);
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function exportMapPdf() {
    const data = getSerializedMapSvg();
    if (!data) return;
    const safeSvg = data.markup.replace(/<\/script/gi, '<\\/script');
    const html = `<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lateral Spider Map</title>
  <style>
    html, body { margin:0; padding:0; background:#fff; }
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .wrap { width:100%; display:flex; align-items:center; justify-content:center; padding:18px; box-sizing:border-box; }
    .wrap svg { max-width:100%; height:auto; display:block; }
    @page { margin: 10mm; }
  </style>
</head>
<body>
  <div class="wrap">${safeSvg}</div>
  <script>window.addEventListener('load',()=>setTimeout(()=>window.print(),120));<\/script>
</body>
</html>`;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if (win) {
      win.addEventListener('afterprint', () => URL.revokeObjectURL(url), { once: true });
      setTimeout(() => URL.revokeObjectURL(url), 120000);
    } else {
      URL.revokeObjectURL(url);
    }
  }

  // ── SELECTION PHASE ─────────────────────────────────────────────────────
  if(phase==='select') return (
    <div style={{position:'fixed',inset:0,background:'rgba(10,8,6,0.5)',backdropFilter:'blur(4px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1100}}>
      <div style={{background:C.surface,borderRadius:16,padding:28,width:'100%',maxWidth:480,boxShadow:'0 24px 64px rgba(0,0,0,0.25)',maxHeight:'80vh',display:'flex',flexDirection:'column'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:800,color:C.text}}>⬡ Spider Map</h3>
          <button onClick={onClose} style={{border:'none',background:'none',fontSize:22,cursor:'pointer',color:C.textMute,lineHeight:1}}>×</button>
        </div>
        <p style={{margin:'0 0 14px',fontSize:12.5,color:C.textMid,lineHeight:1.6}}>Select stories to map. Cross-story connections are drawn from your intelligence brief — generate one first to see lateral links.</p>
        <div style={{overflowY:'auto',flex:1,marginBottom:14,borderTop:`1px solid ${C.borderLight}`}}>
          {stories.map(s=>(
            <label key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 2px',borderBottom:`1px solid ${C.borderLight}`,cursor:'pointer'}}>
              <input type="checkbox" checked={sel.has(s.id)} style={{width:15,height:15,accentColor:C.accent,cursor:'pointer',flexShrink:0}}
                onChange={e=>setSel(prev=>{const n=new Set(prev);e.target.checked?n.add(s.id):n.delete(s.id);return n;})}/>
              <span style={{flex:1,fontSize:13,fontWeight:600,color:C.text,lineHeight:1.3,fontFamily:"'Playfair Display',Georgia,serif"}}>{s.title}</span>
              <span style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
                <span style={{width:7,height:7,borderRadius:'50%',background:ST[s.status]?.dot,display:'inline-block'}}/>
                <span style={{fontSize:11,color:C.textMute}}>{(s.episodes||[]).length} ep</span>
              </span>
            </label>
          ))}
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{display:'flex',gap:10}}>
            <button onClick={()=>setSel(new Set(stories.map(s=>s.id)))} style={{fontSize:11.5,color:C.accent,background:'none',border:'none',cursor:'pointer',fontWeight:700,padding:0}}>All</button>
            <button onClick={()=>setSel(new Set())} style={{fontSize:11.5,color:C.textMute,background:'none',border:'none',cursor:'pointer',fontWeight:600,padding:0}}>None</button>
          </div>
          <Btn onClick={goToMap} disabled={sel.size===0}>Map {sel.size} stor{sel.size===1?'y':'ies'} →</Btn>
        </div>
      </div>
    </div>
  );

  // ── MAP PHASE ────────────────────────────────────────────────────────────
  const { nodes, edges } = mapData;
  const nodeById   = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const crossEdges = edges.filter(e=>e.type!=='ep');
  const totalEps   = selStories.reduce((a,s)=>a+(s.episodes||[]).length,0);
  const safeTooltip = (tooltip && Number.isFinite(tooltip.x) && Number.isFinite(tooltip.y) && typeof tooltip.type === 'string')
    ? tooltip
    : null;
  const episodeNodes = nodes
    .filter(n=>n.type==='episode')
    .sort((a,b)=>(a.id===hoverNodeId?1:0)-(b.id===hoverNodeId?1:0));
  const storyNodes = nodes
    .filter(n=>n.type==='story')
    .sort((a,b)=>(a.id===hoverNodeId?1:0)-(b.id===hoverNodeId?1:0));

  return (
    <div style={{position:'fixed',inset:0,background:C.bg,zIndex:1100,display:'flex',flexDirection:'column',userSelect:'none'}}>

      {/* ── Header ── */}
      <div style={{height:50,flexShrink:0,display:'flex',alignItems:'center',padding:'0 18px',background:C.surface,borderBottom:`1px solid ${C.border}`,gap:14,boxShadow:'0 1px 3px rgba(0,0,0,0.05)'}}>
        <button onClick={()=>setPhase('select')} style={{border:'none',background:'none',fontSize:12,color:C.accent,cursor:'pointer',fontWeight:700,padding:'4px 0',letterSpacing:'0.02em'}}>← Back</button>
        <span style={{fontWeight:900,fontSize:15,color:C.text,fontFamily:"'Playfair Display',Georgia,serif",letterSpacing:'-0.3px'}}>⬡ Spider Map</span>
        <span style={{fontSize:11,color:C.textMute,borderLeft:`1px solid ${C.border}`,paddingLeft:14}}>
          {selStories.length} stor{selStories.length===1?'y':'ies'} · {totalEps} episode{totalEps!==1?'s':''}
          {crossEdges.length>0?` · ${crossEdges.length} connection${crossEdges.length>1?'s':''}` : ''}
        </span>
        <div style={{flex:1}}/>
        {crossEdges.length===0&&(
          <span style={{fontSize:11,color:'#92400e',background:'#fef9c3',padding:'3px 10px',borderRadius:20,fontWeight:600}}>No strong links yet — add more episodes/tags/players</span>
        )}
        <button onClick={()=>setShowAllTags(v=>!v)}
          style={{fontSize:11,color:showAllTags?C.accent:C.textMid,border:`1px solid ${showAllTags?C.accent:C.border}`,background:'none',cursor:'pointer',padding:'4px 11px',borderRadius:6,fontWeight:600,transition:'all 0.15s'}}>
          Tags
        </button>
        <button onClick={()=>setShowAllPlayers(v=>!v)}
          style={{fontSize:11,color:showAllPlayers?C.accent:C.textMid,border:`1px solid ${showAllPlayers?C.accent:C.border}`,background:'none',cursor:'pointer',padding:'4px 11px',borderRadius:6,fontWeight:600,transition:'all 0.15s'}}>
          Players
        </button>
        <button onClick={()=>setShowLegend(v=>!v)}
          style={{fontSize:11,color:showLegend?C.accent:C.textMid,border:`1px solid ${showLegend?C.accent:C.border}`,background:'none',cursor:'pointer',padding:'4px 11px',borderRadius:6,fontWeight:600,transition:'all 0.15s'}}>
          Legend
        </button>
        <div style={{display:'flex',gap:4,alignItems:'center',padding:'3px 5px',borderRadius:8,background:'#c4b5fd',border:'1px solid #a78bfa'}}>
          <button onClick={exportMapSvg}
            style={{fontSize:11,color:'#312e81',border:'1px solid #a78bfa',background:'#ddd6fe',cursor:'pointer',padding:'3px 8px',borderRadius:6,fontWeight:700}}>
            SVG
          </button>
          <button onClick={exportMapPng}
            style={{fontSize:11,color:'#312e81',border:'1px solid #a78bfa',background:'#ddd6fe',cursor:'pointer',padding:'3px 8px',borderRadius:6,fontWeight:700}}>
            PNG
          </button>
          <button onClick={exportMapPdf}
            style={{fontSize:11,color:'#312e81',border:'1px solid #a78bfa',background:'#ddd6fe',cursor:'pointer',padding:'3px 8px',borderRadius:6,fontWeight:700}}>
            PDF
          </button>
        </div>
        <button onClick={onClose} style={{border:'none',background:'none',fontSize:20,cursor:'pointer',color:C.textMute,lineHeight:1,padding:'0 4px'}}>×</button>
      </div>

      {/* ── Canvas ── */}
      <div ref={containerRef} style={{flex:1,overflow:'hidden',cursor:isPanning?'grabbing':'grab',position:'relative'}}
        onPointerDown={onPD} onPointerMove={onPM} onPointerUp={onPU} onPointerCancel={onPU} onLostPointerCapture={onPU}>
        <div data-map-ui="true" style={{position:'absolute',top:12,left:12,zIndex:1150,width:300,maxWidth:'calc(100vw - 24px)'}} onPointerDown={e=>e.stopPropagation()}>
          <div style={{background:`${C.surface}f2`,border:`1px solid ${C.border}`,borderRadius:10,padding:'9px 10px',backdropFilter:'blur(4px)',boxShadow:'0 8px 24px rgba(0,0,0,0.12)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:7}}>
              <div style={{fontSize:11,fontWeight:800,color:C.text,letterSpacing:'0.06em',textTransform:'uppercase'}}>Tag Key</div>
              {activeTagNorm && <button onClick={()=>setActiveTag('')} style={{fontSize:10.5,color:C.accent,border:'none',background:'none',cursor:'pointer',padding:0,fontWeight:700}}>Clear</button>}
            </div>
            {tagMeta.topTags.length===0
              ? <div style={{fontSize:11.5,color:C.textMute}}>No tags available in selected stories.</div>
              : <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {tagMeta.topTags.map(t => {
                    const on = activeTagNorm === t.tag;
                    return (
                      <button key={t.tag} onClick={()=>{ setActiveTag(on?'':t.tag); setActivePlayer(''); }}
                        style={{fontSize:11,padding:'3px 8px',borderRadius:999,border:`1px solid ${on?C.accent:C.border}`,background:on?`${C.accent}22`:'transparent',color:on?C.accent:C.textMid,cursor:'pointer',fontWeight:on?700:600}}>
                        {t.tag} · {t.count}
                      </button>
                    );
                  })}
                </div>}
            {tagMeta.extraTags.length>0 && (
              <button
                onClick={()=>setShowAllTags(v=>!v)}
                style={{marginTop:7,fontSize:10.5,color:C.accent,background:'none',border:'none',padding:0,cursor:'pointer',fontWeight:700}}
              >
                {showAllTags ? 'Hide extra tags' : `+ ${tagMeta.extraTags.length} more tags`}
              </button>
            )}
          </div>
          {showAllTags && tagMeta.extraTags.length>0 && (
            <div style={{marginTop:8,background:`${C.surface}fa`,border:`1px solid ${C.border}`,borderRadius:10,padding:'10px',maxHeight:280,overflowY:'auto',backdropFilter:'blur(3px)',boxShadow:'0 8px 24px rgba(0,0,0,0.12)'}}>
              <input
                value={tagSearch}
                onChange={e=>setTagSearch(e.target.value)}
                placeholder="Search tags…"
                style={{...inputStyle,background:C.bg,padding:'6px 9px',fontSize:11.5,marginBottom:8}}
              />
              {orderedExtraGroups.length===0
                ? <div style={{fontSize:11.5,color:C.textMute}}>No tags match that search.</div>
                : orderedExtraGroups.map(([group, items])=>{
                    const expanded = openTagGroups[group] !== false;
                    return (
                    <div key={group} style={{marginBottom:8}}>
                      <button
                        onClick={()=>setOpenTagGroups(prev=>({ ...prev, [group]: !expanded }))}
                        style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',background:'none',border:'none',padding:0,cursor:'pointer',marginBottom:expanded?5:0}}
                      >
                        <span style={{fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.06em'}}>{group}</span>
                        <span style={{fontSize:10,color:C.textMute}}>{expanded ? '▾' : '▸'}</span>
                      </button>
                      {expanded && (
                        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                          {items.map(t => {
                            const on = activeTagNorm === t.tag;
                            return (
                              <button key={t.tag} onClick={()=>{ setActiveTag(on?'':t.tag); setActivePlayer(''); }}
                                style={{fontSize:10.5,padding:'2px 7px',borderRadius:999,border:`1px solid ${on?C.accent:C.border}`,background:on?`${C.accent}22`:'transparent',color:on?C.accent:C.textMid,cursor:'pointer',fontWeight:on?700:600}}>
                                {t.tag} · {t.count}
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </div>
                    );
                  })}
            </div>
          )}
        </div>
        <div data-map-ui="true" style={{position:'absolute',top:12,right:12,zIndex:1150,width:300,maxWidth:'calc(100vw - 24px)'}} onPointerDown={e=>e.stopPropagation()}>
          <div style={{background:`${C.surface}f2`,border:`1px solid ${C.border}`,borderRadius:10,padding:'9px 10px',backdropFilter:'blur(4px)',boxShadow:'0 8px 24px rgba(0,0,0,0.12)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:7}}>
              <div style={{fontSize:11,fontWeight:800,color:C.text,letterSpacing:'0.06em',textTransform:'uppercase'}}>Key Players</div>
              {activePlayerNorm && <button onClick={()=>setActivePlayer('')} style={{fontSize:10.5,color:C.accent,border:'none',background:'none',cursor:'pointer',padding:0,fontWeight:700}}>Clear</button>}
            </div>
            {playerMeta.topPlayers.length===0
              ? <div style={{fontSize:11.5,color:C.textMute}}>No key players in selected stories.</div>
              : <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {playerMeta.topPlayers.map(p => {
                    const on = activePlayerNorm === p.norm;
                    return (
                      <button key={p.norm} onClick={()=>{ setActivePlayer(on?'':p.norm); setActiveTag(''); }}
                        style={{fontSize:11,padding:'3px 8px',borderRadius:999,border:`1px solid ${on?C.accent:C.border}`,background:on?`${C.accent}22`:'transparent',color:on?C.accent:C.textMid,cursor:'pointer',fontWeight:on?700:600}}>
                        {p.label} · {p.count}
                      </button>
                    );
                  })}
                </div>}
            {playerMeta.extraPlayers.length>0 && (
              <button
                onClick={()=>setShowAllPlayers(v=>!v)}
                style={{marginTop:7,fontSize:10.5,color:C.accent,background:'none',border:'none',padding:0,cursor:'pointer',fontWeight:700}}
              >
                {showAllPlayers ? 'Hide extra players' : `+ ${playerMeta.extraPlayers.length} more players`}
              </button>
            )}
          </div>
          {showAllPlayers && playerMeta.extraPlayers.length>0 && (

// ─── Source color palette (deterministic hash → muted warm color) ────────────
function sourceBlockColor(name) {
  const palette = ['#b07060','#7a96b0','#8aab9a','#9b8ab5','#b8955a','#6fa5a5','#8a9660','#a07880'];
  let h = 0;
  for (let i = 0; i < (name || '').length; i++) h = (h * 31 + (name || '').charCodeAt(i)) & 0xffffffff;
  return palette[Math.abs(h) % palette.length];
}
// Fallback card for articles with no usable image: the source's colour as a soft gradient with a light sheen, so a
// grid with a few misses still looks designed rather than broken.
function shadeHex(hex, amt) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  const c = v => Math.max(0, Math.min(255, Math.round(v + (amt < 0 ? v : 255 - v) * amt)));
  return `rgb(${c((n >> 16) & 255)},${c((n >> 8) & 255)},${c(n & 255)})`;
}
function fallbackGradient(name) {
  const base = sourceBlockColor(name);
  return `linear-gradient(135deg, ${shadeHex(base, 0.12)} 0%, ${base} 45%, ${shadeHex(base, -0.3)} 100%)`;
}
const FALLBACK_SHEEN = { position:'absolute', inset:0, opacity:0.18, pointerEvents:'none',
  backgroundImage:'radial-gradient(circle at 18% 22%, #fff 0, transparent 42%), radial-gradient(circle at 86% 92%, #fff 0, transparent 38%)' };

const AGGREGATOR_DOMAIN_RE = /(^|\.)(news\.google\.com|bing\.com|search\.brave\.com|duckduckgo\.com|startpage\.com|qwant\.com)$/i;
const ENGINE_NAME_RE = /^(bing news|bing|qwant news|yahoo news|google news|wikinews|startpage news|brave\.?news|duckduckgo news)$/i;

function getArticleSourceMeta(article) {
  let sourceDomain = '';
  try {
    sourceDomain = new URL(article.realUrl || article.url || '').hostname.replace(/^www\./, '');
  } catch {}

  let sourceName = '';
  if (article.source) {
    if (typeof article.source === 'string') {
      sourceName = article.source;
    } else {
      sourceName = article.source.name || '';
      if (article.source.domain && (!sourceDomain || AGGREGATOR_DOMAIN_RE.test(sourceDomain))) {
        sourceDomain = String(article.source.domain).replace(/^www\./, '');
      }
    }
  }

  const useDomain = sourceDomain && !AGGREGATOR_DOMAIN_RE.test(sourceDomain);
  let sourceLabel = (useDomain ? sourceDomain : (sourceName || sourceDomain || ''));
  if (!sourceLabel || ENGINE_NAME_RE.test(sourceLabel.trim())) {
    sourceLabel = sourceName || (useDomain ? sourceDomain : '') || '';
  }
  sourceLabel = String(sourceLabel || '').replace(/^www\./, '');
  if (!sourceDomain && sourceLabel.includes('.')) sourceDomain = sourceLabel;
  if (sourceDomain && AGGREGATOR_DOMAIN_RE.test(sourceDomain) && sourceLabel && !sourceLabel.includes('.')) {
    sourceDomain = '';
  }

  return {
    sourceDomain,
    sourceLabel,
    faviconUrl: sourceDomain ? `https://www.google.com/s2/favicons?domain=${sourceDomain}&sz=64` : null,
    sourceInitial: (sourceLabel || sourceDomain || '?').charAt(0).toUpperCase(),
  };
}

function getArticleCardLayout(compact, feature) {
  return {
    mediaHeight: (!compact && feature) ? 188 : 110,
    cardStyle: {
      background: feature ? 'transparent' : C.surface,
      borderRadius: compact ? 8 : (feature ? 0 : 11),
      border: feature ? 'none' : `1px solid ${C.border}`,
      overflow: 'hidden',
      display: 'flex',
      flexDirection: compact ? 'row' : 'column',
      cursor: 'pointer',
      transition: 'box-shadow 0.2s, transform 0.2s',
      textDecoration: 'none',
      color: 'inherit',
      flexShrink: compact ? 0 : undefined,
    },
    bodyPadding: compact ? '8px 10px' : (feature ? '12px 14px' : '10px 12px'),
    bodyGap: compact ? 3 : (feature ? 6 : 5),
    titleSize: compact ? 11.5 : (feature ? 14 : 12.5),
    titleClamp: compact ? 2 : (feature ? 4 : 3),
  };
}

function isSuspiciousArticleImageDimensions(imgEl) {
  const w = Number(imgEl?.naturalWidth || 0);
  const h = Number(imgEl?.naturalHeight || 0);
  if (!w || !h) return true;
  const ratio = w / h;
  // Common icon/sprite signals: very small raster or extreme aspect ratios.
  if (Math.min(w, h) < 90) return true;
  if (w < 220 && h < 140) return true;
  if (ratio > 4.2 || ratio < 0.45) return true;
  return false;
}

function ArticleCard({ article, compact = false, feature = false, hideMedia = false, onTrack, onAddEp, also }) {
  const [imgSrc,  setImgSrc]  = React.useState(article.imageUrl || null);
  const [imgErr,  setImgErr]  = React.useState(false);
  const [favErr,  setFavErr]  = React.useState(false);
  const [added,   setAdded]   = React.useState(false);
  const [recoverTried, setRecoverTried] = React.useState(false);
  const recoveringRef = React.useRef(false);
  const mountedRef = React.useRef(true);
  const hasImg = !hideMedia && imgSrc && !imgErr && !isWeakImageUrl(imgSrc);
  const { sourceDomain, sourceLabel, faviconUrl, sourceInitial } = getArticleSourceMeta(article);
  const { mediaHeight, cardStyle, bodyPadding, bodyGap, titleSize, titleClamp } = getArticleCardLayout(compact, feature);
  React.useEffect(() => {
    mountedRef.current = true;
    return () => { mountedRef.current = false; };
  }, []);
  React.useEffect(() => {
    setImgSrc(article.imageUrl || null);
    setImgErr(false);
    setRecoverTried(false);
  }, [article.imageUrl, article.url, article.realUrl]);
  const tryRecoverImage = React.useCallback(async () => {
    if (hideMedia || recoveringRef.current || recoverTried) return;
    recoveringRef.current = true;
    setRecoverTried(true);
    try {
      const improved = await resolveBestArticleImage(
        { ...article, imageUrl: '' },
        { forceSearchFirst: true, skipCurrent: true }
      ).catch(() => null);
      if (!mountedRef.current) return;
      if (improved && !isWeakImageUrl(improved) && improved !== imgSrc) {
        setImgSrc(improved);
        setImgErr(false);
        const key = article.realUrl || article.url || '';
        if (key) putCachedImageForUrl(key, improved);
      }
    } finally {
      recoveringRef.current = false;

function formatElapsed(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function useBusyElapsed(active) {
  const [since, setSince] = useState(null);
  const [elapsedMs, setElapsedMs] = useState(0);
  useEffect(() => {
    if (!active) { setSince(null); setElapsedMs(0); return; }
    setSince(prev => prev || Date.now());
  }, [active]);
  useEffect(() => {
    if (!since) return;
    const tick = () => setElapsedMs(Date.now() - since);
    tick();
    const id = setInterval(tick, 250);
    return () => clearInterval(id);
  }, [since]);
  return elapsedMs;
}

}

function isActiveStoryForWork(story) {
  const status = String(story?.status || '').toLowerCase();
  return (story?.episodes?.length || 0) > 0 && status !== 'resolved' && status !== 'deleted';

  return (stories || []).filter(isActiveStoryForWork);

function shouldRefreshDiscoveryCache(entry) {
  if (!entry || isHomeStale(entry.generatedAt)) return true;
  // Treat a recent-but-empty cache (from a previous failed fetch) as stale
  return !DISC_CATEGORIES.some(c => (entry[c.key] || []).length > 0);
}

    const b = loadBrief();

    return Object.entries(f).flatMap(([k, arr]) => (Array.isArray(arr) ? arr : []).map(a => ({ ...a, _discKey: k })));
  }, [disc]);
  function restoreDiscovered(a) {
    const k = a._discKey;

    saveDisc(next);
    setDisc(next);

  const [discPhase, setDiscPhase] = useState(() => {

    if (d?.generatedAt) return 'ready'; // show even stale discovery immediately

  // ── Vale synthesis state ──────────────────────────────────────────────────

  const briefElapsedMs = useBusyElapsed(phase === 'generating');
  const discElapsedMs = useBusyElapsed(discPhase === 'loading');
  const valeElapsedMs = useBusyElapsed(valePhase === 'loading');
  const homeBriefSpeechText = buildGlobalBriefSpeechText(brief || null);
