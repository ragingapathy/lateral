  const homeValeFallback = (stories || [])
    .flatMap(s => (getCacheEntry(s?.id, 'headlines')?.items || []).slice(0, 3))
    .slice(0, 18);
  const homeValeSources = resolveRenderSources(vale?.message || '', vale?.sources, homeValeFallback);

  function bootstrapBriefIfNeeded() {
    if (!serverReady) return;
    const cached = loadBrief();
    if (!cached && activeStories.length > 0) generate();
  }

  function bootstrapDiscoveryIfStale() {
    const cachedDisc = loadDisc();
    if (shouldRefreshDiscoveryCache(cachedDisc)) {
      fetchDiscovery(loadBrief() || null);
    }
  }

  async function handlePivotRefresh() {
    fetchDiscovery(loadBrief() || null); // SearXNG only, fire immediately
    await generate(false);               // backend job: brief + web intelligence
  }

  function hydrateValeFromCache() {
    const v = loadVale();
    if (v) { setVale(v); setValePhase('ready'); }
  }

  // Auto-generate brief only after server stories are confirmed and no brief exists yet
  // If a stale brief exists, show it and wait for the user to manually regen
  useEffect(() => {
    bootstrapBriefIfNeeded();
  }, [serverReady]);

  // Auto-fetch discovery: always refresh if stale, even with no brief
  useEffect(() => {
    bootstrapDiscoveryIfStale();
  }, []);

  // Respond to global daily pivot refresh: discovery first (fast), then full
  // brief regen, then Vale — all sequential so Ollama is never double-loaded.
  useEffect(() => {
    window.addEventListener('lateral-refresh', handlePivotRefresh);
    return () => window.removeEventListener('lateral-refresh', handlePivotRefresh);
  }, []);

  useEffect(() => {
    if (phase === 'ready' && brief && discPhase === 'idle') fetchDiscovery(brief);
  }, [phase]);

  // One-time enrichment pass for cached discovery snapshots that are still within TTL.
  // This upgrades image coverage even when a full discovery refresh is not triggered.
  useEffect(() => {
    if (!disc?.generatedAt) return;
    if (discHydratedForRef.current === disc.generatedAt) return;
    discHydratedForRef.current = disc.generatedAt;
    let cancelled = false;
    (async () => {
      try {
        const catKeys = DISC_CATEGORIES.map(c => c.key);
        const curMap = {};
        catKeys.forEach(k => { curMap[k] = Array.isArray(disc[k]) ? disc[k] : []; });
        const curLocal = Array.isArray(disc.local) ? disc.local : [];
        const [catEnriched, localEnriched] = await Promise.all([
          Promise.all(catKeys.map(k => attachImages(curMap[k]))),
          attachImages(curLocal),
        ]);
        if (cancelled) return;
        let changed = false;
        const next = { ...disc };
        catKeys.forEach((k, i) => {
          next[k] = catEnriched[i];
          if (!changed) {
            const before = curMap[k];
            const after = catEnriched[i];
            for (let n = 0; n < Math.min(before.length, after.length); n++) {
              if (String(before[n]?.imageUrl || '') !== String(after[n]?.imageUrl || '')) { changed = true; break; }
            }
          }
        });
        next.local = localEnriched;
        if (!changed) {
          const before = curLocal;
          const after = localEnriched;
          for (let n = 0; n < Math.min(before.length, after.length); n++) {
            if (String(before[n]?.imageUrl || '') !== String(after[n]?.imageUrl || '')) { changed = true; break; }
          }
        }
        if (!changed) return;
        saveDisc(next);
        setDisc(next);
      } catch {}
    })();
    return () => { cancelled = true; };
  }, [disc?.generatedAt]);

  // Vale synthesis loads from cache on mount; only refreshes when explicitly triggered
  useEffect(() => {
    hydrateValeFromCache();
  }, []);

  // If a backend home-intelligence job is already running (user navigated away),
  // resume progress polling so the UI updates when it completes.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const st = await getIntelligenceJobStatus({ scope: 'home' });
        const job = st?.job;
        if (!job || job.scope !== 'home' || job.state !== 'running') return;
        if (cancelled) return;
        setPhase('generating');
        setValePhase('loading');
        setProgress(job.progress || 'Resuming intelligence generation…');
      await waitForIntelligenceJob({
        scope: 'home',
        expectedJobId: String(job.id || ''),
        onProgress: (j) => { if (!cancelled && j?.progress) setProgress(j.progress); }
      });
        if (cancelled) return;
        await syncServerCacheToLocal().catch(() => {});
        const nextBrief = loadBrief();
        const nextVale = loadVale();
        if (nextBrief) setBrief(nextBrief);
        if (nextVale) {
          setVale(nextVale);
          setValePhase('ready');
        }
        setPhase(nextBrief ? 'ready' : 'error');
      } catch {}
    })();
    return () => { cancelled = true; };
  }, []);

  async function fetchDiscovery(briefData) {
    const b = briefData || brief;
    // Stale-while-revalidate: only show loading spinner if we have no disc data at all
    const hasStaleDisc = !!(disc?.generatedAt);
    if (!hasStaleDisc) setDiscPhase('loading');
    try {
      // Fetch all category feeds in parallel
      const catResults = await Promise.all(
        DISC_CATEGORIES.map(cat => searchArticles(cat.query).catch(() => []))
      );
      const catMap = {};
      DISC_CATEGORIES.forEach((cat, i) => { catMap[cat.key] = catResults[i].slice(0, 12); });
      catMap.world = (catMap.world || []).filter(a => !isSportsArticle(a)).slice(0, 12);

      // Local news if location is configured
      let localArticles = [];
      if (settings.location) {
        const localResults = await searchArticles(`${settings.location} local news ${SPORTS_QUERY_EXCLUSIONS}`).catch(() => []);
        localArticles = localResults.filter(a => !isSportsArticle(a)).slice(0, 12);
      }

      // 1) Fast paint: show cached/thumbnails immediately.
      const seededMap = {};
      DISC_CATEGORIES.forEach(cat => { seededMap[cat.key] = applyCachedImages(catMap[cat.key]); });
      const seededLocal = applyCachedImages(localArticles);
      const seed = { generatedAt: new Date().toISOString(), ...seededMap, local: seededLocal };
      saveDisc(seed);
      setDisc(seed);
      setDiscPhase('ready');

      // 2) Background: AI relevance pass per category, then fill missing images — each step patches the feed in place.
      const runId = ++discImageRunRef.current;
      Promise.resolve().then(async () => {
        // 2a) Does each article actually belong in its category? Verdicts are cached, so repeat refreshes are cheap.
        const topics = discoveryRelevanceTopics(settings);
        const gated = {}, filteredMap = {};
        for (const k of [...DISC_CATEGORIES.map(c => c.key), 'local']) {
          const list = k === 'local' ? seededLocal : seededMap[k];
          if (!topics[k] || !list?.length) { gated[k] = list || []; filteredMap[k] = []; continue; }
          const g = await checkRelevance(topics[k], list);
          gated[k] = g.kept; filteredMap[k] = g.filtered;
        }
        if (runId !== discImageRunRef.current) return; // stale run
        const gatedSeed = { generatedAt: seed.generatedAt, ...gated, filtered: filteredMap };
        saveDisc(gatedSeed);
        setDisc(gatedSeed);

        // 2b) Fill missing images on what's left.
        const [catImgResults, localImg] = await Promise.all([
          Promise.all(DISC_CATEGORIES.map(cat => attachImages(gated[cat.key]))),
          attachImages(gated.local),
        ]);
        if (runId !== discImageRunRef.current) return; // stale run
        const catImgMap = {};
        DISC_CATEGORIES.forEach((cat, i) => { catImgMap[cat.key] = catImgResults[i]; });
        const enriched = { generatedAt: seed.generatedAt, ...catImgMap, local: localImg, filtered: filteredMap };
        saveDisc(enriched);
        setDisc(enriched);
      }).catch(() => {});
    } catch(e) {
      console.warn('Discovery fetch failed:', e.message);
      if (!hasStaleDisc) setDiscPhase('error'); // only show error if nothing to display
    }
  }

  async function generate(manual = false) {
    setPhase('generating'); setProgress(''); setErrMsg('');
    setValePhase('loading');
    try {
      if (!activeStories.length) { setPhase('idle'); return; }
      const activeForJob = activeStories.filter(isActiveStoryForWork);
      if (!activeForJob.length) { setPhase('idle'); return; }

      let startedJobId = '';
      try {
        const started = await startIntelligenceJob({ scope: 'home', stories: activeForJob, settings, force: !!manual });
        startedJobId = String(started?.job?.id || '');
      } catch (e) {
        if (e?.status !== 409) throw e;
        const activeJob = e?.payload?.activeJob || null;
        if (!(activeJob?.id && String(activeJob?.scope || '') === 'home')) {
          const msg = e?.payload?.error || 'Another intelligence process is already in progress and should complete soon.';
          throw new Error(msg);
        }
        startedJobId = String(activeJob.id);
        setProgress(activeJob?.progress || e?.payload?.error || 'Another home intelligence process is already in progress and should complete soon.');
      }

      await waitForIntelligenceJob({
        scope: 'home',
        expectedJobId: startedJobId,
        onProgress: (job) => {
          if (job?.progress) setProgress(job.progress);
        }
      });

      await syncServerCacheToLocal().catch(() => {});
      const nextBrief = loadBrief();
      const nextVale = loadVale();
      if (nextBrief) setBrief(nextBrief);
      if (nextVale) {
        setVale(nextVale);
        setValePhase('ready');
      } else setValePhase('error');
      setPhase(nextBrief ? 'ready' : 'error');
    } catch(e) {
      setErrMsg(e.message || 'Generation failed');
      setPhase('error');
      setValePhase('error');
    }
  }

  const totalEpisodes = stories.reduce((sum, s) => sum + (s.episodes?.length || 0), 0);
  const statusCounts  = Object.fromEntries(Object.keys(ST).map(k => [k, stories.filter(s => s.status === k).length]));
  const maxEps        = Math.max(...stories.map(s => s.episodes?.length || 0), 1);
  const lastUpdated   = brief ? new Date(brief.generatedAt).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}) : null;

  function printHomeBrief() {
    const el = document.getElementById('home-brief-body');
    if (!el) return;
    const briefDate = new Date().toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
    const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Lateral Brief — ${briefDate}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; padding: 32px 40px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #fff; color: #1a1714; }
  button { display: none !important; }
  .brief-story-section { page-break-inside: avoid; }
  .brief-cross-section { page-break-before: always; }
  .brief-exec { background: #f0f4ff !important; border: 1.5px solid #c7d7fd !important; border-radius: 10px; padding: 14px 18px; margin-bottom: 24px; }
  .brief-section-head { font-size: 10px; font-weight: 800; color: #9a948d; text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 7px; margin-top: 18px; }
  .brief-list { margin: 0 0 0 2px; padding: 0; list-style: none; }
  @page { margin: 1.5cm 2cm; size: A4; }
</style></head>
<body>
  ${getExportLogoHtml('Narrative Overview Brief')}
  <div style="border-bottom:2px solid #1a1714;padding-bottom:18px;margin-bottom:24px;">
    <div style="font-size:17px;font-weight:900;letter-spacing:-0.3px;">LATERAL BRIEF</div>
    <div style="font-size:11px;color:#9a948d;margin-top:1px;">${briefDate}</div>
  </div>
  ${el.innerHTML}
</body></html>`;
    const blob = new Blob([html], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    const win  = window.open(url, '_blank');
    if (!win) { URL.revokeObjectURL(url); return; }
    win.addEventListener('load', () => {
      setTimeout(() => { win.print(); win.addEventListener('afterprint', () => { win.close(); URL.revokeObjectURL(url); }); }, 200);
    });
  }

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:C.bg}}>
      {/* Header */}
      <div style={{padding:'14px 24px 12px', borderBottom:`1px solid ${C.borderLight}`, background:C.surface, flexShrink:0}}>
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10}}>
          <div style={{fontSize:15, fontWeight:900, color:C.text, letterSpacing:'-0.3px', fontFamily:"'Playfair Display', Georgia, serif"}}>Narrative Overview</div>
          <div style={{fontSize:11, color:C.textMute}}>
            {lastUpdated ? `Brief generated ${lastUpdated}` : 'No brief generated yet'}
            {' · '}{stories.length} {stories.length===1?'story':'stories'} · {totalEpisodes} episodes
          </div>
        </div>
        {refreshing && refreshProg?.title && (
          <div style={{fontSize:11, color:C.textMute, marginBottom:6, paddingLeft:1}}>
            Refreshing headlines: <em>{refreshProg.i}/{refreshProg.total} — {refreshProg.title}</em>
          </div>
        )}
        <div style={{display:'flex', gap:8, maxWidth:680, margin:'0 auto'}}>
          <input
            id="lateral-home-search"
            value={searchInput}
            onChange={e=>setSearchInput(e.target.value)}
            onKeyDown={handleSearchKey}
            placeholder="Search the news…"
            style={{flex:1, padding:'8px 14px', borderRadius:8, border:`1.5px solid ${C.border}`, background:C.bg, color:C.text, fontSize:13.5, outline:'none'}}
          />
          <button
            onClick={()=>runSearch(searchInput)}
            disabled={searchPhase==='loading' || !searchInput.trim()}
            style={{padding:'8px 18px', borderRadius:8, background:C.accent, color:'#fff', border:'none', fontSize:13, fontWeight:700, cursor:'pointer', opacity:(searchPhase==='loading'||!searchInput.trim())?0.5:1}}>
            {searchPhase==='loading' ? '…' : 'Search'}
          </button>
          {searchPhase !== 'idle' && (
            <button onClick={()=>{setSearchPhase('idle');setSearchRes([]);setSearchInput('');setSearchQ('');}}
              style={{padding:'8px 12px', borderRadius:8, background:'transparent', color:C.textMute, border:`1px solid ${C.border}`, fontSize:13, cursor:'pointer'}}>✕</button>
          )}
        </div>
      </div>

      <div style={{flex:1, overflowY:'auto', padding:'20px 24px 80px', display:'flex', flexDirection:'column', gap:20}}>

        {/* Search results */}
        {searchPhase !== 'idle' && (
          <div>
            <div style={{...labelStyle, marginBottom:10}}>
              {searchPhase === 'loading' ? `Searching "${searchQ}"…` : `Results for "${searchQ}" — ${searchRes.length} articles`}
            </div>
            {searchPhase === 'done' && searchRes.length === 0 && (
              <div style={{color:C.textMute, fontSize:13, padding:'20px 0'}}>No articles found.</div>
            )}
            {searchRes.length > 0 && (
              <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(220px, 1fr))', gap:10}}>
                <GroupedCards articles={searchRes} render={(a, also, i) => (
                  <ArticleCard key={a.url || i} article={a} also={also} onAddEp={onStartStory ? (art) => onStartStory(art) : undefined}/>
                )}/>
              </div>
            )}
          </div>
        )}

        {/* Status stats */}
        <div>
          <div style={{...labelStyle, marginBottom:10}}>Status Overview</div>
          <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:10}}>
            {Object.entries(ST).map(([k, v]) => (
              <div key={k} style={{background:C.surface, borderRadius:10, padding:'14px 16px', border:`1px solid ${C.border}`, borderLeft:`3px solid ${v.dot}`}}>
                <div style={{fontSize:11, fontWeight:700, color:v.text, textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:6}}>{v.label}</div>
                <div style={{fontSize:28, fontWeight:900, color:C.text, lineHeight:1}}>{statusCounts[k]}</div>
                <div style={{fontSize:10.5, color:C.textMute, marginTop:3}}>stories</div>
              </div>
            ))}
          </div>
        </div>

        {/* Per-story breakdown */}
        {stories.length > 0 && (
          <div>
            <div style={{...labelStyle, marginBottom:10}}>Story Breakdown — {stories.length} tracked · {totalEpisodes} total episodes</div>
            <div style={{background:C.surface, borderRadius:10, border:`1px solid ${C.border}`, overflow:'hidden'}}>
              {[...stories].sort((a,b)=>(b.episodes?.length||0)-(a.episodes?.length||0)).map((s, i, arr) => {
                const epCount  = s.episodes?.length || 0;
                const pct      = Math.round(epCount / maxEps * 100);
                const stCfg    = ST[s.status] || ST.active;
                const lastEp   = s.episodes?.length ? fmtS(s.episodes.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0].date) : null;
                const hlCache  = getCacheEntry(s.id, 'headlines');
                const hlCount  = hlCache?.items?.length || 0;
                const hlAge    = hlCache?.generatedAt ? fmtS(hlCache.generatedAt) : null;
                const runInfo  = latestRunByStory[s.id];
                const coverageDot = runInfo?.coverage === 'growing' ? '#22c55e'
                  : runInfo?.coverage === 'silent' ? '#9ca3af'
                  : runInfo?.coverage === 'error' ? '#dc2626' : null;
                const coverageTitle = runInfo?.coverage === 'growing'
                  ? `New coverage detected (${runInfo.newCount} headlines${runInfo.novelDomains?.length ? `, ${runInfo.novelDomains.length} new source${runInfo.novelDomains.length!==1?'s':''}` : ''})`
                  : runInfo?.coverage === 'silent' ? 'No new coverage since last auto-refresh'
                  : runInfo?.coverage === 'error' ? 'Last auto-refresh failed for this story' : undefined;
                return (
                  <div key={s.id} onClick={()=>onSelectStory&&onSelectStory(s.id)} style={{display:'flex', alignItems:'center', gap:14, padding:'12px 16px', borderBottom: i < arr.length-1 ? `1px solid ${C.borderLight}` : 'none', cursor: onSelectStory ? 'pointer' : 'default'}}>
                    <div style={{width:3, height:38, borderRadius:2, background:stCfg.dot, flexShrink:0}}/>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:5}}>
                        <span style={{display:'flex', alignItems:'center', gap:6, minWidth:0}}>
                          {coverageDot && (
                            <span title={coverageTitle} style={{width:7, height:7, borderRadius:'50%', background:coverageDot, flexShrink:0, ...(runInfo.coverage==='growing' ? {boxShadow:`0 0 0 3px ${coverageDot}33`} : {})}}/>
                          )}
                          <span style={{fontSize:13, fontWeight:700, color:C.text, fontFamily:"'Playfair Display', Georgia, serif", overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{s.title}</span>
                        </span>
                        <span style={{fontSize:11, color:C.textMute, flexShrink:0, marginLeft:10, display:'flex', gap:6, alignItems:'baseline'}}>
                          {hlCount > 0 && (
                            <span title={hlAge ? `Headlines cached ${hlAge}` : undefined} style={{color: hlCount >= 10 ? '#059669' : hlCount >= 4 ? C.textMid : C.textMute}}>
                              {hlCount} headline{hlCount !== 1 ? 's' : ''}
                            </span>
                          )}
                          {hlCount > 0 && <span style={{opacity:0.4}}>·</span>}
                          <span>{epCount} ep{epCount!==1?'s':''}{lastEp?` · last ${lastEp}`:''}</span>
                        </span>
                      </div>
                      <div style={{height:4, background:C.borderLight, borderRadius:2}}>
                        <div style={{height:'100%', width:`${pct}%`, background:stCfg.dot, borderRadius:2, opacity:0.65, transition:'width 0.5s ease'}}/>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ── Beats: per-story headline strips ─────────────────────────── */}
        {stories.filter(s => getCacheEntry(s.id, 'headlines')?.items?.length).length > 0 && (
          <div>
            <SectionToggleButton onClick={() => setBeatsOpen(o => !o)}>
              <span style={HOME_TITLE_LARGE}>Tracking</span>
              <span style={{...HOME_CHEVRON, marginLeft:'auto'}}>{beatsOpen ? '▾' : '▸'}</span>
            </SectionToggleButton>
            {beatsOpen && (
              <div style={{display:'flex', flexDirection:'column', gap:28}}>
                {stories.map(s => {
                  const entry = getCacheEntry(s.id, 'headlines');
                  const items = entry?.items?.slice(0, 8) || [];
                  if (!items.length) return null;
                  const stCfg = ST[s.status] || ST.active;
                  return (
                    <div key={s.id}>
<div style={{display:'flex', alignItems:'center', gap:7, marginBottom:10}}>
                        <div style={{width:8, height:8, borderRadius:'50%', background:stCfg.dot, flexShrink:0}}/>
                        <span style={{fontFamily:'Playfair Display, Georgia, serif', fontSize:15, fontWeight:600, color:C.textMid, letterSpacing:'0.02em', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{s.title}</span>
                      </div>
                      <div style={HOME_GRID_4_COL}>
                        <GroupedCards articles={items} render={(a, also, i) => (
                          <ArticleCard key={a.url || i} article={a} also={also} onAddEp={onAddEpisode ? (art) => onAddEpisode(art, s.id) : undefined}/>
                        )}/>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* ── Discovery + Local feeds ──────────────────────────────────── */}
        {(discPhase !== 'idle') && (
          <div style={{display:'flex', flexDirection:'column', gap:32}}>

            {/* Discovery H1 Title with Rule Line */}
            <div style={{marginBottom:4}}>
              <h1 style={{fontFamily:'Playfair Display, Georgia, serif', fontSize:28, fontWeight:600, color:C.text, margin:0, padding:0, letterSpacing:'-0.02em'}}>Discovery</h1>
              <div style={{borderBottom:`2px solid ${C.border}`, marginTop:8, marginBottom:12}}></div>
            </div>

            {discPhase === 'loading' && (
              <div style={{fontSize:12, color:C.textMute, padding:'8px 0', display:'flex', alignItems:'center', gap:8}}>
                <BusyInline label="Fetching latest articles…" elapsedMs={discElapsedMs}/>
              </div>
            )}

            {discPhase === 'ready' && DISC_CATEGORIES.map(cat => (
              disc?.[cat.key]?.length > 0 && (
                <div key={cat.key}>
                  <SectionToggleButton onClick={() => setDiscOpen(prev => ({...prev, [cat.key]: !prev[cat.key]}))} marginBottom={discOpen[cat.key] ? 10 : 0}>
                    <span style={HOME_TITLE_SMALL}>{cat.label}</span>
                    <span style={{...HOME_CHEVRON, marginLeft:'auto'}}>{discOpen[cat.key] ? '▾' : '▸'}</span>
                  </SectionToggleButton>
                  {discOpen[cat.key] && (
                    <div style={HOME_GRID_4_COL}>
                      <GroupedCards articles={disc[cat.key]} render={(a, also, i) => (
                        <ArticleCard key={a.url || i} article={a} also={also} onTrack={onStartStory ? () => onStartStory(a) : undefined}/>
                      )}/>
                    </div>
                  )}
                </div>
              )
            ))}

            {discPhase === 'ready' && disc?.local?.length > 0 && (
              <div>
                <SectionToggleButton onClick={() => setDiscOpen(prev => ({...prev, local: !prev.local}))} marginBottom={discOpen.local ? 10 : 0}>
                  <span style={HOME_TITLE_SMALL}>{settings.location || 'Local'}</span>
                  <span style={{...HOME_CHEVRON, marginLeft:'auto'}}>{discOpen.local ? '▾' : '▸'}</span>
                </SectionToggleButton>
                {discOpen.local && (
                  <div style={HOME_GRID_4_COL}>
                    <GroupedCards articles={disc.local} render={(a, also, i) => (
                      <ArticleCard key={a.url || i} article={a} also={also} onTrack={onStartStory ? () => onStartStory(a) : undefined}/>
                    )}/>
                  </div>
                )}
              </div>
            )}

            {discPhase === 'ready' && discFilteredItems.length > 0 && (
              <FilteredOutList label="Filtered out of Discovery" items={discFilteredItems} showGroup padX={0} onRestore={restoreDiscovered}/>
            )}

          </div>
        )}

        {/* Intelligence Brief */}
        <div>
          <SectionToggleButton onClick={() => setBriefOpen(o => !o)}>
            <span style={HOME_TITLE_LARGE}>Intelligence Brief</span>
            <div style={{marginLeft:'auto', display:'flex', gap:8, alignItems:'center'}}>
              {phase === 'generating' && <BusyInline label="Regenerating…" elapsedMs={briefElapsedMs}/>}
              {brief && phase !== 'generating' && (
                <TTSButton
                  text={homeBriefSpeechText}
                  settings={settings}

// ─── Markdown renderer (chat-safe, no library needed) ────────────────────────
function maybeDeltaJsonToMarkdown(parsed) {
  if (!parsed || typeof parsed !== 'object') return '';
  const exec = String(parsed.execSummary || parsed.summary || '').trim();
  const rows = Array.isArray(parsed.stories) ? parsed.stories : [];
  if (!exec && !rows.length) return '';
  const out = [];
  if (exec) {
    out.push('### Executive Summary');
    out.push(exec);
    out.push('');
  }
  rows.forEach((row) => {
    const title = String(row?.storyTitle || row?.title || row?.storyId || '').trim();
    if (!title) return;
    out.push(`#### ${title}`);
    const noNews = String(row?.noNews || '').toLowerCase() === 'true' || row?.noNews === true;
    const velocity = String(row?.velocity || '').trim().toLowerCase();
    const note = String(row?.velocityNote || '').trim();
    const fresh = Array.isArray(row?.keyDevelopments) ? row.keyDevelopments.filter(Boolean).slice(0, 3) : [];
    if (noNews) out.push('- No news since last update.');
    if (velocity) out.push(`- Velocity: ${velocity}`);
    if (note) out.push(`- ${note}`);
    if (fresh.length) {
      out.push('- Fresh developments:');
      fresh.forEach((item) => out.push(`  - ${String(item)}`));
    }
    out.push('');
  });
  return out.join('\n').trim();
}

function normalizeMarkdownInput(text) {
  if (text == null) return '';
  if (typeof text === 'string') {
    const raw = text.trim();
    if (!raw) return '';
    // Some providers return JSON-as-string payloads; recover the markdown field when present.
    if ((raw.startsWith('{') && raw.endsWith('}')) || (raw.startsWith('[') && raw.endsWith(']'))) {
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed?.markdown === 'string') return parsed.markdown;
        if (typeof parsed?.message === 'string') return parsed.message;
        if (typeof parsed?.summary === 'string') return parsed.summary;
        const deltaMd = maybeDeltaJsonToMarkdown(parsed);
        if (deltaMd) return deltaMd;
      } catch {}
    }
    // Some payloads come double-quoted with escaped newlines.
    if (raw.startsWith('"') && raw.endsWith('"')) {
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed === 'string') return parsed;
      } catch {}
    }
    return text;
  }
  if (Array.isArray(text)) {
    return text
      .map(v => (typeof v === 'string' ? v : (v == null ? '' : String(v))))
      .filter(Boolean)
      .join('\n');
  }
  if (typeof text === 'object') {
    if (typeof text.markdown === 'string') return text.markdown;
    if (typeof text.message === 'string') return text.message;
    if (typeof text.summary === 'string') return text.summary;
    const deltaMd = maybeDeltaJsonToMarkdown(text);
    if (deltaMd) return deltaMd;
    try { return JSON.stringify(text, null, 2); } catch {}
  }
  return String(text);
}

function MiniMarkdown({ text, sources = [] }) {
  const safeText = normalizeMarkdownInput(text);
  if (!safeText) return null;
  const lines = safeText.split('\n');
  const elements = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // Skip blank lines between blocks
    if (!line.trim()) { i++; continue; }
    // Fenced code blocks
    if (/^\s*```/.test(line)) {
      const codeLines = [];
      const open = line.match(/^\s*```(\w+)?/) || [];
      const lang = String(open[1] || '').trim();
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) {
        codeLines.push(lines[i]);
        i++;
      }
      if (i < lines.length && /^\s*```/.test(lines[i])) i++;
      elements.push(
        <pre
          key={`code-${i}`}
          style={{
            margin: '8px 0',
            padding: '10px 12px',
            borderRadius: 8,
            background: C.bgElev || C.bg2 || C.bg,
            border: `1px solid ${C.border}`,
            overflowX: 'auto',
            color: C.text,
            fontSize: 12,
            lineHeight: 1.5
          }}
        >
          {lang ? <div style={{fontSize:10,color:C.textMute,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.08em'}}>{lang}</div> : null}
          <code>{codeLines.join('\n')}</code>
        </pre>
      );
      continue;
    }
    // Markdown headings (# through ######)
    if (/^\s*#{1,6}\s/.test(line)) {
      const level = (line.match(/^\s*#+/)?.[0]?.trim().length) || 1;
      const size = level <= 2 ? 13.5 : 12.5;
      elements.push(<div key={i} style={{fontWeight:700, color:'var(--text)', marginTop:10, marginBottom:3, fontSize:size}}>{line.replace(/^\s*#{1,6}\s/, '')}</div>);
      i++; continue;
    }
    // Bullet list — collect consecutive bullet lines
    if (/^\s*[\-\*]\s/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[\-\*]\s/.test(lines[i])) {
        items.push(inlineFormat(lines[i].replace(/^\s*[\-\*]\s/, ''), i, sources));
        i++;
      }
      elements.push(<ul key={`ul-${i}`} style={{margin:'4px 0', paddingLeft:18}}>{items.map((it,j) => <li key={j} style={{marginBottom:2}}>{it}</li>)}</ul>);
      continue;
    }
    // Normal paragraph
    elements.push(<p key={i} style={{margin:'4px 0', lineHeight:1.6}}>{inlineFormat(line, i, sources)}</p>);
    i++;
  }
  return <div style={{fontSize:13}}>{elements}</div>;
}

function renderInlineLinks(text, keyBase, bold = false, sources = []) {
  const src = String(text || '');
  const srcList = normalizeSourceList(sources);
  const out = [];
  const tokenRe = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<>"']+)|(www\.[^\s<>"']+)/g;
  let last = 0;
  let m;
  let k = 0;
  while ((m = tokenRe.exec(src)) !== null) {
    if (m.index > last) out.push(src.slice(last, m.index));
    const mdLabel = m[1];
    const mdUrl = m[2];
    const bareUrl = m[3] || m[4];
    const href = normalizeExternalUrl(mdUrl || bareUrl || '');
    const label = mdLabel || bareUrl || href;
    if (href) {
      out.push(
        <a
          key={`${keyBase}-lnk-${k++}`}
          href={href}
          target="_blank"
          rel="noopener noreferrer"
          style={{ color: C.accent, textDecoration: 'underline', fontWeight: bold ? 700 : 500, wordBreak: bareUrl ? 'break-all' : 'normal' }}
        >
          {label}
        </a>
      );
    } else {
      out.push(label);
    }
    last = tokenRe.lastIndex;
  }
  if (last < src.length) out.push(src.slice(last));

  // Convert citation markers like [1], [2] to source links when available.
  const withCitations = [];
  let ck = 0;
  const citationRe = /\[(\d{1,3})\]/g;
  for (const part of out) {
    if (typeof part !== 'string') {
      withCitations.push(part);
      continue;
    }
    let pLast = 0;
    let cm;
    while ((cm = citationRe.exec(part)) !== null) {
      if (cm.index > pLast) withCitations.push(part.slice(pLast, cm.index));
      const n = Number(cm[1]);
      const src = srcList[n - 1] || null;
      const href = normalizeExternalUrl(src?.url || '');
      if (href) {
        withCitations.push(
          <a
            key={`${keyBase}-cit-${ck++}`}
            href={href}
            target="_blank"
            rel="noopener noreferrer"
            title={src?.title || `Source ${n}`}
            style={{ color: C.accent, textDecoration: 'underline', fontWeight: bold ? 700 : 500 }}
          >
            [{n}]
          </a>
        );
      } else {
        withCitations.push(cm[0]);
      }
      pLast = citationRe.lastIndex;
    }
    if (pLast < part.length) withCitations.push(part.slice(pLast));
  }
  return withCitations;
}

function inlineFormat(text, key, sources = []) {
  // Split on **bold** and render, while preserving hyperlinks.
  const parts = String(text || '').split(/(\*\*[^*]+\*\*)/g);
  return parts.map((p, i) => {
    if (/^\*\*[^*]+\*\*$/.test(p)) {
      const inner = p.slice(2, -2);
      return <strong key={`${key}-b-${i}`}>{renderInlineLinks(inner, `${key}-b-${i}`, true, sources)}</strong>;
    }
    return <React.Fragment key={`${key}-t-${i}`}>{renderInlineLinks(p, `${key}-t-${i}`, false, sources)}</React.Fragment>;
  });
}

const TTS_STATE = {
  utterance: null,
  ownerId: '',
  listeners: new Set(),
};

function subscribeTtsState(listener) {
  if (typeof listener !== 'function') return () => {};
  TTS_STATE.listeners.add(listener);
  return () => TTS_STATE.listeners.delete(listener);
}

function notifyTtsState() {
  TTS_STATE.listeners.forEach(fn => {
    try { fn(TTS_STATE.ownerId || ''); } catch {}
  });
}

function cancelTtsPlayback() {
  if (!window?.speechSynthesis) return;
  try { window.speechSynthesis.cancel(); } catch {}
  TTS_STATE.utterance = null;
  TTS_STATE.ownerId = '';
  notifyTtsState();
}

function markdownToSpeechText(text) {
  const raw = normalizeMarkdownInput(text);
  if (!raw) return '';
  return String(raw)
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^\s*[-*]\s+/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/_([^_]+)_/g, '$1')
    .replace(/\s+/g, ' ')
    .trim();
}

function listToSpeech(label, items) {
  const arr = Array.isArray(items) ? items : [];
  if (!arr.length) return '';
  const body = arr.map(item => {
    if (item && typeof item === 'object') {
      return `${item.name || ''}${item.role ? `, ${item.role}` : ''}`.trim();
    }
    return String(item || '').trim();
  }).filter(Boolean).join('. ');
  return body ? `${label}. ${body}.` : '';
}

function buildStoryBriefSpeechText(story, brief) {
  if (!brief) return '';
  const parts = [];
  if (story?.title) parts.push(`Story: ${story.title}.`);
  if (brief.velocity) parts.push(`Velocity: ${brief.velocity}.`);
  if (brief.velocityNote) parts.push(markdownToSpeechText(brief.velocityNote));
  parts.push(listToSpeech('Key points', brief.keyPoints));
  parts.push(listToSpeech('Key players', brief.keyPlayers));
  parts.push(listToSpeech('Actionable items', brief.actionableItems));
  parts.push(listToSpeech('Watch signals', brief.watchSignals));
  parts.push(listToSpeech('Information gaps', brief.informationGaps));
  if (brief.valeReport?.message) {
    parts.push('Live web intelligence.');
    parts.push(markdownToSpeechText(brief.valeReport.message));
  }
  return parts.filter(Boolean).join(' ');
}

function buildGlobalBriefSpeechText(briefData) {
  if (!briefData) return '';
  const exec = markdownToSpeechText(briefData.execSummary || '');
  const briefs = Array.isArray(briefData.storyBriefs) ? briefData.storyBriefs : [];
  const cross = briefData.crossBrief || null;
  const out = [];
  if (exec) out.push(`Executive summary. ${exec}`);
  briefs.forEach(({ story, brief }) => {
    out.push(buildStoryBriefSpeechText(story, brief));
  });
  if (cross) {
    if (cross.globalTheme) out.push(`Lateral connections theme. ${markdownToSpeechText(cross.globalTheme)}`);
    out.push(listToSpeech('Story connections', cross.connections?.map(c => c.label || c.connection || c.note || '')));
    out.push(listToSpeech('Convergences', cross.convergences));
    out.push(listToSpeech('Collective blind spots', cross.blindSpots));
  }
  return out.filter(Boolean).join(' ');
}

function splitSpeechChunks(text, maxLen = 220) {
  const raw = String(text || '').trim();
  if (!raw) return [];
  const cleaned = raw.replace(/\s+/g, ' ').trim();
  const sentences = cleaned.split(/(?<=[\.\!\?])\s+/).filter(Boolean);
  const chunks = [];
  let cur = '';
  for (const s of sentences) {
    if (s.length > maxLen) {
      if (cur) { chunks.push(cur.trim()); cur = ''; }
      for (let i = 0; i < s.length; i += maxLen) {
        chunks.push(s.slice(i, i + maxLen).trim());
      }
      continue;
    }
    if (!cur) {
      cur = s;
      continue;
    }
    if ((cur.length + 1 + s.length) <= maxLen) cur += ` ${s}`;
    else { chunks.push(cur.trim()); cur = s; }
  }
  if (cur) chunks.push(cur.trim());
  return chunks.filter(Boolean);
}

function TTSButton({ text, settings, label = 'Read', title = 'Read aloud', style = {} }) {
  const ownerIdRef = React.useRef(`tts-${Math.random().toString(36).slice(2, 10)}`);
  const [active, setActive] = React.useState(false);
  const supported = !!window?.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined';
  const speechText = markdownToSpeechText(text);
  const canPlay = supported && !!speechText;

  React.useEffect(() => subscribeTtsState((ownerId) => {
    setActive(ownerId === ownerIdRef.current);
  }), []);

  React.useEffect(() => () => {
    if (TTS_STATE.ownerId === ownerIdRef.current) cancelTtsPlayback();
  }, []);

  const baseStyle = {
    fontSize: 11,
    color: C.accent,
    background: 'none',
    border: `1px solid ${C.border}`,
    borderRadius: 6,
    cursor: canPlay ? 'pointer' : 'default',
    fontWeight: 700,
    padding: '2px 8px',
    opacity: canPlay ? 1 : 0.45,
  };

  function onPress(e) {
    e?.stopPropagation?.();
    if (!canPlay) return;
    if (active) { cancelTtsPlayback(); return; }
    cancelTtsPlayback();
    const chunks = splitSpeechChunks(speechText);
    if (!chunks.length) return;
    const voiceId = String(settings?.ttsVoice || '').trim();
    const voices = window.speechSynthesis.getVoices?.() || [];
    const selected = voiceId ? voices.find(v => v.voiceURI === voiceId) : null;
    const ownerId = ownerIdRef.current;
    TTS_STATE.ownerId = ownerId;
    TTS_STATE.utterance = { ownerId, chunks: chunks.length };
    notifyTtsState();
    chunks.forEach((chunk, idx) => {
      const utterance = new SpeechSynthesisUtterance(chunk);
      if (selected) utterance.voice = selected;
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.onend = () => {
        if (TTS_STATE.ownerId !== ownerId) return;
        if (idx !== chunks.length - 1) return;
        TTS_STATE.ownerId = '';
        TTS_STATE.utterance = null;
        notifyTtsState();
      };
      utterance.onerror = () => {
        if (TTS_STATE.ownerId !== ownerId) return;
        TTS_STATE.ownerId = '';
        TTS_STATE.utterance = null;
        notifyTtsState();
      };
      window.speechSynthesis.speak(utterance);
    });
  }

  return (
    <button onClick={onPress} title={title} disabled={!canPlay} style={{...baseStyle, ...style}}>
      {active ? '■ Stop' : `🔊 ${label}`}
    </button>
  );
}

        <div className="chat-bubble-actions">
          <button className="chat-copy-btn" onClick={copy}>{copied ? '✓' : 'Copy'}</button>
        </div>
      </div>
    </div>
  );
}

function ChatDrawer({ story, stories, leftPanelOpen, rightPanelWidth = 308, onAddEpisode, isMobile = false }) {
  const [open,       setOpen]       = useState(false);
  const [query,      setQuery]      = useState('');
  const [messages,   setMessages]   = useState([]);
  const [loading,    setLoading]    = useState(false);
  const [savingIdx,  setSavingIdx]  = useState(null);
  const [saveStory,  setSaveStory]  = useState('');
  const messagesEndRef = useRef(null);
  const inputRef       = useRef(null);
  const sendingRef     = useRef(false);
  const abortRef       = useRef(null);
  const pageRef        = useRef(null);
  const dragRef        = useRef({ active:false, startY:0, delta:0 });

  useEffect(() => {
    if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  function resetPullVisual() {
    if (!pageRef.current) return;
    pageRef.current.style.transform = 'translateY(0px)';
    pageRef.current.style.transition = 'transform 0.18s ease';
    setTimeout(() => {
      if (pageRef.current) pageRef.current.style.transition = '';
    }, 180);
  }

  function onHandleMove(e) {
    if (!dragRef.current.active || !pageRef.current) return;
    const dy = Math.max(0, e.clientY - dragRef.current.startY);
    dragRef.current.delta = dy;
    pageRef.current.style.transform = `translateY(${Math.min(dy, 90)}px)`;
  }

  function onHandleUp() {
    if (!dragRef.current.active) return;
    const dy = dragRef.current.delta;
    dragRef.current = { active:false, startY:0, delta:0 };
    document.removeEventListener('mousemove', onHandleMove);
    document.removeEventListener('mouseup', onHandleUp);
    if (dy > 48) setOpen(false);
    resetPullVisual();
  }

  function onHandleDown(e) {
    if (e.button !== 0 || !open) return;
    dragRef.current = { active:true, startY:e.clientY, delta:0 };
    document.addEventListener('mousemove', onHandleMove);
    document.addEventListener('mouseup', onHandleUp);
  }

  useEffect(() => () => {
    document.removeEventListener('mousemove', onHandleMove);
    document.removeEventListener('mouseup', onHandleUp);
  }, []);

  // Build story context to include with every query
  function buildContext() {
    const active = (stories || []).filter(isActiveStoryForWork);
    if (!active.length) return '';
    const lines = active.map(s => `- "${s.title}" (${s.status}): ${s.summary || 'no summary'}`).join('\n');
    return `The user is tracking these stories:\n${lines}${story ? `\n\nCurrently viewing: "${story.title}"` : ''}`;
  }

  async function handleSend() {
    const q = query.trim();
    if (!q || loading || sendingRef.current) return;
    sendingRef.current = true;
    setLoading(true);
    setQuery('');
    setOpen(true);
    setMessages(prev => [...prev, { role: 'user', content: q }]);
    const controller = new AbortController();
    abortRef.current = controller;
    try {
      const context = buildContext();
      const systemInstructions = context
        ? `You are an intelligence analyst assistant. ${context}. Answer the user's question using current web information. Structure your response with an executive summary, then key developments as bullet points, then cite sources.`
        : 'You are an intelligence analyst assistant. Answer the user\'s question using current web information. Structure your response with an executive summary, then key developments as bullet points, then cite sources.';
      const storyContext = story ? { title: story.title, actors: story.actors || [] } : null;
      const r = await fetch('/api/lateral/vale', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q, systemInstructions, chat: true, storyContext }),
        signal: controller.signal,
      });
      if (!r.ok) throw new Error(`${r.status}`);
      const data = await r.json();
      setMessages(prev => [...prev, {
        role: 'assistant',
        query: q,
        headline: data.headline || q,
        content: data.message || '(no response)',
        keyPoints: data.keyPoints || [],
        informationGaps: data.informationGaps || [],
        sources: data.sources || [],
        fallback: !!data.fallback,
      }]);
    } catch(e) {
      if (e.name === 'AbortError') {
        // User cancelled — remove the loading bubble, leave the user message
      } else {
        setMessages(prev => [...prev, { role: 'error', content: `Could not reach web intelligence: ${e.message}` }]);
      }
    } finally {
      setLoading(false);
      sendingRef.current = false;
      abortRef.current = null;
      inputRef.current?.focus();
    }
  }

  function handleStop() {
    if (abortRef.current) abortRef.current.abort();
  }

  function handleClear() { setMessages([]); setOpen(false); }

  const leftInset = isMobile ? 0 : (leftPanelOpen ? 304 : 56);
  const rightInset = isMobile ? 0 : rightPanelWidth;

  return (
    <div id="chat-drawer" style={{ left: leftInset, right: rightInset }}>
      <div id="chat-page" ref={pageRef} className={open ? 'open' : ''}>
        <div id="chat-top-handle" onMouseDown={onHandleDown} onDoubleClick={() => setOpen(false)} title="Drag down to close">
          <div id="chat-top-handle-grip"/>
        </div>
        <div id="chat-messages">
          {messages.length === 0 && (
            <div style={{color:'var(--text-mute)', fontSize:12, fontStyle:'italic', textAlign:'center', marginTop:20}}>
              Ask anything. Your tracked stories are included as context.
            </div>
          )}
          {messages.map((m, i) => (
            <div key={i} style={{display:'flex', flexDirection:'column', alignItems: m.role === 'user' ? 'flex-end' : 'flex-start', marginBottom:8}}>
              <CopyableBubble role={m.role} content={m.content}/>
              {m.role === 'assistant' && m.keyPoints?.length > 0 && (
                <div style={{fontSize:11.5, color:'var(--text-mid)', marginTop:6, paddingLeft:4, lineHeight:1.55}}>
                  {m.keyPoints.map((kp, j) => (
                    <div key={j} style={{display:'flex', gap:5, marginBottom:2}}>
                      <span style={{color:'var(--accent)', flexShrink:0}}>•</span>
                      <span>{kp}</span>
                    </div>
                  ))}
                </div>
              )}
              {m.sources?.length > 0 && (
                <div style={{display:'flex', flexWrap:'wrap', gap:5, marginTop:5, paddingLeft: m.role === 'user' ? 0 : 4, justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start'}}>
                  {m.sources.filter(s => s.url).slice(0, 5).map((s, j) => (
                    <a key={j} href={normalizeExternalUrl(s.url)} target="_blank" rel="noopener noreferrer"
                       style={{fontSize:10, color:'var(--text-mute)', border:'1px solid var(--border)', borderRadius:5, padding:'2px 7px', textDecoration:'none', maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                      {s.title || 'Source'}
                    </a>
                  ))}
                </div>
              )}
              {m.role === 'assistant' && onAddEpisode && (
                <div style={{marginTop:6, paddingLeft:4}}>
                  {savingIdx === i ? (
                    <div style={{display:'flex', alignItems:'center', gap:6, flexWrap:'wrap'}}>
                      <select value={saveStory} onChange={e => setSaveStory(e.target.value)}
                        style={{fontSize:11, padding:'3px 6px', borderRadius:5, border:'1px solid var(--border)', background:'var(--bg)', color:'var(--text)', maxWidth:180}}>
                        <option value="">— pick a story —</option>
                        {(stories || []).filter(s => s.status !== 'resolved' && s.status !== 'buried').map(s => (
                          <option key={s.id} value={s.id}>{s.title}</option>
                        ))}
                      </select>
                      <button onClick={() => {
                        if (!saveStory) return;
                        onAddEpisode({
                          id: uid(),
                          date: now().slice(0, 10),
                          type: 'development',
                          episodeType: 'web-summary',
                          headline: m.headline || m.query || 'Web intelligence note',
                          summary: m.content,
                          sourceUrl: m.sources?.[0]?.url || '',
                          sourceLinks: (m.sources || []).filter(s => s.url),
                          addedAt: now(),
                        }, saveStory);
                        setSavingIdx(null);
                        setSaveStory('');
                      }} disabled={!saveStory}
                        style={{fontSize:11, padding:'3px 9px', borderRadius:5, border:'none',
                                background: saveStory ? 'var(--accent)' : 'var(--border)',
                                color: saveStory ? 'white' : 'var(--text-mute)',
                                cursor: saveStory ? 'pointer' : 'default', fontWeight:700}}>
                        Save
                      </button>
                      <button onClick={() => { setSavingIdx(null); setSaveStory(''); }}
                        style={{fontSize:11, padding:'3px 7px', borderRadius:5, border:'1px solid var(--border)', background:'none', color:'var(--text-mute)', cursor:'pointer'}}>
                        Cancel
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => { setSavingIdx(i); setSaveStory(story?.id || ''); }}
                      style={{fontSize:10, padding:'2px 8px', borderRadius:5, border:'1px solid var(--border)',
                              background:'none', color:'var(--text-mute)', cursor:'pointer', fontWeight:600,
                              transition:'all 0.15s'}}
                      title="Save this response as a timeline episode">
                      📌 Save as Episode
                    </button>
                  )}
                </div>
              )}
            </div>
          ))}
          {loading && <ChatLoadingBubble/>}
          <div ref={messagesEndRef}/>
        </div>
      </div>
      <form id="chat-bar" onSubmit={e => { e.preventDefault(); handleSend(); }}>
        <button
          type="button"
          onClick={() => setOpen(o => !o)}
          title={open ? 'Collapse' : 'Expand chat'}
          style={{background:'none', border:'none', cursor:'pointer', color:'var(--text-mute)', fontSize:13, padding:'4px 6px', borderRadius:5, flexShrink:0, transition:'color 0.15s'}}
        >
          {open ? '▼' : '▲'}
        </button>
        <input
          id="chat-input"
          ref={inputRef}
          placeholder={story ? `Ask about "${story.title}"…` : 'Ask about your tracked stories…'}
          value={query}
          onChange={e => setQuery(e.target.value)}
          onFocus={() => { if (messages.length > 0) setOpen(true); }}
        />
        {messages.length > 0 && (
          <button type="button" onClick={handleClear} title="Clear chat"
            style={{background:'none', border:'none', cursor:'pointer', color:'var(--text-mute)', fontSize:11, padding:'4px 6px', borderRadius:5, flexShrink:0}}>
            Clear
          </button>
        )}
        {loading
          ? <button type="button" onClick={handleStop}
              style={{background:'#dc2626', color:'white', border:'none', borderRadius:7, padding:'6px 14px', fontSize:12, fontWeight:700, cursor:'pointer', flexShrink:0}}>
              Stop
            </button>
          : <button type="submit" disabled={!query.trim()}
              style={{background:'var(--accent)', color:'white', border:'none', borderRadius:7, padding:'6px 14px', fontSize:12, fontWeight:700, cursor: !query.trim() ? 'not-allowed' : 'pointer', opacity: !query.trim() ? 0.5 : 1, flexShrink:0, transition:'all 0.15s'}}>
              Ask
            </button>
        }
      </form>
    </div>
  );
}

// Deep linking is story-level only (see the popstate/pushState effects in
// App) — a bookmarked or shared ?story=<id> link that doesn't match anything
// in this browser's own data just falls back to no selection, not an error;
// story data is local, not server-side, so there's nothing else it could do.
function getStoryIdFromUrl() {
  try { return new URLSearchParams(window.location.search).get('story') || null; }
  catch { return null; }
}

function useIsMobile(breakpoint = MOBILE_BREAKPOINT) {
  const getMatch = () => {
    if (typeof window === 'undefined') return false;
    return window.innerWidth <= breakpoint;
  };
  const [isMobile, setIsMobile] = useState(getMatch);
  useEffect(() => {
    const onResize = () => setIsMobile(getMatch());
    onResize();
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [breakpoint]);
  return isMobile;
}

// A phone-sized side panel. It closes with: the Close bar (a big touch target), a tap on the dimmed page beside it, a swipe toward
// its own edge, or Escape. It never fills the screen: a strip of the page always stays visible to tap.
function MobileDrawer({ side='left', open, onClose, width, label, children }) {
  const touch = useRef(null);
  useEffect(() => {
    if (!open) return;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = prevOverflow; window.removeEventListener('keydown', onKey); };
  }, [open]);
  if (!open) return null;
  const toward = side === 'left' ? -1 : 1;   // the swipe direction that closes this drawer
  const onTouchStart = e => { const t = e.touches[0]; touch.current = { x: t.clientX, y: t.clientY }; };
  const onTouchEnd = e => {
    const s = touch.current; touch.current = null;
    if (!s || !e.changedTouches[0]) return;
    const dx = e.changedTouches[0].clientX - s.x, dy = e.changedTouches[0].clientY - s.y;
    if (dx * toward > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) onClose();   // a clear, mostly horizontal swipe
  };
  const edge = side === 'left' ? { left: 0, borderRight: `1px solid ${C.border}` } : { right: 0, borderLeft: `1px solid ${C.border}` };
  return (
    <>
      <div onClick={onClose} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} aria-hidden="true"
        style={{position:'fixed',inset:0,background:'rgba(10, 12, 16, 0.42)',backdropFilter:'blur(2px)',zIndex:1400}}/>
      <div role="dialog" aria-modal="true" aria-label={label || (side === 'left' ? 'Menu' : 'Details')} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
        style={{position:'fixed',top:52,bottom:0,width:width,maxWidth:'calc(100vw - 56px)',background:C.surface,zIndex:1401,
                boxShadow: side === 'left' ? '10px 0 30px rgba(0,0,0,0.18)' : '-10px 0 30px rgba(0,0,0,0.18)',
                overflow:'hidden',display:'flex',flexDirection:'column',...edge}}>
        <div style={{flexShrink:0,display:'flex',justifyContent:side === 'left' ? 'flex-end' : 'flex-start',alignItems:'center',borderBottom:`1px solid ${C.borderLight}`,background:C.surface}}>
          <button onClick={onClose} aria-label="Close panel"
            style={{display:'inline-flex',alignItems:'center',gap:8,minHeight:46,padding:'0 18px',border:'none',background:'none',color:C.textMid,fontSize:13,fontWeight:700,cursor:'pointer',WebkitTapHighlightColor:'transparent'}}>
            {side === 'right' && <LIcon size={18}><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></LIcon>}
            Close
            {side === 'left' && <LIcon size={18}><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></LIcon>}
          </button>
        </div>
        <div style={{flex:1,minHeight:0,display:'flex'}}>{children}</div>
      </div>
    </>
  );
}

  const [tavilyWarningDismissed, setTavilyWarningDismissed] = useState(() => { try { return Number(localStorage.getItem('lateral-tavily-warning-dismissed')) || 0; } catch { return 0; } });
  const tavilyPollRef = useRef(null);

  // Deep linking: keep the URL's ?story= param in sync with which story is
  // open, so the browser's own back/forward and bookmarks work — previously
  // the URL never changed regardless of what was selected. Story-level only;
  // which episode is open doesn't round-trip through the URL.
  useEffect(() => {
    if (skipNextUrlPushRef.current) { skipNextUrlPushRef.current = false; return; }
    const url = new URL(window.location.href);
    const nextParam = (!homeView && selStory) ? selStory : null;
    if (url.searchParams.get('story') === nextParam) return; // URL already matches, nothing to push
    if (nextParam) url.searchParams.set('story', nextParam);
    else url.searchParams.delete('story');
    window.history.pushState({ storyId: nextParam }, '', url.toString());

  // ── Auto-refresh at daily pivot time ────────────────────────────────────────
  // Fires a 'lateral-refresh' event exactly when isCacheStale flips to true,
  // so open tabs get fresh content without requiring a page reload.
  useEffect(() => {
    function msUntilPivot() {
      const [h, m] = (settings?.refreshTime || '08:00').split(':').map(Number);
      const now = new Date();
      const next = new Date(now); next.setHours(h, m, 0, 0);
      if (next <= now) next.setDate(next.getDate() + 1); // already past → next day
      return next.getTime() - now.getTime();
    }
    let timer;
    function schedule() {
      timer = setTimeout(() => {
        window.dispatchEvent(new CustomEvent('lateral-refresh'));
        schedule(); // reschedule for same time tomorrow
      }, msUntilPivot());
    }
    schedule();
    return () => clearTimeout(timer);

    document.addEventListener('visibilitychange', tick);
    window.addEventListener('lateral-tavily-spent', tick);
    return () => {
      clearInterval(tavilyPollRef.current);
      document.removeEventListener('visibilitychange', tick);
      window.removeEventListener('lateral-tavily-spent', tick);

  const tavilyPct = tavilyUsage?.configured ? (tavilyUsage.percentage || 0) : 0;

  useEffect(() => {
