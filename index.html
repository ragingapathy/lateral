// A whole profile for one official, in the right-hand column.
function CivicProfile({ o, civic, onClose, onUpdate }) {
  const key = civicKey(o);
  const j = civic.jurisdictions || {};
  const [about, setAbout] = useState(undefined);   // undefined = loading, then { found, … }
  const [adding, setAdding] = useState(null);
  const [handle, setHandle] = useState('');
  const [busy, setBusy] = useState('');
  const [err, setErr] = useState('');
  const [found, setFound] = useState(null);
  useEffect(() => {
    let on = true;
    setAbout(undefined); setAdding(null); setHandle(''); setErr(''); setFound(null);
    civicJson('about?key=' + encodeURIComponent(key)).then(d => { if (on) setAbout(d.error ? { found: false } : d); });
    return () => { on = false; };
  }, [key]);

  const accounts = o.social || [];
  const have = new Set(accounts.map(a => a.platform));
  const missing = SOCIAL_ORDER.filter(p => !have.has(p));
  const searchable = ['tiktok', 'instagram'].filter(p => !have.has(p));
  const shortName = o.name.split(/\s+/).slice(-1)[0];
  const represents = civicRepresents(o, j);

  async function save(platform, value, source) {
    setBusy('save'); setErr('');
    const d = await civicPost('social/set', { key, platform, handle: value, source });
    setBusy('');
    if (d.error) { setErr(d.error); return; }
    onUpdate(d.profile); setAdding(null); setHandle('');
    if (found) setFound({ ...found, candidates: (found.candidates || []).filter(c => c.platform !== platform) });
  }
  async function drop(platform) { const d = await civicPost('social/remove', { key, platform }); if (!d.error) onUpdate(d.profile); }
  async function search() {
    setBusy('search'); setErr(''); setFound(null);
    const d = await civicPost('social/discover', { key, platforms: searchable });
    setBusy('');
    if (d.error) setErr(d.error); else setFound(d);
  }

  const actions = [
    o.email && { href: 'mailto:' + o.email, icon: CIVIC_ICONS.mail, label: 'Email' },
    o.phone && { href: 'tel:' + o.phone.replace(/[^0-9+]/g, ''), icon: CIVIC_ICONS.phone, label: 'Call' },
    o.website && { href: o.website, icon: CIVIC_ICONS.globe, label: 'Website', ext: true },
    !o.email && o.contactForm && { href: o.contactForm, icon: CIVIC_ICONS.form, label: 'Contact', ext: true },
    about && about.found && { href: about.url, icon: CIVIC_ICONS.wiki, label: 'Wikipedia', ext: true },
  ].filter(Boolean);
  const facts = [
    ['Represents', represents],
    o.termStart && o.termEnds ? ['Term', `${civicDate(o.termStart)} to ${civicDate(o.termEnds)}`] : null,
    o.termStart && !o.termEnds ? [o.level === 'state' ? 'Current term began' : 'In office since', civicDate(o.termStart)] : null,
    !o.termStart && o.termEnds ? ['Term ends', civicDate(o.termEnds)] : null,
    o.nextElection && o.level === 'federal' ? ['Next election', String(o.nextElection)] : null,
    o.body ? ['Body', o.body] : null,
  ].filter(f => f && f[1]);

  return (
    <div className="fade-in">
      <div className="cv-hero">
        <button className="cv-close" onClick={onClose} title="Close profile"><LIcon size={15}>{CIVIC_ICONS.close}</LIcon></button>
        <CivicPhoto k={key} name={o.name}/>
        <div className="cv-name">{o.name}</div>
        <div className="cv-office">{o.office}{o.district && !/Ward/.test(o.office) ? ' · District ' + o.district : ''}</div>
        <div className="cv-chips">
          {o.party && <span className="cv-chip">{o.party}</span>}
          {o.role && <span className="cv-chip">{o.role}</span>}
          {o.upForElection && <span className="cv-chip warn">On the ballot {o.nextElection}</span>}
          {!o.upForElection && civicTermSoon(o) && <span className="cv-chip warn">Term ends {civicDate(o.termEnds)}</span>}
        </div>
      </div>

      <div className="cv-body">
        {actions.length > 0 && (
          <div className="cv-sec"><div className="cv-acts">
            {actions.map(a => <a key={a.label} className="cv-act" href={a.href} {...(a.ext ? { target: '_blank', rel: 'noreferrer' } : {})}><LIcon size={18}>{a.icon}</LIcon>{a.label}</a>)}
          </div></div>
        )}

        {facts.length > 0 && (
          <div className="cv-sec"><div className="cv-h">At a glance</div>
            <dl className="cv-facts">{facts.map(([k, v]) => <React.Fragment key={k}><dt>{k}</dt><dd>{v}</dd></React.Fragment>)}</dl>
          </div>
        )}

        {about && about.found && about.extract && (
          <div className="cv-sec"><div className="cv-h">About</div>
            <div style={{fontSize:12.5,color:C.textMid,lineHeight:1.65}}>{about.extract}</div>
            <a href={about.url} target="_blank" rel="noreferrer" style={{display:'inline-block',marginTop:7,fontSize:11.5,fontWeight:700,color:C.accent,textDecoration:'none'}}>Read on Wikipedia →</a>
            <div style={{fontSize:10.5,color:C.textMute,marginTop:3}}>Text from Wikipedia, under CC BY-SA.</div>
          </div>
        )}
        {about === undefined && <div className="cv-sec"><div className="cv-h">About</div><div style={{fontSize:12,color:C.textMute}}>Looking for a Wikipedia article…</div></div>}

        <div className="cv-sec">
          <div className="cv-h">Social media</div>
          <div className="cv-grid">
            {accounts.map(a => (
              <div key={a.platform} className="cv-tile">
                <a className="cv-tile-a" href={a.url} target="_blank" rel="noreferrer" title={`Open ${a.label}`}>
                  <span className="cv-ico"><LIcon size={16}>{CIVIC_ICONS[a.platform]}</LIcon></span>
                  <span className="cv-tx"><b>{a.label}</b><span>{a.platform === 'mastodon' ? a.handle : '@' + a.handle}</span></span>
                </a>
                {a.source !== 'dataset' && <button className="cv-x" onClick={() => drop(a.platform)} title={`Remove (${a.source === 'search' ? 'found by search' : 'added by you'})`}><LIcon size={11}>{CIVIC_ICONS.close}</LIcon></button>}
              </div>
            ))}
            {missing.map(p => (
              <div key={p} className="cv-tile cv-ghost">
                <button className="cv-tile-a" onClick={() => { setAdding(p); setHandle(''); setErr(''); }} title={`Add a ${SOCIAL_LABEL[p]} account`}>
                  <span className="cv-ico"><LIcon size={16}>{CIVIC_ICONS[p]}</LIcon></span>
                  <span className="cv-tx"><b>{SOCIAL_LABEL[p]}</b><span>Add account</span></span>
                </button>
              </div>
            ))}
          </div>
          {adding && (
            <div style={{display:'flex',gap:7,alignItems:'center',flexWrap:'wrap',marginTop:10}}>
              <input value={handle} autoFocus onChange={e => setHandle(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && handle.trim()) save(adding, handle, 'manual'); if (e.key === 'Escape') { setAdding(null); setHandle(''); } }}
                placeholder={adding === 'mastodon' ? '@name@server.social' : `${SOCIAL_LABEL[adding]} handle or address`} style={{...inputStyle,fontSize:12.5,padding:'7px 10px',flex:'1 1 150px',minWidth:0}}/>
              <Btn onClick={() => save(adding, handle, 'manual')} disabled={!!busy || !handle.trim()} style={{padding:'7px 12px',fontSize:12}}>Save</Btn>
              <button onClick={() => { setAdding(null); setHandle(''); setErr(''); }} style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:12}}>Cancel</button>
            </div>
          )}
          {err && <div style={{marginTop:9,fontSize:12,color:'#991b1b',lineHeight:1.5}}>{err}</div>}

          {searchable.length > 0 && !adding && (
            <div style={{marginTop:11}}>
              <button className="cv-act" onClick={search} disabled={!!busy} style={{flexDirection:'row',gap:8,width:'100%',padding:'9px 10px'}}>
                <LIcon size={15}>{ICONS.search}</LIcon>{busy === 'search' ? 'Searching the web…' : `Find ${searchable.map(p => SOCIAL_LABEL[p]).join(' and ')} on the web`}
              </button>
              <div style={{fontSize:10.5,color:C.textMute,marginTop:5,lineHeight:1.5}}>Uses {searchable.length} Tavily credit{searchable.length > 1 ? 's' : ''}. Nothing is saved until you confirm a match.</div>
            </div>
          )}
          {found && (
            <div style={{marginTop:12}}>
              {found.searched.map(p => {
                const list = (found.candidates || []).filter(c => c.platform === p);
                const good = list.filter(c => c.handleMatch);
                return (
                  <div key={p} style={{marginBottom:10}}>
                    <div className="cv-tag" style={{marginBottom:3}}>{SOCIAL_LABEL[p]}</div>
                    {list.length === 0 && <div style={{fontSize:12,color:C.textMute}}>Nothing found.</div>}
                    {list.length > 0 && good.length === 0 && <div style={{fontSize:11.5,color:'#92400e',background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:8,padding:'6px 9px',margin:'3px 0 4px',lineHeight:1.5}}>No {SOCIAL_LABEL[p]} account with {shortName}'s name turned up. These only mention {o.name}, so they are probably not official.</div>}
                    {list.map(c => (
                      <div key={c.handle} className="cv-cand">
                        <div style={{minWidth:0,flex:1}}>
                          <a href={c.url} target="_blank" rel="noreferrer" style={{fontSize:12.5,fontWeight:800,color:C.accent,textDecoration:'none'}}>@{c.handle}</a>
                          {c.handleMatch && <span className="cv-chip" style={{marginLeft:7,padding:'1px 7px',fontSize:10,background:'#dcfce7',borderColor:'#86efac',color:'#166534'}}>name matches</span>}
                          <div style={{fontSize:11,color:C.textMute,marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{c.title}</div>
                        </div>
                        <Btn variant="secondary" onClick={() => save(c.platform, c.handle, 'search')} disabled={!!busy} style={{padding:'4px 10px',fontSize:11.5}}>Use</Btn>
                      </div>
                    ))}
                  </div>
                );
              })}
              <div style={{fontSize:10.5,color:C.textMute}}>Open each link to check it first. Used {found.credits} Tavily credit{found.credits === 1 ? '' : 's'}.</div>
            </div>
          )}
        </div>

        {(have.has('youtube') || have.has('mastodon')) && <div className="cv-sec"><div className="cv-h">Recent videos and posts</div><CivicPosts k={key}/></div>}

        {(o.address || o.email || o.phone) && (
          <div className="cv-sec"><div className="cv-h">Contact details</div>
            <dl className="cv-facts">
              {o.email && <><dt>Email</dt><dd><a href={'mailto:' + o.email} style={{color:C.accent,textDecoration:'none',fontWeight:700}}>{o.email}</a></dd></>}
              {o.phone && <><dt>Phone</dt><dd>{o.phone}</dd></>}
              {o.address && <><dt>Office</dt><dd>{o.address}</dd></>}
            </dl>
          </div>
        )}

        <div className="cv-sec" style={{fontSize:10.5,color:C.textMute,lineHeight:1.6}}>
          {o.sourceNote ? o.sourceNote + ' ' : ''}{o.sourceUrl ? <>Source: <a href={o.sourceUrl} target="_blank" rel="noreferrer" style={{color:C.textMid}}>{o.sourceUrl.replace(/^https?:\/\//, '').slice(0, 60)}</a> · </> : null}checked {civicDate(o.asOf)}. Photos are fetched and kept by Lateral on this computer. People move and seats change; "Re-check officials" refreshes this.
          {o.source && (
            <div style={{marginTop:8}}>
              <button onClick={async () => { const d = await civicPost('office/remove', { key }); if (!d.error) { onUpdate(d.profile); onClose && onClose(); } }}
                style={{background:'none',border:'none',cursor:'pointer',color:'#991b1b',fontSize:11.5,fontWeight:700,padding:0}}>Remove {o.name.split(' ')[0]} from my list</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// Outlines of your districts, drawn on this computer from public Census boundaries: no map service is contacted, so nothing
// reveals which area you are looking at.
const MAP_ORDER = ['state', 'school', 'place', 'stateSenate', 'stateHouse', 'congress', 'congressNext'];
function CivicMap({ civic, onSelect, selKey }) {
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [on, setOn] = useState({ congress: true, place: true });
  const [hover, setHover] = useState('');
  useEffect(() => {
    let alive = true;
    civicJson('shapes').then(d => {
      if (!alive) return;
      if (d.error) { setErr(d.error); return; }
      setData(d);
      if (d.boundaryChange) setOn(o => ({ ...o, congressNext: true }));
    });
    return () => { alive = false; };
  }, [civic && civic.asOf]);
  const officials = (civic && civic.officials) || [];
  const selOfficial = selKey ? officials.find(o => civicKey(o) === selKey) : null;
  const selId = selOfficial ? civicLayerFor(selOfficial) : '';
  // Selecting someone switches their district's outline on.
  useEffect(() => { if (selId) setOn(o => (o[selId] ? o : { ...o, [selId]: true })); }, [selId]);
  const T = {
    state: { color: '#9ca3af', fill: 0.18, label: 'State' },
    school: { color: '#16a34a', fill: 0.12, label: 'School district' },
    place: { color: '#7c3aed', fill: 0.16, label: 'City' },
    stateSenate: { color: '#0ea5e9', fill: 0.10, label: 'State senate' },
    stateHouse: { color: '#f59e0b', fill: 0.16, label: 'State house' },
    congress: { color: C.accent, fill: 0.16, label: 'Congress' },
    congressNext: { color: '#dc2626', fill: 0, label: 'Congress, new map', dash: '7 5' },
  };
  if (err) return <div style={{fontSize:12.5,color:C.textMute,lineHeight:1.6}}>The map could not be loaded ({err}). Everything else on this page still works.</div>;
  if (!data) return <div style={{fontSize:12.5,color:C.textMute}}>Loading outlines…</div>;
  const layers = MAP_ORDER.map(id => (data.layers || []).find(l => l.id === id)).filter(Boolean);
  const ringsOf = g => !g ? [] : g.type === 'Polygon' ? g.coordinates : g.type === 'MultiPolygon' ? g.coordinates.flat() : [];
  const shown = layers.filter(l => on[l.id]);
  const fit = shown.filter(l => l.id !== 'state').length ? shown.filter(l => l.id !== 'state') : shown;
  const W = 640, H = 400, PAD = 14;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  fit.forEach(l => ringsOf(l.geometry).forEach(r => r.forEach(([x, y]) => { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; })));
  const ready = isFinite(minX);
  const kx = ready ? Math.cos(((minY + maxY) / 2) * Math.PI / 180) : 1;
  const spanX = ready ? Math.max((maxX - minX) * kx, 1e-6) : 1, spanY = ready ? Math.max(maxY - minY, 1e-6) : 1;
  const s = Math.min((W - 2 * PAD) / spanX, (H - 2 * PAD) / spanY);
  const ox = (W - spanX * s) / 2, oy = (H - spanY * s) / 2;
  const pathOf = g => ringsOf(g).map(r => r.map(([x, y], i) => (i ? 'L' : 'M') + (ox + (x - minX) * kx * s).toFixed(1) + ' ' + (oy + (maxY - y) * s).toFixed(1)).join('') + 'Z').join('');
  const whoFor = id => id === 'congress' || id === 'congressNext' ? officials.find(o => o.level === 'federal' && /Representative|Delegate/.test(o.office))
    : id === 'stateSenate' ? officials.find(o => o.office === 'State Senator') : id === 'stateHouse' ? officials.find(o => o.office === 'State Representative') : id === 'place' ? officials.find(o => o.office === 'Mayor') : null;
  const hovered = layers.find(l => l.id === hover);
  const lit = id => hover === id || selId === id;
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block',background:C.bg,border:`1px solid ${C.borderLight}`,borderRadius:8}} role="img" aria-label="Outlines of your districts">
        {ready && layers.filter(l => on[l.id]).map(l => (
          <path key={l.id} d={pathOf(l.geometry)} fillRule="evenodd" fill={T[l.id].color} fillOpacity={lit(l.id) ? T[l.id].fill + 0.18 : T[l.id].fill}
            stroke={T[l.id].color} strokeWidth={(l.id === 'congress' || l.id === 'congressNext' ? 2.2 : 1.5) + (selId === l.id ? 1 : 0)} strokeDasharray={T[l.id].dash} strokeLinejoin="round"
            onMouseEnter={() => setHover(l.id)} onMouseLeave={() => setHover('')}><title>{l.label}</title></path>
        ))}
        {!ready && <text x={W / 2} y={H / 2} textAnchor="middle" fill={C.textMute} fontSize="13">Turn a layer on to see it.</text>}
        {hovered && <text x="12" y="22" fill={C.text} fontSize="13" fontWeight="700">{hovered.label}</text>}
      </svg>
      <div style={{display:'flex',flexDirection:'column',gap:4,marginTop:10}}>
        {layers.map(l => {
          const who = whoFor(l.id);
          const whoOn = who && civicKey(who) === selKey;
          return (
            <div key={l.id} style={{display:'flex',alignItems:'center',gap:8,fontSize:12.5}} onMouseEnter={() => setHover(l.id)} onMouseLeave={() => setHover('')}>
              <button onClick={() => setOn(o => ({ ...o, [l.id]: !o[l.id] }))} title={on[l.id] ? 'Hide this outline' : 'Show this outline'}
                style={{display:'inline-flex',alignItems:'center',gap:7,background:'none',border:'none',cursor:'pointer',padding:'2px 0',color:on[l.id] ? C.text : C.textMute,fontWeight:700,fontSize:12.5}}>
                <span style={{width:14,height:14,borderRadius:3,border:`2px ${T[l.id].dash ? 'dashed' : 'solid'} ${T[l.id].color}`,background:on[l.id] ? T[l.id].color + '55' : 'transparent',flexShrink:0}}/>
                {l.label}
              </button>
              {who && <button onClick={() => onSelect(civicKey(who))} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontSize:12,fontWeight:whoOn ? 900 : 700,textDecoration:whoOn ? 'underline' : 'none',padding:0}}>{who.name} →</button>}
            </div>
          );
        })}
      </div>
      {data.boundaryChange && <div style={{marginTop:10,fontSize:12,color:'#92400e',background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:8,padding:'7px 10px',lineHeight:1.5}}>The congressional boundaries are being redrawn. The dashed red outline is the new map for the next Congress; it differs from the current one (solid), so your representation could change in January.</div>}
      <div style={{fontSize:11,color:C.textMute,marginTop:8,lineHeight:1.5}}>Outlines only, drawn on this computer from Census boundaries. No map service is contacted, so nothing reveals where you are looking. Your address is not used or stored.</div>
    </div>
  );
}

// What to watch: each switch creates an ordinary story that Lateral keeps up to date and alerts on. Some sources use an optional
// free key, set up here the way the Tavily key is.
function CivicWatch({ civicAsOf, onAddStory, onOpenStory }) {
  const [d, setD] = useState(null);
  const [busy, setBusy] = useState('');
  const [msg, setMsg] = useState({});
  const [topics, setTopics] = useState('');
  const [keyOpen, setKeyOpen] = useState('');
  const [keyVal, setKeyVal] = useState('');
  const [keyNote, setKeyNote] = useState('');
  const card = {background:C.surface,border:`1px solid ${C.borderLight}`,borderRadius:10,padding:'14px 16px',marginBottom:14};
  const eyebrow = {fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:8};
  const load = () => civicJson('watch/list').then(x => { if (!x.error) { setD(x); setTopics(t => t || (x.topics || []).join(', ')); } });
  useEffect(() => { load(); }, [civicAsOf]);
  const say = (id, text) => setMsg(m => ({ ...m, [id]: text }));
  const topicList = () => topics.split(',').map(t => t.trim()).filter(Boolean).slice(0, 5);

  async function start(w) {
    setBusy(w.id); say(w.id, '');
    const rules = w.id === 'rules', list = topicList();
    if (rules && !list.length) { say(w.id, 'Type at least one topic first, for example: broadband, Lake Erie'); setBusy(''); return; }
    if (rules) { const r = await civicPost('watch/topics', { topics: list }); if (r.error) { say(w.id, r.error); setBusy(''); return; } }
    // Look first, so a source that is down or needs a key never leaves an empty story behind.
    const probe = await civicJson(`watch/items?kind=${w.id}&fresh=1`);
    if (probe.error) { say(w.id, probe.error); if (probe.needsKey) { setKeyOpen(probe.needsKey); setKeyNote(''); } setBusy(''); return; }
    const story = {
      id: uid(), status: 'active', civicWatch: w.id, createdAt: now(), updatedAt: now(), episodes: [],
      title: rules ? `Federal rules: ${list.join(', ')}` : w.title,
      summary: rules ? `Follows federal proposed and final rules about ${list.join(', ')}, with public-comment deadlines, from the Federal Register, plus news. Part of your Civic profile.` : w.summary,
      tags: rules ? ['civic', 'federal rules', ...list.slice(0, 3)] : w.tags, actors: w.actors || [],
    };
    onAddStory(story);
    const lk = await civicPost('watch/link', { kind: w.id, storyId: story.id, topics: rules ? list : undefined });
    if (lk.error) say(w.id, lk.error);
    setCacheEntry(story.id, 'headlines', { items: probe.items || [], videos: [], socials: [], queries: [], filtered: [] });
    setBusy(''); load();
  }
  async function stop(w) { await civicPost('watch/unlink', { kind: w.id }); load(); }
  async function saveKey(which) {
    setKeyNote('Saving…');
    const r = await civicPost('watch/key', { which, key: keyVal });
    if (r.error) { setKeyNote(r.error); return; }
    if (keyVal.trim()) { const t = await civicPost('watch/key/test', { which }); setKeyNote(t.ok ? 'Saved, and it works.' : `Saved, but: ${t.error || 'it did not check out.'}`); }
    else setKeyNote('Removed.');
    setKeyVal(''); load();
  }

  if (!d || !d.hasProfile) return null;
  const KEY_HELP = {
    congress: { name: 'Congress.gov', steps: 'Request a free key at the page below (it is emailed to you within a minute), then paste it here.' },
    openstates: { name: 'Open States', steps: 'Sign in (or sign up, free) at the page below. Your API key is shown on your profile page. Paste it here.' },
  };
  return (
    <div style={card}>
      <div style={eyebrow}>Watching</div>
      <div style={{fontSize:12.5,color:C.textMid,lineHeight:1.6,marginBottom:6}}>Switch on what you want to follow. Each one becomes a story in your list, kept up to date, and Lateral alerts you when a bill moves, a meeting is tomorrow, or a public-comment period is closing (choose where in Settings → Alerts).</div>
      {d.watches.map(w => {
        const ks = w.keyKind ? d.keys[w.keyKind] : null, help = w.keyKind ? KEY_HELP[w.keyKind] : null;
        return (
          <div key={w.id} style={{padding:'12px 0',borderTop:`1px solid ${C.borderLight}`}}>
            <div style={{display:'flex',gap:12,alignItems:'flex-start',flexWrap:'wrap'}}>
              <div style={{flex:'1 1 260px',minWidth:0}}>
                <div style={{fontSize:13,fontWeight:800,color:C.text}}>{w.id === 'rules' && w.watching && d.topics.length ? `Federal rules: ${d.topics.join(', ')}` : w.title}</div>
                <div style={{fontSize:12,color:C.textMute,lineHeight:1.55,marginTop:2}}>{w.blurb}</div>
              </div>
              <div style={{flexShrink:0,display:'flex',gap:6,alignItems:'center'}}>
                {w.watching ? (
                  <>
                    <span style={{fontSize:11.5,fontWeight:800,color:'#166534'}}>✓ Watching</span>
                    <Btn variant="secondary" onClick={() => onOpenStory(w.storyId)} style={{padding:'5px 10px',fontSize:11.5}}>Open story</Btn>
                    <Btn variant="ghost" onClick={() => stop(w)} style={{padding:'5px 10px',fontSize:11.5}}>Stop</Btn>
                  </>
                ) : <Btn onClick={() => start(w)} disabled={!!busy || !w.available} style={{padding:'6px 14px',fontSize:12}}>{busy === w.id ? 'Starting…' : 'Watch'}</Btn>}
              </div>
            </div>
            {w.id === 'rules' && !w.watching && (
              <input value={topics} onChange={e => setTopics(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') start(w); }} placeholder="Topics, separated by commas (for example: broadband, Lake Erie)" style={{...inputStyle,fontSize:12.5,padding:'6px 10px',marginTop:8}}/>
            )}
            {msg[w.id] && <div style={{marginTop:7,fontSize:12,color:'#991b1b',lineHeight:1.5}}>{msg[w.id]}</div>}
            {w.watching && w.id === 'rules' && <div style={{marginTop:6,fontSize:11.5,color:C.textMute}}>To change the topics, stop this watch and start it again.</div>}
            {ks && (
              <div style={{marginTop:7,fontSize:11.5,color:C.textMute,lineHeight:1.55}}>
                {ks.configured ? `Using your ${help.name} key. ` : ks.usesDemo ? `Using a shared demo key, limited to about 10 requests an hour. ` : `Needs a free ${help.name} key. `}
                <button onClick={() => { setKeyOpen(keyOpen === w.keyKind ? '' : w.keyKind); setKeyNote(''); setKeyVal(''); }} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontWeight:700,fontSize:11.5,padding:0}}>{ks.configured ? 'Change or remove' : 'Add a free key'}</button>
              </div>
            )}
            {ks && keyOpen === w.keyKind && (
              <div style={{marginTop:9,padding:'11px 12px',background:C.bg,border:`1px solid ${C.borderLight}`,borderRadius:8}}>
                <div style={{fontSize:12,color:C.textMid,lineHeight:1.6,marginBottom:8}}>{help.steps}<br/><a href={ks.signup} target="_blank" rel="noreferrer" style={{color:C.accent,fontWeight:700,textDecoration:'none'}}>{ks.signup.replace(/^https?:\/\//, '')} →</a></div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                  <input value={keyVal} onChange={e => setKeyVal(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && keyVal.trim()) saveKey(w.keyKind); }} placeholder={ks.configured ? 'Paste a new key, or leave empty to remove' : 'Paste your key'} style={{...inputStyle,fontSize:12.5,padding:'6px 10px',flex:'1 1 220px',minWidth:0}} autoComplete="off" spellCheck={false}/>
                  <Btn onClick={() => saveKey(w.keyKind)} disabled={!keyVal.trim() && !ks.configured} style={{padding:'6px 12px',fontSize:12}}>{keyVal.trim() || !ks.configured ? 'Save and check' : 'Remove key'}</Btn>
                  <button onClick={() => { setKeyOpen(''); setKeyNote(''); }} style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:12}}>Close</button>
                </div>
                {keyNote && <div style={{marginTop:8,fontSize:12,color:/works|Saved\.|Removed/.test(keyNote) ? '#166534' : '#991b1b'}}>{keyNote}</div>}
                <div style={{fontSize:11,color:C.textMute,marginTop:8,lineHeight:1.5}}>The key stays on this computer and is never included in exports.</div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// Center panel: first-time setup, or the overview (districts, map, who was found). A person's full profile opens in the right column.
// Mayor, county, courts, sheriff and school board: found with the free sources that exist, or with an opt-in web search, and always
// confirmed (or typed) by the person.
function CivicOffices({ civic, onChange, onSelect, card, eyebrow }) {
  const cat = (civic.offices && civic.offices.catalog) || [];
  const presets = (civic.offices && civic.offices.presets) || [];
  const people = civic.officials || [];
  const [busy, setBusy] = useState('');
  const [err, setErr] = useState('');
  const [found, setFound] = useState(null);       // a search result: { id, answer, sources, candidates, note, credits }
  const [pick, setPick] = useState({});
  const [form, setForm] = useState(null);         // a hand entry: { id, office, name, email, phone, website }
  const keyOf = o => civicKey(o);
  const reset = () => { setFound(null); setPick({}); setForm(null); setErr(''); };

  async function search(id) {
    reset(); setBusy('search:' + id);
    const d = await civicPost('office/discover', { officeId: id });
    setBusy('');
    if (d.error) { setErr(d.error); return; }
    setFound({ ...d, id });
    setPick(Object.fromEntries((d.candidates || []).map(c => [c.name, (d.candidates || []).length === 1])));
  }
  async function confirm() {
    const chosen = found.candidates.filter(c => pick[c.name]);
    if (!chosen.length) return;
    setBusy('save');
    const d = await civicPost('office/add', { officeId: found.id, source: 'search', people: chosen.map(c => ({ name: c.name, role: c.role, sourceUrl: c.sourceUrl })) });
    setBusy('');
    if (d.error) { setErr(d.error); return; }
    onChange(d.profile); reset();
  }
  async function saveForm() {
    setBusy('save'); setErr('');
    const isCat = cat.some(c => c.id === form.id);
    const d = await civicPost('office/add', { source: 'manual', ...(isCat ? { officeId: form.id } : { office: form.office === 'Other' ? form.other : form.office }), name: form.name, email: form.email, phone: form.phone, website: form.website });
    setBusy('');
    if (d.error) { setErr(d.error); return; }
    onChange(d.profile); reset();
  }
  async function lookAgain(id) {
    setBusy('restore'); setErr('');
    const d = await civicPost('office/restore', { officeId: id });
    setBusy('');
    if (d.error) setErr(d.error); else onChange(d.profile);
  }
  const mini = {padding:'5px 11px',fontSize:12};
  const chip = {display:'inline-flex',alignItems:'center',gap:6,fontSize:12,fontWeight:700,color:C.text,background:C.bg,border:`1px solid ${C.border}`,borderRadius:14,padding:'3px 10px',cursor:'pointer'};

  return (
    <div style={card}>
      <div style={eyebrow}>Other local offices</div>
      <div style={{fontSize:12.5,color:C.textMid,lineHeight:1.6,marginBottom:10}}>
        The mayor is read from Wikidata automatically. For the county, its courts, the sheriff and your school board there is no single free list for every place, so Lateral can search the web for you (one Tavily credit each) and show what it found with its sources. Nothing is saved until you confirm it, and you can always add someone by hand.
      </div>
      {cat.map(c => {
        const mine = people.filter(o => o.officeId === c.id);
        const isOpen = found && found.id === c.id, isForm = form && form.id === c.id;
        return (
          <div key={c.id} style={{padding:'10px 0',borderTop:`1px solid ${C.borderLight}`}}>
            <div style={{display:'flex',alignItems:'baseline',gap:8,flexWrap:'wrap'}}>
              <div style={{fontSize:13,fontWeight:800,color:C.text}}>{c.title}</div>
              {!c.available && <span style={{fontSize:11.5,color:C.textMute}}>{c.hint}</span>}
            </div>
            {mine.length > 0 && <div style={{display:'flex',gap:6,flexWrap:'wrap',margin:'7px 0 2px'}}>{mine.map(o => <button key={keyOf(o)} style={chip} onClick={() => onSelect(keyOf(o))} title={o.sourceNote || ''}>{o.name}{o.role ? <span style={{fontWeight:500,color:C.textMute}}> · {o.role}</span> : null}</button>)}</div>}
            {mine.length === 0 && c.available && <div style={{fontSize:12,color:C.textMute,marginTop:3}}>{c.dismissed ? 'You removed this one.' : c.via === 'wikidata' ? 'Nobody found on Wikidata for your city.' : 'Nobody on file yet.'}</div>}
            {c.available && !isOpen && !isForm && (
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:7,alignItems:'center'}}>
                {c.via === 'search' && <Btn variant="secondary" onClick={() => search(c.id)} disabled={!!busy} style={mini}>{busy === 'search:' + c.id ? 'Searching the web…' : mine.length ? 'Search again' : 'Find with a web search'}</Btn>}
                {c.via === 'wikidata' && c.dismissed && <Btn variant="secondary" onClick={() => lookAgain(c.id)} disabled={!!busy} style={mini}>Look on Wikidata again</Btn>}
                <Btn variant="ghost" onClick={() => { reset(); setForm({ id: c.id, name: '', email: '', phone: '', website: '' }); }} disabled={!!busy} style={mini}>{c.multi || !mine.length ? 'Add by hand' : 'Replace by hand'}</Btn>
                {c.via === 'search' && busy !== 'search:' + c.id && <span style={{fontSize:11,color:C.textMute}}>1 Tavily credit</span>}
              </div>
            )}
            {isOpen && (
              <div style={{marginTop:9,background:C.bg,border:`1px solid ${C.borderLight}`,borderRadius:8,padding:'10px 12px'}}>
                {found.answer && <div style={{fontSize:12.5,color:C.text,lineHeight:1.6,marginBottom:8}}>{found.answer}</div>}
                {found.note && <div style={{fontSize:11.5,color:'#92400e',background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:8,padding:'6px 9px',marginBottom:8,lineHeight:1.5}}>{found.note}</div>}
                {found.candidates.length > 0 && (
                  <div style={{marginBottom:8}}>
                    <div className="cv-tag" style={{marginBottom:4}}>Found in the results · tick the ones that are right</div>
                    {found.candidates.map(cd => (
                      <label key={cd.name} style={{display:'flex',alignItems:'baseline',gap:8,fontSize:12.5,padding:'3px 0',cursor:'pointer'}}>
                        <input type="checkbox" checked={!!pick[cd.name]} onChange={e => setPick(p => ({ ...p, [cd.name]: e.target.checked }))}/>
                        <span style={{fontWeight:700,color:C.text}}>{cd.name}</span>
                        {cd.role && <span style={{color:C.textMute}}>{cd.role}</span>}
                        {cd.sourceUrl && <a href={cd.sourceUrl} target="_blank" rel="noreferrer" style={{marginLeft:'auto',fontSize:11,color:C.accent,textDecoration:'none',fontWeight:700}}>source ↗</a>}
                      </label>
                    ))}
                  </div>
                )}
                {found.sources.length > 0 && (
                  <div style={{fontSize:11,color:C.textMute,lineHeight:1.6,marginBottom:8}}>Sources: {found.sources.slice(0, 5).map((s, i) => <React.Fragment key={i}>{i ? ' · ' : ''}<a href={s.url} target="_blank" rel="noreferrer" style={{color:C.textMid}}>{s.title.slice(0, 40) || s.url.replace(/^https?:\/\//, '').slice(0, 30)}</a></React.Fragment>)}</div>
                )}
                <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                  {found.candidates.length > 0 && <Btn onClick={confirm} disabled={!!busy || !found.candidates.some(cd => pick[cd.name])} style={mini}>{busy === 'save' ? 'Saving…' : 'Add the ticked ones'}</Btn>}
                  <Btn variant="ghost" onClick={() => { const id = c.id; reset(); setForm({ id, name: '', email: '', phone: '', website: '' }); }} style={mini}>Add by hand instead</Btn>
                  <button onClick={reset} style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:12}}>Close</button>
                  <span style={{fontSize:11,color:C.textMute}}>Used {found.credits} Tavily credit. Open the sources to check before you add anyone.</span>
                </div>
              </div>
            )}
            {isForm && <CivicOfficeForm form={form} setForm={setForm} presets={presets} fixed busy={busy === 'save'} onSave={saveForm} onCancel={reset}/>}
          </div>
        );
      })}
      <div style={{padding:'10px 0 0',borderTop:`1px solid ${C.borderLight}`}}>
        {form && form.id === 'other'
          ? <CivicOfficeForm form={form} setForm={setForm} presets={presets} busy={busy === 'save'} onSave={saveForm} onCancel={reset}/>
          : <Btn variant="ghost" onClick={() => { reset(); setForm({ id: 'other', office: 'County Auditor', other: '', name: '', email: '', phone: '', website: '' }); }} disabled={!!busy} style={mini}>Add another local official</Btn>}
      </div>
      {err && <div style={{marginTop:9,fontSize:12.5,color:'#991b1b',lineHeight:1.5}}>{err}</div>}
    </div>
  );
}

function CivicOfficeForm({ form, setForm, presets, fixed, busy, onSave, onCancel }) {
  const set = (k, v) => setForm({ ...form, [k]: v });
  const f = {...inputStyle, fontSize:12.5, padding:'7px 10px'};
  return (
    <div style={{marginTop:9,display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(170px, 1fr))',gap:8,alignItems:'end'}}>
      {!fixed && (
        <div><label style={labelStyle}>Office</label>
          <select value={form.office} onChange={e => set('office', e.target.value)} style={f}>{presets.map(p => <option key={p} value={p}>{p}</option>)}</select>
          {form.office === 'Other' && <input value={form.other} onChange={e => set('other', e.target.value)} placeholder="Office title" style={{...f,marginTop:6}}/>}
        </div>
      )}
      <div><label style={labelStyle}>Name</label><input value={form.name} autoFocus onChange={e => set('name', e.target.value)} placeholder="First Last" style={f}/></div>
      <div><label style={labelStyle}>Email (optional)</label><input value={form.email} onChange={e => set('email', e.target.value)} style={f}/></div>
      <div><label style={labelStyle}>Phone (optional)</label><input value={form.phone} onChange={e => set('phone', e.target.value)} style={f}/></div>
      <div><label style={labelStyle}>Website (optional)</label><input value={form.website} onChange={e => set('website', e.target.value)} placeholder="https://" style={f}/></div>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <Btn onClick={onSave} disabled={busy || !form.name.trim()} style={{padding:'7px 12px',fontSize:12}}>{busy ? 'Saving…' : 'Save'}</Btn>
        <button onClick={onCancel} style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:12}}>Cancel</button>
      </div>
    </div>
  );
}

// Local media: links to the newspapers, weekly and alternative papers, TV and radio stations that cover where you live. Found from
// Wikipedia's lists for your city and county (volunteer-edited, so add what is missing), plus anything you add, plus an opt-in web
// search. A side menu on a wide pane; a collapsible card on a narrow one.
const MEDIA_KINDS = [['gov', 'Government'], ['paper', 'Newspapers and magazines'], ['tv', 'Television'], ['online', 'News sites'], ['radio', 'Radio']];
function CivicMedia({ civic, compact, card, eyebrow }) {
  const [d, setD] = useState(null);
  const [busy, setBusy] = useState('');
  const [err, setErr] = useState('');
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({ name: '', url: '', kind: 'paper' });
  const [cands, setCands] = useState(null);
  const [picked, setPicked] = useState({});
  const [confirmSearch, setConfirmSearch] = useState(false);
  const [open, setOpen] = useState({ radio: false, hidden: false, card: false });
  const load = () => civicJson('media/list').then(x => { if (!x.error) setD(x); });
  useEffect(() => { setD(null); load(); }, [civic.label]);
  const apply = x => { if (x.error) { setErr(x.error); return false; } setErr(''); setD(x); return true; };

  async function addOutlet() {
    setBusy('add');
    const x = await civicPost('media/add', form);
    setBusy('');
    if (apply(x)) { setForm({ name: '', url: '', kind: 'paper' }); setAdding(false); }
  }
  async function search() {
    setConfirmSearch(false); setBusy('search'); setErr('');
    const x = await civicPost('media/search', {});
    setBusy('');
    if (x.error) { setErr(x.error); return; }
    setCands(x.candidates || []); setPicked({});
  }
  async function addPicked() {
    setBusy('add');
    let last = null;
    for (const c of cands.filter(c => picked[c.url])) last = await civicPost('media/add', { name: c.name, url: c.url, kind: c.kind, source: 'search' });
    setBusy('');
    if (last) apply(last);
    setCands(null);
  }
  const hide = async it => { apply(await civicPost(it.manual ? 'media/remove' : 'media/hide', it.manual ? { id: it.id } : { key: it.key })); };
  const restore = async it => { apply(await civicPost('media/restore', { key: it.key })); };

  const small = {fontSize:11.5,color:C.textMute,lineHeight:1.5};
  const link = {background:'none',border:'none',cursor:'pointer',color:C.accent,fontWeight:700,fontSize:11.5,padding:0,textAlign:'left'};
  const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
  const row = (it, i) => (
    <div key={it.key || i} style={{display:'flex',alignItems:'flex-start',gap:6,padding:'4px 0'}}>
      <a href={it.url} target="_blank" rel="noopener noreferrer" title={it.desc || it.url} style={{flex:1,minWidth:0,textDecoration:'none',lineHeight:1.3}}>
        <span style={{display:'block',fontSize:12.5,fontWeight:700,color:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.name}{it.manual ? ' ★' : ''}</span>
        <span style={{display:'block',fontSize:10.5,color:C.textMute,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{hostOf(it.url)}</span>
      </a>
      <button onClick={() => hide(it)} title={it.manual ? 'Remove this outlet' : 'Hide this outlet'} style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:13,lineHeight:1,padding:'1px 2px'}}>✕</button>
    </div>
  );
  const groups = d ? d.groups : {};
  const total = d ? Object.values(groups).reduce((n, g) => n + g.length, 0) : 0;

  const body = (
    <div>
      {!d && <div style={small}>Looking up the papers and stations for {civic.label}…</div>}
      {d && total === 0 && !d.error && <div style={small}>Nothing was found automatically. Add your local sites and papers below, or try a web search.</div>}
      {d && d.error && total === 0 && <div style={{...small,color:'#991b1b'}}>{d.error} <button onClick={async () => apply(await civicPost('media/refresh', {}))} style={link}>Try again</button></div>}
      {MEDIA_KINDS.map(([kind, label]) => {
        const list = groups[kind] || [];
        if (!list.length) return null;
        const collapsed = kind === 'radio' && !open.radio;
        return (
          <div key={kind} style={{marginTop:10}}>
            {kind === 'radio'
              ? <button onClick={() => setOpen(o => ({ ...o, radio: !o.radio }))} style={{...link,color:C.textMute,fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.07em'}}>{open.radio ? '▾' : '▸'} {label} ({list.length})</button>
              : <div style={{fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:2}}>{label}</div>}
            {!collapsed && list.map(row)}
          </div>
        );
      })}

      {d && (d.quick || []).length > 0 && (
        <div style={{marginTop:12,paddingTop:10,borderTop:`1px solid ${C.borderLight}`}}>
          <div style={{fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:3}}>Look up</div>
          {d.quick.map(q => <div key={q.url} style={{padding:'2px 0'}}><a href={q.url} target="_blank" rel="noopener noreferrer" style={{fontSize:12,fontWeight:600,color:C.accent,textDecoration:'none'}}>{q.name} ↗</a></div>)}
        </div>
      )}

      <div style={{marginTop:12,paddingTop:10,borderTop:`1px solid ${C.borderLight}`,display:'flex',flexDirection:'column',gap:6}}>
        {adding ? (
          <div>
            <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Name, e.g. Toledo Journal or County Auditor" style={{...inputStyle,fontSize:12,padding:'5px 8px',marginBottom:5}}/>
            <input value={form.url} onChange={e => setForm({ ...form, url: e.target.value })} onKeyDown={e => { if (e.key === 'Enter') addOutlet(); }} placeholder="Web address, e.g. toledojournal.com" style={{...inputStyle,fontSize:12,padding:'5px 8px',marginBottom:5}}/>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <select value={form.kind} onChange={e => setForm({ ...form, kind: e.target.value })} style={{...inputStyle,width:'auto',flex:'none',fontSize:12,padding:'4px 6px'}}>
                <option value="paper">Newspaper</option><option value="tv">TV</option><option value="radio">Radio</option><option value="online">News site</option><option value="gov">Government site</option>
              </select>
              <Btn onClick={addOutlet} disabled={busy === 'add' || !form.url.trim()} style={{padding:'4px 10px',fontSize:11.5}}>Add</Btn>
              <button onClick={() => { setAdding(false); setErr(''); }} style={{...link,color:C.textMute,fontWeight:500}}>Cancel</button>
            </div>
          </div>
        ) : <button onClick={() => setAdding(true)} style={link}>+ Add an outlet</button>}

        {cands === null
          ? (confirmSearch
              ? <div style={small}>A web search uses one Tavily credit. <button onClick={search} style={link}>Search</button> <button onClick={() => setConfirmSearch(false)} style={{...link,color:C.textMute,fontWeight:500}}>Cancel</button></div>
              : <button onClick={() => setConfirmSearch(true)} disabled={busy === 'search'} style={link}>{busy === 'search' ? 'Searching…' : '⌕ Find more with a web search'}</button>)
          : (
            <div style={{padding:'8px 9px',background:C.bg,border:`1px solid ${C.borderLight}`,borderRadius:8}}>
              <div style={{...small,marginBottom:4}}>{cands.length ? 'Tick the ones that are local outlets, then add them:' : 'No new outlets turned up.'}</div>
              {cands.map(c => (
                <label key={c.url} style={{display:'flex',gap:6,alignItems:'flex-start',padding:'3px 0',cursor:'pointer',fontSize:12,color:C.text}}>
                  <input type="checkbox" checked={!!picked[c.url]} onChange={e => setPicked(p => ({ ...p, [c.url]: e.target.checked }))} style={{marginTop:2}}/>
                  <span style={{minWidth:0}}><strong>{c.name}</strong><span style={{display:'block',fontSize:10.5,color:C.textMute,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.host}</span></span>
                </label>
              ))}
              <div style={{display:'flex',gap:8,marginTop:6}}>
                {cands.length > 0 && <Btn onClick={addPicked} disabled={busy === 'add' || !Object.values(picked).some(Boolean)} style={{padding:'4px 10px',fontSize:11.5}}>Add ticked</Btn>}
                <button onClick={() => setCands(null)} style={{...link,color:C.textMute,fontWeight:500}}>Close</button>
              </div>
            </div>
          )}

        <button onClick={async () => { setBusy('refresh'); apply(await civicPost('media/refresh', {})); setBusy(''); }} disabled={busy === 'refresh'} style={{...link,color:C.textMute,fontWeight:500}}>{busy === 'refresh' ? 'Reading Wikipedia…' : '↻ Re-read Wikipedia'}</button>
        {d && d.hidden && d.hidden.length > 0 && (
          <div>
            <button onClick={() => setOpen(o => ({ ...o, hidden: !o.hidden }))} style={{...link,color:C.textMute,fontWeight:500}}>{open.hidden ? '▾' : '▸'} {d.hidden.length} hidden</button>
            {open.hidden && d.hidden.map(it => <div key={it.key} style={{display:'flex',gap:6,fontSize:11.5,color:C.textMute,padding:'2px 0'}}><span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.name}</span><button onClick={() => restore(it)} style={link}>Restore</button></div>)}
          </div>
        )}
        {err && <div style={{fontSize:11.5,color:'#991b1b',lineHeight:1.45}}>{err}</div>}
        <div style={{...small,fontSize:10.5}}>Found from Wikipedia's lists for your city and county, which volunteers edit, so a small paper can be missing. ★ marks ones you added.</div>
      </div>
    </div>
  );

  // A narrow pane: a collapsible card near the top. A wide pane: the side menu itself.
  if (compact) {
    return (
      <div style={card}>
        <button onClick={() => setOpen(o => ({ ...o, card: !o.card }))} style={{...eyebrow,background:'none',border:'none',cursor:'pointer',padding:0,marginBottom:open.card ? 8 : 0,display:'flex',gap:6,alignItems:'center',width:'100%'}}>
          <span>{open.card ? '▾' : '▸'}</span><span>Local media{d ? ` (${total})` : ''}</span><span style={{fontWeight:500,textTransform:'none',letterSpacing:0}}>government sites, papers, TV and radio</span>
        </button>
        {open.card && body}
      </div>
    );
  }
  return (
    <div style={{background:C.surface,border:`1px solid ${C.borderLight}`,borderRadius:10,padding:'13px 14px',maxHeight:'calc(100vh - 140px)',overflowY:'auto'}}>
      <div style={{...eyebrow,marginBottom:2}}>Local media</div>
      <div style={{...small,marginBottom:2}}>Government sites, papers, TV and radio for {d && d.place ? d.place : civic.label}</div>
      {body}
    </div>
  );
}

// Local news for the governments that represent you: your city and county first, then your state, then schools and the community.
// Searches are built from your profile (place, county, state, mayor, governor, school district), every group is judged against its own
// topic by the same relevance judge the stories use, repeats of one story are folded together, and anything removed can be restored.
const CIVIC_NEWS_KEY = 'lateral-civic-news-v1';
const CIVIC_NEWS_TTL = 3 * 3600 * 1000;
function civicNewsPlan(civic) {
  const j = civic.jurisdictions || {};
  const bare = s => String(s || '').replace(/\s+(city|town|village|borough|township|CDP)$/i, '').trim();
  const place = bare(j.place && j.place.name), county = String((j.county && j.county.name) || '').trim();
  const stName = (j.state && j.state.name) || '', st = (j.state && j.state.abbr) || '';
  const school = (j.schoolDistricts && j.schoolDistricts[0] && j.schoolDistricts[0].name) || '';
  const offs = civic.officials || [];
  const mayor = (offs.find(o => /^mayor$/i.test(o.office)) || {}).name || '';
  const gov = (offs.find(o => o.office === 'Governor') || {}).name || '';
  const where = place || county;
  const groups = [];
  const q = list => [...new Set(list.filter(Boolean))].slice(0, 5);
  if (where) {
    groups.push({
      key: 'city', title: place ? `${place}${county ? ' and ' + county : ''}: city and county government` : `${county}: county government`,
      queries: place
        ? q([`"${place}" city council ${st}`, `"${place}" mayor ${st}`, `${place} ${st} city government budget`, mayor && `"${mayor}" ${place}`, county && `"${county}" commissioners ${st}`])
        : q([`"${county}" commissioners ${st}`, `${county} ${st} county government`]),
      rctx: { topic: `Government and public affairs of ${where}, ${st || stName}`, ctx: `News about the government of ${where}${county && place ? ' and ' + county : ''}: city council and mayor, ordinances and budgets, city and county services, planning and zoning, public works, local elections and ballot measures, local courts. Not sports scores, entertainment, weather, or other cities.` },
    });
  }
  if (stName) {
    groups.push({
      key: 'state', title: `${stName}: state government`,
      queries: q([`${stName} legislature`, `${stName} state government ${where}`, gov ? `Governor ${gov} ${stName}` : `${stName} governor`]),
      rctx: { topic: `${stName} state government and politics`, ctx: `News about the government of ${stName}: the governor, the legislature, state agencies, state laws and budget, state courts, elections and ballot measures. Not other states, stories only about national politics, sports, or entertainment.` },
    });
  }
  if (where) {
    groups.push({
      key: 'community', title: school ? 'Schools and community' : `${where}: community`,
      queries: q([school && `"${school}" school board`, `${where} ${st} local news`]),
      rctx: { topic: `${school || where} schools and community news`, ctx: `News about ${school ? 'the ' + school + ' (school board, levies, schools) and ' : ''}the community of ${where}: local services, neighborhoods, development, public safety policy. Not sports scores or other places.` },
    });
  }
  return groups;
}

function CivicNews({ civic, onStartStory, card, eyebrow }) {
  const plan = React.useMemo(() => civicNewsPlan(civic), [civic.label, (civic.officials || []).length]);
  const cacheKey = civic.label || '';
  const readCache = () => { try { const c = JSON.parse(localStorage.getItem(CIVIC_NEWS_KEY)); return c && c.key === cacheKey ? c : null; } catch { return null; } };
  const [data, setData] = useState(readCache);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const runRef = React.useRef(0);

  function persist(next) { setData(next); try { localStorage.setItem(CIVIC_NEWS_KEY, JSON.stringify(next)); } catch {} }

  async function load() {
    if (!plan.length) return;
    const run = ++runRef.current;
    setBusy(true); setErr('');
    try {
      const out = {};
      await Promise.all(plan.map(async g => {
        const results = await Promise.all(g.queries.map(qq => searchArticles(qq).catch(() => [])));
        const seen = new Set();
        const merged = results.flat().filter(a => a && a.url && a.title && !seen.has(a.url) && seen.add(a.url) && !isSportsArticle(a))
          .sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))).slice(0, 18);
        const gate = await checkRelevance(g.rctx, merged);
        out[g.key] = { items: gate.kept, filtered: gate.filtered };
      }));
      if (run !== runRef.current) return;
      // A story shows up once: the first group (city, then state, then community) keeps it.
      const taken = new Set();
      for (const g of plan) {
        const grp = out[g.key] || { items: [], filtered: [] };
        grp.items = grp.items.filter(a => !taken.has(a.url)).slice(0, 9);
        grp.items.forEach(a => taken.add(a.url));
        out[g.key] = grp;
      }
      const total = Object.values(out).reduce((n, g) => n + g.items.length, 0);
      if (!total) setErr('No recent local stories came back. The news search may be down; try again in a moment.');
      persist({ key: cacheKey, at: Date.now(), groups: out });
      // Fill in pictures afterwards so the list appears first.
      const withImg = {};
      for (const g of plan) withImg[g.key] = { ...out[g.key], items: await attachImages(out[g.key].items).catch(() => out[g.key].items) };
      if (run === runRef.current) persist({ key: cacheKey, at: Date.now(), groups: withImg });
    } catch (e) { if (run === runRef.current) setErr(e.message || 'Could not load local news.'); }
    finally { if (run === runRef.current) setBusy(false); }
  }
  useEffect(() => {
    const c = readCache();
    if (!c || Date.now() - c.at > CIVIC_NEWS_TTL) load();
    return () => { runRef.current++; };
  }, [cacheKey]);

  function restore(g, a) {
    const { relevance, ...clean } = a;
    restoreRelevance(g.rctx, a);
    const cur = (data && data.groups[g.key]) || { items: [], filtered: [] };
    persist({ ...data, groups: { ...data.groups, [g.key]: { items: [...cur.items, clean].sort((x, y) => String(y.date || '').localeCompare(String(x.date || ''))), filtered: cur.filtered.filter(x => x.url !== a.url) } } });
  }

  if (!plan.length) return null;
  const ago = data && data.at ? (() => { const m = Math.max(0, Math.round((Date.now() - data.at) / 60000)); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} hr ago`; })() : '';
  const grid = { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(210px, 1fr))', gap: 10 };
  return (
    <div style={card}>
      <div style={{display:'flex',alignItems:'baseline',gap:10,flexWrap:'wrap',marginBottom:6}}>
        <div style={{...eyebrow,marginBottom:0}}>Local news</div>
        <span style={{fontSize:11.5,color:C.textMute}}>{busy ? (data ? 'Refreshing…' : 'Searching…') : ago ? `Updated ${ago}` : ''}</span>
        <button onClick={load} disabled={busy} style={{marginLeft:'auto',background:'none',border:'none',cursor:busy ? 'default' : 'pointer',color:busy ? C.textMute : C.accent,fontSize:12,fontWeight:700,padding:0}}>↻ Refresh</button>
      </div>
      <div style={{fontSize:12,color:C.textMute,lineHeight:1.55,marginBottom:10}}>What is being reported about the governments that represent you, city and county first, then your state. Stories that are not really about them are filtered out, and you can restore any.</div>
      {err && <div style={{fontSize:12,color:'#991b1b',marginBottom:8}}>{err}</div>}
      {!data && busy && <div style={{fontSize:12.5,color:C.textMute,padding:'10px 0'}}>Searching the news for {civic.label}…</div>}
      {plan.map(g => {
        const grp = data && data.groups && data.groups[g.key];
        if (!grp || (!grp.items.length && !grp.filtered.length)) return null;
        return (
          <div key={g.key} style={{marginTop:12}}>
            <div style={{fontSize:13,fontWeight:800,color:C.text,marginBottom:8,fontFamily:"'Playfair Display', Georgia, serif"}}>{g.title}</div>
            {grp.items.length === 0
              ? <div style={{fontSize:12,color:C.textMute}}>Nothing recent that is really about this.</div>
              : <div style={grid}><GroupedCards articles={grp.items} render={(a, also, i) => <ArticleCard key={a.url || i} article={a} also={also} onTrack={onStartStory ? () => onStartStory(a) : undefined}/>}/></div>}
            <FilteredOutList items={grp.filtered} onRestore={a => restore(g, a)} padX={0}/>
          </div>
        );
      })}
    </div>
  );
}

// Boards and agendas: a county board, a school board, a Granicus city or any feed, added by pasting an address. Each one can then be
// watched like the council (see CivicWatch). Nothing is added until you press Add.
const BOARD_SCOPES = [['county', 'County government'], ['school', 'School board'], ['city', 'City'], ['other', 'Something else']];
function CivicBoards({ civic, onChange, onChanged, card, eyebrow }) {
  const [boards, setBoards] = useState(null);
  const [sugg, setSugg] = useState([]);
  const [input, setInput] = useState('');
  const [prev, setPrev] = useState(null);
  const [scope, setScope] = useState('other');
  const [busy, setBusy] = useState('');
  const [err, setErr] = useState('');
  const [note, setNote] = useState('');
  const [confirm, setConfirm] = useState('');
  const loadBoards = () => civicJson('boards/list').then(d => { if (!d.error) setBoards(d.boards || []); });
  useEffect(() => {
    loadBoards();
    civicPost('boards/suggest', {}).then(d => { if (!d.error) setSugg(d.suggestions || []); });
  }, [civic.asOf]);
  const small = {fontSize:11.5,color:C.textMute,lineHeight:1.55};
  const link = {background:'none',border:'none',cursor:'pointer',color:C.accent,fontWeight:700,fontSize:12,padding:0};
  const kindLabel = { legistar: 'Legistar', granicus: 'Granicus', feed: 'Feed' };
  const scopeLabel = Object.fromEntries(BOARD_SCOPES);

  async function doPreview() {
    if (!input.trim() || busy) return;
    setBusy('preview'); setErr(''); setNote(''); setPrev(null);
    const d = await civicPost('boards/preview', { input });
    setBusy('');
    if (d.error) { setErr(d.error); return; }
    setPrev(d);
    if (d.kind === 'legistar' && /county/i.test(d.slug + ' ' + d.label)) setScope('county');
    else if (/school|education/i.test((d.label || '') + ' ' + (d.slug || ''))) setScope('school');
  }
  async function add(spec) {
    setBusy('add'); setErr(''); setNote('');
    const sc = spec.scope || scope;
    const d = await civicPost('boards/add', { ...spec, scope: sc });
    setBusy('');
    if (d.error) { setErr(d.error); return; }
    setPrev(null); setInput('');
    setSugg(s => s.filter(x => !(x.kind === spec.kind && x.slug && x.slug === spec.slug)));
    setNote(d.members ? `Added. ${d.members} member${d.members === 1 ? '' : 's'} read from its site${sc === 'school' ? ' (under School Board Member)' : ' (under County Commissioner)'}.` : `Added. Switch it on under Watching below to follow it.${d.memberNote ? ' (Members could not be read: ' + d.memberNote + ')' : ''}`);
    loadBoards(); onChanged();
    civicJson('profile').then(p => { if (!p.error) onChange(p.profile || null); });
  }
  async function remove(id) {
    setConfirm('');
    const d = await civicPost('boards/remove', { id });
    if (!d.error) { loadBoards(); onChanged(); civicJson('profile').then(p => { if (!p.error) onChange(p.profile || null); }); }
  }
  async function dismiss(s) { setSugg(x => x.filter(y => y.id !== s.id)); await civicPost('boards/dismiss', { id: s.id }); }
  const scopeSelect = (
    <select value={scope} onChange={e => setScope(e.target.value)} style={{...inputStyle,width:'auto',flex:'none',fontSize:12.5,padding:'5px 8px'}}>
      {BOARD_SCOPES.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
    </select>
  );

  return (
    <div style={card}>
      <div style={eyebrow}>Boards and agendas</div>
      <div style={{fontSize:12.5,color:C.textMid,lineHeight:1.6,marginBottom:8}}>
        A county board, a school board, or a city that publishes its meetings somewhere other than Legistar. Paste a <strong>Legistar</strong> or <strong>Granicus</strong> address, or a district or county website (Lateral looks for its news or agenda <strong>feed</strong>). Each board you add can then be watched like the council: meeting reminders, new agendas and items.
      </div>

      {sugg.map(s => (
        <div key={s.id} style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',padding:'8px 10px',margin:'6px 0',background:C.accent + '10',border:`1px solid ${C.borderLight}`,borderRadius:8}}>
          <div style={{flex:'1 1 240px',minWidth:0}}>
            <div style={{fontSize:12.5,fontWeight:800,color:C.text}}>Found: {s.label}</div>
            <div style={small}>{s.why} Add it to see your county's meetings and who sits on the board.</div>
          </div>
          <Btn onClick={() => add({ kind: s.kind, slug: s.slug, label: s.label, scope: s.scope })} disabled={!!busy} style={{padding:'5px 12px',fontSize:12}}>{busy === 'add' ? 'Adding…' : 'Add'}</Btn>
          <button onClick={() => dismiss(s)} style={{...link,color:C.textMute,fontWeight:500}}>Not mine</button>
        </div>
      ))}

      {(boards || []).map(b => (
        <div key={b.id} style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',padding:'7px 0',borderTop:`1px solid ${C.borderLight}`}}>
          <div style={{flex:'1 1 220px',minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,color:C.text}}>{b.label.replace(/\s*\((Legistar|Granicus)\)$/, '')}</div>
            <div style={small}><span style={{fontWeight:700,color:C.accent}}>{kindLabel[b.kind] || b.kind}</span> · {scopeLabel[b.scope] || 'Other'}</div>
          </div>
          {confirm === b.id
            ? <span style={{fontSize:12,color:C.textMid}}>Remove it? <button onClick={() => remove(b.id)} style={{...link,color:'#b91c1c'}}>Yes, remove</button> <button onClick={() => setConfirm('')} style={{...link,color:C.textMute,fontWeight:500}}>Keep</button></span>
            : <button onClick={() => setConfirm(b.id)} style={{...link,color:C.textMute,fontWeight:500}}>Remove</button>}
        </div>
      ))}

      <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginTop:10,paddingTop:10,borderTop:`1px solid ${C.borderLight}`}}>
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') doPreview(); }} placeholder="Paste an address: yourcounty.legistar.com, yourcity.granicus.com/…, or a website"
          style={{...inputStyle,flex:'1 1 280px',fontSize:12.5,padding:'7px 10px'}}/>
        <Btn variant="secondary" onClick={doPreview} disabled={!!busy || !input.trim()} style={{padding:'6px 12px',fontSize:12}}>{busy === 'preview' ? 'Looking…' : 'Look'}</Btn>
      </div>
      {err && <div style={{marginTop:8,fontSize:12,color:'#991b1b',lineHeight:1.5}}>{err}</div>}
      {note && <div style={{marginTop:8,fontSize:12,color:'#166534',lineHeight:1.5}}>{note}</div>}

      {prev && (prev.kind === 'feed'
        ? (
          <div style={{marginTop:10}}>
            <div style={{fontSize:12,fontWeight:700,color:C.text,marginBottom:4}}>{prev.feeds.length === 1 ? 'Found a feed' : `Found ${prev.feeds.length} feeds`}. Pick what kind of body this is, then add:</div>
            <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:6}}>{scopeSelect}</div>
            {prev.feeds.map(f => (
              <div key={f.url} style={{padding:'8px 10px',margin:'6px 0',background:C.bg,border:`1px solid ${C.borderLight}`,borderRadius:8}}>
                <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
                  <div style={{flex:'1 1 220px',minWidth:0,fontSize:12.5,fontWeight:700,color:C.text}}>{f.title} <span style={{...small,fontWeight:400}}>· {f.count} items</span></div>
                  <Btn onClick={() => add({ kind: 'feed', url: f.url, label: f.title })} disabled={!!busy} style={{padding:'5px 12px',fontSize:12}}>{busy === 'add' ? 'Adding…' : 'Add this feed'}</Btn>
                </div>
                {(f.items || []).map((i, k) => <div key={k} style={{...small,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{i.date ? civicDate(i.date) + ' · ' : ''}{i.title}</div>)}
              </div>
            ))}
          </div>
        ) : (
          <div style={{marginTop:10,padding:'9px 11px',background:C.bg,border:`1px solid ${C.borderLight}`,borderRadius:8}}>
            <div style={{fontSize:13,fontWeight:800,color:C.text}}>{prev.label}</div>
            {(prev.items || []).map((i, k) => <div key={k} style={{...small,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{i.date ? civicDate(i.date) + ' · ' : ''}{i.title}</div>)}
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginTop:8}}>
              {scopeSelect}
              <Btn onClick={() => add(prev.kind === 'legistar' ? { kind: 'legistar', slug: prev.slug, label: prev.label } : { kind: 'granicus', host: prev.host, viewId: prev.viewId, label: prev.label })} disabled={!!busy} style={{padding:'6px 14px',fontSize:12}}>{busy === 'add' ? 'Adding…' : 'Add this board'}</Btn>
              <button onClick={() => setPrev(null)} style={{...link,color:C.textMute,fontWeight:500}}>Cancel</button>
            </div>
            {prev.canListMembers && <div style={{...small,marginTop:6}}>For a county or school board on Legistar, Lateral also lists its members (with term dates) in your profile.</div>}
          </div>
        ))}
      <div style={{...small,marginTop:10}}>BoardDocs and similar portals do not offer a public feed, so they cannot be read. Many districts also publish a news or agenda feed, which can.</div>
    </div>
  );
}

function CivicCenter({ civic, selKey, onSelect, onChange, onAddStory, onOpenStory, onStartStory }) {
  const [bv, setBv] = useState(0);   // bumps when boards change, so the Watching card reloads
  const wrapRef = React.useRef(null);
  const [wide, setWide] = useState(false);   // room for the Local media side menu beside the cards
  useEffect(() => {
    const el = wrapRef.current;
    if (!el || typeof ResizeObserver === 'undefined') return;
    const measure = () => setWide(el.clientWidth >= 940);
    const ro = new ResizeObserver(measure);
    ro.observe(el); window.addEventListener('resize', measure); measure();
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, [!!civic]);
  const [address, setAddress] = useState('');
  const [busy, setBusy] = useState('');
  const [error, setError] = useState('');
  const [legistar, setLegistar] = useState('');
  const [confirmRemove, setConfirmRemove] = useState(false);
  const [showSources, setShowSources] = useState(false);
  const wrap = {flex:1,minWidth:0,overflowY:'auto',padding:'22px 28px 60px',background:C.bg};
  const card = {background:C.surface,border:`1px solid ${C.borderLight}`,borderRadius:10,padding:'14px 16px',marginBottom:14};
  const eyebrow = {fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:8};
  const title = {fontSize:24,fontWeight:900,color:C.text,fontFamily:"'Playfair Display', Georgia, serif",marginBottom:6};
  const linkStyle = {color:C.accent,fontWeight:700,textDecoration:'none'};

  async function run(label, fn) {
    setBusy(label); setError('');
    const d = await fn();
    setBusy('');
    if (d.error) { setError(d.error); return; }
    onChange(d.profile || null);
  }
  const lookup = () => { if (address.trim() && !busy) run('lookup', () => civicPost('lookup', { address })).then(() => setAddress('')); };

  if (civic === undefined) return <div style={wrap}><div style={{maxWidth:760,margin:'0 auto',color:C.textMute,fontSize:13}}>Loading…</div></div>;

  // ── First-time setup ──
  if (!civic) {
    return (
      <div style={wrap}>
        <div style={{maxWidth:640,margin:'0 auto'}}>
          <div style={title}>Civic</div>
          <div style={{fontSize:14,color:C.textMid,lineHeight:1.65,marginBottom:18}}>Who represents you? Enter one address and Lateral finds every layer of government that speaks for you (federal, state, city and county, and your school district), with ways to contact them. No account and no keys needed.</div>
          <div style={card}>
            <div style={eyebrow}>Your address</div>
            <input value={address} onChange={e => setAddress(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') lookup(); }} disabled={!!busy} autoFocus
              placeholder="Street number and name, city, state, ZIP" style={{...inputStyle,fontSize:14,padding:'10px 13px'}}/>
            <div style={{display:'flex',gap:12,alignItems:'center',marginTop:12,flexWrap:'wrap'}}>
              <Btn onClick={lookup} disabled={!!busy || !address.trim()}>{busy ? 'Asking the Census Bureau…' : 'Find my representatives'}</Btn>
              {busy && <span style={{fontSize:12,color:C.textMute}}>A few seconds.</span>}
            </div>
            {error && <div style={{marginTop:12,fontSize:12.5,color:'#991b1b',lineHeight:1.5}}>{error}</div>}
          </div>
          <div style={{fontSize:12,color:C.textMute,lineHeight:1.7}}>
            <strong style={{color:C.textMid}}>What happens to your address:</strong> it is sent only to the U.S. Census Bureau, which turns it into district numbers, and it is not saved. Lateral keeps just those district numbers and your city and state. You can remove them any time.
          </div>
        </div>
      </div>
    );
  }

  const j = civic.jurisdictions || {};
  const officials = civic.officials || [];

  // ── Overview ──
  const place = j.place ? j.place.name : '';
  const cong = j.congress, next = j.congressNext;
  const mapChanges = cong && next && cong.geoid !== next.geoid;
  const where = [
    ['Congress', cong ? `${cong.atLarge ? 'At-large district' : 'District ' + cong.district} (${ordinalSuffix(cong.session)} Congress)` : ''],
    ['State senate', j.stateSenate ? `${j.stateSenate.name}` : ''],
    ['State house', j.stateHouse ? `${j.stateHouse.name}` : ''],
    ['County', j.county ? j.county.name : ''],
    ['City', place],
    ['Schools', (j.schoolDistricts || []).map(s => s.name).join(', ')],
  ].filter(([, v]) => v);
  const loc = civic.local;
  const cov = civic.coverage || { got: [], missing: [] };
  return (
    <div style={wrap} ref={wrapRef}>
      <div style={{maxWidth: wide ? 1100 : 760, margin:'0 auto', display: wide ? 'grid' : 'block', gridTemplateColumns:'minmax(0,1fr) 250px', gap:24, alignItems:'start'}}>
      <div style={{minWidth:0}}>
        <div style={title}>Civic</div>
        <div style={{fontSize:13,color:C.textMid,lineHeight:1.6,marginBottom:16}}>Who represents you in <strong>{civic.label}</strong>, and what is happening in those governments. Pick a name in the list on the left or on the map to open their profile on the right.</div>

        {!wide && <CivicMedia civic={civic} compact card={card} eyebrow={eyebrow}/>}

        <div style={card}>
          <div style={eyebrow}>Your districts</div>
          {where.map(([k, v]) => (
            <div key={k} style={{display:'flex',gap:12,padding:'5px 0',fontSize:13}}><div style={{width:92,color:C.textMute,flexShrink:0}}>{k}</div><div style={{color:C.text}}>{v}</div></div>
          ))}
          {mapChanges && <div style={{marginTop:10,fontSize:12,color:'#92400e',background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:8,padding:'7px 10px',lineHeight:1.5}}>New congressional map: your district becomes <strong>{next.atLarge ? 'at-large' : 'District ' + next.district}</strong> in the {ordinalSuffix(next.session)} Congress (from January). Your current representative is for the district above.</div>}
        </div>

        <div style={card}>
          <div style={eyebrow}>On the map</div>
          <CivicMap civic={civic} onSelect={onSelect} selKey={selKey}/>
        </div>

        <CivicNews civic={civic} onStartStory={onStartStory} card={card} eyebrow={eyebrow}/>

        <div style={card}>
          <div style={eyebrow}>What was found</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {cov.got.map(g => <span key={g} style={{fontSize:11.5,fontWeight:700,color:'#166534',background:'#dcfce7',border:'1px solid #86efac',borderRadius:12,padding:'3px 10px'}}>✓ {g}</span>)}
            {cov.missing.map(g => <span key={g} style={{fontSize:11.5,fontWeight:700,color:'#92400e',background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:12,padding:'3px 10px'}}>– {g} not found</span>)}
          </div>
        </div>

        {place && (
          <div style={card}>
            <div style={eyebrow}>City council</div>
            {loc && loc.slug && loc.confirmed && <div style={{fontSize:13,color:C.text}}>Read from <a href={loc.url} target="_blank" rel="noreferrer" style={linkStyle}>{loc.slug}.legistar.com</a>{loc.body ? ` (${loc.body}, ${loc.officialCount} members)` : ''}.</div>}
            {loc && loc.slug && !loc.confirmed && (
              <div>
                <div style={{fontSize:13,color:C.text,lineHeight:1.6}}>Lateral found a council site by the name "{loc.guessedFrom}": <a href={loc.url} target="_blank" rel="noreferrer" style={linkStyle}>{loc.slug}.legistar.com</a>{loc.body ? ` (${loc.body}, ${loc.officialCount} members)` : ''}. Names repeat across states, so please check it is the right {place}.</div>
                <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
                  <Btn onClick={() => run('confirm', () => civicPost('legistar', { slug: loc.slug }))} disabled={!!busy} style={{padding:'6px 12px',fontSize:12}}>Yes, that is my city</Btn>
                </div>
              </div>
            )}
            {!(loc && loc.slug) && <div style={{fontSize:13,color:C.textMid,lineHeight:1.6}}>No council roster was found automatically. Many cities publish theirs on Legistar. If yours does, paste its address (it looks like https://yourcity.legistar.com) and Lateral will read it.</div>}
            <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap',alignItems:'center'}}>
              <input value={legistar} onChange={e => setLegistar(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && legistar.trim()) run('legistar', () => civicPost('legistar', { url: legistar })).then(() => setLegistar('')); }}
                placeholder={loc && loc.slug ? 'Wrong city? Paste the right Legistar address' : 'Paste the city\'s Legistar address'} style={{...inputStyle,fontSize:12.5,padding:'6px 10px',maxWidth:330}}/>
              <Btn variant="secondary" onClick={() => run('legistar', () => civicPost('legistar', { url: legistar })).then(() => setLegistar(''))} disabled={!!busy || !legistar.trim()} style={{padding:'6px 12px',fontSize:12}}>Use this</Btn>
            </div>
          </div>
        )}

        <CivicOffices civic={civic} onChange={onChange} onSelect={onSelect} card={card} eyebrow={eyebrow}/>

        <CivicBoards civic={civic} onChange={onChange} onChanged={() => setBv(v => v + 1)} card={card} eyebrow={eyebrow}/>

        <CivicWatch civicAsOf={`${civic.asOf}:${bv}`} onAddStory={onAddStory} onOpenStory={onOpenStory}/>

        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:10}}>
          <Btn variant="secondary" onClick={() => run('refresh', () => civicPost('refresh'))} disabled={!!busy} style={{padding:'6px 12px',fontSize:12}}>{busy === 'refresh' ? 'Checking…' : 'Re-check officials'}</Btn>
          {!confirmRemove
            ? <Btn variant="ghost" onClick={() => setConfirmRemove(true)} disabled={!!busy} style={{padding:'6px 12px',fontSize:12}}>Remove my Civic profile</Btn>
            : <span style={{fontSize:12,color:C.textMid}}>Remove it? <button onClick={() => { setConfirmRemove(false); run('remove', () => civicPost('remove')); }} style={{background:'none',border:'none',cursor:'pointer',color:'#991b1b',fontWeight:700,fontSize:12}}>Yes, remove</button> <button onClick={() => setConfirmRemove(false)} style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:12}}>Cancel</button></span>}
          <button onClick={() => setShowSources(s => !s)} style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:12,textDecoration:'underline'}}>{showSources ? 'Hide' : 'How this was built'}</button>
        </div>
        {error && <div style={{fontSize:12.5,color:'#991b1b',marginBottom:10}}>{error}</div>}
        {showSources && (
          <div style={card}>
            <div style={eyebrow}>Where each piece came from</div>
            {(civic.sources || []).map((s, i) => (
              <div key={i} style={{display:'flex',gap:10,fontSize:12,padding:'3px 0',color:s.ok ? C.textMid : '#991b1b'}}>
                <span style={{width:16}}>{s.ok ? '✓' : '✗'}</span><span style={{width:130,fontWeight:700}}>{s.stage}</span><span style={{flex:1}}>{s.provider}{s.ok ? '' : ': ' + s.error}</span><span style={{color:C.textMute}}>{s.ms} ms</span>
              </div>
            ))}
            <div style={{fontSize:11.5,color:C.textMute,marginTop:8,lineHeight:1.6}}>Everything here comes from free public sources and needs no keys. Your address went only to the U.S. Census Bureau and was not saved. Profile checked {civicDate(civic.asOf)}.</div>
          </div>
        )}
      </div>
      {wide && <aside style={{position:'sticky',top:0}}><CivicMedia civic={civic}/></aside>}
      </div>
    </div>
  );
}
function ordinalSuffix(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

// Small line icon used by the nav and header buttons.

}
