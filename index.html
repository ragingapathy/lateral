function BackfillModal({ story, onClose, onAdd, settings }) {
  const [phase, setPhase] = useState('searching'); // searching|results|suggesting|extracting|review
  const [wikiResults, setWikiResults] = useState([]);
  const [selected, setSelected] = useState({}); // url -> {title,url}
  const [showPaste, setShowPaste] = useState(false);
  const [pasteUrl, setPasteUrl] = useState('');
  const [pasteText, setPasteText] = useState('');
  const [errMsg, setErrMsg] = useState('');
  const [progressMsg, setProgressMsg] = useState('');
  const [candidates, setCandidates] = useState([]);
  const [triedSuggest, setTriedSuggest] = useState(false);

  useEffect(() => { runInitialSearch(); }, []);

  async function runInitialSearch() {
    setPhase('searching'); setErrMsg('');
    const results = await searchWikipedia(story.title, 6);
    setWikiResults(results);
    setSelected(prev => {
      // Auto-check a single strong-looking result so the common case is one click away.
      if (results.length === 1) return { [results[0].url]: results[0] };
      return prev;
    });
    setPhase('results');
    if (!results.length) setErrMsg('No direct Wikipedia match. Try suggested searches, or paste a link/text below.');
  }

  async function runSuggestedSearch() {
    setPhase('suggesting'); setErrMsg(''); setTriedSuggest(true);
    try {
      const queries = await suggestBackfillQueries(story, settings);
      if (!queries.length) {
        setPhase('results');
        setErrMsg('Could not think of alternate searches — try pasting a link or text instead.');
        return;
      }
      const batches = await Promise.all(queries.map(q => searchWikipedia(q, 3)));
      const seen = new Set(wikiResults.map(r => r.url));
      const merged = [];
      batches.flat().forEach(r => { if (r.url && !seen.has(r.url)) { seen.add(r.url); merged.push(r); } });
      setWikiResults(prev => [...prev, ...merged]);
      setPhase('results');
      if (!merged.length) setErrMsg('No additional matches found — try pasting a link or text instead.');
    } catch (e) {
      setPhase('results');
      setErrMsg(e?.message || 'Suggestion failed — try pasting a link or text instead.');
    }
  }

  function toggleSelect(item) {
    setSelected(prev => {
      const next = { ...prev };
      if (next[item.url]) delete next[item.url]; else next[item.url] = item;
      return next;
    });
  }

  async function runExtraction() {
    const sources = Object.values(selected);
    const trimmedPasteUrl = pasteUrl.trim();
    const trimmedPasteText = pasteText.trim();
    if (trimmedPasteUrl) sources.push({ title: 'Pasted link', url: trimmedPasteUrl });
    if (!sources.length && !trimmedPasteText) {
      setErrMsg('Select at least one source above, or paste a link/text.');
      return;
    }
    setPhase('extracting'); setErrMsg('');
    const found = [];
    for (const src of sources) {
      setProgressMsg(`Reading ${src.title}…`);
      const text = await fetchBackfillSource(src.url);
      if (!text) continue;
      setProgressMsg(`Extracting milestones from ${src.title}…`);
      try {
        const eps = await extractBackfillEpisodes(text, src.title, story, settings);
        eps.forEach(e => found.push({ ...e, sourceLabel: src.title, sourceUrl: src.url }));
      } catch {}
    }
    if (trimmedPasteText) {
      setProgressMsg('Extracting milestones from pasted text…');
      try {
        const eps = await extractBackfillEpisodes(trimmedPasteText.slice(0, 16000), 'Pasted text', story, settings);
        eps.forEach(e => found.push({ ...e, sourceLabel: 'Pasted text', sourceUrl: '' }));
      } catch {}
    }
    if (!found.length) {
      setPhase('results');
      setErrMsg('No dated milestones could be extracted from the selected source(s). Try a different page, or paste text directly.');
      return;
    }
    found.sort((a, b) => (parseDateSafe(a.date)?.getTime()||0) - (parseDateSafe(b.date)?.getTime()||0));
    setCandidates(found.map((e, i) => ({
      id: `c${i}`,
      date: parseDateSafe(e.date)?.toISOString().slice(0, 10) || now().slice(0, 10),
      dateLabel: e.dateLabel || '',
      headline: e.headline || 'Untitled milestone',
      summary: e.summary || '',
      sourceLabel: e.sourceLabel,
      sourceUrl: e.sourceUrl || '',
      checked: true,
    })));
    setPhase('review');
  }

  function updateCandidate(id, patch) {
    setCandidates(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c));
  }

  function commit() {
    const chosen = candidates.filter(c => c.checked);
    chosen.forEach(c => {
      onAdd({
        id: uid(),
        date: c.date,
        type: 'development',
        headline: c.headline,
        summary: c.summary,
        framingNote: `Backfilled from ${c.sourceLabel}${c.dateLabel ? ` (originally dated "${c.dateLabel}")` : ''}.`,
        sourceUrl: c.sourceUrl || '',
        addedAt: now(),
      }, story.id);
    });
    onClose();
  }

  const spinnerDot = <span style={{width:8,height:8,borderRadius:'50%',background:C.accent,display:'inline-block',animation:'chatPulse 1.2s ease-in-out infinite',marginRight:8}}/>;

  return (
    <Modal title={`Backfill History — ${story.title}`} onClose={onClose} maxWidth={620}>
      {phase === 'searching' && (
        <div style={{display:'flex',alignItems:'center',padding:'20px 4px',fontSize:13,color:C.textMid}}>
          {spinnerDot}Searching Wikipedia for “{story.title}”…
        </div>
      )}

      {phase === 'suggesting' && (
        <div style={{display:'flex',alignItems:'center',padding:'20px 4px',fontSize:13,color:C.textMid}}>
          {spinnerDot}Thinking about where else this story's history might live…
        </div>
      )}

      {phase === 'extracting' && (
        <div style={{display:'flex',alignItems:'center',padding:'20px 4px',fontSize:13,color:C.textMid}}>
          {spinnerDot}{progressMsg || 'Extracting…'}
        </div>
      )}

      {phase === 'results' && (
        <>
          {errMsg && <StatusLine msg={errMsg}/>}
          {wikiResults.length > 0 && (
            <div style={{display:'flex',flexDirection:'column',gap:8,margin:'12px 0'}}>
              {wikiResults.map(r => {
                const isSel = !!selected[r.url];
                return (
                  <div key={r.url} onClick={() => toggleSelect(r)}
                    style={{display:'flex',gap:10,padding:'10px 12px',borderRadius:9,border:`1.5px solid ${isSel?C.accent:C.border}`,background:isSel?C.borderLight:C.surface,cursor:'pointer'}}>
                    <input type="checkbox" checked={isSel} onChange={()=>toggleSelect(r)} onClick={e=>e.stopPropagation()} style={{marginTop:3,flexShrink:0}}/>
                    <div style={{minWidth:0,flex:1}}>
                      <div style={{display:'flex',alignItems:'baseline',gap:8}}>
                        <span style={{fontSize:13.5,fontWeight:700,color:C.text}}>{r.title}</span>
                        <a href={r.url} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{fontSize:11,color:C.accent,textDecoration:'none',flexShrink:0}}>view ↗</a>
                      </div>
                      {r.description && <div style={{fontSize:12,color:C.textMute,marginTop:2,lineHeight:1.4}}>{r.description}</div>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {!triedSuggest && (
            <Btn variant="ghost" onClick={runSuggestedSearch} style={{width:'100%',marginBottom:10}}>
              🔮 {wikiResults.length ? 'Suggest other relevant pages' : 'Let AI suggest better searches'}
            </Btn>
          )}
          <div style={{display:'flex',alignItems:'center',gap:8,margin:'10px 0'}}>
            <div style={{flex:1,height:1,background:C.border}}/>
            <button onClick={()=>setShowPaste(s=>!s)} style={{background:'none',border:'none',fontSize:11,color:C.textMute,cursor:'pointer',padding:0}}>
              {showPaste ? '– hide' : '+ or paste a link / article / your own notes instead'}
            </button>
            <div style={{flex:1,height:1,background:C.border}}/>
          </div>
          {showPaste && (
            <>
              <Field label="URL"><input value={pasteUrl} onChange={e=>setPasteUrl(e.target.value)} placeholder="https://…" style={inputStyle}/></Field>
              <Field label="Or paste text directly">
                <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)} rows={4} placeholder="Paste a retrospective, timeline, or your own notes…" style={{...inputStyle,resize:'vertical'}}/>
              </Field>
            </>
          )}
          <Btn onClick={runExtraction} style={{width:'100%',marginTop:6}}>Extract Episodes →</Btn>
        </>
      )}

      {phase === 'review' && (
        <>
          <div style={{fontSize:12.5,color:C.textMid,marginBottom:12}}>
            {candidates.length} milestone{candidates.length!==1?'s':''} found — review before adding to the timeline.
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10,maxHeight:420,overflowY:'auto',paddingRight:2}}>
            {candidates.map((c, i) => (
              <div key={c.id} className="row-reveal" style={{padding:'10px 12px',borderRadius:9,border:`1.5px solid ${C.border}`,background:C.surface,opacity:c.checked?1:0.5,animation:`rowReveal 0.35s ease both`,animationDelay:`${Math.min(i,14)*35}ms`}}>
                <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
                  <input type="checkbox" checked={c.checked} onChange={e=>updateCandidate(c.id,{checked:e.target.checked})} style={{marginTop:6,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',gap:8,marginBottom:6}}>
                      <input type="date" value={c.date} onChange={e=>updateCandidate(c.id,{date:e.target.value})} style={{...inputStyle,width:150,flex:'none',fontSize:12,padding:'6px 8px'}}/>
                      {c.dateLabel && <span style={{fontSize:10.5,color:C.textMute,alignSelf:'center'}}>as written: “{c.dateLabel}”</span>}
                    </div>
                    <input value={c.headline} onChange={e=>updateCandidate(c.id,{headline:e.target.value})} style={{...inputStyle,fontWeight:700,fontSize:13,marginBottom:6,padding:'6px 8px'}}/>
                    <textarea value={c.summary} onChange={e=>updateCandidate(c.id,{summary:e.target.value})} rows={2} style={{...inputStyle,resize:'vertical',fontSize:12,padding:'6px 8px'}}/>
                    <div style={{fontSize:10.5,color:C.textMute,marginTop:5}}>
                      via {c.sourceUrl ? <a href={c.sourceUrl} target="_blank" rel="noopener noreferrer" style={{color:C.textMute}}>{c.sourceLabel}</a> : c.sourceLabel}
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:8,marginTop:14}}>
            <Btn variant="ghost" onClick={()=>setPhase('results')} style={{flex:1}}>← Back</Btn>
            <Btn onClick={commit} disabled={!candidates.some(c=>c.checked)} style={{flex:2}}>
              Add {candidates.filter(c=>c.checked).length} Episode{candidates.filter(c=>c.checked).length!==1?'s':''}
            </Btn>
          </div>
        </>
      )}
    </Modal>
  );
}

function SettingsModal({ settings, onSave, onClose, onPurgeDeletedStories }) {
  const [f,setF]=useState(settings);
  const [tab,setTab]=useState('basic');
  const [status,setStatus]=useState('');
  const [voices,setVoices]=useState([]);
  const [models,setModels]=useState(MODELS);
  const [externalModels,setExternalModels]=useState([]);
  const [keyDraft,setKeyDraft]=useState({
    anthropicApiKey:'',
    geminiApiKey:'',
    moonshotApiKey:'',
    openaiCompatApiKey:'',
    listenNotesApiKey:'',
    podcastIndexApiKey:'',
    podcastIndexApiSecret:'',
    tavilyApiKey:''
  });
  const [keyStatus,setKeyStatus]=useState({
    hasAnthropic:false,
    hasGemini:false,
    hasMoonshot:false,
    hasOpenAICompat:false,
    hasListenNotes:false,
    hasPodcastIndex:false,
    hasPodcastIndexSecret:false,
    hasTavily:false
  });
  const [keysLoaded,setKeysLoaded]=useState(false);
  const [pingStatus,setPingStatus]=useState({});
  const provider = String(f.llmProvider || 'ollama');
  const llmEndpointCandidates = (suffix) => {
    const s = String(suffix || '').startsWith('/') ? String(suffix) : `/${suffix}`;
    return [
      `/api/lateral${s}`,
      s,
      `http://localhost:3005/api/lateral${s}`,
      `http://localhost:3005${s}`,
      `http://127.0.0.1:3005/api/lateral${s}`,
      `http://127.0.0.1:3005${s}`,
    ];
  };
  async function fetchLlmJson(suffix, options) {
    let lastStatus = 0;
    let lastErr = '';
    for (const u of llmEndpointCandidates(suffix)) {
      try {
        const r = await fetch(u, options);
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          lastStatus = r.status;
          lastErr = d?.error || `HTTP ${r.status}`;
          continue;
        }
        return { r, d, url: u };
      } catch (e) {
        lastErr = e?.message || 'Network error';
      }
    }
    throw new Error(lastErr || `Request failed (${lastStatus || 'network'})`);
  }

  function persistSettings() {
    const cleaned = {
      ...f,
      moonshotBaseUrl: String(f.moonshotBaseUrl || DEF_SETTINGS.moonshotBaseUrl).trim(),
      openaiBaseUrl: String(f.openaiBaseUrl || DEF_SETTINGS.openaiBaseUrl).trim(),
      stalledDays: Math.max(1, Number(f.stalledDays || DEF_SETTINGS.stalledDays)),
      ttsVoice: String(f.ttsVoice || '').trim(),
      autoRefreshHours: Math.max(0, Number(f.autoRefreshHours ?? DEF_SETTINGS.autoRefreshHours))
    };
    onSave(cleaned);
    return cleaned;
  }

  function closeWithSave() {
    persistSettings();
    onClose();
  }

  const pingFor = id => pingStatus[id] || { state:'idle', note:'' };
  const lightFor = id => {
    const p = pingFor(id);
    if (p.state === 'ok') return '#16a34a';
    if (p.state === 'fail') return '#dc2626';
    if (p.state === 'testing') return '#d97706';
    if (id === 'anthropic' && keyStatus.hasAnthropic) return '#10b981';
    if (id === 'gemini' && keyStatus.hasGemini) return '#10b981';
    if (id === 'moonshot' && keyStatus.hasMoonshot) return '#10b981';
    if (id === 'openai_compatible' && keyStatus.hasOpenAICompat) return '#10b981';
    if (id === 'ollama') return '#2563eb';
    return '#9ca3af';
  };

  async function refreshModels(baseUrl = f.ollamaUrl) {
    if (provider !== 'ollama') return 0;
    try {
      const r = await fetch(`${baseUrl}/api/tags`);
      if (!r.ok) throw new Error(`Ollama ${r.status}`);
      const d = await r.json();
      const discovered = (d.models || []).map(m => m.name).filter(Boolean);
      const merged = [...new Set([...discovered, ...MODELS])];
      if (merged.length) setModels(merged);
      return discovered.length;
    } catch {
      return 0;
    }
  }

  useEffect(() => { if (provider === 'ollama') refreshModels(); }, [provider]);

  async function test() {
    setStatus('Testing…');
    await pingProvider(provider, { updateGlobalStatus: true });
  }

  async function loadKeyStatus() {
    try {
      setKeysLoaded(false);
      const { d } = await fetchLlmJson('/llm/secrets');
      setKeyStatus({
        hasAnthropic: !!d.hasAnthropic,
        hasGemini: !!d.hasGemini,
        hasMoonshot: !!d.hasMoonshot,
        hasOpenAICompat: !!d.hasOpenAICompat,
        hasListenNotes: !!d.listenNotesConfigured,
        hasPodcastIndex: !!d.podcastIndexConfigured,
        hasPodcastIndexSecret: !!d.podcastIndexSecretConfigured,
        hasTavily: !!d.tavilyConfigured
      });
      if (!f.moonshotBaseUrl && d.moonshotBaseUrl) {
        setF(prev => ({ ...prev, moonshotBaseUrl: d.moonshotBaseUrl }));
      }
      if (!f.openaiBaseUrl && d.openaiCompatBaseUrl) {
        setF(prev => ({ ...prev, openaiBaseUrl: d.openaiCompatBaseUrl }));
      }
      setKeysLoaded(true);
    } catch (e) {
      setStatus(`Could not load key status: ${e.message}`);
      setKeysLoaded(true);
    }
  }

  async function refreshExternalModels() {
    if (provider === 'ollama') return;
    try {
      const qp = new URLSearchParams({ provider });
      if (provider === 'openai_compatible' && f.openaiBaseUrl) qp.set('openaiBaseUrl', f.openaiBaseUrl);
      if (provider === 'moonshot' && f.moonshotBaseUrl) qp.set('moonshotBaseUrl', f.moonshotBaseUrl);
      const { d } = await fetchLlmJson(`/llm/models?${qp.toString()}`);
      const list = Array.isArray(d.models) ? d.models : [];
      setExternalModels(list);
      if (d.source === 'fallback' && d.warning) {
        setStatus(`Model list fallback: ${d.warning}`);
      }
    } catch (e) {
      setExternalModels([]);
      setStatus(`Model list unavailable: ${e.message}`);
    }
  }

  function modelForProvider(p) {
    if (p === 'ollama') return String(f.model || 'qwen3:latest').trim();
    if (f.externalModel?.trim()) return f.externalModel.trim();
    return EXTERNAL_PROVIDER_DEFAULT_MODEL[p] || '';
  }

  async function pingProvider(p, { updateGlobalStatus = false } = {}) {
    const providerId = String(p || '').toLowerCase();
    if (!providerId) return;
    setPingStatus(prev => ({ ...prev, [providerId]: { state:'testing', note:'Testing…' } }));
    try {
      const payload = {
        provider: providerId,
        model: modelForProvider(providerId),
        openaiBaseUrl: f.openaiBaseUrl || '',
        moonshotBaseUrl: f.moonshotBaseUrl || ''
      };
      const { d } = await fetchLlmJson('/llm/ping', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      if (!d.ok) throw new Error(d?.error || 'Ping failed');
      const note = `OK in ${d.latencyMs || '?'}ms${d.modelUsed ? ` • ${d.modelUsed}` : ''}`;
      setPingStatus(prev => ({ ...prev, [providerId]: { state:'ok', note } }));
      if (updateGlobalStatus) setStatus(`✓ ${providerId} ${note}`);
    } catch (e) {
      const note = e.message || 'Ping failed';
      setPingStatus(prev => ({ ...prev, [providerId]: { state:'fail', note } }));
      if (updateGlobalStatus) setStatus(`Failed: ${note}`);
    }
  }

  // Runs one tiny real search with the saved key so a bad key is caught immediately, not on the first prediction.
  async function testTavily() {
    setPingStatus(prev => ({ ...prev, tavily: { state:'testing', note:'Testing…' } }));
    try {
      const r = await fetch('/api/lateral/llm/ping', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ provider:'tavily' }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d.error || `Test failed (HTTP ${r.status})`);
      setPingStatus(prev => ({ ...prev, tavily: { state:'ok', note:`Working — search returned in ${d.latencyMs || '?'}ms` } }));
    } catch (e) {
      setPingStatus(prev => ({ ...prev, tavily: { state:'fail', note: e.message || 'Test failed' } }));
    }
  }

  async function saveApiKeys() {
    setStatus('Saving API keys…');
    const savedTavily = !!keyDraft.tavilyApiKey.trim();
    try {
      const payload = { moonshotBaseUrl: f.moonshotBaseUrl || '', openaiCompatBaseUrl: f.openaiBaseUrl || '' };
      if (keyDraft.anthropicApiKey.trim()) payload.anthropicApiKey = keyDraft.anthropicApiKey.trim();
      if (keyDraft.geminiApiKey.trim()) payload.geminiApiKey = keyDraft.geminiApiKey.trim();
      if (keyDraft.moonshotApiKey.trim()) payload.moonshotApiKey = keyDraft.moonshotApiKey.trim();
      if (keyDraft.openaiCompatApiKey.trim()) payload.openaiCompatApiKey = keyDraft.openaiCompatApiKey.trim();
      if (keyDraft.listenNotesApiKey.trim()) payload.listenNotesApiKey = keyDraft.listenNotesApiKey.trim();
      if (keyDraft.podcastIndexApiKey.trim()) payload.podcastIndexApiKey = keyDraft.podcastIndexApiKey.trim();
      if (keyDraft.podcastIndexApiSecret.trim()) payload.podcastIndexApiSecret = keyDraft.podcastIndexApiSecret.trim();
      if (keyDraft.tavilyApiKey.trim()) payload.tavilyApiKey = keyDraft.tavilyApiKey.trim();
      const { d } = await fetchLlmJson('/llm/secrets', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      setKeyStatus({
        hasAnthropic: !!d.hasAnthropic,
        hasGemini: !!d.hasGemini,
        hasMoonshot: !!d.hasMoonshot,
        hasOpenAICompat: !!d.hasOpenAICompat,
        hasListenNotes: !!d.listenNotesConfigured,
        hasPodcastIndex: !!d.podcastIndexConfigured,
        hasPodcastIndexSecret: !!d.podcastIndexSecretConfigured,
        hasTavily: !!d.tavilyConfigured
      });
      if (d.moonshotBaseUrl) setF(prev => ({ ...prev, moonshotBaseUrl: d.moonshotBaseUrl }));
      if (d.openaiCompatBaseUrl) setF(prev => ({ ...prev, openaiBaseUrl: d.openaiCompatBaseUrl }));
      setKeyDraft({
        anthropicApiKey:'',
        geminiApiKey:'',
        moonshotApiKey:'',
        openaiCompatApiKey:'',
        listenNotesApiKey:'',
        podcastIndexApiKey:'',
        podcastIndexApiSecret:'',
        tavilyApiKey:''
      });
      setStatus('✓ API keys saved');
      if (savedTavily) testTavily();
    } catch (e) {
      setStatus(`Failed: ${e.message}`);
    }
  }

  useEffect(() => { loadKeyStatus(); }, []);
  useEffect(() => {
    if (!window?.speechSynthesis) { setVoices([]); return; }
    const loadVoices = () => {
      const list = (window.speechSynthesis.getVoices?.() || [])
        .filter(v => !!v?.voiceURI)
        .sort((a, b) => {
          const an = `${a.lang || ''} ${a.name || ''}`.toLowerCase();
          const bn = `${b.lang || ''} ${b.name || ''}`.toLowerCase();
          return an.localeCompare(bn);
        });
      setVoices(list);
    };
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
    return () => {
      if (window.speechSynthesis.onvoiceschanged === loadVoices) {
        window.speechSynthesis.onvoiceschanged = null;
      }
    };
  }, []);
  useEffect(() => {
    if (provider === 'ollama') return;
    refreshExternalModels();
  }, [provider]);

  const tabBtn = (id, label) => (
    <button
      key={id}
      onClick={()=>setTab(id)}
      style={{
        border:`1px solid ${tab===id ? C.accent : C.border}`,
        background: tab===id ? `${C.borderLight}` : C.bg,
        color: tab===id ? C.text : C.textMute,
        fontSize:12,
        fontWeight:700,
        borderRadius:8,
        padding:'6px 10px',
        cursor:'pointer'
      }}
    >{label}</button>
  );

  return (
    <Modal title="Settings" onClose={closeWithSave}>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        {tabBtn('basic', 'Basic')}
        {tabBtn('search', `Web search${keysLoaded && !keyStatus.hasTavily ? ' ⚠' : ''}`)}
        {tabBtn('models', 'Model setup')}
        {tabBtn('podcasts', 'Podcasts')}
      </div>

      {tab === 'basic' && (
        <>
          <Field label="Daily refresh time">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <input type="time" value={f.refreshTime||'08:00'} onChange={e=>setF({...f,refreshTime:e.target.value})} style={{...inputStyle,width:'auto',flex:'none'}}/>
              <span style={{fontSize:11,color:C.textMute}}>Headlines &amp; intelligence cache until this time each day</span>
            </div>
          </Field>
          <Field label="Local news location">
            <input value={f.location||''} onChange={e=>setF({...f,location:e.target.value})} placeholder="e.g. Chicago, IL" style={inputStyle}/>
          </Field>
          <Field label="Stalled threshold (days)">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <input
                type="number"
                min={1}
                max={365}
                step={1}
                value={f.stalledDays ?? DEF_SETTINGS.stalledDays}
                onChange={e=>setF({...f,stalledDays:Math.max(1, Number(e.target.value || DEF_SETTINGS.stalledDays))})}
                style={{...inputStyle,width:96,flex:'none'}}
              />
              <span style={{fontSize:11,color:C.textMute}}>Story auto-shows as stalled after this many inactive days</span>
            </div>
          </Field>
          <Field label="Auto-refresh interval (hours)">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <input
                type="number"
                min={0}
                max={168}
                step={1}
                value={f.autoRefreshHours ?? DEF_SETTINGS.autoRefreshHours}
                onChange={e=>setF({...f,autoRefreshHours:Math.max(0, Number(e.target.value || 0))})}
                style={{...inputStyle,width:96,flex:'none'}}
              />
              <span style={{fontSize:11,color:C.textMute}}>Background headline refresh &amp; change detection. 0 disables.</span>
            </div>
          </Field>
          <Field label="Read-aloud voice">
            <select value={f.ttsVoice || ''} onChange={e=>setF({...f,ttsVoice:e.target.value})} style={inputStyle}>
              <option value="">System default</option>
              {voices.map(v => (
                <option key={v.voiceURI} value={v.voiceURI}>
                  {v.name} ({v.lang}){v.default ? ' • default' : ''}
                </option>
              ))}
            </select>
          </Field>
          <Field label="Admin utilities">
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              <Btn
                variant="ghost"
                style={{borderColor:'#ef4444',color:'#ef4444'}}
                onClick={()=>{
                  if (!onPurgeDeletedStories) return;
                  if (!window.confirm('Permanently purge all deleted stories from the data store? This cannot be undone.')) return;
                  const removed = onPurgeDeletedStories();
                  setStatus(removed > 0 ? `✓ Purged ${removed} deleted ${removed===1?'story':'stories'}` : 'No deleted stories to purge');
                }}
              >
                Purge Deleted Stories
              </Btn>
              <span style={{fontSize:11,color:C.textMute}}>Hard-removes soft-deleted stories from storage.</span>
            </div>
          </Field>
        </>
      )}

      {tab === 'search' && (
        <div style={{border:`1px solid ${C.border}`,borderRadius:8,padding:'12px 12px 10px',marginBottom:12,background:C.surface}}>
          <div style={{fontSize:11,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8}}>Web search (Tavily) — needed for evidence &amp; briefs</div>
          <div style={{fontSize:12,color:C.textMid,lineHeight:1.55,marginBottom:10}}>
            Lateral uses <strong>Tavily</strong> to search the web. It finds the news that supports or contradicts your predictions, and powers intelligence briefs and chat search. Without a key, those features can’t fetch anything.
            Get a free key at <a href="https://app.tavily.com" target="_blank" rel="noopener noreferrer" style={{color:C.accent}}>app.tavily.com</a>, then paste it below.
          </div>
          {keysLoaded && !keyStatus.hasTavily && (
            <div style={{fontSize:12,color:'#b45309',background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:6,padding:'7px 10px',marginBottom:10}}>
              ⚠ No Tavily key is set yet. Searches will fail until you add one.
            </div>
          )}
          <Field label={`Tavily API key ${!keysLoaded ? '• checking…' : (keyStatus.hasTavily ? '• set' : '• missing')}`}>
            <input type="password" autoComplete="off" value={keyDraft.tavilyApiKey} onChange={e=>setKeyDraft({...keyDraft,tavilyApiKey:e.target.value})}
              placeholder={keyStatus.hasTavily ? 'Paste a new key to replace the saved one' : 'tvly-…'} style={inputStyle}/>
          </Field>
          <div style={{fontSize:11,color:C.textMute,marginTop:-2,marginBottom:10,lineHeight:1.5}}>
            The key is stored on the Lateral server and is never sent back to your browser. Leaving the field blank keeps the saved key.
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <Btn variant="ghost" onClick={saveApiKeys} disabled={!keyDraft.tavilyApiKey.trim()} style={{padding:'6px 10px',fontSize:11.5}}>Save key</Btn>
            <Btn variant="ghost" onClick={testTavily} disabled={!keyStatus.hasTavily || pingStatus.tavily?.state === 'testing'} style={{padding:'6px 10px',fontSize:11.5}}>Test key</Btn>
            {pingStatus.tavily && (
              <span style={{fontSize:12,color: pingStatus.tavily.state === 'ok' ? '#059669' : pingStatus.tavily.state === 'fail' ? '#dc2626' : C.textMute}}>
                {pingStatus.tavily.state === 'ok' ? '✓ ' : pingStatus.tavily.state === 'fail' ? '✗ ' : ''}{pingStatus.tavily.note}
              </span>
            )}
          </div>
        </div>
      )}

      {tab === 'models' && (
        <>
          <Field label="LLM Provider">
            <select value={provider} onChange={e=>setF({...f,llmProvider:e.target.value})} style={inputStyle}>
              {LLM_PROVIDER_OPTIONS.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
            </select>
          </Field>
          <div style={{display:'flex',alignItems:'center',gap:8,marginTop:-4,marginBottom:10,padding:'8px 10px',border:`1px solid ${C.border}`,borderRadius:8,background:'#f8fafc'}}>
            <span style={{width:9,height:9,borderRadius:'50%',background:lightFor(provider),display:'inline-block'}}/>

function NotebookLMExportModal({ stories, onClose }) {
  const candidates = (stories || []).filter(s => (s.episodes || []).length > 0);
  const [selected, setSelected] = useState(() => new Set(candidates.map(s => s.id)));
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState('');

  function toggle(storyId) {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(storyId)) next.delete(storyId);
      else next.add(storyId);
      return next;
    });
  }

  function selectAll() {
    setSelected(new Set(candidates.map(s => s.id)));
  }

  function clearAll() {
    setSelected(new Set());
  }

  async function runExport() {
    if (!selected.size || busy) return;
    setBusy(true);
    setStatus('Building PDF…');
    let win = null;
    try {
      const picked = candidates.filter(s => selected.has(s.id));
      if (!picked.length) throw new Error('No stories selected');
      // Open the tab inside the click (pop-up blockers), then fetch prediction evidence before building the page.
      win = window.open('', '_blank');
      if (!win) throw new Error('Pop-up blocked — allow pop-ups and try again');
      const predMap = await fetchPredictionShareData(picked);
      // PDF, not a ZIP of plain-text files — a blob download only works in the
      // tab that made it, and NotebookLM won't take an .html upload at all,
      // but it (and every friend's inbox) takes a PDF just fine. Same proven
      // mechanism as the per-story Share button, just looping the sections.
      const html = buildMultiStoryShareHtml(picked, predMap);
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      win.location.href = url;
      setTimeout(() => URL.revokeObjectURL(url), 120000);
      setStatus(`✓ Opened ${picked.length} stor${picked.length===1?'y':'ies'} — click Download PDF in the new tab`);
    } catch (e) {
      if (win) { try { win.close(); } catch (err) {} }
      setStatus(`Failed: ${e.message || 'export failed'}`);
    } finally {
      setBusy(false);
    }
  }

  return (
    <Modal title="Export to NotebookLM" onClose={onClose} maxWidth={720}>
      <div style={{fontSize:12,color:C.textMute,marginBottom:10}}>
        Select tracked stories to include. Opens a print-ready page in a new tab — click Download PDF there. PDF is what NotebookLM actually accepts as a source.
      </div>
      <div style={{display:'flex',gap:8,marginBottom:10}}>
        <Btn variant="ghost" onClick={selectAll} style={{padding:'6px 10px',fontSize:11.5}}>Select All</Btn>
        <Btn variant="ghost" onClick={clearAll} style={{padding:'6px 10px',fontSize:11.5}}>Clear</Btn>
      </div>
      <div style={{border:`1px solid ${C.border}`,borderRadius:10,maxHeight:360,overflowY:'auto',padding:8,marginBottom:12}}>
        {candidates.length === 0 ? (
          <div style={{fontSize:12,color:C.textMute,padding:10}}>No tracked stories with episodes yet.</div>
        ) : candidates.map(s => {
          const on = selected.has(s.id);
          return (
            <label key={s.id} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'9px 8px',borderRadius:8,cursor:'pointer',background:on?`${C.borderLight}`:'transparent'}}>
              <input type="checkbox" checked={on} onChange={()=>toggle(s.id)} style={{marginTop:2}} />
              <div style={{minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:C.text,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.title}</div>
                <div style={{fontSize:11.5,color:C.textMute}}>
                  {(s.episodes||[]).length} episode{(s.episodes||[]).length===1?'':'s'} · updated {fmtS(s.updatedAt || s.createdAt)}
                </div>
              </div>
            </label>
          );
        })}
      </div>
      <div style={{display:'flex',gap:8}}>
        <Btn variant="ghost" onClick={onClose} style={{flex:1}}>Cancel</Btn>
        <Btn onClick={runExport} disabled={!selected.size || busy || !candidates.length} style={{flex:1}}>
          {busy ? 'Exporting…' : `Export ${selected.size} stor${selected.size===1?'y':'ies'}`}
        </Btn>
      </div>
      <StatusLine msg={status}/>
    </Modal>
  );
}

const SRC = {

function BriefSectionHead({ children }) {
  return <div className="brief-section-head" style={{fontSize:10,fontWeight:800,color:C.textMute,textTransform:'uppercase',letterSpacing:'0.09em',marginBottom:7,marginTop:18}}>{children}</div>;
}
function BriefBulletList({ items, color, linkWiki = false }) {
  if (!items?.length) return null;
  const wikiFromItem = (item) => {
    const text = String(typeof item === 'object' ? (item?.name || '') : (item || '')).trim();
    if (!text) return '';
    const base = text.split(/\s[—-]\s|\s\|\s|,\s+/)[0].trim();
    const cleaned = base.replace(/^(the|a|an)\s+/i, '').trim();
    if (!cleaned || cleaned.length < 2) return '';
    return `https://en.wikipedia.org/w/index.php?search=${encodeURIComponent(cleaned)}`;
  };
  return (
    <ul className="brief-list" style={{margin:'0 0 0 2px',padding:0,listStyle:'none'}}>
      {items.map((item,i) => (
        <li key={i} style={{display:'flex',gap:7,marginBottom:5,fontSize:12.5,color:C.text,lineHeight:1.5}}>
          <span style={{color:color||C.accent,flexShrink:0,marginTop:2}}>›</span>
          {(() => {
            const label = typeof item==='object'?`${item.name} — ${item.role||item.connection||''}`:String(item||'');
            const wiki = linkWiki ? wikiFromItem(item) : '';
            if (!wiki) return <span>{label}</span>;
            return (
              <a href={wiki} target="_blank" rel="noopener noreferrer" style={{color:C.text,textDecoration:'underline',textDecorationColor:C.accent}}>
                {label}
              </a>
            );
          })()}
        </li>
      ))}
    </ul>
  );
}
function BriefChip({ label, color, bg }) {
  return <span style={{display:'inline-flex',alignItems:'center',padding:'2px 9px',borderRadius:999,background:bg,color,fontSize:11,fontWeight:700,letterSpacing:'0.03em'}}>{label}</span>;
}

  const [progress, setProgress] = useState('');
  const [storyBriefs, setStoryBriefs] = useState(() => cachedBrief?.storyBriefs || []);  // [{story, brief}]
  const [crossBrief, setCrossBrief]   = useState(() => cachedBrief?.crossBrief || null);
  const [execSummary, setExecSummary] = useState(() => cachedBrief?.execSummary || '');
  const [generatedAt, setGeneratedAt] = useState(() => cachedBrief?.generatedAt || '');
  const [errMsg, setErrMsg] = useState('');
  const genElapsedMs = useBusyElapsed(phase === 'generating');

  function applyBriefPayload(payload) {
    const p = payload || {};
    setExecSummary(String(p.execSummary || ''));
    setStoryBriefs(Array.isArray(p.storyBriefs) ? p.storyBriefs : []);
    setCrossBrief(p.crossBrief || null);
    setGeneratedAt(String(p.generatedAt || ''));
  }

  async function runGeneration({ force = true } = {}) {
    setPhase('generating');
    setErrMsg('');
    setStoryBriefs([]);
    setCrossBrief(null);
    setExecSummary('');
    try {
      const active = stories.filter(isActiveStoryForWork);
      if (active.length === 0) { setErrMsg('No active stories with episodes to brief.'); setPhase('error'); return; }
      let startedJobId = '';
      try {
        const started = await startIntelligenceJob({ scope: 'home', stories: active, settings, force: !!force });
        startedJobId = String(started?.job?.id || '');
      } catch (e) {
        if (e?.status !== 409) throw e;
        const activeJob = e?.payload?.activeJob || null;
        if (activeJob?.id && String(activeJob?.scope || '') === 'home') {
          startedJobId = String(activeJob.id);
          setProgress(activeJob?.progress || 'Another home intelligence process is already in progress and should complete soon.');
        } else {
          throw new Error(e?.payload?.error || 'Another intelligence process is already in progress and should complete soon.');
        }
      }
      await waitForIntelligenceJob({
        scope: 'home',
        expectedJobId: startedJobId,
        onProgress: (job) => {
          if (job?.progress) setProgress(job.progress);
        }
      });
      await syncServerCacheToLocal().catch(() => {});
      const fresh = loadBrief();
      if (!fresh || !Array.isArray(fresh.storyBriefs) || fresh.storyBriefs.length === 0) {
        throw new Error('No home brief available after generation.');
      }
      applyBriefPayload(fresh);
      setPhase('ready');
    } catch(e) {
      setErrMsg(e.message);
      setPhase('error');
    }
  }

  useEffect(() => {
    const activeStories = stories.filter(isActiveStoryForWork);
    const activeIds = new Set(activeStories.map(s => String(s.id || '')).filter(Boolean));
    const cachedIds = new Set(
      (Array.isArray(cachedBrief?.storyBriefs) ? cachedBrief.storyBriefs : [])
        .map(sb => String(sb?.story?.id || ''))
        .filter(Boolean)
    );
    const cacheMatchesActiveStories =
      activeIds.size === cachedIds.size &&
      [...activeIds].every(id => cachedIds.has(id));

    // If cache is missing, or story membership changed (deleted/resolved/reopened),
    // regenerate so the brief tracks the current active set exactly.
    if (!cachedBrief || !cacheMatchesActiveStories) {
      runGeneration({ force: true });
      return;
    }
    applyBriefPayload(cachedBrief);
  }, []);

  // ── Render loading
  if (phase === 'generating') {
    return (
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
        <div style={{background:C.surface,borderRadius:14,padding:'40px 44px',maxWidth:420,width:'90%',textAlign:'center',boxShadow:'0 24px 60px rgba(0,0,0,0.18)'}}>
          <div style={{fontSize:16,fontWeight:800,color:C.text,marginBottom:8}}>Generating Brief</div>
          <div style={{marginBottom:18}}>
            <BusyInline label={progress || 'Searching…'} elapsedMs={genElapsedMs} />
          </div>
          {storyBriefs.length > 0 && (
            <div style={{display:'flex',gap:6,flexWrap:'wrap',justifyContent:'center',marginBottom:20}}>
              {storyBriefs.map(({story})=>(
                <span key={story.id} style={{fontSize:10,fontWeight:700,color:'#059669',background:'#d1fae5',padding:'2px 8px',borderRadius:5}}>✓ {story.title.slice(0,24)}{story.title.length>24?'…':''}</span>
              ))}
            </div>
          )}
          <div style={{fontSize:11,color:C.textMute,marginTop:6}}>You can continue using Lateral while this runs.</div>
          <div style={{marginTop:14,display:'flex',gap:16,justifyContent:'center',alignItems:'center'}}>
            <button onClick={onClose} style={{fontSize:11,color:C.textMute,background:'none',border:'none',cursor:'pointer'}}>Run in background</button>
            <button onClick={async () => {
              await cancelIntelligenceJob({ scope: 'home' }).catch(() => {});
              onClose();
            }} style={{fontSize:11,color:'#dc2626',background:'none',border:'none',cursor:'pointer'}}>Cancel</button>
          </div>
        </div>
      </div>
    );
  }

  // ── Render error
  if (phase === 'error') {
    return (
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
        <div style={{background:C.surface,borderRadius:14,padding:36,maxWidth:380,width:'90%',textAlign:'center'}}>
          <div style={{fontSize:13,color:'#dc2626',marginBottom:16}}>{errMsg||'Brief generation failed.'}</div>
          <Btn onClick={onClose}>Close</Btn>
        </div>
      </div>
    );
  }

  // ── Render full brief
  const briefDate = new Date(generatedAt || Date.now()).toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const globalSpeechText = buildGlobalBriefSpeechText({ execSummary, storyBriefs, crossBrief });

  function printBrief() {
    const el = document.getElementById('brief-modal-inner');
    if (!el) return;

    // Use outerHTML so #brief-modal-inner exists in the print doc and CSS can target it
    const html = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lateral Brief — ${briefDate}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #fff; color: #1a1714;
    }
    /* Strip modal chrome — !important overrides inline React styles */
    button { display: none !important; }
    #brief-modal-inner {
      position: static !important;
      display: block !important;
      width: 100% !important;
      max-height: none !important;
      height: auto !important;
      overflow: visible !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      background: #fff !important;
    }
    .brief-header {
      padding: 0 0 18px !important;
      border-bottom: 2px solid #1a1714 !important;
      margin-bottom: 24px;
    }
    .brief-body {
      overflow-y: visible !important;
      max-height: none !important;
      flex: none !important;
      height: auto !important;
      padding: 0 !important;
    }
    .brief-story-section { page-break-inside: avoid; }
    .brief-cross-section { page-break-before: always; }
    @page { margin: 1.5cm 2cm; size: A4; }
  </style>
</head>
<body>
  ${getExportLogoHtml('Multi-Story Intelligence Brief')}
  ${el.outerHTML}
</body>
</html>`;

    // Blob URL: browser loads it as a real document — no document.write() timing issues
    const blob = new Blob([html], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    const win  = window.open(url, '_blank');
    if (!win) { URL.revokeObjectURL(url); return; }
    win.addEventListener('load', () => {
      setTimeout(() => {
        win.print();
        win.addEventListener('afterprint', () => { win.close(); URL.revokeObjectURL(url); });
      }, 200);
    });
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
      <div id="brief-modal-inner" style={{background:C.surface,borderRadius:14,width:'min(860px,96vw)',maxHeight:'92vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 60px rgba(0,0,0,0.2)',overflow:'hidden'}}>

        {/* ── Header bar */}
        <div className="brief-header" style={{padding:'16px 24px',borderBottom:`1px solid ${C.borderLight}`,display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
          <div style={{flex:1}}>
            <div style={{fontSize:17,fontWeight:900,color:C.text,letterSpacing:'-0.3px'}}>LATERAL BRIEF</div>
            <div style={{fontSize:11,color:C.textMute,marginTop:1}}>{briefDate}</div>
          </div>
          <button onClick={printBrief} title="Print / Export PDF"
            style={{padding:'6px 14px',borderRadius:7,background:C.accent,color:'#fff',border:'none',fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em'}}>
            ⬡ Export PDF
          </button>
          <button
            onClick={() => runGeneration({ force: true })}
            title="Regenerate brief"
            style={{padding:'6px 12px',borderRadius:7,background:C.surface,color:C.accent,border:`1.5px solid ${C.accent}`,fontSize:12,fontWeight:700,cursor:'pointer',letterSpacing:'0.02em'}}
          >
            ↻ Regenerate
          </button>
          <TTSButton
            text={globalSpeechText}
            settings={settings}
            label="Read brief"
            title="Read full brief aloud"
            style={{fontSize:12,padding:'6px 10px',borderRadius:7}}
          />
          <button onClick={onClose} style={{border:'none',background:'none',fontSize:20,cursor:'pointer',color:C.textMute,lineHeight:1,padding:'2px 6px'}}>×</button>
        </div>

        {/* ── Scrollable body */}
        <div className="brief-body" style={{overflowY:'auto',padding:'22px 28px',flex:1}}>
          <BriefContent execSummary={execSummary} storyBriefs={storyBriefs} crossBrief={crossBrief} isGlobal={true}/>
        </div>
      </div>
    </div>
  );
}


// ─── Spider Map Modal ────────────────────────────────────────────────────────
function SpiderMapModal({ stories, onClose, onSelectStory }) {
  const [phase, setPhase]           = useState('select');
  const [sel, setSel]               = useState(()=>new Set(stories.map(s=>s.id)));
  const [mapData, setMapData]       = useState({nodes:[],edges:[]});
  const [tooltip, setTooltip]       = useState(null);
  const [hoverNodeId, setHoverNodeId] = useState(null);
  const [showLegend, setShowLegend] = useState(false);
  const [activeTag, setActiveTag]   = useState('');
  const [activePlayer, setActivePlayer] = useState('');
  const [showAllTags, setShowAllTags] = useState(false);
  const [showAllPlayers, setShowAllPlayers] = useState(false);
  const [tagSearch, setTagSearch]   = useState('');
  const [playerSearch, setPlayerSearch] = useState('');
  const [openTagGroups, setOpenTagGroups] = useState({});
  const [openPlayerGroups, setOpenPlayerGroups] = useState({});
  const [pz, setPz]                 = useState({x:0,y:0,s:1});
  const [isPanning, setIsPanning]   = useState(false);
  const isDragging                  = useRef(false);
  const lastPos                     = useRef(null);
  const containerRef                = useRef(null);
  const svgRef                      = useRef(null);

  const selStories = stories.filter(s=>sel.has(s.id));
  const tagMeta = useMemo(() => buildSpiderTagMeta(selStories), [selStories]);
  const playerMeta = useMemo(() => buildSpiderPlayerMeta(selStories), [selStories]);
  const activeTagNorm = normalizeMapTag(activeTag);
  const activePlayerNorm = normalizeMapPerson(activePlayer);
  const focusActive = !!(activeTagNorm || activePlayerNorm);
  const filteredGroupedExtraTags = useMemo(() => {
    const q = normalizeMapTag(tagSearch);
    const source = tagMeta.groupedExtraTags || {};
    if (!q) return source;
    const out = {};
    Object.entries(source).forEach(([group, items]) => {
      const keep = items.filter(it => it.tag.includes(q));
      if (keep.length) out[group] = keep;
    });
    return out;
  }, [tagMeta.groupedExtraTags, tagSearch]);
  const orderedExtraGroups = useMemo(() => (
    Object.entries(filteredGroupedExtraTags).sort((a, b) => {
      if (a[0] === 'Other') return 1;
      if (b[0] === 'Other') return -1;
      return a[0].localeCompare(b[0]);
    })
  ), [filteredGroupedExtraTags]);
  const filteredGroupedExtraPlayers = useMemo(() => {
    const q = normalizeMapPerson(playerSearch);
    const source = playerMeta.groupedExtraPlayers || {};
    if (!q) return source;
    const out = {};
    Object.entries(source).forEach(([group, items]) => {
      const keep = items.filter(it => it.norm.includes(q) || it.label.toLowerCase().includes(q));
      if (keep.length) out[group] = keep;
    });
    return out;
  }, [playerMeta.groupedExtraPlayers, playerSearch]);
  const orderedExtraPlayerGroups = useMemo(() => (
    Object.entries(filteredGroupedExtraPlayers).sort((a, b) => {
      if (a[0] === 'Other') return 1;
      if (b[0] === 'Other') return -1;
      return a[0].localeCompare(b[0]);
    })
  ), [filteredGroupedExtraPlayers]);

  const nodeHasTag = n => {
    if (!activeTagNorm) return true;
    if (!n) return false;
    if (n.type === 'story') return !!tagMeta.storyTagSets[n.story.id]?.has(activeTagNorm);
    if (n.type === 'episode') {
      return !!tagMeta.epTagSets[n.ep.id]?.has(activeTagNorm) || !!tagMeta.storyTagSets[n.storyId]?.has(activeTagNorm);
    }
    return false;
  };
  const nodeHasPlayer = n => {
    if (!activePlayerNorm) return true;
    if (!n) return false;
    if (n.type === 'story') return !!playerMeta.storyPlayerSets[n.story.id]?.has(activePlayerNorm);
    if (n.type === 'episode') {
      return !!playerMeta.epPlayerSets[n.ep.id]?.has(activePlayerNorm) || !!playerMeta.storyPlayerSets[n.storyId]?.has(activePlayerNorm);
    }
    return false;
  };
  const nodeMatchesFocus = n => nodeHasTag(n) && nodeHasPlayer(n);

  const edgeHasTag = e => {
    if (!focusActive) return true;
    const s = mapData.nodes.find(n => n.id === e.source);
    const t = mapData.nodes.find(n => n.id === e.target);
    return nodeMatchesFocus(s) || nodeMatchesFocus(t);
  };

  function goToMap() {
    const md = buildMapData(selStories, loadBrief());
    setMapData(md);
    setActiveTag('');
    setActivePlayer('');
    setShowAllTags(false);
    setShowAllPlayers(false);
    setTagSearch('');
    setPlayerSearch('');
    setOpenTagGroups({});
    setOpenPlayerGroups({});
    // Auto-fit initial view to node extents
    if (md.nodes.length) {
      const pad = 90;
      const xs = md.nodes.map(n => n.x), ys = md.nodes.map(n => n.y);
      const minX = Math.min(...xs)-pad, maxX = Math.max(...xs)+pad;
      const minY = Math.min(...ys)-pad, maxY = Math.max(...ys)+pad;
      const bw = maxX-minX, bh = maxY-minY;
      const vw = window.innerWidth, vh = window.innerHeight-50;
      const s = Math.min(1.1, Math.max(0.18, Math.min(vw/bw, vh/bh) * 0.82));
      const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
      setPz({ x: -cx*s, y: -cy*s, s });
    } else {
      setPz({x:0,y:0,s:1});
    }
    setPhase('map');
  }

  // Wheel zoom centered on cursor
  useEffect(()=>{
    if(phase!=='map') return;
    const el=containerRef.current; if(!el) return;
    const h=(e)=>{
      e.preventDefault();
      const f=e.deltaY<0?1.12:0.88;
      const rect=el.getBoundingClientRect();
      const ox=e.clientX-rect.left-rect.width/2;
      const oy=e.clientY-rect.top-rect.height/2;
      setPz(p=>{ const ns=Math.max(0.2,Math.min(5,p.s*f)); const r=ns/p.s;
        return {x:ox+(p.x-ox)*r, y:oy+(p.y-oy)*r, s:ns}; });
    };
    el.addEventListener('wheel',h,{passive:false});
    return ()=>el.removeEventListener('wheel',h);
  },[phase]);

  function onPD(e){
    if (e.button !== 0) return;
    if (!Number.isFinite(e.clientX) || !Number.isFinite(e.clientY)) return;
    isDragging.current = true;
    setIsPanning(true);
    lastPos.current = { x:e.clientX, y:e.clientY };
    try { containerRef.current?.setPointerCapture?.(e.pointerId); } catch {}
  }
  function onPM(e){
    if (!isDragging.current || !lastPos.current) return;
    if (!Number.isFinite(e.clientX) || !Number.isFinite(e.clientY)) return;
    const dx = e.clientX - lastPos.current.x;
    const dy = e.clientY - lastPos.current.y;
    if (!Number.isFinite(dx) || !Number.isFinite(dy)) return;
    setPz(p => ({ ...p, x: p.x + dx, y: p.y + dy }));
    lastPos.current = { x:e.clientX, y:e.clientY };
  }
  function onPU(e){
    isDragging.current = false;
    setIsPanning(false);
    lastPos.current = null;
    try { containerRef.current?.releasePointerCapture?.(e.pointerId); } catch {}
  }

  function exportStamp() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 800);
  }

  function getSerializedMapSvg() {
    const svg = svgRef.current;
    if (!svg) return null;
    const rect = svg.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    clone.setAttribute('width', String(w));
    clone.setAttribute('height', String(h));
    clone.setAttribute('viewBox', `0 0 ${w} ${h}`);
    materializeSvgThemeVars(clone);
    addMapExportLogo(clone, w, h);
    const markup = `<?xml version="1.0" encoding="UTF-8"?>\n${new XMLSerializer().serializeToString(clone)}`;
    return { markup, width: w, height: h };
  }

  function exportMapSvg() {
    const data = getSerializedMapSvg();
    if (!data) return;
    const blob = new Blob([data.markup], { type: 'image/svg+xml;charset=utf-8' });
    downloadBlob(blob, `lateral-spider-map-${exportStamp()}.svg`);
  }

  async function exportMapPng() {
    const data = getSerializedMapSvg();
    if (!data) return;
    const svgBlob = new Blob([data.markup], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    try {
      await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = data.width;
            canvas.height = data.height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = C.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            canvas.toBlob((pngBlob) => {
              if (!pngBlob) return reject(new Error('PNG export failed'));
              downloadBlob(pngBlob, `lateral-spider-map-${exportStamp()}.png`);
              resolve();
            }, 'image/png');
          } catch (err) { reject(err); }
        };
        img.onerror = () => reject(new Error('Could not render map image'));
        img.src = url;
      });
    } catch (err) {
      console.warn('PNG export failed', err);
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function exportMapPdf() {

    const safeSvg = data.markup.replace(/<\/script/gi, '<\\/script');
    const html = `<!doctype html>
<html>

  <meta charset="utf-8" />
  <title>Lateral Spider Map</title>

    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }

    .wrap svg { max-width:100%; height:auto; display:block; }
    @page { margin: 10mm; }
  </style>
</head>
<body>
  <div class="wrap">${safeSvg}</div>
  <script>window.addEventListener('load',()=>setTimeout(()=>window.print(),120));<\/script>
</body>
</html>`;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if (win) {
      win.addEventListener('afterprint', () => URL.revokeObjectURL(url), { once: true });
      setTimeout(() => URL.revokeObjectURL(url), 120000);
    } else {
      URL.revokeObjectURL(url);
    }
  }

  // ── SELECTION PHASE ─────────────────────────────────────────────────────
  if(phase==='select') return (
    <div style={{position:'fixed',inset:0,background:'rgba(10,8,6,0.5)',backdropFilter:'blur(4px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1100}}>
      <div style={{background:C.surface,borderRadius:16,padding:28,width:'100%',maxWidth:480,boxShadow:'0 24px 64px rgba(0,0,0,0.25)',maxHeight:'80vh',display:'flex',flexDirection:'column'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:800,color:C.text}}>⬡ Spider Map</h3>
          <button onClick={onClose} style={{border:'none',background:'none',fontSize:22,cursor:'pointer',color:C.textMute,lineHeight:1}}>×</button>
        </div>
        <p style={{margin:'0 0 14px',fontSize:12.5,color:C.textMid,lineHeight:1.6}}>Select stories to map. Cross-story connections are drawn from your intelligence brief — generate one first to see lateral links.</p>
        <div style={{overflowY:'auto',flex:1,marginBottom:14,borderTop:`1px solid ${C.borderLight}`}}>
          {stories.map(s=>(
            <label key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 2px',borderBottom:`1px solid ${C.borderLight}`,cursor:'pointer'}}>
              <input type="checkbox" checked={sel.has(s.id)} style={{width:15,height:15,accentColor:C.accent,cursor:'pointer',flexShrink:0}}
