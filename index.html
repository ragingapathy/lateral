  );
}

// ─── Discover Modal ──────────────────────────────────────────────────────────
function DiscoverModal({ story, onClose, onAdd, settings }) {
  const [phase, setPhase] = useState('idle'); // idle | searching | results
  const [queries, setQueries] = useState([]);
  const [articles, setArticles] = useState([]);
  const [status, setStatus] = useState('');
  const [addingUrl, setAddingUrl] = useState(null);
  const [activeSources, setActiveSources] = useState(null); // null = all; Set = specific domains
  const [busySince, setBusySince] = useState(null);
  const [busyElapsedMs, setBusyElapsedMs] = useState(0);
  const [customTerms, setCustomTerms] = useState('');
  const [cachedAt, setCachedAt] = useState(null);
  const [filteredOut, setFilteredOut] = useState([]);

  const storyCacheId = story?.id || story?.title || 'discover';

  // Derive source list + filtered articles from current state
  const sourceCounts = {};
  articles.forEach(a => { const k = a.source?.domain||''; if(k) sourceCounts[k]=(sourceCounts[k]||0)+1; });
  const sourceList = Object.entries(sourceCounts)
    .sort((a,b)=>b[1]-a[1])
    .map(([domain,count])=>({ domain, name:articles.find(a=>a.source?.domain===domain)?.source?.name||domain, count }));
  const displayedArticles = activeSources
    ? articles.filter(a => activeSources.has(a.source?.domain||''))
    : articles;
  const isFiltered = activeSources !== null;

  const discoverGroups = useArticleGroups(displayedArticles);
  const editorialRows = React.useMemo(() => buildDiscoverEditorialRows(discoverGroups.lead), [discoverGroups]);

  const busyActive = phase === 'searching' || addingUrl !== null;
  const busyLabel = phase === 'searching'
    ? 'Searching live sources'
    : (addingUrl ? 'Analyzing selected article' : 'Working');
  const fmtElapsed = ms => {
    const total = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `${m}:${String(s).padStart(2,'0')}`;
  };
  const fmtAgo = iso => {
    if (!iso) return '';
    const t = new Date(iso).getTime();
    if (!Number.isFinite(t)) return '';
    const mins = Math.max(0, Math.floor((Date.now() - t) / 60000));
    if (mins < 1) return 'just now';
    if (mins === 1) return '1 minute ago';
    return `${mins} minutes ago`;
  };

  useEffect(() => {
    if (!busySince) { setBusyElapsedMs(0); return; }
    const tick = () => setBusyElapsedMs(Date.now() - busySince);
    tick();
    const id = setInterval(tick, 250);
    return () => clearInterval(id);
  }, [busySince]);

  function toggleSource(domain) {
    setActiveSources(prev => {
      const allKeys = new Set(sourceList.map(s=>s.domain));
      const current = prev ? new Set(prev) : new Set(allKeys);
      current.has(domain) ? current.delete(domain) : current.add(domain);
      if (current.size === allKeys.size) return null; // all selected = reset to null
      return current;
    });
  }

  function parseCustomQueries(input) {
    const cleaned = String(input || '').trim();
    if (!cleaned) return [];
    const parts = cleaned.includes('\n') || cleaned.includes(';')
      ? cleaned.split(/[\n;]+/)
      : [cleaned];
    return [...new Set(parts.map(p => p.trim()).filter(Boolean))].slice(0, 4);
  }

  async function runQuerySet(qs, { cacheable = false, gated = false } = {}) {
    if (!qs?.length) {
      setStatus('No valid queries to run.');
      return;
    }

    setPhase('searching');
    setBusySince(Date.now());
    setStatus(`Searching: ${qs.join(' · ')}…`);
    setQueries(qs);
    setActiveSources(null);

    try {
      const results = await Promise.all(qs.map(q => searchArticles(q).catch(() => [])));
      const seen = new Set();
      const merged = results.flat().filter(a => {
        if (seen.has(a.url)) return false;
        seen.add(a.url);
        return true;
      }).sort((a,b) => (b.date||'') > (a.date||'') ? 1 : (b.date||'') < (a.date||'') ? -1 : 0);

      if (!merged.length) {
        setArticles([]);
        setPhase('results');
        setBusySince(null);
        setStatus('No results found. Try different queries.');
        return;
      }

      // AI relevance pass (AI-generated queries only; your own custom terms are never second-guessed).
      let kept = merged, rejected = [];
      if (gated) {
        setStatus(`Found ${merged.length} articles. Checking relevance…`);
        const gate = await checkRelevance(storyRelevanceCtx(story), merged);
        kept = gate.kept; rejected = gate.filtered;
      }
      setFilteredOut(rejected);

      setStatus(`Loaded ${kept.length} articles. Enriching images…`);
      const withImages = await attachImages(kept).catch(() => kept);
      setArticles(withImages);
      setPhase('results');
      setBusySince(null);
      setStatus('');

      if (cacheable) {
        setCacheEntry(storyCacheId, 'discoverModal', { queries: qs, articles: withImages, filtered: rejected });
        setCachedAt(getCacheEntry(storyCacheId, 'discoverModal')?.generatedAt || null);
      } else {
        setCachedAt(null);
      }
    } catch (e) {
      setBusySince(null);
      setPhase('idle');
      setStatus(`Error: ${e.message}`);
    }
  }

  async function discover(forceRefresh = false) {
    const cached = getCacheEntry(storyCacheId, 'discoverModal');
    const cacheFresh = cached?.generatedAt && (Date.now() - new Date(cached.generatedAt).getTime()) < DISCOVER_MODAL_TTL_MS;
    if (!forceRefresh && cacheFresh && Array.isArray(cached.articles) && cached.articles.length) {
      setQueries(cached.queries || []);
      setArticles(cached.articles || []);
      setFilteredOut(cached.filtered || []);
      setPhase('results');
      setActiveSources(null);
      setCachedAt(cached.generatedAt || null);
      setStatus(`Using saved discovery from ${fmtS(cached.generatedAt)}.`);
      return;
    }

    setStatus('Asking AI for search queries…');
    setCachedAt(null);
    setBusySince(Date.now());
    try {
      const qs = await generateSearchQueries(story, settings);
      await runQuerySet(qs, { cacheable: true, gated: true });
    } catch (e) {
      setBusySince(null);
      setPhase('idle');
      setStatus(`Error: ${e.message}`);
    }
  }

  async function runCustomDiscover() {
    const qs = parseCustomQueries(customTerms);
    if (!qs.length) {
      setStatus('Enter one or more custom search terms first.');
      return;
    }
    await runQuerySet(qs, { cacheable: false });
    setCachedAt(null);
  }

  function restoreDiscovered(a) {
    const { relevance, ...clean } = a;
    restoreRelevance(storyRelevanceCtx(story), a);
    const nextFiltered = filteredOut.filter(x => x.url !== a.url);
    setArticles(prev => [clean, ...prev]);
    setFilteredOut(nextFiltered);
    const cached = getCacheEntry(storyCacheId, 'discoverModal');
    if (cached) patchCacheEntry(storyCacheId, 'discoverModal', { articles: [clean, ...(cached.articles || [])], filtered: nextFiltered });
  }

  async function addArticle(article) {
    setAddingUrl(article.url);
    setBusySince(Date.now());
    setStatus(`Analyzing: ${article.title.slice(0,60)}…`);
    try {
      let ep = null;
      const [text, imgUrl] = await Promise.all([
        fetchText(article.url),
        (article.imageUrl ? Promise.resolve(article.imageUrl) : fetchOgImage(article.url)).catch(() => null),
      ]);
      if (text && text.length > 200) {
        try {
          const r = await analyzeEpisode(text, story, settings);
          ep = { date:r.date||article.date||now().slice(0,10), type:r.type||'development',
            headline:r.headline||article.title, summary:r.summary||article.snippet||'',
            framingNote:r.framingNote||'', _suggestedActors:r.newActors||[] };
        } catch(e) { console.warn('analyzeEpisode failed, using metadata:', e.message); }
      }
      if (!ep) {
        ep = { date:article.date||now().slice(0,10), type:'development',
          headline:article.title, summary:article.snippet||'', framingNote:'', _suggestedActors:[] };
      }
      onAdd({id:uid(),...ep,sourceUrl:article.url,...(imgUrl?{imageUrl:imgUrl}:{}),addedAt:now()});
      setArticles(prev => prev.filter(a => a.url !== article.url));
      setStatus(`Added: ${article.title.slice(0,50)}`);
    } catch(e) {
      setStatus(`Failed to add: ${e.message}`);
    }
    setAddingUrl(null);
    setBusySince(null);
  }

  return (
    <Modal title={`Discover Episodes — ${story.title}`} onClose={onClose} maxWidth={980}>
      <div style={{marginBottom:16}}>
        <p style={{fontSize:13,color:C.textMid,lineHeight:1.6,margin:'0 0 14px'}}>
          AI will generate focused search queries from the story context, then scan live sources for timely coverage. The layout mixes spotlight cards and 3-up rows so results can breathe.
        </p>
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <Btn onClick={() => discover(false)} disabled={phase==='searching'} style={{flex:1}}>
            {phase==='searching' ? '🔍 Searching…' : '🔍 Find Related Articles'}
          </Btn>
          <Btn variant="ghost" onClick={() => discover(true)} disabled={phase==='searching'} style={{padding:'0 12px',fontSize:12}}>Refresh</Btn>
        </div>
        <div style={{display:'flex',gap:8}}>
          <input
            value={customTerms}
            onChange={e=>setCustomTerms(e.target.value)}
            placeholder="Custom terms (one query, or separate with ; or new lines)"
            style={{...inputStyle,margin:0,flex:1}}
          />
          <Btn variant="ghost" onClick={runCustomDiscover} disabled={phase==='searching'} style={{padding:'0 12px',fontSize:12}}>Run Custom</Btn>
        </div>
        {cachedAt && (
          <div style={{marginTop:7,fontSize:11,color:C.textMute}}>
            cached {fmtAgo(cachedAt)}
          </div>
        )}
      </div>

      {busyActive && (
        <div style={{display:'flex',alignItems:'center',gap:9,padding:'8px 10px',borderRadius:8,background:'#f6f8fb',border:`1px solid ${C.border}`,marginBottom:10}}>

          <span style={{fontSize:12,color:C.textMid,fontWeight:600}}>{busyLabel}</span>

      {status && (

function AddPredictionModal({ onClose, onAdd }) {
  const [statement,setStatement]=useState('');
  const [confidence,setConfidence]=useState(50);
  const [resolutionDate,setResolutionDate]=useState('');
  const [busy,setBusy]=useState(false);
  const [status,setStatus]=useState('');
  const [signalText,setSignalText]=useState('');
  const [autoSuggest,setAutoSuggest]=useState(true);

  async function handleCreate() {
    if (!statement.trim()) { setStatus('Enter a prediction statement.'); return; }
    setBusy(true); setStatus('Creating prediction…');
    try {
      // Signals = the searches that watch for evidence. Your own (one per line) plus, optionally, AI suggestions.
      let signals = signalText.split('\n').map(l => l.trim()).filter(Boolean).map(q => ({ query: q, type: 'indicator', active: true }));
      if (autoSuggest) {
        setStatus('Suggesting signals…');
        try {
          const sr = await fetch('/v2/signals/suggest', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ statement: statement.trim(), resolutionDate })
          });
          const sd = await sr.json();
          if (sr.ok && Array.isArray(sd.signals)) {
            const have = new Set(signals.map(s => s.query.toLowerCase()));
            signals = [...signals, ...sd.signals.filter(s => !have.has(s.query.toLowerCase())).map(s => ({ ...s, active: true }))];
          }
        } catch (e) { /* non-fatal: the prediction is still created; add signals from its page later */ }
        setStatus('Creating prediction…');
      }
      const r = await fetch('/v2/predictions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statement: statement.trim(), confidence: Number(confidence), resolutionDate, signals })
      });
      const data = await r.json();
      if (!r.ok || data.error) throw new Error(data.error || 'Failed to create prediction');
      const pred = data.prediction || data; // server responds { prediction: {...} }
      if (!pred?.id) throw new Error('Server did not return a prediction id');
      // Create linked story
      const story = {
        id: 'pred-' + pred.id.slice(0,8),
        title: statement.trim().slice(0,80) + (statement.trim().length>80?'…':'') + ' (Prediction)',
        summary: statement.trim(),
        statusLine: `${confidence}% confidence · ${resolutionDate ? 'Resolves ' + resolutionDate : 'No resolution date'}`,
        status: 'active',
        tags: ['Prediction', 'Forecasting'],
        actors: [],
        predictionId: pred.id,
        createdAt: now(),
        updatedAt: now(),
        episodes: []
      };
      onAdd(story);
      onClose();
    } catch(e) { setStatus(`Error: ${e.message}`); }
    setBusy(false);
  }

  return (
    <Modal title="New Prediction" onClose={onClose}>
      <Field label="Statement *"><textarea value={statement} onChange={e=>setStatement(e.target.value)} placeholder="A clear, falsifiable claim… e.g. 'Bitcoin will hit $100k by Dec 31'" rows={3} style={{...inputStyle,resize:'vertical'}}/></Field>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
        <div><label style={labelStyle}>Confidence (0-100)</label><input type="number" min={0} max={100} value={confidence} onChange={e=>setConfidence(Math.max(0,Math.min(100,Number(e.target.value))))} style={inputStyle}/></div>
        <div><label style={labelStyle}>Resolution Date</label><input type="date" value={resolutionDate} onChange={e=>setResolutionDate(e.target.value)} style={inputStyle}/></div>
      </div>
      <Field label="Signals (optional) — one search per line">
        <textarea value={signalText} onChange={e=>setSignalText(e.target.value)} rows={3} placeholder={'Searches that would turn up evidence, e.g.\nFed rate cut odds\nPowell inflation statement'} style={{...inputStyle,resize:'vertical'}}/>
      </Field>
      <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:C.textMid,margin:'-4px 0 14px',cursor:'pointer'}}>
        <input type="checkbox" checked={autoSuggest} onChange={e=>setAutoSuggest(e.target.checked)}/>
        Also suggest signals for me (takes a few seconds)
      </label>
      <Btn onClick={handleCreate} disabled={busy||!statement.trim()} style={{width:'100%'}}>{busy?status||'Creating…':'Create Prediction'}</Btn>
      <StatusLine msg={status}/>
    </Modal>
  );
}

function BackfillModal({ story, onClose, onAdd, settings }) {
  const [phase, setPhase] = useState('searching'); // searching|results|suggesting|extracting|review
  const [wikiResults, setWikiResults] = useState([]);
  const [selected, setSelected] = useState({}); // url -> {title,url}
  const [showPaste, setShowPaste] = useState(false);
  const [pasteUrl, setPasteUrl] = useState('');
  const [pasteText, setPasteText] = useState('');
  const [errMsg, setErrMsg] = useState('');
  const [progressMsg, setProgressMsg] = useState('');
  const [candidates, setCandidates] = useState([]);
  const [triedSuggest, setTriedSuggest] = useState(false);

  useEffect(() => { runInitialSearch(); }, []);

  async function runInitialSearch() {
    setPhase('searching'); setErrMsg('');
    const results = await searchWikipedia(story.title, 6);
    setWikiResults(results);
    setSelected(prev => {
      // Auto-check a single strong-looking result so the common case is one click away.
      if (results.length === 1) return { [results[0].url]: results[0] };
      return prev;
    });
    setPhase('results');
    if (!results.length) setErrMsg('No direct Wikipedia match. Try suggested searches, or paste a link/text below.');
  }

  async function runSuggestedSearch() {
    setPhase('suggesting'); setErrMsg(''); setTriedSuggest(true);
    try {
      const queries = await suggestBackfillQueries(story, settings);
      if (!queries.length) {
        setPhase('results');
        setErrMsg('Could not think of alternate searches — try pasting a link or text instead.');
        return;
      }
      const batches = await Promise.all(queries.map(q => searchWikipedia(q, 3)));
      const seen = new Set(wikiResults.map(r => r.url));
      const merged = [];
      batches.flat().forEach(r => { if (r.url && !seen.has(r.url)) { seen.add(r.url); merged.push(r); } });
      setWikiResults(prev => [...prev, ...merged]);
      setPhase('results');
      if (!merged.length) setErrMsg('No additional matches found — try pasting a link or text instead.');
    } catch (e) {
      setPhase('results');
      setErrMsg(e?.message || 'Suggestion failed — try pasting a link or text instead.');
    }
  }

  function toggleSelect(item) {
    setSelected(prev => {
      const next = { ...prev };
      if (next[item.url]) delete next[item.url]; else next[item.url] = item;
      return next;
    });
  }

  async function runExtraction() {
    const sources = Object.values(selected);
    const trimmedPasteUrl = pasteUrl.trim();
    const trimmedPasteText = pasteText.trim();
    if (trimmedPasteUrl) sources.push({ title: 'Pasted link', url: trimmedPasteUrl });
    if (!sources.length && !trimmedPasteText) {
      setErrMsg('Select at least one source above, or paste a link/text.');
      return;
    }
    setPhase('extracting'); setErrMsg('');
    const found = [];
    for (const src of sources) {
      setProgressMsg(`Reading ${src.title}…`);
      const text = await fetchBackfillSource(src.url);
      if (!text) continue;
      setProgressMsg(`Extracting milestones from ${src.title}…`);
      try {
        const eps = await extractBackfillEpisodes(text, src.title, story, settings);
        eps.forEach(e => found.push({ ...e, sourceLabel: src.title, sourceUrl: src.url }));
      } catch {}
    }
    if (trimmedPasteText) {
      setProgressMsg('Extracting milestones from pasted text…');
      try {
        const eps = await extractBackfillEpisodes(trimmedPasteText.slice(0, 16000), 'Pasted text', story, settings);
        eps.forEach(e => found.push({ ...e, sourceLabel: 'Pasted text', sourceUrl: '' }));
      } catch {}
    }
    if (!found.length) {
      setPhase('results');
      setErrMsg('No dated milestones could be extracted from the selected source(s). Try a different page, or paste text directly.');
      return;
    }
    found.sort((a, b) => (parseDateSafe(a.date)?.getTime()||0) - (parseDateSafe(b.date)?.getTime()||0));
    setCandidates(found.map((e, i) => ({
      id: `c${i}`,
      date: parseDateSafe(e.date)?.toISOString().slice(0, 10) || now().slice(0, 10),
      dateLabel: e.dateLabel || '',
      headline: e.headline || 'Untitled milestone',
      summary: e.summary || '',
      sourceLabel: e.sourceLabel,
      sourceUrl: e.sourceUrl || '',
      checked: true,
    })));
    setPhase('review');
  }

  function updateCandidate(id, patch) {
    setCandidates(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c));
  }

  function commit() {
    const chosen = candidates.filter(c => c.checked);
    chosen.forEach(c => {
      onAdd({
        id: uid(),
        date: c.date,
        type: 'development',
        headline: c.headline,
        summary: c.summary,
        framingNote: `Backfilled from ${c.sourceLabel}${c.dateLabel ? ` (originally dated "${c.dateLabel}")` : ''}.`,
        sourceUrl: c.sourceUrl || '',
        addedAt: now(),
      }, story.id);
    });
    onClose();
  }

    <Modal title={`Backfill History — ${story.title}`} onClose={onClose} maxWidth={620}>

        <div style={{display:'flex',alignItems:'center',padding:'20px 4px',fontSize:13,color:C.textMid}}>

        </div>

        <div style={{display:'flex',alignItems:'center',padding:'20px 4px',fontSize:13,color:C.textMid}}>

          {wikiResults.length > 0 && (
            <div style={{display:'flex',flexDirection:'column',gap:8,margin:'12px 0'}}>
              {wikiResults.map(r => {
                const isSel = !!selected[r.url];
                return (
                  <div key={r.url} onClick={() => toggleSelect(r)}
                    style={{display:'flex',gap:10,padding:'10px 12px',borderRadius:9,border:`1.5px solid ${isSel?C.accent:C.border}`,background:isSel?C.borderLight:C.surface,cursor:'pointer'}}>

                      </div>
                      {r.description && <div style={{fontSize:12,color:C.textMute,marginTop:2,lineHeight:1.4}}>{r.description}</div>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {!triedSuggest && (
            <Btn variant="ghost" onClick={runSuggestedSearch} style={{width:'100%',marginBottom:10}}>
              🔮 {wikiResults.length ? 'Suggest other relevant pages' : 'Let AI suggest better searches'}
            </Btn>
          )}
          <div style={{display:'flex',alignItems:'center',gap:8,margin:'10px 0'}}>
            <div style={{flex:1,height:1,background:C.border}}/>
            <button onClick={()=>setShowPaste(s=>!s)} style={{background:'none',border:'none',fontSize:11,color:C.textMute,cursor:'pointer',padding:0}}>
              {showPaste ? '– hide' : '+ or paste a link / article / your own notes instead'}
            </button>
            <div style={{flex:1,height:1,background:C.border}}/>
          </div>
          {showPaste && (
            <>
              <Field label="URL"><input value={pasteUrl} onChange={e=>setPasteUrl(e.target.value)} placeholder="https://…" style={inputStyle}/></Field>
              <Field label="Or paste text directly">
                <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)} rows={4} placeholder="Paste a retrospective, timeline, or your own notes…" style={{...inputStyle,resize:'vertical'}}/>
              </Field>
            </>

      {phase === 'review' && (
        <>
          <div style={{fontSize:12.5,color:C.textMid,marginBottom:12}}>
            {candidates.length} milestone{candidates.length!==1?'s':''} found — review before adding to the timeline.

          <div style={{display:'flex',flexDirection:'column',gap:10,maxHeight:420,overflowY:'auto',paddingRight:2}}>
            {candidates.map((c, i) => (

                <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
                  <input type="checkbox" checked={c.checked} onChange={e=>updateCandidate(c.id,{checked:e.target.checked})} style={{marginTop:6,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',gap:8,marginBottom:6}}>
                      <input type="date" value={c.date} onChange={e=>updateCandidate(c.id,{date:e.target.value})} style={{...inputStyle,width:150,flex:'none',fontSize:12,padding:'6px 8px'}}/>
                      {c.dateLabel && <span style={{fontSize:10.5,color:C.textMute,alignSelf:'center'}}>as written: “{c.dateLabel}”</span>}

              Add {candidates.filter(c=>c.checked).length} Episode{candidates.filter(c=>c.checked).length!==1?'s':''}

    </Modal>

// ── RSS / Atom ───────────────────────────────────────────────────────────────
async function feedsJson(sub, opts) {
  try {
    const r = await fetch('/api/lateral/feeds/' + sub, opts);
    const d = await r.json().catch(() => ({}));
    if (!r.ok && !d.error) d.error = `HTTP ${r.status}`;
    return d;
  } catch (e) { return { error: e.message }; }
}
const feedsPost = (sub, body) => feedsJson(sub, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
function copyText(t) {
  try { navigator.clipboard.writeText(t); return true; } catch { /* fall back */ }
  try { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); return true; } catch { return false; }
}

// Attach feeds to one story: paste a feed or a site address, or import an OPML file.
function StoryFeedsModal({ story, onClose, onChanged }) {
  const [subs, setSubs] = useState(null);
  const [input, setInput] = useState('');
  const [found, setFound] = useState(null);
  const [busy, setBusy] = useState('');
  const [msg, setMsg] = useState('');
  const [token, setToken] = useState('');
  const [base, setBase] = useState(window.location.origin);
  const fileRef = useRef(null);
  const loadSubs = () => feedsJson('subs?storyId=' + encodeURIComponent(story.id)).then(d => setSubs(d.subs || []));
  useEffect(() => {
    loadSubs();
    feedsJson('info').then(d => setToken(d.token || ''));
    alertsJson('config').then(d => { if (d.config && d.config.appUrl) setBase(d.config.appUrl); });
  }, []);

  async function look() {
    if (!input.trim()) return;
    setBusy('look'); setMsg(''); setFound(null);
    const d = await feedsPost('preview', { url: input.trim() });
    setBusy('');
    if (d.error) setMsg(d.error.includes('HTTP') || d.error.includes('fetch') ? `Could not open that address (${d.error}).` : d.error);
    else if (!d.feeds.length) setMsg('No feed found at that address. Try the feed address itself (often ending in /feed or .xml).');
    else setFound(d.feeds);
  }
  async function follow(f) {
    const d = await feedsPost('subs', { storyId: story.id, url: f.url, title: f.title });
    if (d.error) { setMsg(d.error); return; }
    setSubs(d.subs); setFound(null); setInput('');
    await fetchNow(true);
    if (onChanged) onChanged();
  }
  async function unfollow(url) { const d = await feedsPost('subs/remove', { storyId: story.id, url }); setSubs(d.subs || []); if (onChanged) onChanged(); }
  // Read the story's feeds now and put the new items into its headlines straight away.
  async function fetchNow(quiet) {
    setBusy('fetch'); if (!quiet) setMsg('');
    const d = await feedsPost('fetch', { storyId: story.id });
    setBusy('');
    if (d.error) { setMsg(d.error); return; }
    const cur = getCacheEntry(story.id, 'headlines') || {};
    const have = new Set((cur.items || []).map(i => i.url));
    const fresh = (d.items || []).filter(i => !have.has(i.url));
    if (fresh.length) {
      const merged = [...fresh, ...(cur.items || [])].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0)).slice(0, 40);
      patchCacheEntry(story.id, 'headlines', { items: merged });
      window.dispatchEvent(new CustomEvent('lateral-headlines-updated', { detail: { storyId: story.id } }));
    }
    setMsg(`${fresh.length} new article${fresh.length === 1 ? '' : 's'} added to Latest Headlines${d.errors && d.errors.length ? `; ${d.errors.length} feed${d.errors.length === 1 ? '' : 's'} could not be read` : ''}.`);
  }
  async function importOpml(e) {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    const d = await feedsPost('opml', { storyId: story.id, opml: await file.text() });
    if (d.error) { setMsg(d.error); return; }
    setSubs(d.subs); setMsg(d.found ? `Found ${d.found} feed${d.found === 1 ? '' : 's'}; ${d.added} added.` : 'No feeds found in that file.');
    if (d.added) { await fetchNow(true); if (onChanged) onChanged(); }
  }
  const ownUrl = token ? `${base.replace(/\/+$/, '')}/api/lateral/feed/${token}/story/${story.id}.xml` : '';
  const sec = { fontSize:10, fontWeight:800, color:C.textMute, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:6 };
  return (
    <Modal title="Feeds for this story" onClose={onClose} maxWidth={600}>
      <div style={{fontSize:12.5,color:C.textMid,lineHeight:1.55,marginBottom:12}}>
        Follow RSS or Atom feeds for <strong>{story.title.replace(' (Prediction)', '')}</strong>: a trusted outlet, a reporter, a court docket, an agency's press page. Their new items join the story's Latest Headlines (and its alerts).
      </div>
      <div style={sec}>Following</div>
      <div style={{marginBottom:14}}>
        {subs === null && <div style={{fontSize:12,color:C.textMute}}>Loading…</div>}
        {subs && subs.length === 0 && <div style={{fontSize:12,color:C.textMute}}>No feeds yet.</div>}
        {(subs || []).map(f => (
          <div key={f.url} style={{display:'flex',alignItems:'center',gap:10,padding:'6px 0',borderBottom:`1px solid ${C.borderLight}`}}>
            <span style={{color:C.accent,display:'inline-flex'}}><LIcon>{ICONS.rss}</LIcon></span>
            <span style={{flex:1,minWidth:0}}>
              <span style={{display:'block',fontSize:12.5,fontWeight:700,color:C.text,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{f.title}</span>
              <span style={{display:'block',fontSize:10.5,color:C.textMute,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{f.url}</span>
            </span>
            <button onClick={() => unfollow(f.url)} title="Stop following" style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:15,padding:'0 4px'}}>✕</button>
          </div>
        ))}
      </div>
      <div style={sec}>Add a feed</div>
      <div style={{display:'flex',gap:8,marginBottom:8}}>
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') look(); }} placeholder="A site or feed address, e.g. reuters.com or https://example.com/feed" style={{...inputStyle,flex:1,fontSize:12.5}}/>
        <Btn onClick={look} disabled={busy === 'look' || !input.trim()} style={{padding:'6px 14px',fontSize:12}}>{busy === 'look' ? 'Looking…' : 'Find feed'}</Btn>
      </div>
      {found && found.map(f => (
        <div key={f.url} style={{padding:'9px 11px',borderRadius:8,background:C.surface,border:`1px solid ${C.border}`,marginBottom:8}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:700,color:C.text}}>{f.title} <span style={{fontWeight:500,fontSize:11,color:C.textMute}}>· {f.count} items</span></div>
              <div style={{fontSize:10.5,color:C.textMute,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{f.url}</div>
            </div>
            <Btn onClick={() => follow(f)} style={{padding:'5px 12px',fontSize:12}}>Follow</Btn>
          </div>
          {f.sample.map(i => <div key={i.url} style={{fontSize:11.5,color:C.textMid,marginTop:4,lineHeight:1.4}}>• {i.title}</div>)}
        </div>
      ))}
      <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap',margin:'4px 0 12px'}}>
        <button onClick={() => fileRef.current && fileRef.current.click()} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontSize:12,fontWeight:700,padding:0}}>Import an OPML file…</button>
        <input ref={fileRef} type="file" accept=".opml,.xml,text/xml" onChange={importOpml} style={{display:'none'}}/>
        {subs && subs.length > 0 && <button onClick={() => fetchNow(false)} disabled={busy === 'fetch'} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontSize:12,fontWeight:700,padding:0}}>{busy === 'fetch' ? 'Reading feeds…' : 'Read the feeds now'}</button>}
      </div>
      {msg && <div style={{fontSize:12,color:C.textMid,marginBottom:12,lineHeight:1.45}}>{msg}</div>}
      {ownUrl && (
        <>
          <div style={sec}>Follow this story elsewhere</div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input readOnly value={ownUrl} onFocus={e => e.target.select()} style={{...inputStyle,flex:1,fontSize:11.5}}/>
            <Btn variant="secondary" onClick={() => setMsg(copyText(ownUrl) ? 'Feed address copied.' : 'Select the address and copy it.')} style={{padding:'5px 12px',fontSize:12}}>Copy</Btn>
          </div>
          <div style={{fontSize:11,color:C.textMute,marginTop:5}}>An Atom feed of this story's episodes and headlines for your feed reader. The secret in the address is the only password.</div>
        </>
      )}
    </Modal>
  );
}

// ── Change alerts ────────────────────────────────────────────────────────────
async function alertsJson(sub, opts) {
  try {
    const r = await fetch('/api/lateral/alerts/' + sub, opts);
    const d = await r.json().catch(() => ({}));
    if (!r.ok && !d.error) d.error = `HTTP ${r.status}`;
    return d;
  } catch (e) { return { error: e.message }; }
}
const alertsPost = (sub, body) => alertsJson(sub, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

const ALERT_KIND = {
  'prediction-move': { icon: 'trend', color: '#059669', label: 'Prediction' },
  'prediction-due': { icon: 'clock', color: '#d97706', label: 'Resolution date' },
  'story-activity': { icon: 'doc', color: '#2563eb', label: 'Story' },
  system: { icon: 'warn', color: '#dc2626', label: 'Setup' },
  tavily: { icon: 'coin', color: '#d97706', label: 'Credits' },
  'civic-vote': { icon: 'civic', color: '#7c3aed', label: 'Bill or ordinance' },
  'civic-deadline': { icon: 'clock', color: '#d97706', label: 'Comment deadline' },
  'civic-meeting': { icon: 'civic', color: '#0ea5e9', label: 'Meeting' },
  'civic-activity': { icon: 'civic', color: '#7c3aed', label: 'Civic' },
};
const timeAgo = iso => {
  const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
  if (m < 1) return 'just now'; if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h} hr ago`;
  return new Date(iso).toLocaleDateString();
};

// The inbox: everything Lateral noticed, newest first. Works with no delivery channel set up at all.
function ActivityModal({ onClose, onOpenStory, onOpenSettings, onChanged }) {
  const [events, setEvents] = useState(null);
  const [mutedIds, setMutedIds] = useState([]);
  const [muteFor, setMuteFor] = useState(null);   // event id whose mute choices are open
  const load = () => {
    alertsJson('events?limit=100').then(d => setEvents(d.events || []));
    alertsJson('config').then(d => setMutedIds(((d.config && d.config.muted) || []).map(m => m.storyId)));
  };
  useEffect(() => { load(); }, []);
  async function muteStory(storyId, hours) {
    setMuteFor(null);
    await alertsPost(hours === -1 ? 'unmute' : 'mute', { storyId, hours: hours === -1 ? undefined : hours });
    await load(); if (onChanged) onChanged();
  }
  async function open(e) {
    if (!e.read) { await alertsPost('read', { ids: [e.id] }); if (onChanged) onChanged(); }
    if (e.storyId) onOpenStory(e.storyId); else load();
  }
  async function markAll() { await alertsPost('read', { all: true }); await load(); if (onChanged) onChanged(); }
  async function clearAll() { if (!window.confirm('Clear the whole activity list?')) return; await alertsPost('clear'); await load(); if (onChanged) onChanged(); }
  const unread = (events || []).filter(e => !e.read).length;
  return (
    <Modal title="Activity" onClose={onClose} maxWidth={620}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,flexWrap:'wrap'}}>
        <span style={{fontSize:12,color:C.textMute,flex:1}}>{events === null ? 'Loading…' : `${events.length} update${events.length === 1 ? '' : 's'}${unread ? `, ${unread} unread` : ''}`}</span>
        <button onClick={markAll} disabled={!unread} style={{background:'none',border:'none',cursor:unread ? 'pointer' : 'default',color:unread ? C.accent : C.textMute,fontSize:12,fontWeight:700,padding:0}}>Mark all read</button>
        <button onClick={onOpenSettings} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontSize:12,fontWeight:700,padding:0}}>Alert settings</button>
        <button onClick={clearAll} disabled={!events || !events.length} style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:12,padding:0}}>Clear</button>
      </div>
      {events && events.length === 0 && (
        <div style={{padding:'28px 8px',textAlign:'center',color:C.textMute,fontSize:13,lineHeight:1.6}}>
          Nothing yet. Lateral will list it here when a prediction's evidence moves, a resolution date gets close, a story picks up new coverage, or something needs attention.
          <div style={{marginTop:10}}><button onClick={onOpenSettings} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontSize:12.5,fontWeight:700}}>Set up phone or chat alerts →</button></div>
        </div>
      )}
      <div style={{maxHeight:'60vh',overflowY:'auto'}}>
        {(events || []).map(e => {
          const k = ALERT_KIND[e.kind] || ALERT_KIND['story-activity'];
          const isMutedStory = !!e.storyId && mutedIds.includes(e.storyId);
          const mutePick = { background:'none', border:'none', cursor:'pointer', color:C.accent, fontSize:11, fontWeight:700, padding:0 };
          return (
            <div key={e.id} style={{marginBottom:6}}>
            <button onClick={() => open(e)}
              style={{display:'flex',gap:11,width:'100%',textAlign:'left',padding:'10px 12px',marginBottom:0,borderRadius:9,cursor:'pointer',
                background:e.read ? C.bg : C.surface,border:`1px solid ${e.read ? C.borderLight : C.border}`,opacity:e.muted ? 0.55 : e.read ? 0.78 : 1}}>
              <span style={{width:28,height:28,borderRadius:8,background:k.color + '1f',color:k.color,display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><LIcon size={15}>{ICONS[k.icon]}</LIcon></span>
              <span style={{flex:1,minWidth:0}}>
                <span style={{display:'flex',gap:8,alignItems:'baseline'}}>
                  <span style={{fontSize:13,fontWeight:e.read ? 600 : 800,color:C.text,lineHeight:1.35,flex:1}}>{e.title}</span>
                  <span style={{fontSize:10.5,color:C.textMute,flexShrink:0}}>{timeAgo(e.at)}</span>
                </span>
                {e.body && <span style={{display:'block',fontSize:12,color:C.textMid,lineHeight:1.5,marginTop:3,whiteSpace:'pre-line'}}>{e.body}</span>}
                <span style={{display:'block',fontSize:10.5,color:C.textMute,marginTop:4}}>
                  {k.label}{e.severity === 'important' ? ' · important' : ''}{e.muted ? ' · muted story' : ''}{e.delivered === 'held' ? ' · held for quiet hours' : ''}{Array.isArray(e.delivered) ? ` · sent to ${e.delivered.filter(r => r.ok).length} of ${e.delivered.length} channel${e.delivered.length === 1 ? '' : 's'}` : ''}
                </span>
              </span>
            </button>
            {e.storyId && (
              <div style={{padding:'3px 14px 0',fontSize:11,color:C.textMute,display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
                {isMutedStory
                  ? <><span>🔕 This story is muted.</span><button style={mutePick} onClick={() => muteStory(e.storyId, -1)}>Unmute</button></>
                  : muteFor === e.id
                    ? <><span>Mute this story for</span>
                        <button style={mutePick} onClick={() => muteStory(e.storyId, 24)}>1 day</button>
                        <button style={mutePick} onClick={() => muteStory(e.storyId, 168)}>1 week</button>
                        <button style={mutePick} onClick={() => muteStory(e.storyId, 0)}>until I unmute</button>
                        <button style={{...mutePick,color:C.textMute,fontWeight:500}} onClick={() => setMuteFor(null)}>cancel</button></>
                    : <button style={{...mutePick,color:C.textMute,fontWeight:500}} onClick={() => setMuteFor(e.id)} title="Stop alerts from this story. It still shows here, dimmed.">🔕 Mute this story</button>}
              </div>
            )}
            </div>
          );
        })}
      </div>
    </Modal>
  );
}

// Settings → Alerts
function AlertsPanel() {
  const [cfg, setCfg] = useState(null);
  const [status, setStatus] = useState(null);
  const [saved, setSaved] = useState('');
  const [tests, setTests] = useState({});
  const EMPTY_DRAFT = { type: 'ntfy', name: '', server: 'https://ntfy.sh', topic: '', token: '', url: '', host: '', port: '', secure: 'starttls', user: '', pass: '', from: '', to: '', allowSelfSigned: false };
  const [draft, setDraft] = useState(EMPTY_DRAFT);
  const [adding, setAdding] = useState(false);
  const [msg, setMsg] = useState('');
  const [preview, setPreview] = useState(null);
  const saveTimer = useRef(null);

  const load = () => { alertsJson('config').then(d => d.config && setCfg(d.config)); alertsJson('status').then(d => !d.error && setStatus(d)); };
  useEffect(() => {
    load();
    // Phone links need an address a phone can reach. If Lateral is being opened from a real address (not localhost), use it.
    alertsJson('config').then(d => {
      const host = window.location.hostname;
      if (d.config && !d.config.appUrl && !/^(localhost|127\.|\[::1\]|0\.0\.0\.0)/.test(host)) {
        alertsPost('config', { appUrl: window.location.origin }).then(r => { if (r.config) { setCfg(r.config); setSaved('Link address filled in from this page'); setTimeout(() => setSaved(''), 3000); } });
      }
    });
  }, []);

  // Every change saves itself shortly after.
  const pending = useRef({});
  const mergeInto = (base, patch) => {
    const out = { ...base };
    for (const k of Object.keys(patch)) out[k] = (patch[k] && typeof patch[k] === 'object' && !Array.isArray(patch[k]) && base[k] && typeof base[k] === 'object') ? { ...base[k], ...patch[k] } : patch[k];
    return out;
  };
  function change(patch, immediate) {
    setCfg(c => mergeInto(c, patch));
    pending.current = mergeInto(pending.current, patch);
    clearTimeout(saveTimer.current);
    const run = async () => {
      const body = pending.current; pending.current = {};
      const d = await alertsPost('config', body);
      if (d.config) { setCfg(d.config); setSaved('Saved'); setTimeout(() => setSaved(''), 1500); load(); }
    };
    if (immediate) run(); else saveTimer.current = setTimeout(run, 600);
  }
  const channelsForSave = list => list.map(c => ({ id: c.id, type: c.type, name: c.name, enabled: c.enabled, server: c.server }));

  async function addChannel() {
    const body = { ...draft, name: draft.name || ({ ntfy: 'ntfy', discord: 'Discord', slack: 'Slack', webhook: 'Webhook', email: 'Email' }[draft.type]) };
    if (draft.type === 'email') {
      if (!draft.host.trim() || !draft.to.trim() || !(draft.from.trim() || draft.user.trim())) { setMsg('Email needs a server, a from address and at least one to address.'); return; }
    } else if (draft.type === 'ntfy' ? !draft.topic.trim() : !/^https?:\/\//i.test(draft.url.trim())) { setMsg(draft.type === 'ntfy' ? 'Enter a topic name.' : 'Enter the full URL, starting with https://'); return; }
    setMsg('');
    const d = await alertsPost('config', { channels: [...channelsForSave(cfg.channels), body] });
    if (d.config) { setCfg(d.config); setAdding(false); setDraft(EMPTY_DRAFT); load(); }
  }
  async function test(id) {
    setTests(t => ({ ...t, [id]: '…' }));
    const d = await alertsPost('test', { channelId: id });
    setTests(t => ({ ...t, [id]: d.ok ? '✓ Sent' : '✗ ' + (d.error || 'failed') }));
  }
  async function runNow(sub, label, body) {
    setMsg(label + '…');
    const d = await alertsPost(sub, body);
    if (sub === 'digest' && body && body.preview) setPreview(d);
    setMsg(d.error ? d.error : sub === 'digest' ? (body && body.preview ? '' : d.sent ? 'Digest sent.' : d.reason || 'Nothing sent.') : sub === 'check' ? `Checked. ${d.newEvents || 0} new update${d.newEvents === 1 ? '' : 's'}.` : sub === 'watch' ? `Started checking ${d.targets} prediction${d.targets === 1 ? '' : 's'}.` : 'Done.');
    load();
  }

  if (!cfg) return <div style={{fontSize:13,color:C.textMute}}>Loading…</div>;
  const box = { padding:'10px 12px', borderRadius:8, background:C.surface, border:`1px solid ${C.borderLight}`, marginBottom:14 };
  const head = { fontSize:10, fontWeight:800, color:C.textMute, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:8 };
  const small = { fontSize:11.5, color:C.textMute, lineHeight:1.5 };
  const check = (label, checked, onChange, hintText) => (
    <label style={{display:'flex',alignItems:'flex-start',gap:9,fontSize:12.5,color:C.textMid,lineHeight:1.45,cursor:'pointer',padding:'3px 0'}}>
      <input type="checkbox" checked={checked} onChange={e => onChange(e.target.checked)} style={{marginTop:3}}/>
      <span>{label}{hintText && <span style={{display:'block',...small}}>{hintText}</span>}</span>
    </label>
  );
  const typeLabel = { ntfy: 'ntfy', discord: 'Discord', slack: 'Slack', webhook: 'Webhook', email: 'Email' };

  return (
    <div>
      <div style={{...small,marginBottom:12,fontSize:12.5,color:C.textMid}}>
        Lateral always lists what it notices in <strong>Activity</strong> (the bell). Add a channel below to also get it on your phone or in chat, even when the app is closed.
        Alerts are sent from this computer; nothing goes through Lateral's servers (there aren't any).
      </div>

      <div style={head}>Where to send alerts</div>
      <div style={box}>
        {cfg.channels.length === 0 && !adding && <div style={{...small,marginBottom:8}}>No channels yet.</div>}
        {cfg.channels.map(ch => (
          <div key={ch.id} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 0',borderBottom:`1px solid ${C.borderLight}`,flexWrap:'wrap'}}>
            <input type="checkbox" checked={ch.enabled} title="Send alerts to this channel" onChange={e => change({ channels: channelsForSave(cfg.channels).map(c => c.id === ch.id ? { ...c, enabled: e.target.checked } : c) }, true)}/>
            <div style={{flex:1,minWidth:140}}>
              <div style={{fontSize:13,fontWeight:700,color:C.text}}>{ch.name} <span style={{fontSize:10.5,fontWeight:700,color:C.accent,border:`1px solid ${C.border}`,borderRadius:8,padding:'1px 7px',marginLeft:4}}>{typeLabel[ch.type]}</span></div>
              <div style={small}>{ch.type === 'ntfy' ? `${ch.server.replace(/^https?:\/\//, '')} · topic ${ch.topicHint}` : ch.type === 'email' ? `${ch.host}${ch.port ? ':' + ch.port : ''} → ${ch.to}` : ch.urlHint}</div>
            </div>
            <button onClick={() => test(ch.id)} style={{background:'none',border:`1px solid ${C.border}`,borderRadius:7,cursor:'pointer',color:C.accent,fontSize:11.5,fontWeight:700,padding:'3px 10px'}}>Send test</button>
            {tests[ch.id] && <span style={{fontSize:11.5,color:tests[ch.id].startsWith('✓') ? '#059669' : tests[ch.id] === '…' ? C.textMute : '#dc2626'}}>{tests[ch.id]}</span>}
            <button onClick={() => { if (window.confirm(`Remove ${ch.name}?`)) change({ channels: channelsForSave(cfg.channels).filter(c => c.id !== ch.id) }, true); }} title="Remove" style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:15,padding:'0 4px'}}>✕</button>
          </div>
        ))}
        {adding ? (
          <div style={{marginTop:10}}>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
              <select value={draft.type} onChange={e => setDraft({ ...draft, type: e.target.value })} style={{...inputStyle,width:'auto',flex:'none',fontSize:12.5}}>
                <option value="ntfy">ntfy (phone push)</option><option value="discord">Discord</option><option value="slack">Slack</option><option value="email">Email (SMTP)</option><option value="webhook">Webhook (anything else)</option>
              </select>
              <input value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} placeholder="Name (optional)" style={{...inputStyle,flex:1,minWidth:120,fontSize:12.5}}/>
            </div>
            {draft.type === 'email' ? (
              <>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
                  <input value={draft.host} onChange={e => setDraft({ ...draft, host: e.target.value })} placeholder="SMTP server, e.g. smtp.gmail.com" style={{...inputStyle,flex:2,minWidth:180,fontSize:12.5}}/>
                  <input value={draft.port} onChange={e => setDraft({ ...draft, port: e.target.value.replace(/\D/g, '') })} placeholder="Port" style={{...inputStyle,flex:'0 0 80px',fontSize:12.5}}/>
                  <select value={draft.secure} onChange={e => setDraft({ ...draft, secure: e.target.value })} style={{...inputStyle,width:'auto',flex:'none',fontSize:12.5}}>
                    <option value="starttls">STARTTLS (usually 587)</option><option value="tls">SSL/TLS (usually 465)</option><option value="none">None (local relay)</option>
                  </select>
                </div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
                  <input value={draft.user} onChange={e => setDraft({ ...draft, user: e.target.value })} placeholder="Username (often your email address)" autoComplete="off" style={{...inputStyle,flex:1,minWidth:180,fontSize:12.5}}/>
                  <input type="password" value={draft.pass} onChange={e => setDraft({ ...draft, pass: e.target.value })} placeholder="Password or app password" autoComplete="new-password" style={{...inputStyle,flex:1,minWidth:160,fontSize:12.5}}/>
                </div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  <input value={draft.from} onChange={e => setDraft({ ...draft, from: e.target.value })} placeholder="From address" style={{...inputStyle,flex:1,minWidth:180,fontSize:12.5}}/>
                  <input value={draft.to} onChange={e => setDraft({ ...draft, to: e.target.value })} placeholder="Send to (comma-separated)" style={{...inputStyle,flex:1,minWidth:180,fontSize:12.5}}/>
                </div>
                <div style={{...small,marginTop:6}}>Gmail, iCloud and Outlook need an <em>app password</em> rather than your normal one. The password is stored only on this computer and is never shown again.</div>
                <label style={{display:'flex',alignItems:'center',gap:7,...small,marginTop:6,cursor:'pointer'}}><input type="checkbox" checked={draft.allowSelfSigned} onChange={e => setDraft({ ...draft, allowSelfSigned: e.target.checked })}/> Accept a self-signed certificate (for a mail server on your own network)</label>
              </>
            ) : draft.type === 'ntfy' ? (
              <>
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  <input value={draft.topic} onChange={e => setDraft({ ...draft, topic: e.target.value })} placeholder="Topic, e.g. my-lateral-alerts-8f3k" style={{...inputStyle,flex:1,minWidth:200,fontSize:12.5}}/>
                  <input value={draft.server} onChange={e => setDraft({ ...draft, server: e.target.value })} placeholder="Server" style={{...inputStyle,flex:1,minWidth:160,fontSize:12.5}}/>
                </div>
                <div style={{...small,marginTop:6}}>Install the free ntfy app, subscribe to the same topic, and pick a hard-to-guess name: anyone who knows a public topic can read it. A self-hosted server or access token also works.</div>
                <input value={draft.token} onChange={e => setDraft({ ...draft, token: e.target.value })} placeholder="Access token (optional, for private servers)" style={{...inputStyle,fontSize:12.5,marginTop:6}}/>
              </>
            ) : (
              <>
                <input value={draft.url} onChange={e => setDraft({ ...draft, url: e.target.value })} placeholder={draft.type === 'discord' ? 'Discord webhook URL' : draft.type === 'slack' ? 'Slack incoming-webhook URL' : 'https://…'} style={{...inputStyle,fontSize:12.5}}/>
                <div style={{...small,marginTop:6}}>{draft.type === 'webhook' ? 'Lateral POSTs JSON: app, kind, title, message, url, priority, sentAt. Works with n8n, Home Assistant, Zapier and similar.' : 'Create the webhook in the channel settings, then paste its URL. It is stored only on this computer.'}</div>
              </>
            )}
            <div style={{display:'flex',gap:8,marginTop:10,alignItems:'center'}}>
              <Btn onClick={addChannel} style={{padding:'6px 12px',fontSize:12}}>Add channel</Btn>
              <Btn variant="ghost" onClick={() => { setAdding(false); setMsg(''); }} style={{padding:'6px 12px',fontSize:12}}>Cancel</Btn>
              {msg && <span style={{fontSize:11.5,color:'#dc2626'}}>{msg}</span>}
            </div>
          </div>
        ) : (
          <Btn variant="secondary" onClick={() => setAdding(true)} style={{padding:'6px 12px',fontSize:12,marginTop:cfg.channels.length ? 10 : 0}}>+ Add a channel</Btn>
        )}
      </div>

      <div style={head}>What to tell me</div>
      <div style={box}>
        <div style={{fontSize:12,fontWeight:700,color:C.text,marginBottom:4}}>Send straight away</div>
        {check('A prediction’s evidence moves', cfg.instant.predictionMoves, v => change({ instant: { predictionMoves: v } }), 'The balance changes direction, or shifts by a meaningful amount.')}
        {check('A prediction’s resolution date is close', cfg.instant.resolutionDue, v => change({ instant: { resolutionDue: v } }), 'A week out, a day out, the day itself, and when it is overdue.')}
        {check('Something needs attention', cfg.instant.system, v => change({ instant: { system: v } }), 'The local AI, search, or your Tavily key stops working (and when it recovers).')}
        {check('Tavily credits are running low', cfg.instant.tavilyUsage, v => change({ instant: { tavilyUsage: v } }))}
        {check('A watched bill moves, a meeting is tomorrow, or a comment period is closing', cfg.instant.civic !== false, v => change({ instant: { civic: v } }), 'For the watches you switch on in Civic. New items from them always go in the daily digest.')}
        <div style={{height:1,background:C.borderLight,margin:'10px 0'}}/>
        {check('Send a daily digest', cfg.digest.enabled, v => change({ digest: { enabled: v, tzOffsetMin: new Date().getTimezoneOffset() } }, true), 'One message with everything since the last one, including stories with new coverage. Nothing is sent on quiet days.')}
        {cfg.digest.enabled && (
          <div style={{display:'flex',alignItems:'center',gap:10,margin:'6px 0 2px 24px',flexWrap:'wrap'}}>
            <span style={small}>Around</span>
            <input type="time" value={cfg.digest.time} onChange={e => change({ digest: { time: e.target.value, tzOffsetMin: new Date().getTimezoneOffset() } })} style={{...inputStyle,width:'auto',flex:'none',fontSize:12.5}}/>
            <button onClick={() => runNow('digest', 'Building preview', { preview: true })} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontSize:11.5,fontWeight:700,padding:0}}>Preview</button>
            <button onClick={() => runNow('digest', 'Sending digest', {})} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontSize:11.5,fontWeight:700,padding:0}}>Send now</button>
          </div>
        )}
        {preview && (
          <div style={{margin:'8px 0 2px 24px',padding:'8px 10px',borderRadius:7,background:C.bg,border:`1px solid ${C.borderLight}`}}>
            <div style={{fontSize:12,fontWeight:700,color:C.text}}>{preview.title}</div>
            <div style={{fontSize:11.5,color:C.textMid,whiteSpace:'pre-line',lineHeight:1.5,marginTop:4}}>{preview.count ? preview.message : 'Nothing new since the last digest.'}</div>
            <button onClick={() => setPreview(null)} style={{background:'none',border:'none',cursor:'pointer',color:C.textMute,fontSize:11,padding:0,marginTop:4}}>Hide</button>
          </div>
        )}
        <div style={{height:1,background:C.borderLight,margin:'10px 0'}}/>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <span style={{fontSize:12.5,color:C.textMid}}>Count a prediction as “moved” at</span>
          <input type="range" min="10" max="40" step="5" value={cfg.sensitivity.scoreDelta} onChange={e => change({ sensitivity: { scoreDelta: Number(e.target.value) } })} style={{width:130}}/>
          <strong style={{fontSize:12.5,color:C.text}}>{cfg.sensitivity.scoreDelta} points</strong>
        </div>
        <div style={small}>A change of direction always counts. Lower numbers mean more alerts.</div>
      </div>

      <div style={head}>Quiet hours</div>
      <div style={box}>
        {check('Don’t send alerts during these hours', cfg.quiet.enabled, v => change({ quiet: { enabled: v, tzOffsetMin: new Date().getTimezoneOffset() } }, true), 'Alerts are held, still listed in Activity, and sent afterwards as one message instead of waking your phone.')}
        {cfg.quiet.enabled && (
          <>
            <div style={{display:'flex',alignItems:'center',gap:10,margin:'6px 0 2px 24px',flexWrap:'wrap'}}>
              <span style={small}>From</span>
              <input type="time" value={cfg.quiet.from} onChange={e => change({ quiet: { from: e.target.value, tzOffsetMin: new Date().getTimezoneOffset() } })} style={{...inputStyle,width:'auto',flex:'none',fontSize:12.5}}/>
              <span style={small}>until</span>
              <input type="time" value={cfg.quiet.to} onChange={e => change({ quiet: { to: e.target.value, tzOffsetMin: new Date().getTimezoneOffset() } })} style={{...inputStyle,width:'auto',flex:'none',fontSize:12.5}}/>
              {cfg.quietNow && <span style={{fontSize:11,fontWeight:700,color:'#7c3aed'}}>🌙 quiet right now</span>}
            </div>
            <div style={{marginLeft:24}}>
              {check('Still send important alerts', cfg.quiet.allowImportant, v => change({ quiet: { allowImportant: v } }), 'For example a prediction’s evidence changing direction, or something breaking.')}
            </div>
            {cfg.digest.enabled && <div style={{...small,marginLeft:24,marginTop:4}}>The daily digest waits until quiet hours end if its time falls inside them.</div>}
          </>
        )}
      </div>

      <div style={head}>Muted stories</div>
      <div style={box}>
        {(cfg.muted || []).length === 0
          ? <div style={small}>None. To silence a story, open <strong>Activity</strong> and choose “Mute this story” under one of its updates. Muted stories still list their updates there, dimmed, but never send them and stay out of the digest.</div>
          : (cfg.muted || []).map(m => (
              <div key={m.storyId} style={{display:'flex',alignItems:'center',gap:10,padding:'5px 0',borderBottom:`1px solid ${C.borderLight}`}}>
                <span style={{flex:1,minWidth:0,fontSize:12.5,color:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>🔕 {m.title}</span>
                <span style={small}>{m.until ? `until ${new Date(m.until).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}` : 'until you unmute'}</span>
                <button onClick={async () => { const d = await alertsPost('unmute', { storyId: m.storyId }); if (d.config) setCfg(d.config); }} style={{background:'none',border:`1px solid ${C.border}`,borderRadius:7,cursor:'pointer',color:C.accent,fontSize:11.5,fontWeight:700,padding:'2px 10px'}}>Unmute</button>
              </div>
            ))}
      </div>

      <div style={head}>Keep predictions fresh</div>
      <div style={box}>
        <div style={{fontSize:12.5,color:C.textMid,lineHeight:1.5,marginBottom:8}}>
          Predictions only change when their searches run. Let Lateral re-run them on a schedule so alerts can fire while you are away.
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>

            {cfg.watch.hours ? ` That is roughly ${Math.round(status.watch.creditsPerRun * 30 * 24 / cfg.watch.hours)} a month. It pauses on its own if your credits pass 90%.` : ''}

async function fetchHealthRaw() {
  try {
    const r = await fetch('/api/lateral/health/check', { cache: 'no-store' });
    const d = await r.json();
    if (!r.ok || !d.checks) throw new Error(d?.error || `HTTP ${r.status}`);
    return d;
  } catch (e) {
    return { overall: 'fail', checkedAt: new Date().toISOString(), checks: [{
      id: 'proxy', label: 'Lateral server', status: 'fail',
      detail: `Can’t reach the Lateral server (${e.message}).`,
      fix: 'Check that the lateral-proxy container is running: docker compose ps',
    }] };
  }
}

// Settings → Status: is everything Lateral depends on working, plus backup / restore of your data.
function SetupStatusPanel({ onShowShortcuts }) {
  const [health, setHealth] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [plan, setPlan] = useState(null); // a backup file waiting for confirmation
  const fileRef = useRef(null);
  const ICON = { ok:'✓', warn:'!', fail:'✗' };
  const COLOR = { ok:'#059669', warn:'#d97706', fail:'#dc2626' };

  async function runCheck() { setBusy(true); setHealth(await fetchHealthRaw()); setBusy(false); }
  useEffect(() => { runCheck(); }, []);

  async function downloadBackup() {
    setMsg('');
    try {
      const r = await fetch('/api/lateral/backup', { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `lateral-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      setMsg('Backup downloaded. API keys are not included.');
    } catch (e) { setMsg('Backup failed: ' + e.message); }
  }

  async function chooseFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setMsg('');
    try {
      const bundle = JSON.parse(await file.text());
      const r = await fetch('/api/lateral/restore', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ bundle, dryRun: true }) });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
      setPlan({ bundle, counts: d.counts, createdAt: d.createdAt, name: file.name });
    } catch (err) { setMsg('Can’t use that file: ' + err.message); }
  }

  async function confirmRestore() {
    setBusy(true); setMsg('');
    try {
      const r = await fetch('/api/lateral/restore', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ bundle: plan.bundle }) });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
      // Drop this browser's copy so it can't merge old stories back over the restored ones, then reload.
      try { localStorage.setItem(SK, JSON.stringify({ stories: [] })); localStorage.removeItem(SSK); } catch {}
      setMsg('Restored. Reloading…');
      setTimeout(() => location.reload(), 700);
    } catch (err) { setMsg('Restore failed: ' + err.message); setBusy(false); }
  }

  const box = { padding:'10px 12px', borderRadius:8, background:C.surface, border:`1px solid ${C.borderLight}`, marginBottom:14 };
  const head = { fontSize:10, fontWeight:800, color:C.textMute, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:8 };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <div style={{...head,marginBottom:0}}>Setup check</div>
        <Btn variant="ghost" onClick={runCheck} disabled={busy} style={{padding:'4px 10px',fontSize:11.5}}>{busy && !plan ? 'Checking…' : 'Re-check'}</Btn>
      </div>
      <div style={box}>
        {!health && <div style={{fontSize:12,color:C.textMute}}>Checking…</div>}
        {health && health.checks.map(c => (
          <div key={c.id} style={{display:'flex',gap:10,padding:'6px 0',alignItems:'flex-start'}}>
            <span style={{width:18,height:18,borderRadius:9,background:COLOR[c.status],color:'#fff',fontSize:11,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}}>{ICON[c.status]}</span>
            <div style={{minWidth:0}}>
              <div style={{fontSize:12.5,fontWeight:700,color:C.text}}>{c.label}</div>
              <div style={{fontSize:11.5,color:C.textMid,lineHeight:1.45}}>{c.detail}</div>
              {c.fix && c.status !== 'ok' && <div style={{fontSize:11.5,color:COLOR[c.status],lineHeight:1.45,marginTop:2}}>{c.fix}</div>}
            </div>
          </div>
        ))}
        {health && <div style={{fontSize:10,color:C.textMute,marginTop:6}}>Last checked {new Date(health.checkedAt).toLocaleTimeString()}</div>}
      </div>

      <div style={head}>Your data</div>
      <div style={box}>
        <div style={{fontSize:12,color:C.textMid,lineHeight:1.5,marginBottom:10}}>
          Back up your stories, predictions, scored articles and settings to one file, or restore from one. API keys are never included. Saved article copies (the Library) are not in this file; copy the <code>data/archive</code> folder to keep them.
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <Btn variant="secondary" onClick={downloadBackup} style={{padding:'6px 12px',fontSize:12}}>⬇ Export backup</Btn>
          <Btn variant="secondary" onClick={() => fileRef.current && fileRef.current.click()} disabled={busy} style={{padding:'6px 12px',fontSize:12}}>⬆ Import backup…</Btn>
          <input ref={fileRef} type="file" accept="application/json,.json" onChange={chooseFile} style={{display:'none'}}/>
        </div>
        {plan && (
          <div style={{marginTop:12,padding:'10px 12px',borderRadius:8,background:C.bg,border:`1px solid ${C.border}`}}>
            <div style={{fontSize:12,color:C.text,lineHeight:1.5}}>
              <strong>{plan.name}</strong>{plan.createdAt ? ` · made ${new Date(plan.createdAt).toLocaleString()}` : ''}<br/>
              Contains {plan.counts.stories} stor{plan.counts.stories === 1 ? 'y' : 'ies'}, {plan.counts.predictions} prediction{plan.counts.predictions === 1 ? '' : 's'}, {plan.counts.articles} scored article{plan.counts.articles === 1 ? '' : 's'}.
            </div>
            <div style={{fontSize:11.5,color:'#b45309',marginTop:6,lineHeight:1.45}}>
              Importing replaces what Lateral has now. Your current files are kept beside them in the data folder as <code>*.pre-restore-…</code>.
            </div>
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <Btn onClick={confirmRestore} disabled={busy} style={{padding:'6px 12px',fontSize:12}}>{busy ? 'Restoring…' : 'Replace my data'}</Btn>
              <Btn variant="ghost" onClick={() => setPlan(null)} disabled={busy} style={{padding:'6px 12px',fontSize:12}}>Cancel</Btn>
            </div>
          </div>
        )}
        {msg && <div style={{marginTop:10,fontSize:11.5,color:C.textMid}}>{msg}</div>}
      </div>

      <div style={head}>Keyboard</div>
      <div style={box}>
        <span style={{fontSize:12,color:C.textMid}}>Press <kbd style={{padding:'1px 6px',borderRadius:4,border:`1px solid ${C.border}`,fontSize:11}}>?</kbd> anywhere for the shortcut list. </span>
        <button onClick={onShowShortcuts} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,fontSize:12,fontWeight:700,padding:0}}>Show shortcuts</button>
      </div>
    </div>
  );
}

function SettingsModal({ settings, onSave, onClose, onPurgeDeletedStories, tavilyUsage, setTavilyUsage, initialTab, onShowShortcuts, stories }) {
  const [f,setF]=useState(settings);
  const [tab,setTab]=useState(initialTab || 'basic');
  const [status,setStatus]=useState('');
  const [voices,setVoices]=useState([]);
  const [models,setModels]=useState(MODELS);
  const [externalModels,setExternalModels]=useState([]);
  const [keyDraft,setKeyDraft]=useState({
    anthropicApiKey:'',
    geminiApiKey:'',
    moonshotApiKey:'',
    openaiCompatApiKey:'',
    listenNotesApiKey:'',
    podcastIndexApiKey:'',
    podcastIndexApiSecret:'',
    tavilyApiKey:''
  });
  const [keyStatus,setKeyStatus]=useState({
    hasAnthropic:false,
    hasGemini:false,
    hasMoonshot:false,
    hasOpenAICompat:false,
    hasListenNotes:false,
    hasPodcastIndex:false,
    hasPodcastIndexSecret:false,
    hasTavily:false
  });
  const [keysLoaded,setKeysLoaded]=useState(false);
  const [pingStatus,setPingStatus]=useState({});
  const [usageCheckedAt, setUsageCheckedAt] = useState(null);
  const provider = String(f.llmProvider || 'ollama');
  const llmEndpointCandidates = (suffix) => {
    const s = String(suffix || '').startsWith('/') ? String(suffix) : `/${suffix}`;
    return [
      `/api/lateral${s}`,
      s,
      `http://localhost:3005/api/lateral${s}`,
      `http://localhost:3005${s}`,
      `http://127.0.0.1:3005/api/lateral${s}`,
      `http://127.0.0.1:3005${s}`,
    ];
  };
  async function fetchLlmJson(suffix, options) {
    let lastStatus = 0;
    let lastErr = '';
    for (const u of llmEndpointCandidates(suffix)) {
      try {
        const r = await fetch(u, options);
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          lastStatus = r.status;
          lastErr = d?.error || `HTTP ${r.status}`;
          continue;
        }
        return { r, d, url: u };
      } catch (e) {
        lastErr = e?.message || 'Network error';
      }
    }
    throw new Error(lastErr || `Request failed (${lastStatus || 'network'})`);
  }

  function persistSettings() {
    const cleaned = {
      ...f,
      moonshotBaseUrl: String(f.moonshotBaseUrl || DEF_SETTINGS.moonshotBaseUrl).trim(),
      openaiBaseUrl: String(f.openaiBaseUrl || DEF_SETTINGS.openaiBaseUrl).trim(),
      stalledDays: Math.max(1, Number(f.stalledDays || DEF_SETTINGS.stalledDays)),
      ttsVoice: String(f.ttsVoice || '').trim(),
      autoRefreshHours: Math.max(0, Number(f.autoRefreshHours ?? DEF_SETTINGS.autoRefreshHours))
    };
    onSave(cleaned);
    return cleaned;
  }

  function closeWithSave() {
    persistSettings();
    onClose();
  }

  const pingFor = id => pingStatus[id] || { state:'idle', note:'' };
  const lightFor = id => {
    const p = pingFor(id);
    if (p.state === 'ok') return '#16a34a';
    if (p.state === 'fail') return '#dc2626';
    if (p.state === 'testing') return '#d97706';
    if (id === 'anthropic' && keyStatus.hasAnthropic) return '#10b981';
    if (id === 'gemini' && keyStatus.hasGemini) return '#10b981';
    if (id === 'moonshot' && keyStatus.hasMoonshot) return '#10b981';
    if (id === 'openai_compatible' && keyStatus.hasOpenAICompat) return '#10b981';
    if (id === 'ollama') return '#2563eb';
    return '#9ca3af';
  };

  async function refreshModels(baseUrl = f.ollamaUrl) {
    if (provider !== 'ollama') return 0;
    try {
      const r = await fetch(`${baseUrl}/api/tags`);
      if (!r.ok) throw new Error(`Ollama ${r.status}`);
      const d = await r.json();
      const discovered = (d.models || []).map(m => m.name).filter(Boolean);
      const merged = [...new Set([...discovered, ...MODELS])];
      if (merged.length) setModels(merged);
      return discovered.length;
    } catch {
      return 0;
    }
  }

  useEffect(() => { if (provider === 'ollama') refreshModels(); }, [provider]);

  async function test() {
    setStatus('Testing…');
    await pingProvider(provider, { updateGlobalStatus: true });
  }

  async function fetchTavilyUsage() {
    try {
      const { d } = await fetchLlmJson('/tavily/usage');
      setTavilyUsage(d);
      setUsageCheckedAt(new Date());
    } catch (e) {
      setTavilyUsage({ configured: false, error: e.message });
      setUsageCheckedAt(new Date());
    }
  }

  async function loadKeyStatus() {
    try {
      setKeysLoaded(false);
      const { d } = await fetchLlmJson('/llm/secrets');
      setKeyStatus({
        hasAnthropic: !!d.hasAnthropic,
        hasGemini: !!d.hasGemini,
        hasMoonshot: !!d.hasMoonshot,
        hasOpenAICompat: !!d.hasOpenAICompat,
        hasListenNotes: !!d.listenNotesConfigured,
        hasPodcastIndex: !!d.podcastIndexConfigured,
        hasPodcastIndexSecret: !!d.podcastIndexSecretConfigured,
        hasTavily: !!d.tavilyConfigured
      });
      if (!f.moonshotBaseUrl && d.moonshotBaseUrl) {
        setF(prev => ({ ...prev, moonshotBaseUrl: d.moonshotBaseUrl }));
      }
      if (!f.openaiBaseUrl && d.openaiCompatBaseUrl) {
        setF(prev => ({ ...prev, openaiBaseUrl: d.openaiCompatBaseUrl }));
      }
      setKeysLoaded(true);
      if (d.tavilyConfigured) fetchTavilyUsage();
    } catch (e) {
      setStatus(`Could not load key status: ${e.message}`);
      setKeysLoaded(true);
    }
  }

  async function refreshExternalModels() {
    if (provider === 'ollama') return;
    try {
      const qp = new URLSearchParams({ provider });
      if (provider === 'openai_compatible' && f.openaiBaseUrl) qp.set('openaiBaseUrl', f.openaiBaseUrl);
      if (provider === 'moonshot' && f.moonshotBaseUrl) qp.set('moonshotBaseUrl', f.moonshotBaseUrl);
      const { d } = await fetchLlmJson(`/llm/models?${qp.toString()}`);
      const list = Array.isArray(d.models) ? d.models : [];
      setExternalModels(list);
      if (d.source === 'fallback' && d.warning) {
        setStatus(`Model list fallback: ${d.warning}`);
      }
    } catch (e) {
      setExternalModels([]);
      setStatus(`Model list unavailable: ${e.message}`);
    }
  }

  function modelForProvider(p) {
    if (p === 'ollama') return String(f.model || 'qwen3:latest').trim();
    if (f.externalModel?.trim()) return f.externalModel.trim();
    return EXTERNAL_PROVIDER_DEFAULT_MODEL[p] || '';
  }

  async function pingProvider(p, { updateGlobalStatus = false } = {}) {
    const providerId = String(p || '').toLowerCase();
    if (!providerId) return;
    setPingStatus(prev => ({ ...prev, [providerId]: { state:'testing', note:'Testing…' } }));
    try {
      const payload = {
        provider: providerId,
        model: modelForProvider(providerId),
        openaiBaseUrl: f.openaiBaseUrl || '',
        moonshotBaseUrl: f.moonshotBaseUrl || ''
      };
      const { d } = await fetchLlmJson('/llm/ping', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      if (!d.ok) throw new Error(d?.error || 'Ping failed');
      const note = `OK in ${d.latencyMs || '?'}ms${d.modelUsed ? ` • ${d.modelUsed}` : ''}`;
      setPingStatus(prev => ({ ...prev, [providerId]: { state:'ok', note } }));
      if (updateGlobalStatus) setStatus(`✓ ${providerId} ${note}`);
    } catch (e) {
      const note = e.message || 'Ping failed';
      setPingStatus(prev => ({ ...prev, [providerId]: { state:'fail', note } }));
      if (updateGlobalStatus) setStatus(`Failed: ${note}`);
    }
  }

  // Runs one tiny real search with the saved key so a bad key is caught immediately, not on the first prediction.
  async function testTavily() {
    setPingStatus(prev => ({ ...prev, tavily: { state:'testing', note:'Testing…' } }));
    try {
      const r = await fetch('/api/lateral/llm/ping', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ provider:'tavily' }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d.error || `Test failed (HTTP ${r.status})`);
      setPingStatus(prev => ({ ...prev, tavily: { state:'ok', note:`Working — search returned in ${d.latencyMs || '?'}ms` } }));
    } catch (e) {
      setPingStatus(prev => ({ ...prev, tavily: { state:'fail', note: e.message || 'Test failed' } }));
    }
  }

  async function saveApiKeys() {
    setStatus('Saving API keys…');
    const savedTavily = !!keyDraft.tavilyApiKey.trim();
    try {
      const payload = { moonshotBaseUrl: f.moonshotBaseUrl || '', openaiCompatBaseUrl: f.openaiBaseUrl || '' };
      if (keyDraft.anthropicApiKey.trim()) payload.anthropicApiKey = keyDraft.anthropicApiKey.trim();
      if (keyDraft.geminiApiKey.trim()) payload.geminiApiKey = keyDraft.geminiApiKey.trim();
      if (keyDraft.moonshotApiKey.trim()) payload.moonshotApiKey = keyDraft.moonshotApiKey.trim();
      if (keyDraft.openaiCompatApiKey.trim()) payload.openaiCompatApiKey = keyDraft.openaiCompatApiKey.trim();
      if (keyDraft.listenNotesApiKey.trim()) payload.listenNotesApiKey = keyDraft.listenNotesApiKey.trim();
      if (keyDraft.podcastIndexApiKey.trim()) payload.podcastIndexApiKey = keyDraft.podcastIndexApiKey.trim();
      if (keyDraft.podcastIndexApiSecret.trim()) payload.podcastIndexApiSecret = keyDraft.podcastIndexApiSecret.trim();
      if (keyDraft.tavilyApiKey.trim()) payload.tavilyApiKey = keyDraft.tavilyApiKey.trim();
      const { d } = await fetchLlmJson('/llm/secrets', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      setKeyStatus({
        hasAnthropic: !!d.hasAnthropic,
        hasGemini: !!d.hasGemini,
        hasMoonshot: !!d.hasMoonshot,
        hasOpenAICompat: !!d.hasOpenAICompat,
        hasListenNotes: !!d.listenNotesConfigured,
        hasPodcastIndex: !!d.podcastIndexConfigured,
        hasPodcastIndexSecret: !!d.podcastIndexSecretConfigured,
        hasTavily: !!d.tavilyConfigured
      });
      if (d.moonshotBaseUrl) setF(prev => ({ ...prev, moonshotBaseUrl: d.moonshotBaseUrl }));
      if (d.openaiCompatBaseUrl) setF(prev => ({ ...prev, openaiBaseUrl: d.openaiCompatBaseUrl }));
      setKeyDraft({
        anthropicApiKey:'',
        geminiApiKey:'',
        moonshotApiKey:'',
        openaiCompatApiKey:'',
        listenNotesApiKey:'',
        podcastIndexApiKey:'',
        podcastIndexApiSecret:'',
        tavilyApiKey:''
      });
      setStatus('✓ API keys saved');
      if (savedTavily) { testTavily(); fetchTavilyUsage(); }
    } catch (e) {
      setStatus(`Failed: ${e.message}`);
    }
  }

  useEffect(() => { loadKeyStatus(); }, []);
  useEffect(() => {
    if (!window?.speechSynthesis) { setVoices([]); return; }
    const loadVoices = () => {
      const list = (window.speechSynthesis.getVoices?.() || [])
        .filter(v => !!v?.voiceURI)
        .sort((a, b) => {
          const an = `${a.lang || ''} ${a.name || ''}`.toLowerCase();
          const bn = `${b.lang || ''} ${b.name || ''}`.toLowerCase();
          return an.localeCompare(bn);
        });
      setVoices(list);
    };
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
    return () => {
      if (window.speechSynthesis.onvoiceschanged === loadVoices) {
        window.speechSynthesis.onvoiceschanged = null;
      }
    };
  }, []);
  useEffect(() => {
    if (provider === 'ollama') return;
    refreshExternalModels();
  }, [provider]);

  const tabBtn = (id, label) => (
    <button
      key={id}
      onClick={()=>setTab(id)}
      style={{
