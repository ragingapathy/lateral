# Lateral — standalone stack
#
#   cp .env.example .env     (optional — you can also paste your Tavily key in the app's Settings)
#   docker compose up -d
#   open http://localhost:8080
#
# Services
#   web           Caddy: serves index.html and forwards /api/lateral, /v2 and /ollama to the right place
#   lateral-proxy The Lateral server (Node): search, predictions, relevance + image pipelines
#   searxng       Meta-search engine used for news results (JSON output enabled in ./searxng/settings.yml)
#
# Ollama is NOT part of this stack — run it on the host (https://ollama.com) with the models listed in the README.

services:
  web:
    image: caddy:2-alpine
    ports:
      - "${LATERAL_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/index.html:ro
      - ./manifest.json:/srv/manifest.json:ro
      - ./sw.js:/srv/sw.js:ro
      - ./icon-192.png:/srv/icon-192.png:ro
      - ./icon-512.png:/srv/icon-512.png:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Caddy reach Ollama on the host (built in on Docker Desktop)
    depends_on:
      - lateral-proxy
    restart: unless-stopped

  lateral-proxy:
    image: node:20-alpine
    working_dir: /app
    command: node server.js
    ports:
      - "127.0.0.1:${LATERAL_PROXY_PORT:-3005}:3005"
    volumes:
      - ./proxy:/app:ro
      - ./data:/data                           # your stories, predictions, caches and saved API keys
    environment:
      - LATERAL_DATA_DIR=/data
      - SEARXNG_URL=http://searxng:8080
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Optional: you can set these here, or paste them into Settings in the app (Settings wins).
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GOOGLE_CIVIC_API_KEY=${GOOGLE_CIVIC_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-https://api.openai.com/v1}
      # Optional podcast transcription helper (python tools/transcribe_worker.py on the host); see the README.
      - LATERAL_TRANSCRIBE_URL=${LATERAL_TRANSCRIBE_URL:-http://host.docker.internal:3007}
      - LATERAL_TRANSCRIBE_TOKEN=${LATERAL_TRANSCRIBE_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - searxng
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
